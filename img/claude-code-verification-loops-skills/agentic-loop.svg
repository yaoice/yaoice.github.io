<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">验证在 agentic 循环中的位置</title>
  <desc id="d">收集上下文、采取行动、验证结果构成闭环；验证信号分为 Claude 能自己推断的确定性信号与只在你脑子里的人工检查。</desc>
  <rect width="960" height="470" fill="#f8fafc" rx="10"/>
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">验证是循环的收口环节，缺口在"Claude 推断不出来的那部分"</text>

  <!-- 循环三节点 -->
  <rect x="120" y="70" width="180" height="60" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="210" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">① 收集上下文</text>
  <text x="210" y="116" text-anchor="middle" font-size="10.5" fill="#64748b">读代码 · 读规范 · 读日志</text>

  <rect x="390" y="70" width="180" height="60" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="480" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">② 采取行动</text>
  <text x="480" y="116" text-anchor="middle" font-size="10.5" fill="#64748b">写代码 · 改配置 · 跑命令</text>

  <rect x="660" y="70" width="180" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="750" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">③ 验证结果</text>
  <text x="750" y="116" text-anchor="middle" font-size="10.5" fill="#475569">通过则回报，不通过则重来</text>

  <path d="M300 100 L388 100" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M570 100 L658 100" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M750 132 L750 156 Q750 168 738 168 L222 168 Q210 168 210 156 L210 132" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="480" y="162" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">不通过 → 带着失败信号回到①，这就是"循环"</text>

  <!-- 分割线 -->
  <line x1="30" y1="196" x2="930" y2="196" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">③ 这一环靠什么信号？两类，处境完全不同</text>

  <!-- 左：确定性信号 -->
  <rect x="30" y="240" width="430" height="184" rx="10" fill="#fff" stroke="#10b981"/>
  <rect x="30" y="240" width="430" height="32" rx="10" fill="#10b981"/>
  <text x="245" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">已经免费拿到：代码库里的确定性信号</text>
  <rect x="50" y="288" width="190" height="30" rx="6" fill="#ecfdf5"/>
  <text x="145" y="308" text-anchor="middle" font-size="11.5" fill="#047857">类型检查器</text>
  <rect x="250" y="288" width="190" height="30" rx="6" fill="#ecfdf5"/>
  <text x="345" y="308" text-anchor="middle" font-size="11.5" fill="#047857">Linter</text>
  <rect x="50" y="326" width="190" height="30" rx="6" fill="#ecfdf5"/>
  <text x="145" y="346" text-anchor="middle" font-size="11.5" fill="#047857">测试</text>
  <rect x="250" y="326" width="190" height="30" rx="6" fill="#ecfdf5"/>
  <text x="345" y="346" text-anchor="middle" font-size="11.5" fill="#047857">运行时错误</text>
  <text x="245" y="382" text-anchor="middle" font-size="11" fill="#475569">Claude 会主动去看、去接收退出码和告警</text>
  <text x="245" y="404" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">你要做的只有一件事：把命令写进 CLAUDE.md</text>

  <!-- 右：人工检查 -->
  <rect x="500" y="240" width="430" height="184" rx="10" fill="#fff" stroke="#f59e0b"/>
  <rect x="500" y="240" width="430" height="32" rx="10" fill="#f59e0b"/>
  <text x="715" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">还留在你脑子里：推断不出来的人工检查</text>
  <rect x="520" y="288" width="390" height="30" rx="6" fill="#fef3c7"/>
  <text x="534" y="308" font-size="11.5" fill="#92400e">日志必须带 request ID，且不能带请求体</text>
  <rect x="520" y="326" width="390" height="30" rx="6" fill="#fef3c7"/>
  <text x="534" y="346" font-size="11.5" fill="#92400e">删列的迁移必须先有回填步骤</text>
  <text x="715" y="382" text-anchor="middle" font-size="11" fill="#475569">通用 linter 抓不到，因为它是"你这个项目的规则"</text>
  <text x="715" y="404" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">这一格里的每一条，都是一个待编码的验证循环</text>

  <text x="480" y="452" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">凡是你每次都要亲手把关的东西，就是可以被写下来的东西</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
