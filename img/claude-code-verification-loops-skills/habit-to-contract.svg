<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">从习惯到团队契约的落地路径</title>
  <desc id="d">六步把手动复查变成验证循环，并沿习惯、契约、团队基础设施三个阶段演进。</desc>
  <rect width="960" height="430" fill="#f8fafc" rx="10"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">六步落地：从"我总得再看一眼"到"它自己会看"</text>
  <text x="480" y="56" text-anchor="middle" font-size="11.5" fill="#64748b">不管自动化什么、在什么环境里，这个流程是同一套</text>

  <!-- 六步 -->
  <rect x="30" y="76" width="140" height="132" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <circle cx="100" cy="104" r="14" fill="#475569"/>
  <text x="100" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="100" y="138" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">挑一个动作</text>
  <text x="100" y="160" text-anchor="middle" font-size="10" fill="#64748b">本周你重复次数</text>
  <text x="100" y="176" text-anchor="middle" font-size="10" fill="#64748b">最多的那次手动</text>
  <text x="100" y="192" text-anchor="middle" font-size="10" fill="#64748b">收尾复查</text>

  <rect x="182" y="76" width="140" height="132" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <circle cx="252" cy="104" r="14" fill="#475569"/>
  <text x="252" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="252" y="138" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">先试内置</text>
  <text x="252" y="160" text-anchor="middle" font-size="10" fill="#64748b">跑一遍 /verify</text>
  <text x="252" y="176" text-anchor="middle" font-size="10" fill="#64748b">能解决就不用</text>
  <text x="252" y="192" text-anchor="middle" font-size="10" fill="#64748b">自己造</text>

  <rect x="334" y="76" width="140" height="132" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <circle cx="404" cy="104" r="14" fill="#3b82f6"/>
  <text x="404" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="404" y="138" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">用大白话写下</text>
  <text x="404" y="160" text-anchor="middle" font-size="10" fill="#475569">按交接给入职第</text>
  <text x="404" y="176" text-anchor="middle" font-size="10" fill="#475569">一天的同事那样</text>
  <text x="404" y="192" text-anchor="middle" font-size="10" fill="#475569">写，这步最关键</text>

  <rect x="486" y="76" width="140" height="132" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <circle cx="556" cy="104" r="14" fill="#475569"/>
  <text x="556" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="556" y="138" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">变成 SKILL.md</text>
  <text x="556" y="160" text-anchor="middle" font-size="10" fill="#64748b">让 skill-creator</text>
  <text x="556" y="176" text-anchor="middle" font-size="10" fill="#64748b">访谈你，或自己</text>
  <text x="556" y="192" text-anchor="middle" font-size="10" fill="#64748b">手写一个文件</text>

  <rect x="638" y="76" width="140" height="132" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <circle cx="708" cy="104" r="14" fill="#475569"/>
  <text x="708" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
  <text x="708" y="138" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">在新任务验收</text>
  <text x="708" y="160" text-anchor="middle" font-size="10" fill="#64748b">确认检查真的出</text>
  <text x="708" y="176" text-anchor="middle" font-size="10" fill="#64748b">现在输出里，没</text>
  <text x="708" y="192" text-anchor="middle" font-size="10" fill="#64748b">出现就改描述</text>

  <rect x="790" y="76" width="140" height="132" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
  <circle cx="860" cy="104" r="14" fill="#8b5cf6"/>
  <text x="860" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>
  <text x="860" y="138" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">试着串链</text>
  <text x="860" y="160" text-anchor="middle" font-size="10" fill="#475569">拼出端到端的验</text>
  <text x="860" y="176" text-anchor="middle" font-size="10" fill="#475569">证流，只在升级</text>
  <text x="860" y="192" text-anchor="middle" font-size="10" fill="#475569">时才叫你</text>

  <path d="M175 142L179 142" stroke="#94a3b8" stroke-width="2"/>
  <path d="M327 142 L331 142" stroke="#94a3b8" stroke-width="2"/>
  <path d="M479 142 L483 142" stroke="#94a3b8" stroke-width="2"/>
  <path d="M631 142 L635 142" stroke="#94a3b8" stroke-width="2"/>
  <path d="M783 142 L787 142" stroke="#94a3b8" stroke-width="2"/>

  <line x1="30" y1="232" x2="930" y2="232" stroke="#e2e8f0"/>

  <!-- 三阶段 -->
  <text x="480" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">同一件事，三种身份</text>

  <rect x="30" y="272" width="290" height="88" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="175" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">习惯</text>
  <text x="175" y="322" text-anchor="middle" font-size="11" fill="#1e293b">"我每次精简完都会再验一遍"</text>
  <text x="175" y="344" text-anchor="middle" font-size="10.5" fill="#64748b">靠记性，会漏</text>

  <rect x="336" y="272" width="290" height="88" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="481" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">契约</text>
  <text x="481" y="322" text-anchor="middle" font-size="11" fill="#1e293b">"精简结束时一定会调验证"</text>
  <text x="481" y="344" text-anchor="middle" font-size="10.5" fill="#475569">写进 Skill，不再依赖记性</text>

  <rect x="642" y="272" width="288" height="88" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="786" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">团队基础设施</text>
  <text x="786" y="322" text-anchor="middle" font-size="11" fill="#1e293b">"每个人的每次改动都过同一关"</text>
  <text x="786" y="344" text-anchor="middle" font-size="10.5" fill="#475569">跟作者是否自觉无关</text>

  <path d="M322 316 L334 316" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M628 316 L640 316" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <text x="480" y="398" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">你为省自己每周两分钟写下的检查，现在每人每次提交都省两分钟</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
