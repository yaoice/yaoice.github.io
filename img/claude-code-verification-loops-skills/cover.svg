<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">把手动复查编码成 Skill</title>
  <desc id="d">左侧是每次都要人工做的复查清单，中间写成 SKILL.md，右侧 Claude 自己闭合反馈回路。</desc>
  <rect width="960" height="400" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">把手动复查编码成 Skill：让 Claude 自己闭合反馈回路</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#64748b">验证循环 = 代理自查 + 自修，跑完再回报</text>

  <!-- 左：人工复查 -->
  <rect x="30" y="90" width="260" height="222" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <rect x="30" y="90" width="260" height="34" rx="10" fill="#f59e0b"/>
  <text x="160" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">每次都要你手动做</text>
  <text x="52" y="152" font-size="11.5" fill="#1e293b">· 起服务，点一遍页面</text>
  <text x="52" y="176" font-size="11.5" fill="#1e293b">· 翻控制台有没有新报错</text>
  <text x="52" y="200" font-size="11.5" fill="#1e293b">· 查日志有没有带request ID</text>
  <text x="52" y="224" font-size="11.5" fill="#1e293b">· 核对迁移脚本有没有回填</text>
  <text x="52" y="248" font-size="11.5" fill="#1e293b">· 检查文案是否符合规范</text>
  <rect x="52" y="264" width="216" height="32" rx="6" fill="#fef3c7"/>
  <text x="160" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">重复 · 易忘 · 持续占注意力</text>

  <!-- 箭头 1 -->
  <path d="M298 200 L340 200" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="319" y="188" text-anchor="middle" font-size="10" fill="#64748b">编码</text>

  <!-- 中：写成 SKILL.md -->
  <rect x="350" y="90" width="260" height="222" rx="10" fill="#fff" stroke="#3b82f6"/>
  <rect x="350" y="90" width="260" height="34" rx="10" fill="#3b82f6"/>
  <text x="480" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">写成一个 SKILL.md</text>
  <rect x="370" y="140" width="220" height="26" rx="5" fill="#f1f5f9"/>
  <text x="382" y="158" font-size="11" font-weight="600" fill="#1e40af">name / description</text>
  <rect x="370" y="172" width="220" height="26" rx="5" fill="#f1f5f9"/>
  <text x="382" y="190" font-size="11" font-weight="600" fill="#1e40af">allowed-tools</text>
  <rect x="370" y="204" width="220" height="26" rx="5" fill="#eff6ff"/>
  <text x="382" y="222" font-size="11" fill="#1e293b">读什么 · 查什么 · 判什么</text>
  <rect x="370" y="236" width="220" height="26" rx="5" fill="#eff6ff"/>
  <text x="382" y="254" font-size="11" fill="#1e293b">报 file:line · 然后修掉</text>
  <text x="480" y="288" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">用你交接给新同事的说法写</text>

  <!-- 箭头 2 -->
  <path d="M618 200 L660 200" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="639" y="188" text-anchor="middle" font-size="10" fill="#64748b">交付</text>

  <!-- 右：Claude 闭环 -->
  <rect x="670" y="90" width="260" height="222" rx="10" fill="#fff" stroke="#10b981"/>
  <rect x="670" y="90" width="260" height="34" rx="10" fill="#10b981"/>
  <text x="800" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Claude 自己跑完再回报</text>
  <circle cx="708" cy="152" r="11" fill="#ecfdf5" stroke="#10b981"/>
  <text x="708" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">1</text>
  <text x="730" y="156" font-size="11.5" fill="#1e293b">改完自动触发检查</text>
  <circle cx="708" cy="188" r="11" fill="#ecfdf5" stroke="#10b981"/>
  <text x="708" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">2</text>
  <text x="730" y="192" font-size="11.5" fill="#1e293b">发现违规 → 定位 → 修</text>
  <circle cx="708" cy="224" r="11" fill="#ecfdf5" stroke="#10b981"/>
  <text x="708" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">3</text>
  <text x="730" y="228" font-size="11.5" fill="#1e293b">不通过就再来一轮</text>
  <circle cx="708" cy="260" r="11" fill="#ecfdf5" stroke="#10b981"/>
  <text x="708" y="264" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">4</text>
  <text x="730" y="264" font-size="11.5" fill="#1e293b">通过后才回来找你</text>
  <text x="800" y="291" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">这段时间你可以做别的事</text>

  <text x="480" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">你能替Claude 写下来的越多，它第一次就交对的次数越多</text>
  <text x="480" y="376" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">省下的复查时间，回到只有你能做的那部分工作上</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
