<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">四种落位方式对比</title>
<desc id="d">独立调用、内嵌、链式、PR 门禁四种验证循环落位方式对比。</desc>
<rect width="960" height="550" fill="#f8fafc" rx="10"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">同一个检查，放在哪里跑，决定它有没有用</text>
<g><rect x="30" y="52" width="150" height="40" rx="6" fill="#1e293b"/><rect x="190" y="52" width="180" height="40" rx="6" fill="#475569"/><rect x="380" y="52" width="180" height="40" rx="6" fill="#3b82f6"/><rect x="570" y="52" width="180" height="40" rx="6" fill="#8b5cf6"/><rect x="760" y="52" width="170" height="40" rx="6" fill="#10b981"/></g>
<g text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff"><text x="105" y="78" font-size="12">维度</text><text x="280" y="71">独立调用</text><text x="470" y="71">内嵌</text><text x="660" y="71">链式</text><text x="845" y="71">PR 门禁</text></g>
<g text-anchor="middle" font-size="9.5"><text x="280" y="86" fill="#cbd5e1">Standalone</text><text x="470" y="86" fill="#dbeafe">Embedded</text><text x="660" y="86" fill="#ede9fe">Chained</text><text x="845" y="86" fill="#d1fae5">on every PR</text></g>

<g fill="#e2e8f0"><rect x="30" y="100" width="150" height="62" rx="6"/><rect x="30" y="170" width="150" height="76" rx="6"/><rect x="30" y="254" width="150" height="76" rx="6"/><rect x="30" y="338" width="150" height="76" rx="6"/></g>
<g text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b"><text x="105" y="136">怎么被触发</text><text x="105" y="213">最适合什么</text><text x="105" y="297">代价在哪</text><text x="105" y="373">何时该换挡</text></g>
<text x="105" y="391" text-anchor="middle" font-size="10" fill="#64748b">升级 / 避开信号</text>

<g fill="#fff" stroke="#e2e8f0"><rect x="190" y="100" width="180" height="62" rx="6"/><rect x="190" y="170" width="180" height="76" rx="6"/><rect x="190" y="338" width="180" height="76" rx="6"/></g>
<g fill="#fff" stroke="#dbeafe"><rect x="380" y="100" width="180" height="62" rx="6"/><rect x="380" y="170" width="180" height="76" rx="6"/><rect x="380" y="338" width="180" height="76" rx="6"/></g>
<g fill="#fff" stroke="#ede9fe"><rect x="570" y="100" width="180" height="62" rx="6"/><rect x="570" y="170" width="180" height="76" rx="6"/><rect x="570" y="338" width="180" height="76" rx="6"/></g>
<g fill="#fff" stroke="#d1fae5"><rect x="760" y="100" width="170" height="62" rx="6"/><rect x="760" y="170" width="170" height="76" rx="6"/><rect x="760" y="338" width="170" height="76" rx="6"/></g>
<g fill="#fffbeb" stroke="#fde68a"><rect x="190" y="254" width="180" height="76" rx="6"/><rect x="380" y="254" width="180" height="76" rx="6"/><rect x="570" y="254" width="180" height="76" rx="6"/><rect x="760" y="254" width="170" height="76" rx="6"/></g>

<g text-anchor="middle" font-size="11" fill="#1e293b"><text x="280" y="126">你自己想起来调</text><text x="470" y="126">生产 Skill 收尾自动跑</text><text x="660" y="126">上个 Skill 结束时调下一个</text><text x="845" y="126">每一次 PR / push</text></g>
<g text-anchor="middle" font-size="10" fill="#64748b"><text x="280" y="146">产物已存在之后</text><text x="470" y="146">你不用开口</text><text x="660" y="146">端到端串起来</text><text x="845" y="146">和作者是谁无关</text>
<text x="280" y="212">提交前安全扫描</text><text x="470" y="212">脚手架完组件就跑</text><text x="660" y="212">查错 → 精简 → 验收</text><text x="845" y="212">全员统一标准</text>
<text x="280" y="230">许可证头全仓核对</text><text x="470" y="230">eslint 并自行修掉</text><text x="660" y="230">动了 UI 再查设计稿</text><text x="845" y="230">不靠自觉执行</text></g>
<g text-anchor="middle" font-size="10.5" fill="#1e293b"><text x="280" y="194">跨流程、非每次都要</text><text x="470" y="194">只属于一个工作流</text><text x="660" y="194">多道关卡按序过</text><text x="845" y="194">已经跑稳的那条链</text>
<text x="280" y="366">每改一次都在调它</text><text x="470" y="366">检查横跨多个流程</text><text x="660" y="366">有时只想跑其中一步</text><text x="845" y="366">链条还在频繁改</text></g>

<g text-anchor="middle" font-size="10.5" fill="#92400e"><text x="280" y="278">每次调用都占一轮</text><text x="470" y="278">只能改你能改的 Skill</text><text x="660" y="278">token 开销上升</text><text x="845" y="278">每次调整都会变成</text></g>
<g text-anchor="middle" font-size="10" fill="#b45309"><text x="280" y="298">你还得自己记得</text><text x="470" y="298">内置与插件托管的</text><text x="660" y="298">牺牲灵活性换自动化</text><text x="845" y="298">团队可见的事件</text>
<text x="280" y="316">在合适时机调它</text><text x="470" y="316">升级会被覆盖</text><text x="660" y="316">大规模铺开前先试</text><text x="845" y="316">松紧摇摆代价高</text></g>

<g text-anchor="middle" font-size="10.5" font-weight="600"><text x="280" y="386" fill="#475569">→ 该内嵌或串链了</text><text x="470" y="386" fill="#1e40af">→ 退回独立调用</text><text x="660" y="386" fill="#6d28d9">→ 别串，保持独立</text><text x="845" y="386" fill="#047857">→ 先别上门禁</text></g>

<rect x="30" y="422" width="150" height="60" rx="6" fill="#1e293b"/>
<rect x="190" y="422" width="180" height="60" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<rect x="380" y="422" width="180" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="570" y="422" width="180" height="60" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="760" y="422" width="170" height="60" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="105" y="448" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">这一挡的本质</text>
<text x="105" y="466" text-anchor="middle" font-size="9.5" fill="#cbd5e1">你把什么交出去</text>
<g text-anchor="middle" font-size="13" font-weight="700"><text x="280" y="458" fill="#1e293b">检查的内容</text><text x="470" y="458" fill="#1e40af">调用的时机</text><text x="660" y="458" fill="#6d28d9">整段流程编排</text><text x="845" y="458" fill="#047857">团队执行标准</text></g>

<path d="M195 508 L925 508" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="532" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">从左到右：个人习惯 → 个人基础设施 → 团队基础设施</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
