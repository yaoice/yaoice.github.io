<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">六种内置验证能力全景</title>
  <desc id="d">按会话内、仓库内、团队托管三层，列出 verify、工具链、规格校验、GitHub Actions、Code Review、评分量规六种内置验证能力。</desc>
  <rect width="960" height="470" fill="#f8fafc" rx="10"/>
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">先把内置的六种用完，再考虑自己写</text>
  <text x="480" y="58" text-anchor="middle" font-size="11.5" fill="#64748b">从上到下：配置成本递增，覆盖范围从"你这一次会话"扩到"整个团队每一次提交"</text>

  <!-- 第一层 -->
  <rect x="30" y="76" width="150" height="106" rx="8" fill="#475569"/>
  <text x="105" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">会话内</text>
  <text x="105" y="138" text-anchor="middle" font-size="10.5" fill="#cbd5e1">零配置，改完立刻查</text>
  <text x="105" y="158" text-anchor="middle" font-size="10.5" fill="#cbd5e1">今天就能用</text>

  <rect x="192" y="76" width="360" height="106" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="210" y="102" font-size="13" font-weight="700" fill="#1e293b">/verify</text>
  <text x="266" y="102" font-size="11" fill="#64748b">内置验证 Skill</text>
  <text x="210" y="126" font-size="11" fill="#475569">构建、运行、观察改动在应用里的真实表现</text>
  <rect x="210" y="138" width="324" height="30" rx="5" fill="#f1f5f9"/>
  <text x="222" y="158" font-size="10.5" fill="#334155">动手写自定义 Skill 之前，先拿它试一遍</text>

  <rect x="564" y="76" width="366" height="106" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="582" y="102" font-size="13" font-weight="700" fill="#1e293b">工具链信号</text>
  <text x="666" y="102" font-size="11" fill="#64748b">Toolchain</text>
  <text x="582" y="126" font-size="11" fill="#475569">主动捕获你提供的任何工具的错误码与告警</text>
  <rect x="582" y="138" width="330" height="30" rx="5" fill="#f1f5f9"/>
  <text x="594" y="158" font-size="10.5" fill="#334155">把精确的构建与测试命令写进 CLAUDE.md，别让它猜</text>

  <!-- 第二层 -->
  <rect x="30" y="192" width="150" height="106" rx="8" fill="#3b82f6"/>
  <text x="105" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">仓库内</text>
  <text x="105" y="254" text-anchor="middle" font-size="10.5" fill="#dbeafe">规则写死在项目里</text>
  <text x="105" y="274" text-anchor="middle" font-size="10.5" fill="#dbeafe">换人也一样跑</text>

  <rect x="192" y="192" width="360" height="106" rx="8" fill="#fff" stroke="#dbeafe"/>
  <text x="210" y="218" font-size="13" font-weight="700" fill="#1e40af">规格校验</text>
  <text x="278" y="218" font-size="11" fill="#64748b">Spec validation</text>
  <text x="210" y="242" font-size="11" fill="#475569">拿仓库里的 Markdown 规格逐条比对每次改动</text>
  <rect x="210" y="254" width="324" height="30" rx="5" fill="#eff6ff"/>
  <text x="222" y="274" font-size="10.5" fill="#1e40af">发现违反就直接尝试修掉，而不是只报告</text>

  <rect x="564" y="192" width="366" height="106" rx="8" fill="#fff" stroke="#dbeafe"/>
  <text x="582" y="218" font-size="13" font-weight="700" fill="#1e40af">GitHub Actions</text>
  <text x="582" y="242" font-size="11" fill="#475569">定义一个 job，用验证 Skill 调起 Claude</text>
  <rect x="582" y="254" width="330" height="30" rx="5" fill="#eff6ff"/>
  <text x="594" y="274" font-size="10.5" fill="#1e40af">本地跑的那套检查，在每次 push / PR 上原样重放</text>

  <!-- 第三层 -->
  <rect x="30" y="308" width="150" height="106" rx="8" fill="#8b5cf6"/>
  <text x="105" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">团队 / 托管</text>
  <text x="105" y="370" text-anchor="middle" font-size="10.5" fill="#ede9fe">不依赖谁记得</text>
  <text x="105" y="390" text-anchor="middle" font-size="10.5" fill="#ede9fe">失败自动回流返工</text>

  <rect x="192" y="308" width="360" height="106" rx="8" fill="#fff" stroke="#ede9fe"/>
  <text x="210" y="334" font-size="13" font-weight="700" fill="#6d28d9">Code Review</text>
  <text x="304" y="334" font-size="10.5" fill="#64748b">research preview</text>
  <text x="210" y="358" font-size="11" fill="#475569">托管多代理服务，对启用的仓库自动过一遍 PR</text>
  <rect x="210" y="370" width="324" height="30" rx="5" fill="#f5f3ff"/>
  <text x="222" y="390" font-size="10.5" fill="#6d28d9">在结论下回复 @claude，就把回路闭上了</text>

  <rect x="564" y="308" width="366" height="106" rx="8" fill="#fff" stroke="#ede9fe"/>
  <text x="582" y="334" font-size="13" font-weight="700" fill="#6d28d9">评分量规</text>
  <text x="650" y="334" font-size="10.5" fill="#64748b">Managed Agents · beta</text>
  <text x="582" y="358" font-size="11" fill="#475569">用独立的评分代理，按量规校验产出结果</text>
  <rect x="582" y="370" width="330" height="30" rx="5" fill="#f5f3ff"/>
  <text x="594" y="390" font-size="10.5" fill="#6d28d9">不达标的自动打回返工，不需要人来点这一下</text>

  <text x="480" y="446" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">自己写验证循环之前，先确认这六格里没有现成答案——省下的是维护成本</text>
</svg>
