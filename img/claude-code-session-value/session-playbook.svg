<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 会话运行手册</title>
  <desc id="desc">根据任务关联性、错误分支和中间输出量选择继续、压缩、回退、清除或使用子代理。</desc>
  <defs>
    <style>
      .text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .muted{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#64748b}
      .small{font-size:14px}
      .label{font-size:16px;font-weight:600}
      .line{stroke:#94a3b8;stroke-width:2;fill:none}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="500" rx="10" fill="#f8fafc"/>
  <text class="text" x="40" y="38" font-size="18" font-weight="600">Claude Code 会话运行手册</text>
  <text class="muted" x="40" y="65" font-size="15">先判断上下文是否仍有价值，再选择动作</text>

  <rect x="380" y="96" width="200" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="text label" x="442" y="128">任务完成或转折</text>

  <path class="line" d="M480 148V180" marker-end="url(#arrow)"/>
  <polygon points="480,180 590,230 480,280 370,230" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="text label" x="416" y="226">仍与当前任务相关？</text>
  <text class="muted small" x="462" y="250">判断上下文价值</text>

  <path class="line" d="M370 230H226" marker-end="url(#arrow)"/>
  <text class="muted small" x="275" y="216">否</text>
  <rect x="62" y="202" width="164" height="58" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text class="text label" x="113" y="227">/clear</text>
  <text class="muted small" x="86" y="248">切换无关任务</text>

  <path class="line" d="M590 230H732" marker-end="url(#arrow)"/>
  <text class="muted small" x="636" y="216">是</text>
  <polygon points="816,180 910,230 816,280 722,230" fill="#ecfdf5" stroke="#10b981"/>
  <text class="text small" x="765" y="226">最近是否走错？</text>
  <text class="muted small" x="782" y="248">保留早期探索？</text>

  <path class="line" d="M816 280V326" marker-end="url(#arrow)"/>
  <text class="muted small" x="830" y="308">否</text>
  <rect x="722" y="326" width="188" height="58" rx="10" fill="#d1fae5" stroke="#10b981"/>
  <text class="text label" x="774" y="351">继续</text>
  <text class="muted small" x="746" y="372">上下文仍然有用</text>

  <path class="line" d="M722 230H650V430H540" marker-end="url(#arrow)"/>
  <text class="muted small" x="654" y="410">是</text>
  <rect x="376" y="402" width="164" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="text label" x="424" y="427">/rewind</text>
  <text class="muted small" x="394" y="448">删除错误分支</text>

  <rect x="62" y="326" width="250" height="58" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="text label" x="86" y="351">下一步会产生大量中间输出？</text>
  <text class="muted small" x="86" y="372">是 → 用 Subagent 隔离</text>

  <rect x="62" y="416" width="250" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="muted small" x="82" y="443">同一任务但旧史过多 → /compact &lt;hint&gt;</text>
</svg>
