<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 会话成本模型</title>
  <desc id="desc">一次请求由稳定前缀、动态新增内容和模型输出组成，历史部分可从缓存读取。</desc>
  <defs>
    <style>
      .text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .muted{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#64748b}
      .small{font-size:14px}
      .label{font-size:16px;font-weight:600}
      .line{stroke:#94a3b8;stroke-width:2;fill:none}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="10" fill="#f8fafc"/>
  <text class="text" x="40" y="38" font-size="18" font-weight="600">Claude Code 会话成本模型</text>
  <text class="muted" x="40" y="65" font-size="15">每轮请求都携带历史，但只有新增部分需要完整预填充</text>

  <text class="muted small" x="56" y="104">请求进入模型</text>
  <rect x="56" y="120" width="278" height="58" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="text label" x="76" y="145">稳定前缀</text>
  <text class="muted small" x="76" y="166">系统提示 · 工具 · CLAUDE.md</text>
  <rect x="342" y="120" width="278" height="58" rx="8" fill="#ffedd5" stroke="#f59e0b"/>
  <text class="text label" x="362" y="145">动态新增</text>
  <text class="muted small" x="362" y="166">用户消息 · 文件 · 命令输出</text>
  <rect x="628" y="120" width="276" height="58" rx="8" fill="#d1fae5" stroke="#10b981"/>
  <text class="text label" x="648" y="145">模型输出</text>
  <text class="muted small" x="648" y="166">思考 · 工具调用 · 总结</text>

  <path class="line" d="M196 178V224" marker-end="url(#arrow)"/>
  <path class="line" d="M481 178V224" marker-end="url(#arrow)"/>
  <path class="line" d="M766 178V224" marker-end="url(#arrow)"/>

  <rect x="68" y="228" width="256" height="92" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="text label" x="92" y="258">缓存读取</text>
  <text class="muted small" x="92" y="283">命中时约为输入价格 0.1x</text>
  <text class="muted small" x="92" y="305">历史可复用，但不是零成本</text>

  <rect x="352" y="228" width="256" height="92" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text class="text label" x="376" y="258">完整预填充</text>
  <text class="muted small" x="376" y="283">新增内容按完整输入处理</text>
  <text class="muted small" x="376" y="305">范围越宽，后续负担越大</text>

  <rect x="636" y="228" width="256" height="92" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="text label" x="660" y="258">逐 Token 解码</text>
  <text class="muted small" x="660" y="283">输出通常比输入更昂贵</text>
  <text class="muted small" x="660" y="305">effort 会影响思考量</text>

  <rect x="134" y="354" width="692" height="36" rx="8" fill="#e2e8f0"/>
  <text class="text small" x="182" y="377">会话消耗 ≈ 上下文规模 × 保留轮数 × 同时运行的会话数</text>
</svg>
