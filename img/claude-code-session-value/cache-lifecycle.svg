<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">提示词缓存生命周期</title>
  <desc id="desc">首次请求建立缓存，后续工具结果追加到尾部并复用前缀，前缀改变时缓存失效。</desc>
  <defs>
    <style>
      .text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .muted{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#64748b}
      .small{font-size:14px}
      .label{font-size:16px;font-weight:600}
      .line{stroke:#94a3b8;stroke-width:2;fill:none}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="10" fill="#f8fafc"/>
  <text class="text" x="40" y="38" font-size="18" font-weight="600">提示词缓存生命周期</text>
  <text class="muted" x="40" y="65" font-size="15">前缀从请求开头匹配；动态结果追加在尾部最安全</text>

  <rect x="48" y="96" width="864" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="text label" x="72" y="124">稳定前缀：工具定义 → 系统提示 → 项目规则 → 已有会话</text>
  <rect x="48" y="148" width="864" height="30" rx="6" fill="#ffedd5" stroke="#f59e0b"/>
  <text class="muted small" x="72" y="169">动态尾部：用户消息、Read 文件、Edit 结果、命令输出</text>

  <rect x="48" y="216" width="190" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="text label" x="70" y="247">首次请求</text>
  <text class="muted small" x="70" y="274">完整预填充</text>
  <text class="muted small" x="70" y="297">写入缓存</text>

  <path class="line" d="M238 272H286" marker-end="url(#arrow)"/>

  <rect x="286" y="216" width="190" height="112" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="text label" x="308" y="247">工具结果追加</text>
  <text class="muted small" x="308" y="274">前缀不变</text>
  <text class="muted small" x="308" y="297">只计算新增尾部</text>

  <path class="line" d="M476 272H524" marker-end="url(#arrow)"/>

  <rect x="524" y="216" width="190" height="112" rx="10" fill="#d1fae5" stroke="#10b981"/>
  <text class="text label" x="546" y="247">后续请求</text>
  <text class="muted small" x="546" y="274">读取缓存前缀</text>
  <text class="muted small" x="546" y="297">继续追加结果</text>

  <path class="line" d="M714 272H762" marker-end="url(#arrow)"/>

  <rect x="762" y="216" width="150" height="112" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text class="text label" x="784" y="247">缓存失效</text>
  <text class="muted small" x="784" y="274">前缀改变</text>
  <text class="muted small" x="784" y="297">重新预填充</text>

  <rect x="112" y="364" width="736" height="42" rx="8" fill="#e2e8f0"/>
  <text class="text small" x="143" y="390">常见触发：切换 model / effort、打开 Fast mode、/compact、缓存过期、恢复旧会话</text>
</svg>
