<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">上下文卫生</title>
  <desc id="desc">精准输入和安静输出进入主上下文，过大的中间过程通过清理或子代理隔离。</desc>
  <defs>
    <style>
      .text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .muted{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#64748b}
      .small{font-size:14px}
      .label{font-size:16px;font-weight:600}
      .line{stroke:#94a3b8;stroke-width:2;fill:none}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="460" rx="10" fill="#f8fafc"/>
  <text class="text" x="40" y="38" font-size="18" font-weight="600">上下文卫生</text>
  <text class="muted" x="40" y="65" font-size="15">让相关信息进入主线，让高噪声过程留在边界之外</text>

  <rect x="48" y="102" width="210" height="236" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="text label" x="72" y="135">进入会话前</text>
  <rect x="72" y="154" width="162" height="36" rx="6" fill="#dbeafe"/>
  <text class="text small" x="88" y="177">@ 关键文件</text>
  <rect x="72" y="201" width="162" height="36" rx="6" fill="#dbeafe"/>
  <text class="text small" x="88" y="224">/context 检查</text>
  <rect x="72" y="248" width="162" height="36" rx="6" fill="#dbeafe"/>
  <text class="text small" x="88" y="271">安静命令</text>
  <text class="muted small" x="72" y="312">范围越准，搜索越少</text>

  <path class="line" d="M258 220H330" marker-end="url(#arrow)"/>

  <rect x="330" y="130" width="300" height="180" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text class="text label" x="360" y="165">主会话上下文</text>
  <rect x="360" y="185" width="240" height="36" rx="6" fill="#d1fae5"/>
  <text class="text small" x="382" y="208">当前任务的相关证据</text>
  <rect x="360" y="232" width="240" height="36" rx="6" fill="#d1fae5"/>
  <text class="text small" x="382" y="255">必要的决策与结果</text>
  <text class="muted small" x="360" y="293">短、准、可继续利用</text>

  <path class="line" d="M630 188H698" marker-end="url(#arrow)"/>
  <path class="line" d="M630 264H698" marker-end="url(#arrow)"/>

  <rect x="698" y="102" width="214" height="236" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text class="text label" x="722" y="135">不留在主线</text>
  <rect x="722" y="154" width="166" height="36" rx="6" fill="#fed7aa"/>
  <text class="text small" x="738" y="177">/clear：换任务</text>
  <rect x="722" y="201" width="166" height="36" rx="6" fill="#fed7aa"/>
  <text class="text small" x="738" y="224">/compact：压旧史</text>
  <rect x="722" y="248" width="166" height="36" rx="6" fill="#fed7aa"/>
  <text class="text small" x="738" y="271">Subagent：隔离噪声</text>
  <text class="muted small" x="722" y="312">不要让过程变成永久负担</text>

  <rect x="122" y="374" width="716" height="42" rx="8" fill="#e2e8f0"/>
  <text class="text small" x="148" y="400">命令输出超过约 30,000 字符会外置；真正危险的是“没超阈值但很嘈杂”的输出</text>
</svg>
