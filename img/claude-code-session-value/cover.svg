<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 会话效率</title>
  <desc id="desc">将任务输入、相关上下文和有效输出连接起来，并隔离无关上下文。</desc>
  <defs>
    <style>
      .text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .muted{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#64748b}
      .small{font-size:14px}
      .label{font-size:16px;font-weight:600}
      .line{stroke:#94a3b8;stroke-width:2;fill:none}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="10" fill="#f8fafc"/>
  <text class="text" x="40" y="38" font-size="18" font-weight="600">Claude Code 会话效率</text>
  <text class="muted" x="40" y="65" font-size="15">把 Token 花在当前任务上，而不是让无关上下文反复占位</text>

  <rect x="42" y="112" width="220" height="108" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="text label" x="68" y="148">任务输入</text>
  <text class="muted small" x="68" y="176">目标、路径、约束</text>
  <text class="muted small" x="68" y="198">精确范围优先</text>

  <path class="line" d="M262 166H330" marker-end="url(#arrow)"/>

  <rect x="330" y="96" width="300" height="140" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="text label" x="360" y="132">相关上下文</text>
  <rect x="360" y="150" width="112" height="28" rx="6" fill="#bfdbfe"/>
  <text class="text small" x="376" y="169">稳定前缀</text>
  <rect x="484" y="150" width="116" height="28" rx="6" fill="#93c5fd"/>
  <text class="text small" x="502" y="169">新增尾部</text>
  <text class="muted small" x="360" y="207">可复用、可验证、与任务相关</text>

  <path class="line" d="M630 166H698" marker-end="url(#arrow)"/>

  <rect x="698" y="112" width="220" height="108" rx="10" fill="#d1fae5" stroke="#10b981"/>
  <text class="text label" x="725" y="148">有效输出</text>
  <text class="muted small" x="725" y="176">更少搜索</text>
  <text class="muted small" x="725" y="198">更快完成</text>

  <rect x="118" y="278" width="724" height="42" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text class="muted small" x="142" y="304">无关文件、冗长命令输出、过时历史 → 不要进入主会话，或尽早清理、压缩、隔离</text>
</svg>
