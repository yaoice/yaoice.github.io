<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-label="DeepSeek Harness 轮次与步骤循环">
  <style>text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;text-anchor:middle}.l{text-anchor:start}.r{text-anchor:end}.b{font-weight:700}</style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="960" height="700" rx="10" fill="#f8fafc"/>

  <text x="480" y="32" font-size="18" class="b" fill="#1e293b">轮次与步骤：一个步骤 = 一次模型请求 + 它调用的工具</text>
  <text x="480" y="54" font-size="12" fill="#64748b">实线框为持久会话事件；虚线框为 waterfall 实时扩展点（监听器必须调用 next() 委托）；turn-stopping 为 serial</text>

  <!-- turn/start -->
  <rect x="260" y="76" width="440" height="38" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="100" font-size="12" class="b" fill="#065f46">turn/start　领取首条输入，打开轮次</text>
  <line x1="480" y1="114" x2="480" y2="134" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 循环容器 -->
  <rect x="200" y="134" width="560" height="360" rx="10" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="220" y="152" font-size="11" fill="#64748b" class="l">循环：工具欠一个请求，或新输入到达 → 领取下一步</text>

  <rect x="260" y="168" width="440" height="36" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="480" y="191" font-size="11.5" fill="#1e3a8a">agent/pre-step（waterfall）　改写已领取消息，或拒绝之</text>
  <line x1="480" y1="204" x2="480" y2="222" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="260" y="222" width="440" height="32" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="243" font-size="11.5" class="b" fill="#065f46">step/start　entered messages 追加为 user/message</text>
  <line x1="480" y1="254" x2="480" y2="274" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="480" y="270" font-size="10.5" fill="#64748b">从日志 derive 模型历史</text>

  <!-- 请求链 -->
  <rect x="278" y="282" width="100" height="34" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="328" y="303" font-size="11" fill="#1e3a8a">agent/request</text>
  <line x1="378" y1="299" x2="386" y2="299" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="386" y="282" width="100" height="34" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="436" y="303" font-size="11" fill="#1e3a8a">llm/stream</text>
  <line x1="486" y1="299" x2="494" y2="299" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="494" y="282" width="100" height="34" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="544" y="303" font-size="11" fill="#1e3a8a">assistant/chunk*</text>
  <line x1="594" y1="299" x2="602" y2="299" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="602" y="282" width="100" height="34" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="652" y="303" font-size="11" class="b" fill="#065f46">assistant/message</text>
  <line x1="480" y1="316" x2="480" y2="340" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 判断 -->
  <rect x="395" y="340" width="170" height="32" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="361" font-size="11" class="b" fill="#92400e">有工具调用？</text>
  <line x1="480" y1="372" x2="480" y2="396" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 工具链 -->
  <rect x="278" y="396" width="100" height="34" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="328" y="417" font-size="10.5" fill="#1e3a8a">pre-execute</text>
  <line x1="378" y1="413" x2="386" y2="413" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="386" y="396" width="100" height="34" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="436" y="417" font-size="10.5" fill="#1e3a8a">execute</text>
  <line x1="486" y1="413" x2="494" y2="413" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="494" y="396" width="100" height="34" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="544" y="417" font-size="10.5" fill="#1e3a8a">post-execute</text>
  <line x1="594" y1="413" x2="602" y2="413" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="602" y="396" width="100" height="34" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="652" y="417" font-size="10.5" class="b" fill="#065f46">tool/result*</text>
  <line x1="480" y1="430" x2="480" y2="448" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="260" y="448" width="440" height="30" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="468" font-size="11.5" class="b" fill="#065f46">step/end　无更多工作则退出循环</text>

  <!-- 循环回边 -->
  <path d="M 700 463 C 760 463 760 186 704 186" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrb)"/>
  <text x="726" y="330" font-size="10.5" fill="#3b82f6" class="l">下一步</text>

  <line x1="480" y1="494" x2="480" y2="518" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- turn-stopping / turn end -->
  <rect x="260" y="518" width="440" height="36" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="541" font-size="11.5" fill="#1e293b">agent/turn-stopping（serial，无 next）　监听器可在此停住轮次</text>
  <line x1="480" y1="554" x2="480" y2="576" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="260" y="576" width="440" height="40" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="601" font-size="12" class="b" fill="#065f46">turn/end　不再欠任何工作时关闭轮次</text>

  <!-- 图例 -->
  <rect x="160" y="644" width="12" height="12" rx="3" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="180" y="655" font-size="11" fill="#475569" class="l">持久会话事件（写入日志）</text>
  <rect x="380" y="644" width="12" height="12" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="400" y="655" font-size="11" fill="#475569" class="l">waterfall 实时扩展点（可拦截改写）</text>
  <line x1="640" y1="650" x2="668" y2="650" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="676" y="655" font-size="11" fill="#475569" class="l">循环回边</text>
</svg>
