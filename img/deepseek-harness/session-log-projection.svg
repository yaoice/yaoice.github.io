<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="DeepSeek Harness 会话日志与模型历史投影">
  <style>text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;text-anchor:middle}.l{text-anchor:start}.r{text-anchor:end}.b{font-weight:700}</style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="10" fill="#f8fafc"/>

  <text x="480" y="32" font-size="18" class="b" fill="#1e293b">会话日志投影：模型历史只来自日志</text>
  <text x="480" y="54" font-size="12" fill="#64748b">仅追加的 SessionEvent 日志是唯一事实来源；deriveMessages() 只投影 surface 上的消息事件</text>

  <!-- 左：事件日志 -->
  <rect x="20" y="76" width="290" height="346" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="98" font-size="11.5" class="l b" fill="#475569">仅追加事件日志（seq 严格递增）</text>

  <rect x="40" y="110" width="250" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="131" font-size="11" fill="#475569" class="l">turn/start</text>
  <text x="278" y="131" text-anchor="end" font-size="10" fill="#94a3b8" class="r">seq 0</text>

  <rect x="40" y="150" width="250" height="34" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="171" font-size="11" class="l b" fill="#1e3a8a">user/message</text>
  <text x="278" y="171" text-anchor="end" font-size="10" fill="#3b82f6" class="r">seq 1 · surface</text>

  <rect x="40" y="190" width="250" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="211" font-size="11" fill="#475569" class="l">assistant/chunk ×N</text>
  <text x="278" y="211" text-anchor="end" font-size="10" fill="#94a3b8" class="r">seq 2..k</text>

  <rect x="40" y="230" width="250" height="34" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="251" font-size="11" class="l b" fill="#1e3a8a">assistant/message</text>
  <text x="278" y="251" text-anchor="end" font-size="10" fill="#3b82f6" class="r">seq k+1 · surface</text>

  <rect x="40" y="270" width="250" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="291" font-size="11" fill="#475569" class="l">tool/call</text>
  <text x="278" y="291" text-anchor="end" font-size="10" fill="#94a3b8" class="r">seq k+2</text>

  <rect x="40" y="310" width="250" height="34" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="331" font-size="11" class="l b" fill="#1e3a8a">tool/result</text>
  <text x="278" y="331" text-anchor="end" font-size="10" fill="#3b82f6" class="r">seq k+3 · surface</text>

  <rect x="40" y="350" width="250" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="371" font-size="11" fill="#475569" class="l">step/end</text>
  <text x="278" y="371" text-anchor="end" font-size="10" fill="#94a3b8" class="r">seq k+4</text>

  <text x="165" y="406" font-size="10.5" fill="#94a3b8" class="l">蓝框 = surface 消息事件；其余为流程/流式事实</text>

  <!-- 中：投影 -->
  <line x1="290" y1="167" x2="348" y2="167" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="290" y1="247" x2="348" y2="247" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="290" y1="327" x2="348" y2="327" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="350" y="76" width="260" height="250" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="122" font-size="13" class="b" fill="#065f46">deriveMessages()</text>
  <text x="480" y="146" font-size="11" fill="#475569">遍历 surface 节点序列</text>
  <text x="480" y="166" font-size="11" fill="#475569">逐条折叠为 Message</text>
  <text x="480" y="186" font-size="11" fill="#475569">带缓存：增量重建投影</text>
  <text x="480" y="224" font-size="10.5" fill="#94a3b8">chunk 事件保证回放与 UI 保真，</text>
  <text x="480" y="242" font-size="10.5" fill="#94a3b8">但不进入模型历史</text>
  <text x="480" y="292" font-size="10.5" fill="#065f46">fork · 恢复 · transcript · 遥测</text>
  <text x="480" y="310" font-size="10.5" fill="#065f46">全部派生自同一事件流</text>

  <line x1="610" y1="200" x2="668" y2="200" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrg)"/>

  <!-- 右：模型历史 -->
  <rect x="670" y="76" width="270" height="250" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="805" y="122" font-size="13" class="b" fill="#1e3a8a">模型历史 Message[]</text>

  <rect x="700" y="142" width="210" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="805" y="161" font-size="11" class="b" fill="#475569">user</text>
  <text x="805" y="176" font-size="10" fill="#94a3b8">来自 user/message</text>

  <rect x="700" y="192" width="210" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="805" y="211" font-size="11" class="b" fill="#475569">assistant</text>
  <text x="805" y="226" font-size="10" fill="#94a3b8">来自 assistant/message</text>

  <rect x="700" y="242" width="210" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="805" y="261" font-size="11" class="b" fill="#475569">tool</text>
  <text x="805" y="276" font-size="10" fill="#94a3b8">来自 tool/result</text>

  <text x="805" y="308" font-size="10.5" fill="#1e3a8a">仅三类消息：user / assistant / tool</text>

  <!-- 底部不变量 -->
  <rect x="20" y="446" width="920" height="84" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="40" y="472" font-size="12.5" class="l b" fill="#92400e">运行时不变量：模型可见即已记录</text>
  <text x="40" y="496" font-size="11" fill="#78350f" class="l">· append 消息类事件必须携带 surfaceOp 标记——编译期在调用点强制，运行时缺失则直接报错</text>
  <text x="40" y="516" font-size="11" fill="#78350f" class="l">· 新增任何模型可见输入，必须先扩展 SessionEventMap 并从日志渲染——这是唯一被允许的路径</text>
</svg>
