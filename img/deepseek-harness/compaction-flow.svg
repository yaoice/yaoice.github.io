<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="DeepSeek Harness 上下文压缩流程">
  <style>text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;text-anchor:middle}.l{text-anchor:start}.r{text-anchor:end}.b{font-weight:700}</style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="580" rx="10" fill="#f8fafc"/>

  <text x="480" y="32" font-size="18" class="b" fill="#1e293b">上下文压缩：把一段历史替换为一个摘要节点</text>
  <text x="480" y="54" font-size="12" fill="#64748b">触发后经测量、修剪、摘要三步，最终以 surfaceOp: replace 收缩模型可见历史</text>

  <!-- 步骤1 -->
  <rect x="34" y="96" width="164" height="116" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="116" y="120" font-size="12.5" class="b" fill="#92400e">① 触发</text>
  <text x="116" y="142" font-size="10.5" fill="#78350f">pressure：token</text>
  <text x="116" y="157" font-size="10.5" fill="#78350f">超过阈值比例</text>
  <text x="116" y="180" font-size="10.5" fill="#78350f">context-overflow：</text>
  <text x="116" y="195" font-size="10.5" fill="#78350f">服务端窗口溢出</text>
  <line x1="198" y1="154" x2="216" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 步骤2 -->
  <rect x="216" y="96" width="164" height="116" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="298" y="120" font-size="12.5" class="b" fill="#1e293b">② 测量</text>
  <text x="298" y="144" font-size="10.5" fill="#475569">tokenMeter.measure()</text>
  <text x="298" y="162" font-size="10.5" fill="#475569">thresholdRatio 默认 0.8</text>
  <text x="298" y="180" font-size="10.5" fill="#475569">retainRatio 默认 0.16</text>
  <text x="298" y="198" font-size="10.5" fill="#94a3b8">算保留与压缩阈值</text>
  <line x1="380" y1="154" x2="398" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 步骤3 -->
  <rect x="398" y="96" width="164" height="116" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="480" y="120" font-size="12.5" class="b" fill="#1e293b">③ 修剪（可选）</text>
  <text x="480" y="146" font-size="10.5" fill="#475569">prune：无模型参与</text>
  <text x="480" y="164" font-size="10.5" fill="#475569">删减低价值工具结果</text>
  <text x="480" y="190" font-size="10.5" fill="#94a3b8">先做免费收缩，</text>
  <text x="480" y="205" font-size="10.5" fill="#94a3b8">再决定是否摘要</text>
  <line x1="562" y1="154" x2="580" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 步骤4 -->
  <rect x="580" y="96" width="164" height="116" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="662" y="120" font-size="12.5" class="b" fill="#1e3a8a">④ 摘要</text>
  <text x="662" y="144" font-size="10.5" fill="#1e3a8a">selectCompactableRange</text>
  <text x="662" y="162" font-size="10.5" fill="#1e3a8a">工具配对平衡检查</text>
  <text x="662" y="180" font-size="10.5" fill="#1e3a8a">summarizeWithLlm</text>
  <text x="662" y="198" font-size="10.5" fill="#1e3a8a">生成区间摘要</text>
  <line x1="744" y1="154" x2="762" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 步骤5 -->
  <rect x="762" y="96" width="164" height="116" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="844" y="120" font-size="12.5" class="b" fill="#065f46">⑤ 替换</text>
  <text x="844" y="146" font-size="10.5" fill="#065f46">surfaceOp: replace</text>
  <text x="844" y="164" font-size="10.5" fill="#065f46">区间替换为单个</text>
  <text x="844" y="182" font-size="10.5" fill="#065f46">user/message 摘要</text>
  <text x="844" y="200" font-size="10.5" fill="#065f46">成为新的 surface 节点</text>

  <!-- 对照区 -->
  <text x="20" y="256" font-size="12" class="l b" fill="#475569">压缩前后对照（surface 视角）</text>

  <rect x="20" y="268" width="430" height="130" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="290" font-size="11.5" class="l b" fill="#475569">压缩前：surface 上 n 个事件</text>
  <rect x="40" y="306" width="62" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="71" y="328" font-size="10" class="b" fill="#1e3a8a">user</text>
  <text x="71" y="344" font-size="9.5" fill="#475569">待压缩</text>
  <rect x="110" y="306" width="62" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="141" y="328" font-size="10" class="b" fill="#1e3a8a">assistant</text>
  <text x="141" y="344" font-size="9.5" fill="#475569">待压缩</text>
  <rect x="180" y="306" width="62" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="211" y="328" font-size="10" class="b" fill="#1e3a8a">tool</text>
  <text x="211" y="344" font-size="9.5" fill="#475569">待压缩</text>
  <rect x="250" y="306" width="62" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="281" y="328" font-size="10" class="b" fill="#1e3a8a">user</text>
  <text x="281" y="344" font-size="9.5" fill="#475569">待压缩</text>
  <text x="318" y="337" font-size="12" fill="#94a3b8">…</text>
  <rect x="346" y="306" width="62" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="377" y="328" font-size="10" class="b" fill="#475569">user</text>
  <text x="377" y="344" font-size="9.5" fill="#94a3b8">保留尾部</text>
  <text x="235" y="384" font-size="10.5" fill="#64748b">长对话历史越长，尾部保留（retainRatio）越重要</text>

  <line x1="455" y1="333" x2="505" y2="333" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <text x="480" y="323" font-size="10" fill="#10b981">压缩</text>

  <rect x="510" y="268" width="430" height="130" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="530" y="290" font-size="11.5" class="l b" fill="#065f46">压缩后：摘要节点 + 保留尾部</text>
  <rect x="530" y="306" width="150" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="605" y="328" font-size="10" class="b" fill="#1e3a8a">summary 摘要</text>
  <text x="605" y="344" font-size="9.5" fill="#475569">单个 user/message 节点</text>
  <rect x="692" y="306" width="62" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="723" y="328" font-size="10" class="b" fill="#475569">user</text>
  <text x="723" y="344" font-size="9.5" fill="#94a3b8">保留</text>
  <rect x="762" y="306" width="62" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="793" y="328" font-size="10" class="b" fill="#475569">…</text>
  <text x="793" y="344" font-size="9.5" fill="#94a3b8">保留</text>
  <text x="725" y="384" font-size="10.5" fill="#64748b">n 个事件 → 1 个摘要节点，token 大幅收缩</text>

  <!-- 底部说明 -->
  <rect x="20" y="440" width="920" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="466" font-size="12.5" class="l b" fill="#1e293b">压缩同样写进日志：过程可审计、可回放</text>
  <text x="40" y="490" font-size="11" fill="#64748b" class="l">· compaction/start · summary · end 以 log-only 事件记录锁与计量；替换后的摘要仍是会话事件，不破坏日志完整性</text>
  <text x="40" y="510" font-size="11" fill="#64748b" class="l">· 摘要本身由 LLM 生成（summarizeWithLlm），其质量直接决定压缩后模型对旧上下文的理解上限</text>
</svg>
