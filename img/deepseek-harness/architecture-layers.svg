<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="DeepSeek Harness 架构总览：profile 分层叠加出插件树">
  <style>text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;text-anchor:middle}.l{text-anchor:start}.r{text-anchor:end}.b{font-weight:700}</style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="640" rx="10" fill="#f8fafc"/>

  <text x="480" y="32" font-size="18" class="b" fill="#1e293b">DeepSeek Harness 架构总览：profile 分层叠加出插件树</text>
  <text x="480" y="54" font-size="12" fill="#64748b">组合包按序叠加，用户 patch 可覆盖任意条目；所有能力经 Cordis 共享上下文与三类事件域协作</text>

  <!-- 1 组合包层 -->
  <text x="20" y="86" font-size="12" class="l b" fill="#475569">1 · 组合包分层叠加（profile = 有序 patch 层）</text>

  <rect x="20" y="98" width="290" height="96" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="165" y="122" font-size="13" class="b" fill="#1e3a8a">dsh-base（第一层）</text>
  <text x="165" y="142" font-size="11" fill="#475569">模型适配器 · 工具 · 持久化</text>
  <text x="165" y="158" font-size="11" fill="#475569">沙箱与审批 · 凭据 · 遥测</text>
  <text x="165" y="180" font-size="10.5" fill="#94a3b8">每个 profile 的起点，约 90 个插件</text>

  <rect x="335" y="98" width="290" height="96" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="480" y="122" font-size="13" class="b" fill="#5b21b6">dsh-web-app / dsh-headless（第二层）</text>
  <text x="480" y="142" font-size="11" fill="#475569">叠加浏览器应用（Web UI + HTTP）</text>
  <text x="480" y="158" font-size="11" fill="#475569">或一次性 headless runner（无服务器）</text>
  <text x="480" y="180" font-size="10.5" fill="#94a3b8">二选一，可被上层 patch 继续改写</text>

  <rect x="650" y="98" width="290" height="96" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="795" y="122" font-size="13" class="b" fill="#92400e">用户 cordis.patch.yml（顶层）</text>
  <text x="795" y="142" font-size="11" fill="#475569">按 id 定位任意条目并替换整个 config</text>
  <text x="795" y="158" font-size="11" fill="#475569">home 级 → --patch overlay 依次覆盖</text>
  <text x="795" y="180" font-size="10.5" fill="#94a3b8">profile 级 / home 级 / 命令行三层</text>

  <line x1="165" y1="196" x2="165" y2="232" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="196" x2="480" y2="232" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="795" y1="196" x2="795" y2="232" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2 Cordis 上下文 -->
  <rect x="20" y="240" width="920" height="158" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="266" font-size="12" class="l b" fill="#475569">2 · Cordis 共享上下文：无特权内核，注册即副作用、卸载即撤销</text>

  <rect x="40" y="284" width="160" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="306" font-size="12" class="b" fill="#1e3a8a">ctx.sessions</text>
  <text x="120" y="328" font-size="10.5" fill="#475569">会话日志与存储</text>
  <text x="120" y="344" font-size="10.5" fill="#475569">fork / 恢复</text>
  <text x="120" y="360" font-size="10.5" fill="#94a3b8">core/session</text>

  <rect x="212" y="284" width="160" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="292" y="306" font-size="12" class="b" fill="#1e3a8a">ctx.agents</text>
  <text x="292" y="328" font-size="10.5" fill="#475569">活跃 Agent 注册表</text>
  <text x="292" y="344" font-size="10.5" fill="#475569">agent/* 事件</text>
  <text x="292" y="360" font-size="10.5" fill="#94a3b8">core/agent</text>

  <rect x="384" y="284" width="160" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="464" y="306" font-size="12" class="b" fill="#1e3a8a">ctx.tools</text>
  <text x="464" y="328" font-size="10.5" fill="#475569">作用域化工具注册表</text>
  <text x="464" y="344" font-size="10.5" fill="#475569">三阶段把关流水线</text>
  <text x="464" y="360" font-size="10.5" fill="#94a3b8">core/tools</text>

  <rect x="556" y="284" width="160" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="636" y="306" font-size="12" class="b" fill="#1e3a8a">ctx.llm</text>
  <text x="636" y="328" font-size="10.5" fill="#475569">消息与流式词汇表</text>
  <text x="636" y="344" font-size="10.5" fill="#475569">适配器 seam</text>
  <text x="636" y="360" font-size="10.5" fill="#94a3b8">llm/llm</text>

  <rect x="728" y="284" width="160" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="808" y="306" font-size="12" class="b" fill="#1e3a8a">ctx.systemPrompt</text>
  <text x="808" y="328" font-size="10.5" fill="#475569">提示词分段组装</text>
  <text x="808" y="344" font-size="10.5" fill="#475569">工具 schema 注入</text>
  <text x="808" y="360" font-size="10.5" fill="#94a3b8">core/system-prompt</text>

  <!-- 3 事件域 -->
  <line x1="300" y1="400" x2="300" y2="428" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="400" x2="480" y2="428" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="400" x2="660" y2="428" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="20" y="448" font-size="12" class="l b" fill="#475569">3 · 三类事件域 = 扩展点（改动前先选对事件域）</text>

  <rect x="20" y="460" width="920" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="28" y="468" width="8" height="34" rx="4" fill="#10b981"/>
  <text x="48" y="482" font-size="12" class="l b" fill="#1e293b">会话事件 session/event</text>
  <text x="48" y="500" font-size="11" fill="#64748b" class="l">持久事实：追加进日志并广播，重载后仍然存在</text>

  <rect x="20" y="516" width="920" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="28" y="524" width="8" height="34" rx="4" fill="#3b82f6"/>
  <text x="48" y="538" font-size="12" class="l b" fill="#1e293b">Agent 事件 agent/*</text>
  <text x="48" y="556" font-size="11" fill="#64748b" class="l">实时扩展点：inbox · 步骤 · 状态 · 请求 · 续跑，waterfall 监听器可改写或拒绝</text>

  <rect x="20" y="572" width="920" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="28" y="580" width="8" height="34" rx="4" fill="#8b5cf6"/>
  <text x="48" y="594" font-size="12" class="l b" fill="#1e293b">能力事件 tools/* · fs/* · telemetry/*</text>
  <text x="48" y="612" font-size="11" fill="#64748b" class="l">seam 挂载点：策略与适配器在此附着，无需导入环</text>
</svg>
