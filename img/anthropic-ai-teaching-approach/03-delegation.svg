<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="500" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">三个案例：哪些交给 AI，哪些留给自己</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">委托判断与披露，是"超越对话"的具体功夫</text>

  <text x="115" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">场景</text>
  <text x="396" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6">交给 AI</text>
  <text x="761" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">留给自己</text>

  <!-- 备忘录 -->
  <rect x="40" y="100" width="150" height="88" rx="10" fill="#f1f5f9" stroke="#94a3b8" filter="url(#s)"/>
  <text x="115" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">备忘录</text>
  <text x="115" y="158" text-anchor="middle" font-size="11" fill="#64748b">写作分工</text>
  <rect x="206" y="100" width="380" height="88" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="396" y="138" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">汇总要点、生成幻灯片</text>
  <text x="396" y="160" text-anchor="middle" font-size="11" fill="#64748b">格式化劳动可以外包</text>
  <rect x="602" y="100" width="318" height="88" rx="10" fill="#ecfdf5" stroke="#10b981" filter="url(#s)"/>
  <text x="761" y="138" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">敏感判断与结论亲笔</text>
  <text x="761" y="160" text-anchor="middle" font-size="11" fill="#64748b">立场与风险不能外包</text>

  <!-- 数据分析 -->
  <rect x="40" y="204" width="150" height="88" rx="10" fill="#f1f5f9" stroke="#94a3b8" filter="url(#s)"/>
  <text x="115" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">数据分析</text>
  <text x="115" y="262" text-anchor="middle" font-size="11" fill="#64748b">分析分工</text>
  <rect x="206" y="204" width="380" height="88" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="396" y="242" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">探索性分析：找模式、出假设</text>
  <text x="396" y="264" text-anchor="middle" font-size="11" fill="#64748b">广撒网交给模型</text>
  <rect x="602" y="204" width="318" height="88" rx="10" fill="#ecfdf5" stroke="#10b981" filter="url(#s)"/>
  <text x="761" y="242" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">最终核查与归因判断</text>
  <text x="761" y="264" text-anchor="middle" font-size="11" fill="#64748b">进决策文档前的最后一道关</text>

  <!-- 法务用例 -->
  <rect x="40" y="308" width="150" height="88" rx="10" fill="#f1f5f9" stroke="#94a3b8" filter="url(#s)"/>
  <text x="115" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">法务用例</text>
  <text x="115" y="366" text-anchor="middle" font-size="11" fill="#64748b">学习分工</text>
  <rect x="206" y="308" width="380" height="88" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="396" y="346" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">用例演练、条款对比</text>
  <text x="396" y="368" text-anchor="middle" font-size="11" fill="#64748b">在练习中熟悉工具边界</text>
  <rect x="602" y="308" width="318" height="88" rx="10" fill="#ecfdf5" stroke="#10b981" filter="url(#s)"/>
  <text x="761" y="346" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">边用边反思：哪些不该外包</text>
  <text x="761" y="368" text-anchor="middle" font-size="11" fill="#64748b">这是素养课的核心动作</text>

  <!-- 披露 -->
  <rect x="40" y="420" width="880" height="48" rx="10" fill="#fffbeb" stroke="#f59e0b" filter="url(#s)"/>
  <text x="480" y="443" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">披露伦理</text>
  <text x="480" y="460" text-anchor="middle" font-size="11.5" fill="#475569">明确说明 AI 在文档 / 分析 / 媒体中的参与方式——披露是素养，不是负担</text>
</svg>
