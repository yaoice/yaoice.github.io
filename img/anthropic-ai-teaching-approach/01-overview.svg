<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="430" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">Claude Academy：一次"内部经验外化"</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">Anthropic 教育打法全景 · 官方博客 2026-08-20</text>

  <!-- 内部实践 -->
  <rect x="40" y="80" width="250" height="280" rx="10" fill="#f1f5f9" stroke="#94a3b8" filter="url(#s)"/>
  <text x="165" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">内部实践</text>
  <text x="165" y="126" text-anchor="middle" font-size="11" fill="#64748b">教学方式的源头</text>
  <rect x="56" y="140" width="218" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="158" font-size="12" font-weight="600" fill="#1e293b">4D AI 素养框架</text>
  <text x="66" y="174" font-size="11" fill="#64748b">入职第一天开始教</text>
  <rect x="56" y="196" width="218" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="214" font-size="12" font-weight="600" fill="#1e293b">Ever-boarding 常青式入职</text>
  <text x="66" y="230" font-size="11" fill="#64748b">持续的进阶学习项目</text>
  <rect x="56" y="252" width="218" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="270" font-size="12" font-weight="600" fill="#1e293b">Claude Tag 即时答疑</text>
  <text x="66" y="286" font-size="11" fill="#64748b">公司 / 岗位 / 入职问题</text>
  <rect x="56" y="308" width="218" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="326" font-size="12" font-weight="600" fill="#1e293b">Claude 审核 Slack 频道</text>
  <text x="66" y="342" font-size="11" fill="#64748b">覆盖 IT / 法务 / 福利</text>

  <line x1="298" y1="220" x2="336" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="336,214 348,220 336,226" fill="#94a3b8"/>
  <text x="322" y="206" text-anchor="middle" font-size="11" fill="#94a3b8">外化</text>

  <!-- 设计理念 -->
  <rect x="355" y="80" width="250" height="280" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="480" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">设计理念</text>
  <text x="480" y="126" text-anchor="middle" font-size="11" fill="#3b82f6">四条原则，反依赖导向</text>
  <rect x="371" y="140" width="218" height="44" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="381" y="158" font-size="12" font-weight="600" fill="#1e293b">增强能动性，不制造依赖</text>
  <text x="381" y="174" font-size="11" fill="#64748b">围绕学习者要解决的问题</text>
  <rect x="371" y="196" width="218" height="44" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="381" y="214" font-size="12" font-weight="600" fill="#1e293b">心智模式优先于技巧</text>
  <text x="381" y="230" font-size="11" fill="#64748b">功能会过时，判断力可迁移</text>
  <rect x="371" y="252" width="218" height="44" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="381" y="270" font-size="12" font-weight="600" fill="#1e293b">委托与披露超越对话</text>
  <text x="381" y="286" font-size="11" fill="#64748b">交互之外的判断同样是素养</text>
  <rect x="371" y="308" width="218" height="44" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="381" y="326" font-size="12" font-weight="600" fill="#1e293b">学习需要持续投入</text>
  <text x="381" y="342" font-size="11" fill="#64748b">边学边练、反思与实验</text>

  <line x1="613" y1="220" x2="651" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="651,214 663,220 651,226" fill="#94a3b8"/>
  <text x="637" y="206" text-anchor="middle" font-size="11" fill="#94a3b8">落地</text>

  <!-- 对外产品 -->
  <rect x="670" y="80" width="250" height="280" rx="10" fill="#ecfdf5" stroke="#10b981" filter="url(#s)"/>
  <text x="795" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">对外产品</text>
  <text x="795" y="126" text-anchor="middle" font-size="11" fill="#10b981">Claude Academy</text>
  <rect x="686" y="140" width="218" height="44" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="696" y="158" font-size="12" font-weight="600" fill="#1e293b">academy.claude.com</text>
  <text x="696" y="174" font-size="11" fill="#64748b">或 Claude 资料页 "Learn more"</text>
  <rect x="686" y="196" width="218" height="44" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="696" y="214" font-size="12" font-weight="600" fill="#1e293b">model-agnostic 课程</text>
  <text x="696" y="230" font-size="11" fill="#64748b">不绑死单一模型，知识普惠</text>
  <rect x="686" y="252" width="218" height="44" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="696" y="270" font-size="12" font-weight="600" fill="#1e293b">Claude Academy Skill</text>
  <text x="696" y="286" font-size="11" fill="#64748b">按个人工作方式推荐路径</text>
  <rect x="686" y="308" width="218" height="44" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="696" y="326" font-size="12" font-weight="600" fill="#1e293b">进度追踪与徽章</text>
  <text x="696" y="342" font-size="11" fill="#64748b">按兴趣推荐课程</text>

  <rect x="40" y="378" width="880" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="480" y="401" text-anchor="middle" font-size="12" fill="#475569">"AI 素养之旅从入职第一天开始"——先当自己的第一批学员，再做成公开课</text>
</svg>
