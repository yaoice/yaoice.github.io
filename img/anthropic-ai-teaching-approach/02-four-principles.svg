<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">Claude Academy 的四大设计原则</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">摘自《Anthropic's approach to teaching and learning AI》</text>

  <!-- 原则一 -->
  <rect x="40" y="84" width="430" height="200" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <circle cx="92" cy="140" r="20" fill="#3b82f6"/>
  <text x="92" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">01</text>
  <text x="130" y="134" font-size="15" font-weight="700" fill="#1e293b">增强人类能动性</text>
  <text x="130" y="152" font-size="11" fill="#3b82f6">Augment human agency</text>
  <text x="68" y="194" font-size="12" fill="#475569">围绕"学习者要解决的问题"组织课程，而非产品功能；</text>
  <text x="68" y="216" font-size="12" fill="#475569">提防技能萎缩（skill atrophy）：</text>
  <text x="68" y="238" font-size="12" fill="#475569">执行可以外包，判断力必须有意识地维护。</text>

  <!-- 原则二 -->
  <rect x="490" y="84" width="430" height="200" rx="10" fill="#ecfdf5" stroke="#10b981" filter="url(#s)"/>
  <circle cx="542" cy="140" r="20" fill="#10b981"/>
  <text x="542" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">02</text>
  <text x="580" y="134" font-size="15" font-weight="700" fill="#1e293b">心智模式优先</text>
  <text x="580" y="152" font-size="11" fill="#10b981">Mindsets over tricks</text>
  <text x="518" y="194" font-size="12" fill="#475569">"今天的 AI 是你余生用过的最差 AI"；</text>
  <text x="518" y="216" font-size="12" fill="#475569">"验证程度应与风险成正比"；</text>
  <text x="518" y="238" font-size="12" fill="#475569">技巧会过时，判断框架可长期迁移。</text>

  <!-- 原则三 -->
  <rect x="40" y="300" width="430" height="200" rx="10" fill="#fffbeb" stroke="#f59e0b" filter="url(#s)"/>
  <circle cx="92" cy="356" r="20" fill="#f59e0b"/>
  <text x="92" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">03</text>
  <text x="130" y="350" font-size="15" font-weight="700" fill="#1e293b">安全使用超越对话本身</text>
  <text x="130" y="368" font-size="11" fill="#b45309">Beyond the chat</text>
  <text x="68" y="410" font-size="12" fill="#475569">何时委托 AI，何时保留任务；</text>
  <text x="68" y="432" font-size="12" fill="#475569">如何披露 AI 在产出中的参与；</text>
  <text x="68" y="454" font-size="12" fill="#475569">交互之外的判断同样是素养的一部分。</text>

  <!-- 原则四 -->
  <rect x="490" y="300" width="430" height="200" rx="10" fill="#f5f3ff" stroke="#8b5cf6" filter="url(#s)"/>
  <circle cx="542" cy="356" r="20" fill="#8b5cf6"/>
  <text x="542" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">04</text>
  <text x="580" y="350" font-size="15" font-weight="700" fill="#1e293b">学习需要投入</text>
  <text x="580" y="368" font-size="11" fill="#8b5cf6">Learning takes effort</text>
  <text x="518" y="410" font-size="12" fill="#475569">强调边学边练、反思与实验，拒绝"收藏了事"；</text>
  <text x="518" y="432" font-size="12" fill="#475569">官方自我定位："今天的 Claude Academy</text>
  <text x="518" y="454" font-size="12" fill="#475569">将是其最僵化的版本"，未来走向个性化。</text>

  <text x="480" y="536" text-anchor="middle" font-size="12" fill="#475569">四条原则共同指向同一个目标：增强能动性，而非制造依赖</text>
</svg>
