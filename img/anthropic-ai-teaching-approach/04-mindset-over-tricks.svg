<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="460" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">素养 &gt; 技巧：会过时的与不过时的</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">"描述受众"技巧的演变，是这条原则最好的注脚</text>

  <!-- 左：具体技巧 -->
  <rect x="40" y="84" width="420" height="260" rx="10" fill="#f1f5f9" stroke="#94a3b8" filter="url(#s)"/>
  <text x="250" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">具体技巧 · 会过时</text>
  <rect x="56" y="130" width="388" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="56" y="130" width="4" height="52" fill="#f59e0b"/>
  <text x="72" y="151" font-size="12" font-weight="600" fill="#1e293b">手动描述受众："写给法务同事"</text>
  <text x="72" y="170" font-size="11" fill="#64748b">如今 Claude 会主动追问受众与目标</text>
  <rect x="56" y="192" width="388" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="56" y="192" width="4" height="52" fill="#f59e0b"/>
  <text x="72" y="213" font-size="12" font-weight="600" fill="#1e293b">背诵固定的提示词模板</text>
  <text x="72" y="232" font-size="11" fill="#64748b">模型迭代一批，模板换一批</text>
  <rect x="56" y="254" width="388" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="56" y="254" width="4" height="52" fill="#f59e0b"/>
  <text x="72" y="275" font-size="12" font-weight="600" fill="#1e293b">记忆界面功能的位置与开关</text>
  <text x="72" y="294" font-size="11" fill="#64748b">随版本更新即刻失效</text>

  <text x="480" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#94a3b8">vs</text>

  <!-- 右：心智模式 -->
  <rect x="500" y="84" width="420" height="260" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="710" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">心智模式 · 可迁移</text>
  <rect x="516" y="130" width="388" height="52" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <rect x="516" y="130" width="4" height="52" fill="#3b82f6"/>
  <text x="532" y="151" font-size="12" font-weight="600" fill="#1e293b">验证程度应与风险成正比</text>
  <text x="532" y="170" font-size="11" fill="#64748b">比任何模板都长寿的判断框架</text>
  <rect x="516" y="192" width="388" height="52" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <rect x="516" y="192" width="4" height="52" fill="#3b82f6"/>
  <text x="532" y="213" font-size="12" font-weight="600" fill="#1e293b">"今天的 AI 是你余生用过的最差 AI"</text>
  <text x="532" y="232" font-size="11" fill="#64748b">押注能力曲线，不押注版本技巧</text>
  <rect x="516" y="254" width="388" height="52" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <rect x="516" y="254" width="4" height="52" fill="#3b82f6"/>
  <text x="532" y="275" font-size="12" font-weight="600" fill="#1e293b">委托前先问：判断力归谁</text>
  <text x="532" y="294" font-size="11" fill="#64748b">决定哪些环节必须留给自己</text>

  <rect x="40" y="372" width="880" height="46" rx="10" fill="#ecfdf5" stroke="#10b981" filter="url(#s)"/>
  <text x="480" y="401" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">教育的目标：把心智模式装进人脑，而不是把技巧灌给模型</text>
</svg>
