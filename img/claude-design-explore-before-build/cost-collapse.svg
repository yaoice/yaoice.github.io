<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="点击原型的成本从逐屏建模坍塌为一句话">
  <defs>
    <filter id="cc" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .h{font-size:14px;font-weight:700}
      .sh{font-size:11.5px;fill:#94a3b8}
      .sp{font-size:12px;fill:#334155}
      .bd{font-size:10.5px;font-weight:700}
      .l{font-size:11.5px;fill:#475569}
      .note{font-size:12px;font-weight:700}
      .chip{font-size:11.5px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="500" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="42" text-anchor="middle">同一个交互原型，两条完全不同的成本曲线</text>
  <text class="f st" x="600" y="64" text-anchor="middle">传统工具里每个状态都要人手画一遍并连线，这里是「把素材交给它，说：让它跑起来」</text>

  <g filter="url(#cc)">
    <rect x="60" y="90" width="510" height="272" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="630" y="90" width="510" height="272" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="60" y="90" width="510" height="4" rx="2" fill="#f59e0b"/>
  <rect x="630" y="90" width="510" height="4" rx="2" fill="#3b82f6"/>

  <text class="f h" x="84" y="124" fill="#b45309">传统设计工具做点击原型</text>
  <text class="f sh" x="84" y="144">四步都由人完成，且每一步都会被下一次修改作废</text>

  <g class="f">
    <rect x="84" y="158" width="462" height="38" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
    <circle cx="108" cy="177" r="11" fill="#fef3c7"/>
    <text class="bd" x="108" y="181" text-anchor="middle" fill="#b45309">1</text>
    <text class="sp" x="130" y="182">画出每一个屏幕</text>

    <rect x="84" y="204" width="462" height="38" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
    <circle cx="108" cy="223" r="11" fill="#fef3c7"/>
    <text class="bd" x="108" y="227" text-anchor="middle" fill="#b45309">2</text>
    <text class="sp" x="130" y="228">再画出每个屏幕的每一个状态</text>

    <rect x="84" y="250" width="462" height="38" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
    <circle cx="108" cy="269" r="11" fill="#fef3c7"/>
    <text class="bd" x="108" y="273" text-anchor="middle" fill="#b45309">3</text>
    <text class="sp" x="130" y="274">手动把热区和跳转一条条连起来</text>

    <rect x="84" y="296" width="462" height="38" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
    <circle cx="108" cy="315" r="11" fill="#fef3c7"/>
    <text class="bd" x="108" y="319" text-anchor="middle" fill="#b45309">4</text>
    <text class="sp" x="130" y="320">导出截图，发到群里等人看</text>
  </g>
  <text class="f note" x="84" y="352" fill="#b45309">改一处方向 → 基本回到第 1 步重来</text>

  <text class="f h" x="654" y="124" fill="#1d4ed8">Claude Design 做同一件事</text>
  <text class="f sh" x="654" y="144">产物天然带链接，分享成本等于分享一份文档</text>

  <g class="f">
    <rect x="654" y="158" width="462" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="678" cy="177" r="11" fill="#dbeafe"/>
    <text class="bd" x="678" y="181" text-anchor="middle" fill="#1d4ed8">1</text>
    <text class="sp" x="700" y="182">上传素材与品牌文件</text>

    <rect x="654" y="204" width="462" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="678" cy="223" r="11" fill="#dbeafe"/>
    <text class="bd" x="678" y="227" text-anchor="middle" fill="#1d4ed8">2</text>
    <text class="sp" x="700" y="228">说一句「让它跑起来」</text>

    <rect x="654" y="250" width="462" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="678" cy="269" r="11" fill="#dbeafe"/>
    <text class="bd" x="678" y="273" text-anchor="middle" fill="#1d4ed8">3</text>
    <text class="sp" x="700" y="274">拿到一条可分享的链接</text>

    <rect x="654" y="296" width="462" height="38" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text class="sp" x="678" y="320" fill="#047857">省下来的时间去做别的：一次生成 15 个流程版本收反馈</text>
  </g>
  <text class="f note" x="654" y="352" fill="#1d4ed8">改一处方向 → 再说一句话</text>

  <rect x="60" y="382" width="1080" height="86" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="f" x="84" y="412" font-size="12" font-weight="700" fill="#1e293b">成本坍塌的真正后果</text>
  <text class="f l" x="84" y="436">不是「同样的活干得更快」，而是「一次只做一个方案」这个默认前提被取消了。</text>
  <g class="f">
    <rect x="760" y="410" width="120" height="28" rx="14" fill="#e2e8f0"/>
    <text class="chip" x="820" y="429" text-anchor="middle" fill="#475569">单选打磨</text>
    <path d="M894 424L928 424" stroke="#10b981" fill="none" marker-end="url(#ca)"/>
    <rect x="944" y="410" width="120" height="28" rx="14" fill="#d1fae5"/>
    <text class="chip" x="1004" y="429" text-anchor="middle" fill="#047857">十选混搭</text>
  </g>
</svg>
