<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="设计价值向动手之前迁移的全景图">
  <defs>
    <filter id="cs" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <marker id="cml" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .sec{font-size:11px;fill:#94a3b8}
      .num{font-size:11px;fill:#94a3b8}
      .h{font-size:14px;font-weight:700}
      .l{font-size:11.5px;fill:#475569}
      .tag{font-size:10.5px;font-weight:700}
      .ct{font-size:13.5px;font-weight:700;fill:#1e293b}
      .fn{font-size:11px;fill:#94a3b8}
      .q{font-size:12.5px;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="580" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="42" text-anchor="middle">最重要的设计工作，正在向「动手之前」迁移</text>
  <text class="f st" x="600" y="64" text-anchor="middle">Claude Design 作者 Nate Parrott 的 10 条工作方法，与一个关于设计价值位置的判断</text>

  <text class="f sec" x="60" y="96">设计流程中的杠杆分布</text>

  <g filter="url(#cs)">
    <rect x="60" y="110" width="255" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="335" y="110" width="255" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="610" y="110" width="255" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="885" y="110" width="255" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="60" y="110" width="255" height="4" rx="2" fill="#3b82f6"/>
  <rect x="335" y="110" width="255" height="4" rx="2" fill="#3b82f6"/>
  <rect x="610" y="110" width="255" height="4" rx="2" fill="#3b82f6"/>
  <rect x="885" y="110" width="255" height="4" rx="2" fill="#94a3b8"/>

  <g class="f">
    <text class="num" x="80" y="138">01</text>
    <text class="h" x="80" y="162" fill="#1d4ed8">想出好点子</text>
    <text class="l" x="80" y="186">发散、并行试很多方向</text>
    <text class="l" x="80" y="204">线框优先，成本可抛弃</text>
    <rect x="80" y="212" width="64" height="19" rx="9.5" fill="#dbeafe"/>
    <text class="tag" x="112" y="225" text-anchor="middle" fill="#1d4ed8">人的杠杆</text>

    <text class="num" x="355" y="138">02</text>
    <text class="h" x="355" y="162" fill="#1d4ed8">让所有人对齐</text>
    <text class="l" x="355" y="186">把方向做成能点开的东西</text>
    <text class="l" x="355" y="204">共识发生在动工之前</text>
    <rect x="355" y="212" width="64" height="19" rx="9.5" fill="#dbeafe"/>
    <text class="tag" x="387" y="225" text-anchor="middle" fill="#1d4ed8">人的杠杆</text>

    <text class="num" x="630" y="138">03</text>
    <text class="h" x="630" y="162" fill="#1d4ed8">收集早期反馈</text>
    <text class="l" x="630" y="186">想法还便宜的时候就改</text>
    <text class="l" x="630" y="204">一条链接就是一次评审</text>
    <rect x="630" y="212" width="64" height="19" rx="9.5" fill="#dbeafe"/>
    <text class="tag" x="662" y="225" text-anchor="middle" fill="#1d4ed8">人的杠杆</text>

    <text class="num" x="905" y="138">04</text>
    <text class="h" x="905" y="162" fill="#475569">生产级落地</text>
    <text class="l" x="905" y="186">写代码、交付可用软件</text>
    <text class="l" x="905" y="204">这是 Claude Code 的主场</text>
    <rect x="905" y="212" width="88" height="19" rx="9.5" fill="#e2e8f0"/>
    <text class="tag" x="949" y="225" text-anchor="middle" fill="#475569">模型正在接管</text>
  </g>

  <text class="f l" x="600" y="258" text-anchor="middle">价值迁移方向：越靠前越值钱</text>
  <path d="M1140 272L60 272" stroke="#94a3b8" fill="none" marker-end="url(#cml)"/>

  <text class="f sec" x="60" y="306">三条最反直觉的操作</text>
  <g filter="url(#cs)">
    <rect x="60" y="318" width="346" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="426" y="318" width="346" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="792" y="318" width="346" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="60" y="318" width="346" height="4" rx="2" fill="#f59e0b"/>
  <rect x="426" y="318" width="346" height="4" rx="2" fill="#3b82f6"/>
  <rect x="792" y="318" width="346" height="4" rx="2" fill="#10b981"/>

  <g class="f">
    <text class="ct" x="82" y="348">要十个方案，然后混搭</text>
    <text class="l" x="82" y="374">大多数不会好，这没关系，</text>
    <text class="l" x="82" y="392">总有一两个是好的</text>
    <text class="fn" x="82" y="418">再说：把 B 和 D 揉成五个变体</text>

    <text class="ct" x="448" y="348">在远离电脑时把想法想清楚</text>
    <text class="l" x="448" y="374">散步时录语音、沙发上用备忘录打字</text>
    <text class="l" x="448" y="392">坐下来时，Claude 才能执行确切构想</text>
    <text class="fn" x="448" y="418">提示词就是设计意图本身</text>

    <text class="ct" x="814" y="348">最后一公里手动做</text>
    <text class="l" x="814" y="374">重排、删除、改字、缩放、改颜色</text>
    <text class="l" x="814" y="392">直接编辑不消耗 token</text>
    <text class="fn" x="814" y="418">对齐和尺寸，肉眼比描述更准</text>
  </g>

  <rect x="60" y="458" width="1080" height="46" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="f" x="82" y="486" font-size="12" font-weight="700" fill="#b45309">边界</text>
  <text class="f l" x="126" y="486">它没有图像生成模型，别拿它做 logo，导入已有素材；要交付生产环境软件，请用 Claude Code。</text>

  <text class="f q" x="600" y="546" text-anchor="middle">「我们画出的每一样东西都应该默认是活的。」—— Bret Victor《Stop Drawing Dead Fish》</text>
</svg>
