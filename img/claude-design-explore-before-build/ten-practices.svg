<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="10 条工作方法按四个阶段重排">
  <defs>
    <filter id="ps" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .ph{font-size:10.5px;font-weight:700}
      .pt{font-size:13.5px;font-weight:700}
      .it{font-size:12.5px;font-weight:700;fill:#1e293b}
      .l{font-size:11px;fill:#475569}
      .bd{font-size:10.5px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="550" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="42" text-anchor="middle">10 条工作方法，按「谁在出力」重排成四段</text>
  <text class="f st" x="600" y="64" text-anchor="middle">原文是一份并列清单；按阶段排开之后，会看到人和模型的分工线其实很清楚</text>

  <rect x="60" y="88" width="255" height="48" rx="8" fill="#dbeafe"/>
  <text class="f ph" x="80" y="110" fill="#1d4ed8">阶段 A · 人出力</text>
  <text class="f pt" x="80" y="130" fill="#1d4ed8">先想清楚，再开口</text>

  <rect x="335" y="88" width="255" height="48" rx="8" fill="#ede9fe"/>
  <text class="f ph" x="355" y="110" fill="#6d28d9">阶段 B · 人搭台</text>
  <text class="f pt" x="355" y="130" fill="#6d28d9">把品味变成可复用上下文</text>

  <rect x="610" y="88" width="255" height="48" rx="8" fill="#fef3c7"/>
  <text class="f ph" x="630" y="110" fill="#b45309">阶段 C · 模型出力</text>
  <text class="f pt" x="630" y="130" fill="#b45309">把探索成本压到可抛弃</text>

  <rect x="885" y="88" width="255" height="48" rx="8" fill="#d1fae5"/>
  <text class="f ph" x="905" y="110" fill="#047857">阶段 D · 人收口</text>
  <text class="f pt" x="905" y="130" fill="#047857">压缩摩擦，最后一步手动</text>

  <g filter="url(#ps)">
    <rect x="60" y="150" width="255" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="60" y="248" width="255" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="335" y="150" width="255" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="335" y="248" width="255" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="610" y="150" width="255" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="610" y="248" width="255" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="610" y="346" width="255" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="885" y="150" width="255" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="885" y="248" width="255" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="885" y="346" width="255" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <g class="f">
    <rect x="74" y="162" width="26" height="18" rx="4" fill="#dbeafe"/>
    <text class="bd" x="87" y="175" text-anchor="middle" fill="#1d4ed8">01</text>
    <text class="it" x="108" y="176">先思考，再提示</text>
    <text class="l" x="74" y="200">语音口述、手机备忘录打字、</text>
    <text class="l" x="74" y="218">散步录音后粘贴转录稿</text>

    <rect x="74" y="260" width="26" height="18" rx="4" fill="#dbeafe"/>
    <text class="bd" x="87" y="273" text-anchor="middle" fill="#1d4ed8">02</text>
    <text class="it" x="108" y="274">告诉它该长什么样</text>
    <text class="l" x="74" y="298">指定字体与配色，给图片</text>
    <text class="l" x="74" y="316">moodboard，否则它自选美学</text>

    <rect x="349" y="162" width="26" height="18" rx="4" fill="#ede9fe"/>
    <text class="bd" x="362" y="175" text-anchor="middle" fill="#6d28d9">03</text>
    <text class="it" x="383" y="176">把重复工作变设计系统</text>
    <text class="l" x="349" y="200">上传logo、字体规范、幻灯片、</text>
    <text class="l" x="349" y="218">截图，让它分析并生成系统</text>

    <rect x="349" y="260" width="26" height="18" rx="4" fill="#ede9fe"/>
    <text class="bd" x="362" y="273" text-anchor="middle" fill="#6d28d9">09</text>
    <text class="it" x="383" y="274">给它真实上下文</text>
    <text class="l" x="349" y="298">接上 GitHub 抓现有组件与页面，</text>
    <text class="l" x="349" y="316">也支持联网搜索与 MCP 连接</text>

    <rect x="624" y="162" width="26" height="18" rx="4" fill="#fef3c7"/>
    <text class="bd" x="637" y="175" text-anchor="middle" fill="#b45309">04</text>
    <text class="it" x="658" y="176">要十个方案，再混搭</text>
    <text class="l" x="624" y="200">一次生成 15 个流程版本收反馈，</text>
    <text class="l" x="624" y="218">再挑两个揉成五个变体</text>

    <rect x="624" y="260" width="26" height="18" rx="4" fill="#fef3c7"/>
    <text class="bd" x="637" y="273" text-anchor="middle" fill="#b45309">07</text>
    <text class="it" x="658" y="274">保真度不重要时先线框</text>
    <text class="l" x="624" y="298">更快，也让它聚焦设计的高层</text>
    <text class="l" x="624" y="316">结构，而不是视觉细节</text>

    <rect x="624" y="358" width="26" height="18" rx="4" fill="#fef3c7"/>
    <text class="bd" x="637" y="371" text-anchor="middle" fill="#b45309">05</text>
    <text class="it" x="658" y="372">画出你说不清的东西</text>
    <text class="l" x="624" y="396">脑中有布局但没有词汇描述时，</text>
    <text class="l" x="624" y="414">在纸上画出来拍照上传</text>

    <rect x="899" y="162" width="26" height="18" rx="4" fill="#d1fae5"/>
    <text class="bd" x="912" y="175" text-anchor="middle" fill="#047857">06</text>
    <text class="it" x="933" y="176">指着说</text>
    <text class="l" x="899" y="200">点中元素直接语音，不必写一段</text>
    <text class="l" x="899" y="218">话去说明自己指的是哪个</text>

    <rect x="899" y="260" width="26" height="18" rx="4" fill="#d1fae5"/>
    <text class="bd" x="912" y="273" text-anchor="middle" fill="#047857">10</text>
    <text class="it" x="933" y="274">与它并行工作</text>
    <text class="l" x="899" y="298">不必等结果出完再提新需求，</text>
    <text class="l" x="899" y="316">可以排队发多条消息</text>

    <rect x="899" y="358" width="26" height="18" rx="4" fill="#d1fae5"/>
    <text class="bd" x="912" y="371" text-anchor="middle" fill="#047857">08</text>
    <text class="it" x="933" y="372">最后一公里手动做</text>
    <text class="l" x="899" y="396">重排、删除、改字、缩放、改色，</text>
    <text class="l" x="899" y="414">直接编辑不消耗 token</text>
  </g>

  <rect x="60" y="452" width="1080" height="52" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="f" x="82" y="474" font-size="12" font-weight="700" fill="#1e293b">这份清单里的隐含排序</text>
  <text class="f l" x="82" y="494">A 段和 D 段是人的手艺，C 段才是模型真正接管的部分。大多数人只学C，然后抱怨输出不像自己想要的。</text>

  <text class="f st" x="600" y="534" text-anchor="middle">编号沿用原文顺序，分段是本文的重排</text>
</svg>
