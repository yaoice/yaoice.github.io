<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Claude Design 与 Claude Code 的分工与双向往返">
  <defs>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .h{font-size:14px;font-weight:700}
      .l{font-size:11.5px;fill:#475569}
      .fn{font-size:11px;fill:#94a3b8}
      .chip{font-size:11px;fill:#334155}
      .ct{font-size:12.5px;font-weight:700;fill:#1e293b}
      .sec{font-size:11px;fill:#94a3b8}
      .mid{font-size:12px;font-weight:700;fill:#1d4ed8}
    </style>
  </defs>
  <rect width="1200" height="460" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="42" text-anchor="middle">分工：探索归 Design，交付归 Code，中间可以来回走</text>
  <text class="f st" x="600" y="64" text-anchor="middle">两个工具解决的是同一条链路上的不同段落，用错的成本比不用更高</text>

  <g filter="url(#ds)">
    <rect x="60" y="88" width="400" height="212" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="740" y="88" width="400" height="212" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="60" y="88" width="400" height="4" rx="2" fill="#3b82f6"/>
  <rect x="740" y="88" width="400" height="4" rx="2" fill="#475569"/>

  <text class="f h" x="84" y="122" fill="#1d4ed8">Claude Design（Beta）</text>
  <text class="f l" x="84" y="146">定位比产品设计高一层：协作对象是那些</text>
  <text class="f l" x="84" y="164">以沟通与构思为主要任务的视觉物</text>
  <g class="f">
    <rect x="84" y="176" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="139" y="191" text-anchor="middle">幻灯片</text>
    <rect x="205" y="176" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="260" y="191" text-anchor="middle">落地页</text>
    <rect x="326" y="176" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="381" y="191" text-anchor="middle">一页纸 PDF</text>
    <rect x="84" y="206" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="139" y="221" text-anchor="middle">邮件</text>
    <rect x="205" y="206" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="260" y="221" text-anchor="middle">动画</text>
    <rect x="326" y="206" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="381" y="221" text-anchor="middle">社媒物料</text>
    <rect x="84" y="236" width="110" height="22" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
    <text class="chip" x="139" y="251" text-anchor="middle" fill="#1d4ed8">早期线框</text>
    <rect x="205" y="236" width="110" height="22" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
    <text class="chip" x="260" y="251" text-anchor="middle" fill="#1d4ed8">交互原型</text>
    <rect x="326" y="236" width="110" height="22" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
    <text class="chip" x="381" y="251" text-anchor="middle" fill="#1d4ed8">定制小工具</text>
  </g>
  <text class="f fn" x="84" y="282">每个产物都带一条可像分享文档那样分享的链接</text>

  <text class="f h" x="764" y="122" fill="#334155">Claude Code</text>
  <text class="f l" x="764" y="146">定位：写代码，把方案变成能上生产的软件</text>
  <text class="f l" x="764" y="164">设计工作的「其余部分」不在这里发生</text>
  <g class="f">
    <rect x="764" y="176" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="819" y="191" text-anchor="middle">实现功能</text>
    <rect x="885" y="176" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="940" y="191" text-anchor="middle">重构迁移</text>
    <rect x="1006" y="176" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="1061" y="191" text-anchor="middle">测试</text>
    <rect x="764" y="206" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="819" y="221" text-anchor="middle">生产代码</text>
    <rect x="885" y="206" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="940" y="221" text-anchor="middle">上线交付</text>
    <rect x="1006" y="206" width="110" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text class="chip" x="1061" y="221" text-anchor="middle">自主长任务</text>
  </g>
  <text class="f fn" x="764" y="282">Design 里成熟的原型，交接到这里变成真代码</text>

  <text class="f l" x="600" y="152" text-anchor="middle">原型交接去落地</text>
  <path d="M470 166L730 166" stroke="#3b82f6" fill="none" marker-end="url(#da)"/>
  <text class="f mid" x="600" y="196" text-anchor="middle">双向往返</text>
  <text class="f fn" x="600" y="214" text-anchor="middle">round-trip</text>
  <path d="M730 244L470 244" stroke="#94a3b8" fill="none" marker-end="url(#db)"/>
  <text class="f l" x="600" y="264" text-anchor="middle">代码原型同步回画布继续改</text>

  <text class="f sec" x="60" y="330">三条要写清楚的边界</text>
  <g filter="url(#ds)">
    <rect x="60" y="342" width="346" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="426" y="342" width="346" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="792" y="342" width="346" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="60" y="342" width="346" height="4" rx="2" fill="#ef4444"/>
  <rect x="426" y="342" width="346" height="4" rx="2" fill="#3b82f6"/>
  <rect x="792" y="342" width="346" height="4" rx="2" fill="#8b5cf6"/>
  <g class="f">
    <text class="ct" x="82" y="370">它没有图像生成模型</text>
    <text class="l" x="82" y="392">不适合做 logo，正确做法是导入你</text>
    <text class="l" x="82" y="410">已有的 logo 和素材</text>

    <text class="ct" x="448" y="370">要交付软件请用 Claude Code</text>
    <text class="l" x="448" y="392">Design 负责的是早期构思、协作、</text>
    <text class="l" x="448" y="410">以及在动工前为方向争取共识</text>

    <text class="ct" x="814" y="370">它已经不只是 mockup 工具</text>
    <text class="l" x="814" y="392">范围随模型视觉能力上升，覆盖到</text>
    <text class="l" x="814" y="410">任何需要视觉沟通的产物</text>
  </g>
</svg>
