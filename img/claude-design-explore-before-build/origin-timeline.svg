<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Claude Design 从副业原型到正式项目的演进过程">
  <defs>
    <filter id="os" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .ct{font-size:13.5px;font-weight:700;fill:#1e293b}
      .l{font-size:11.5px;fill:#475569}
      .fn{font-size:11px;fill:#94a3b8}
      .bd{font-size:11px;font-weight:700}
      .mid{font-size:12px;font-weight:700;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="540" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="42" text-anchor="middle">Claude Design 的来路：一个追不上工程师的设计师，换了媒介</text>
  <text class="f st" x="600" y="64" text-anchor="middle">从内部小工具到正式产品，转折点不是提示词更长了，而是产物形态变成了 HTML</text>

  <g filter="url(#os)">
    <rect x="60" y="92" width="346" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="426" y="92" width="346" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="792" y="92" width="346" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="60" y="92" width="346" height="4" rx="2" fill="#94a3b8"/>
  <rect x="426" y="92" width="346" height="4" rx="2" fill="#f59e0b"/>
  <rect x="792" y="92" width="346" height="4" rx="2" fill="#ef4444"/>

  <g class="f">
    <circle cx="94" cy="126" r="13" fill="#e2e8f0"/>
    <text class="bd" x="94" y="130" text-anchor="middle" fill="#475569">01</text>
    <text class="ct" x="118" y="131">2025 秋：一个人对两个工程师</text>
    <text class="l" x="82" y="160">Claude Code for VS Code 项目上</text>
    <text class="l" x="82" y="180">唯一的产品设计师</text>
    <text class="l" x="82" y="200">任务是把终端里的体验搬到终端之外</text>
    <text class="fn" x="82" y="226">9 月底发 beta，11 月 Opus 4.5 后团队开始狂奔</text>

    <circle cx="460" cy="126" r="13" fill="#fef3c7"/>
    <text class="bd" x="460" y="130" text-anchor="middle" fill="#b45309">02</text>
    <text class="ct" x="484" y="131">痛点：一条速度差</text>
    <text class="l" x="448" y="160">工程师的交付速度被 AI 大幅拉高</text>
    <text class="l" x="448" y="180">而他「仍以一贯的速度交付」</text>
    <text class="l" x="448" y="200">必须找到追赶的方法</text>
    <text class="fn" x="448" y="226">这就是 Claude Design 的起源动机</text>

    <circle cx="826" cy="126" r="13" fill="#fee2e2"/>
    <text class="bd" x="826" y="130" text-anchor="middle" fill="#b91c1c">03</text>
    <text class="ct" x="850" y="131">第一次尝试：失败</text>
    <text class="l" x="814" y="160">把终端输出加截图贴给 Claude</text>
    <text class="l" x="814" y="180">「这是我们要加的功能，你来设计」</text>
    <text class="l" x="814" y="200">结果：效果很差</text>
    <text class="fn" x="814" y="226">问题不在提示词，在产物形态</text>
  </g>

  <g stroke="#cbd5e1" fill="none" marker-end="url(#oa)">
    <path d="M408 168L423 168"/>
    <path d="M774 168L789 168"/>
  </g>

  <text class="f mid" x="600" y="274" text-anchor="middle">换了媒介之后：从个人小工具变成团队默认工具</text>

  <g filter="url(#os)">
    <rect x="60" y="290" width="346" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="426" y="290" width="346" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="792" y="290" width="346" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="60" y="290" width="346" height="4" rx="2" fill="#3b82f6"/>
  <rect x="426" y="290" width="346" height="4" rx="2" fill="#8b5cf6"/>
  <rect x="792" y="290" width="346" height="4" rx="2" fill="#10b981"/>

  <g class="f">
    <circle cx="94" cy="324" r="13" fill="#dbeafe"/>
    <text class="bd" x="94" y="328" text-anchor="middle" fill="#1d4ed8">04</text>
    <text class="ct" x="118" y="329">关键洞察：Claude 极擅长 HTML</text>
    <text class="l" x="82" y="358">HTML 不只是网页格式，而是丰富的</text>
    <text class="l" x="82" y="378">交互式视觉媒介：幻灯片、视频、PDF</text>
    <text class="l" x="82" y="398">能做的，网页都能做</text>
    <text class="fn" x="82" y="424">于是有了左侧对话、右侧预览的分屏雏形</text>

    <circle cx="460" cy="324" r="13" fill="#ede9fe"/>
    <text class="bd" x="460" y="328" text-anchor="middle" fill="#6d28d9">05</text>
    <text class="ct" x="484" y="329">补上品味：蒸馏品牌</text>
    <text class="l" x="448" y="358">把字体、色彩、素材、原则等品牌精髓</text>
    <text class="l" x="448" y="378">花时间蒸馏成提示词</text>
    <text class="l" x="448" y="398">输出开始自动落在品牌规范内</text>
    <text class="fn" x="448" y="424">做成内部原型分享，设计师立刻拿去做交互稿</text>

    <circle cx="826" cy="324" r="13" fill="#d1fae5"/>
    <text class="bd" x="826" y="328" text-anchor="middle" fill="#047857">06</text>
    <text class="ct" x="850" y="329">转正：一次线下会投的票</text>
    <text class="l" x="814" y="358">Anthropic Labs 线下会想法路演上</text>
    <text class="l" x="814" y="378">每个人都用它临时赶出了幻灯片</text>
    <text class="l" x="814" y="398">有人在轮到自己发言前才做完</text>
    <text class="fn" x="814" y="424">Labs 决定正式投人，副业变成正式项目</text>
  </g>

  <rect x="60" y="462" width="1080" height="52" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="f" x="82" y="484" font-size="12" font-weight="700" fill="#1e293b">这条路径里最值得抄的一步</text>
  <text class="f l" x="82" y="504">不是「怎么让 AI 更懂设计」，而是「换一个 AI 本来就很强的产物形态」——从静态图挪到活的 HTML。</text>
</svg>
