<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="六条可迁移到任何创作场景的原则">
  <defs>
    <filter id="ts" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .ct{font-size:13.5px;font-weight:700;fill:#1e293b}
      .l{font-size:11.5px;fill:#475569}
      .fn{font-size:11px;fill:#94a3b8}
      .bd{font-size:10.5px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="520" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="42" text-anchor="middle">六条可以搬到写代码、写文档、写方案上的原则</text>
  <text class="f st" x="600" y="64" text-anchor="middle">这套方法本质上跟设计无关，它讲的是人和模型在一条创作流水线上怎么分工</text>

  <g filter="url(#ts)">
    <rect x="60" y="88" width="346" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="426" y="88" width="346" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="792" y="88" width="346" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="60" y="258" width="346" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="426" y="258" width="346" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="792" y="258" width="346" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="60" y="88" width="346" height="4" rx="2" fill="#3b82f6"/>
  <rect x="426" y="88" width="346" height="4" rx="2" fill="#f59e0b"/>
  <rect x="792" y="88" width="346" height="4" rx="2" fill="#8b5cf6"/>
  <rect x="60" y="258" width="346" height="4" rx="2" fill="#10b981"/>
  <rect x="426" y="258" width="346" height="4" rx="2" fill="#3b82f6"/>
  <rect x="792" y="258" width="346" height="4" rx="2" fill="#ef4444"/>

  <g class="f">
    <rect x="82" y="106" width="24" height="18" rx="4" fill="#dbeafe"/>
    <text class="bd" x="94" y="119" text-anchor="middle" fill="#1d4ed8">01</text>
    <text class="ct" x="116" y="120">思考前置才是真正的动作</text>
    <text class="l" x="82" y="148">把要什么讲清楚的那段时间，就是</text>
    <text class="l" x="82" y="168">工作本身。散步、备忘录、语音都算</text>
    <text class="fn" x="82" y="196">提示词等于意图，写不清就是想不清</text>
    <text class="fn" x="82" y="216">写代码同理：先说清约束，再让它动手</text>

    <rect x="448" y="106" width="24" height="18" rx="4" fill="#fef3c7"/>
    <text class="bd" x="460" y="119" text-anchor="middle" fill="#b45309">02</text>
    <text class="ct" x="482" y="120">探索要广，不求一次到位</text>
    <text class="l" x="448" y="148">十个里有一两个能用就够。低保真</text>
    <text class="l" x="448" y="168">优先，让「多试」从奢侈变成默认</text>
    <text class="fn" x="448" y="196">先挑，再让它把两个方案揉成变体</text>
    <text class="fn" x="448" y="216">对应写作：先出五个提纲再合并</text>

    <rect x="814" y="106" width="24" height="18" rx="4" fill="#ede9fe"/>
    <text class="bd" x="826" y="119" text-anchor="middle" fill="#6d28d9">03</text>
    <text class="ct" x="848" y="120">上下文比提示词技巧值钱</text>
    <text class="l" x="814" y="148">品牌文件、现有组件、仓库代码，</text>
    <text class="l" x="814" y="168">比任何形容词都管用</text>
    <text class="fn" x="814" y="196">目标是让它从你的既有选择出发</text>
    <text class="fn" x="814" y="216">而不是每次从空白画布重新猜</text>

    <rect x="82" y="276" width="24" height="18" rx="4" fill="#d1fae5"/>
    <text class="bd" x="94" y="289" text-anchor="middle" fill="#047857">04</text>
    <text class="ct" x="116" y="290">最后一公里留给人</text>
    <text class="l" x="82" y="318">对齐、尺寸、微调这类事，动手比</text>
    <text class="l" x="82" y="338">描述更快，而且不消耗 token</text>
    <text class="fn" x="82" y="366">关键能力是判断何时该停止提示</text>
    <text class="fn" x="82" y="386">继续跟模型拉扯往往是负收益</text>

    <rect x="448" y="276" width="24" height="18" rx="4" fill="#dbeafe"/>
    <text class="bd" x="460" y="289" text-anchor="middle" fill="#1d4ed8">05</text>
    <text class="ct" x="482" y="290">原型成为默认的沟通单位</text>
    <text class="l" x="448" y="318">可分享链接取代静态图和长文档，</text>
    <text class="l" x="448" y="338">共识在动工之前就形成</text>
    <text class="fn" x="448" y="366">反馈越早越便宜，这条没有例外</text>
    <text class="fn" x="448" y="386">评审对象从「文档」变成「能点的东西」</text>

    <rect x="814" y="276" width="24" height="18" rx="4" fill="#fee2e2"/>
    <text class="bd" x="826" y="289" text-anchor="middle" fill="#b91c1c">06</text>
    <text class="ct" x="848" y="290">工具边界要写清楚</text>
    <text class="l" x="814" y="318">探索归 Design，交付归 Code，</text>
    <text class="l" x="814" y="338">没有图像模型就别求它画 logo</text>
    <text class="fn" x="814" y="366">用错工具的成本高于不用工具</text>
    <text class="fn" x="814" y="386">先问它擅长什么，再决定交给它什么</text>
  </g>

  <rect x="60" y="428" width="1080" height="62" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="f" x="84" y="454" font-size="12" font-weight="700" fill="#1e293b">一句话</text>
  <text class="f l" x="84" y="476">模型越擅长把东西做出来，做判断的人就越值钱——前提是那个判断，发生在动工之前。</text>
</svg>
