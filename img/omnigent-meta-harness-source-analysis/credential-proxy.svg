<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">凭证代理：让真 secret 从不进入沙箱</text>
  <text x="480" y="64" text-anchor="middle" font-size="12.5" fill="#94a3b8">L7 egress 代理是所有出网流量的强制中间人，凭证在这一跳注入</text>

  <rect x="40" y="88" width="430" height="330" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="255" y="116" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">默认：swap-on-access</text>
  <text x="255" y="136" text-anchor="middle" font-size="11.5" fill="#94a3b8">沙箱里连占位符都没有</text>

  <rect x="62" y="152" width="386" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="82" y="174" font-size="12.5" fill="#1e293b">父进程（未沙箱化）解析真 secret</text>
  <text x="82" y="194" font-size="11.5" fill="#94a3b8">只留在本进程与代理的内存重写表里</text>
  <path d="M 255 206 L 255 220" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="62" y="224" width="386" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="82" y="246" font-size="12.5" fill="#1e293b">沙箱内 git / curl 发出请求</text>
  <text x="82" y="266" font-size="11.5" fill="#94a3b8">不带任何 Authorization 头</text>
  <path d="M 255 278 L 255 292" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="62" y="296" width="386" height="54" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="82" y="318" font-size="12.5" fill="#1e293b">egress MITM 代理识别绑定主机</text>
  <text x="82" y="338" font-size="11.5" fill="#94a3b8">注入 Authorization: &lt;scheme&gt; &lt;real&gt;</text>
  <path d="M 255 350 L 255 364" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="62" y="368" width="386" height="34" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="82" y="390" font-size="12.5" fill="#10b981">上游收到真凭证，返回 200 OK</text>

  <rect x="490" y="88" width="430" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="705" y="116" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">可选：占位符注入</text>
  <text x="705" y="136" text-anchor="middle" font-size="11.5" fill="#94a3b8">给 gh 这类"没本地 token 就不发请求"的客户端</text>

  <rect x="512" y="152" width="386" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="532" y="174" font-size="12.5" fill="#1e293b">父进程铸造 oa_cred_XXX 占位符</text>
  <text x="532" y="194" font-size="11.5" fill="#94a3b8">只把占位符注入 GH_TOKEN，非机密</text>
  <path d="M 705 206 L 705 220" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="512" y="224" width="386" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="532" y="246" font-size="12.5" fill="#1e293b">gh 以为已登录，发出请求</text>
  <text x="532" y="266" font-size="11.5" fill="#94a3b8">Authorization: token oa_cred_XXX</text>
  <path d="M 705 278 L 705 292" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="512" y="296" width="386" height="54" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="532" y="318" font-size="12.5" fill="#1e293b">代理核对主机绑定后替换为真 token</text>
  <text x="532" y="338" font-size="11.5" fill="#94a3b8">客户端自己设的真 Authorization 原样透传</text>
  <path d="M 705 350 L 705 364" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="512" y="368" width="386" height="34" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="532" y="390" font-size="12.5" fill="#ef4444">占位符发往其他主机 → 403，代理不附真凭证</text>

  <rect x="40" y="440" width="880" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="64" y="466" font-size="12.5" fill="#475569">真 secret 永不进 argv、永不落盘到沙箱、不参与 SandboxPolicy 序列化（避免泄进日志与转储）。</text>
  <text x="64" y="488" font-size="12.5" fill="#475569">该配置要求 backend 为 linux_bwrap 或 darwin_seatbelt —— 只有它们能保证 MITM 代理是唯一出网路径。</text>

  <text x="480" y="528" text-anchor="middle" font-size="11.5" fill="#94a3b8">威胁模型：agent 被注入诱导读取环境变量并外传 —— 沙箱里没有可读的真凭证，外传主机也不在 egress 白名单</text>
</svg>
