<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="480" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">Omnigent：架在 harness 之上的那一层</text>
  <text x="480" y="64" text-anchor="middle" font-size="12.5" fill="#94a3b8">不替换你的 agent，而是让它们成为可互操作的一部分</text>

  <rect x="60" y="88" width="260" height="58" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="110" text-anchor="middle" font-size="13.5" fill="#1e293b" font-weight="600">组合 Composition</text>
  <text x="190" y="131" text-anchor="middle" font-size="11.5" fill="#475569">多模型 · 多 harness · 子 agent</text>

  <rect x="350" y="88" width="260" height="58" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="480" y="110" text-anchor="middle" font-size="13.5" fill="#1e293b" font-weight="600">控制 Control</text>
  <text x="480" y="131" text-anchor="middle" font-size="11.5" fill="#475569">状态化策略 · 成本 · 沙箱</text>

  <rect x="640" y="88" width="260" height="58" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="770" y="110" text-anchor="middle" font-size="13.5" fill="#1e293b" font-weight="600">协作 Collaboration</text>
  <text x="770" y="131" text-anchor="middle" font-size="11.5" fill="#475569">共享会话 · 评论 · 共同驾驶</text>

  <path d="M 190 146 L 190 178" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 480 146 L 480 178" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 770 146 L 770 178" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="60" y="180" width="840" height="76" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="480" y="210" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">Omnigent meta-harness</text>
  <text x="480" y="233" text-anchor="middle" font-size="12.5" fill="#475569">统一接口：消息 + 文件 进 → 文本流 + 工具调用 出</text>
  <text x="480" y="249" text-anchor="middle" font-size="11" fill="#94a3b8">Executor 协议 · Runner · Server · 策略引擎 · 权限</text>

  <path d="M 480 256 L 480 282" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 114 282 L 834 282" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 114 282 L 114 316" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 258 282 L 258 316" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 402 282 L 402 316" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 546 282 L 546 316" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 690 282 L 690 316" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 834 282 L 834 316" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="48" y="318" width="132" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="114" y="348" text-anchor="middle" font-size="12.5" fill="#1e293b">Claude Code</text>
  <rect x="192" y="318" width="132" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="258" y="348" text-anchor="middle" font-size="12.5" fill="#1e293b">Codex</text>
  <rect x="336" y="318" width="132" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="402" y="348" text-anchor="middle" font-size="12.5" fill="#1e293b">Cursor</text>
  <rect x="480" y="318" width="132" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="546" y="348" text-anchor="middle" font-size="12.5" fill="#1e293b">Pi</text>
  <rect x="624" y="318" width="132" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="690" y="348" text-anchor="middle" font-size="12.5" fill="#1e293b">OpenCode</text>
  <rect x="768" y="318" width="132" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="834" y="348" text-anchor="middle" font-size="12.5" fill="#1e293b">自定义 YAML</text>

  <text x="480" y="410" text-anchor="middle" font-size="12.5" fill="#475569">harness 各自维护自己的会话、上下文与权限；meta-harness 让会话、策略、技能跟着你走</text>
  <text x="480" y="434" text-anchor="middle" font-size="11.5" fill="#94a3b8">模型和 harness 会一直变，你工作的那一层不该跟着变</text>
</svg>
