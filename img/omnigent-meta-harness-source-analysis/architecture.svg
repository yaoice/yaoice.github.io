<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 546" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="546" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">五层切面：Client / Server / Host / Runner / Harness</text>
  <text x="480" y="64" text-anchor="middle" font-size="12.5" fill="#94a3b8">控制面与数据面分离，每层只做一件事</text>

  <path d="M 80 96 L 80 496" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="110" y="96" width="790" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="134" y="124" font-size="14" fill="#1e293b" font-weight="600">Client</text>
  <text x="230" y="124" font-size="12" fill="#94a3b8">人类 I/O，只说 REST + SSE</text>
  <text x="134" y="147" font-size="12.5" fill="#475569">终端 CLI · Web SPA · iOS / Android · 桌面 App · Python SDK</text>
  <text x="884" y="124" text-anchor="end" font-size="11" fill="#94a3b8">浏览器 / 终端</text>

  <rect x="110" y="182" width="790" height="70" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="134" y="210" font-size="14" fill="#1e293b" font-weight="600">Server（控制面）</text>
  <text x="300" y="210" font-size="12" fill="#94a3b8">持有持久状态</text>
  <text x="134" y="233" font-size="12.5" fill="#475569">会话表 · 鉴权与授权 · 策略 · 共享与权限 · 主机注册表 · 成本账本</text>
  <text x="884" y="210" text-anchor="end" font-size="11" fill="#94a3b8">omnigent server</text>

  <rect x="110" y="268" width="790" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="134" y="296" font-size="14" fill="#1e293b" font-weight="600">Host（可选）</text>
  <text x="262" y="296" font-size="12" fill="#94a3b8">你自己的算力</text>
  <text x="134" y="319" font-size="12.5" fill="#475569">跑在你机器上的守护进程，负责拉起 / 回收 Runner</text>
  <text x="884" y="296" text-anchor="end" font-size="11" fill="#94a3b8">omnigent host</text>

  <rect x="110" y="354" width="790" height="70" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="134" y="382" font-size="14" fill="#1e293b" font-weight="600">Runner（数据面）</text>
  <text x="306" y="382" font-size="12" fill="#94a3b8">一个会话一个进程</text>
  <text x="134" y="405" font-size="12.5" fill="#475569">harness 子进程 · 沙箱环境 · MCP 连接 · 终端 · 文件 · 子 agent 路由</text>
  <text x="884" y="382" text-anchor="end" font-size="11" fill="#94a3b8">omnigent.runner</text>

  <rect x="110" y="440" width="790" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="134" y="468" font-size="14" fill="#1e293b" font-weight="600">Harness 子进程</text>
  <text x="286" y="468" font-size="12" fill="#94a3b8">被包裹的那个 agent</text>
  <text x="134" y="491" font-size="12.5" fill="#475569">把 Claude Code / Codex / Pi / 自定义 agent 适配成统一 HTTP 接口</text>
  <text x="884" y="468" text-anchor="end" font-size="11" fill="#94a3b8">每个会话一个</text>

  <path d="M 80 96 L 80 510" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 80 176 L 80 178" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 80 262 L 80 264" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 80 348 L 80 350" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 80 434 L 80 436" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="480" y="532" text-anchor="middle" font-size="11.5" fill="#94a3b8">Server 决定"能做什么"，Runner 决定"怎么做"；换 harness 只动最底一层</text>
</svg>
