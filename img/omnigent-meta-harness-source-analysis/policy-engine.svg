<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="500" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">策略引擎：六个检查点，三种判定，三级叠加</text>
  <text x="480" y="64" text-anchor="middle" font-size="12.5" fill="#94a3b8">策略本身是无状态纯函数，状态由引擎持有 —— 所以判定可以跨轮次记忆</text>

  <text x="60" y="94" font-size="13" fill="#1e293b" font-weight="600">① 一个 turn 内的六个检查点</text>

  <rect x="60" y="104" width="125" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="122" y="126" text-anchor="middle" font-size="12.5" fill="#1e293b">request</text>
  <text x="122" y="145" text-anchor="middle" font-size="10" fill="#94a3b8">用户消息到达</text>
  <path d="M 185 130 L 203 130" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="203" y="104" width="125" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="265" y="126" text-anchor="middle" font-size="12.5" fill="#1e293b">llm_request</text>
  <text x="265" y="145" text-anchor="middle" font-size="10" fill="#94a3b8">每次 LLM 调用前</text>
  <path d="M 328 130 L 346 130" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="346" y="104" width="125" height="52" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="408" y="126" text-anchor="middle" font-size="12.5" fill="#1e293b">tool_call</text>
  <text x="408" y="145" text-anchor="middle" font-size="10" fill="#94a3b8">工具执行前</text>
  <path d="M 471 130 L 489 130" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="489" y="104" width="125" height="52" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="551" y="126" text-anchor="middle" font-size="12.5" fill="#1e293b">tool_result</text>
  <text x="551" y="145" text-anchor="middle" font-size="10" fill="#94a3b8">结果回灌模型前</text>
  <path d="M 614 130 L 632 130" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="632" y="104" width="125" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="694" y="126" text-anchor="middle" font-size="12.5" fill="#1e293b">llm_response</text>
  <text x="694" y="145" text-anchor="middle" font-size="10" fill="#94a3b8">每次 LLM 返回</text>
  <path d="M 757 130 L 775 130" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="775" y="104" width="125" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="837" y="126" text-anchor="middle" font-size="12.5" fill="#1e293b">response</text>
  <text x="837" y="145" text-anchor="middle" font-size="10" fill="#94a3b8">最终回复前</text>

  <text x="60" y="192" font-size="13" fill="#1e293b" font-weight="600">② 三种判定</text>

  <rect x="60" y="204" width="260" height="74" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="190" y="228" text-anchor="middle" font-size="13.5" fill="#10b981" font-weight="600">ALLOW 放行</text>
  <text x="190" y="249" text-anchor="middle" font-size="11.5" fill="#475569">可用 data 重写负载（如脱敏后的参数）</text>
  <text x="190" y="267" text-anchor="middle" font-size="11.5" fill="#475569">可写 state_updates / set_labels</text>

  <rect x="350" y="204" width="260" height="74" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="480" y="228" text-anchor="middle" font-size="13.5" fill="#f59e0b" font-weight="600">ASK 挂起等人</text>
  <text x="480" y="249" text-anchor="middle" font-size="11.5" fill="#475569">这就是"暂停"：批准 → ALLOW</text>
  <text x="480" y="267" text-anchor="middle" font-size="11.5" fill="#475569">拒绝 / 超时 → DENY</text>

  <rect x="640" y="204" width="260" height="74" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="770" y="228" text-anchor="middle" font-size="13.5" fill="#ef4444" font-weight="600">DENY 阻断</text>
  <text x="770" y="249" text-anchor="middle" font-size="11.5" fill="#475569">携带 reason 回灌给模型</text>
  <text x="770" y="267" text-anchor="middle" font-size="11.5" fill="#475569">让它知道为什么被拒</text>

  <text x="60" y="314" font-size="13" fill="#1e293b" font-weight="600">③ 三级叠加：越靠近会话越优先</text>

  <rect x="60" y="326" width="840" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="349" font-size="12.5" fill="#1e293b">server-wide</text>
  <text x="190" y="349" font-size="11.5" fill="#94a3b8">管理员定底线，写进服务器配置</text>

  <rect x="60" y="366" width="840" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="389" font-size="12.5" fill="#1e293b">per-agent</text>
  <text x="190" y="389" font-size="11.5" fill="#94a3b8">开发者随 agent 一起发布，写进 YAML</text>

  <rect x="60" y="406" width="840" height="36" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="84" y="429" font-size="12.5" fill="#1e293b">per-session</text>
  <text x="190" y="429" font-size="11.5" fill="#94a3b8">使用者在对话里说一句话就加上</text>
  <text x="876" y="429" text-anchor="end" font-size="11" fill="#3b82f6">先检查，最严的赢</text>

  <text x="480" y="474" text-anchor="middle" font-size="11.5" fill="#94a3b8">策略可读：session_state（可变 KV）· 累计 cost · actor · model / harness / labels · 原始 tool_call</text>
</svg>
