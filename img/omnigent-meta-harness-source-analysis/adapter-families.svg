<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="560" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">同一份契约，三条适配路径</text>
  <text x="480" y="64" text-anchor="middle" font-size="12.5" fill="#94a3b8">native 与 SDK 的差别只在子进程内部，对上是同一个 REST / SSE 契约</text>

  <rect x="190" y="86" width="580" height="58" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="480" y="110" text-anchor="middle" font-size="13.5" fill="#1e293b" font-weight="600">runtime/harnesses/&lt;name&gt; · create_app() → FastAPI 子进程</text>
  <text x="480" y="132" text-anchor="middle" font-size="11.5" fill="#475569">名字 → 模块查表；未知 harness 回落到 acp，或提示安装插件包</text>

  <path d="M 190 144 L 190 186" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 480 144 L 480 186" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 770 144 L 770 186" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="60" y="190" width="260" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="78" y="220" font-size="14" fill="#1e293b" font-weight="600">① Native TUI</text>
  <text x="78" y="240" font-size="11.5" fill="#94a3b8">tmux / PTY 包裹现有 CLI</text>
  <path d="M 78 252 L 302 252" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="84" cy="276" r="3" fill="#cbd5e1"/>
  <text x="96" y="280" font-size="12.5" fill="#1e293b">起 tmux 会话跑 claude / codex</text>
  <circle cx="84" cy="310" r="3" fill="#cbd5e1"/>
  <text x="96" y="314" font-size="12.5" fill="#1e293b">bridge 解析终端输出流</text>
  <circle cx="84" cy="344" r="3" fill="#cbd5e1"/>
  <text x="96" y="348" font-size="12.5" fill="#1e293b">forwarder 转成统一事件</text>
  <circle cx="84" cy="378" r="3" fill="#cbd5e1"/>
  <text x="96" y="382" font-size="12.5" fill="#1e293b">权限：hook / 审批镜像</text>
  <circle cx="84" cy="412" r="3" fill="#cbd5e1"/>
  <text x="96" y="416" font-size="12.5" fill="#1e293b">恢复：热重连 WARM_REATTACH</text>
  <text x="78" y="466" font-size="11.5" fill="#475569">保真度最高：原汁原味的厂商 CLI，</text>
  <text x="78" y="484" font-size="11.5" fill="#475569">订阅登录、斜杠命令全部可用。</text>
  <text x="78" y="502" font-size="11.5" fill="#94a3b8">代价：靠解析终端，脆弱且慢。</text>

  <rect x="350" y="190" width="260" height="320" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="368" y="220" font-size="14" fill="#1e293b" font-weight="600">② SDK 进程内</text>
  <text x="368" y="240" font-size="11.5" fill="#94a3b8">inner/*_executor.py</text>
  <path d="M 368 252 L 592 252" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="374" cy="276" r="3" fill="#cbd5e1"/>
  <text x="386" y="280" font-size="12.5" fill="#1e293b">直接调 Agent SDK</text>
  <circle cx="374" cy="310" r="3" fill="#cbd5e1"/>
  <text x="386" y="314" font-size="12.5" fill="#1e293b">原生工具调用 + 流式输出</text>
  <circle cx="374" cy="344" r="3" fill="#cbd5e1"/>
  <text x="386" y="348" font-size="12.5" fill="#1e293b">子 agent 事件归一化</text>
  <circle cx="374" cy="378" r="3" fill="#cbd5e1"/>
  <text x="386" y="382" font-size="12.5" fill="#1e293b">权限：JSON-RPC 回调</text>
  <circle cx="374" cy="412" r="3" fill="#cbd5e1"/>
  <text x="386" y="416" font-size="12.5" fill="#1e293b">usage 与成本可直接取到</text>
  <text x="368" y="466" font-size="11.5" fill="#475569">结构最稳：事件是结构化对象，</text>
  <text x="368" y="484" font-size="11.5" fill="#475569">策略、成本、重试都好接。</text>
  <text x="368" y="502" font-size="11.5" fill="#94a3b8">代价：只覆盖有官方 SDK 的厂商。</text>

  <rect x="640" y="190" width="260" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="658" y="220" font-size="14" fill="#1e293b" font-weight="600">③ ACP 子进程</text>
  <text x="658" y="240" font-size="11.5" fill="#94a3b8">Agent Client Protocol</text>
  <path d="M 658 252 L 882 252" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="664" cy="276" r="3" fill="#cbd5e1"/>
  <text x="676" y="280" font-size="12.5" fill="#1e293b">厂商 CLI over stdio</text>
  <circle cx="664" cy="310" r="3" fill="#cbd5e1"/>
  <text x="676" y="314" font-size="12.5" fill="#1e293b">自带登录，Omnigent 不存凭证</text>
  <circle cx="664" cy="344" r="3" fill="#cbd5e1"/>
  <text x="676" y="348" font-size="12.5" fill="#1e293b">权限走 SSE 权限通道</text>
  <circle cx="664" cy="378" r="3" fill="#cbd5e1"/>
  <text x="676" y="382" font-size="12.5" fill="#1e293b">恢复：仅冷启动</text>
  <circle cx="664" cy="412" r="3" fill="#cbd5e1"/>
  <text x="676" y="416" font-size="12.5" fill="#1e293b">新 agent 注册成本最低</text>
  <text x="658" y="466" font-size="11.5" fill="#475569">生态最广：任何实现了 ACP 的</text>
  <text x="658" y="484" font-size="11.5" fill="#475569">agent 都能挂进来。</text>
  <text x="658" y="502" font-size="11.5" fill="#94a3b8">代价：能力以对方实现为准。</text>

  <text x="480" y="542" text-anchor="middle" font-size="11.5" fill="#94a3b8">三条路共用同一张能力表（capabilities）：能否中断、能否流式、恢复方式、模型族、权限通道</text>
</svg>
