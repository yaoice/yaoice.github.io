<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">组合：一行换 harness，跨厂商交叉评审</text>

  <rect x="60" y="78" width="380" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="250" y="108" text-anchor="middle" font-size="14.5" fill="#1e293b" font-weight="600">① 一行换 harness</text>

  <rect x="84" y="126" width="332" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="146" font-size="11" fill="#94a3b8">before</text>
  <text x="100" y="170" font-size="12.5" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">executor:</text>
  <text x="118" y="190" font-size="12.5" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">type: omnigent</text>
  <text x="118" y="210" font-size="12.5" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">config:</text>
  <text x="136" y="230" font-size="12.5" fill="#1e293b" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">harness: claude-sdk</text>

  <path d="M 250 240 L 250 262" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="262" y="255" font-size="11" fill="#3b82f6">只改这一行</text>

  <rect x="84" y="266" width="332" height="110" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="100" y="286" font-size="11" fill="#94a3b8">after</text>
  <text x="100" y="310" font-size="12.5" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">executor:</text>
  <text x="118" y="330" font-size="12.5" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">type: omnigent</text>
  <text x="118" y="350" font-size="12.5" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">config:</text>
  <text x="136" y="370" font-size="12.5" fill="#1e293b" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">harness: codex-native</text>

  <path d="M 84 404 L 416 404" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <text x="84" y="430" font-size="12.5" fill="#475569">prompt · tools · policies · os_env · terminals</text>
  <text x="84" y="450" font-size="12.5" fill="#475569">一行都不用动。</text>
  <text x="84" y="474" font-size="11.5" fill="#94a3b8">等价写法：omnigent run agent.yaml --harness codex</text>

  <rect x="480" y="78" width="420" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="690" y="108" text-anchor="middle" font-size="14.5" fill="#1e293b" font-weight="600">② 跨厂商编排：Polly</text>

  <rect x="600" y="126" width="180" height="56" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="690" y="148" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">Polly · claude-sdk</text>
  <text x="690" y="168" text-anchor="middle" font-size="11" fill="#94a3b8">只规划，不写代码</text>

  <path d="M 690 182 L 690 200" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 555 200 L 825 200" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 555 200 L 555 238" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>
  <path d="M 690 200 L 690 238" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>
  <path d="M 825 200 L 825 238" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>

  <rect x="495" y="242" width="120" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="555" y="264" text-anchor="middle" font-size="11.5" fill="#1e293b">claude-native</text>
  <text x="555" y="283" text-anchor="middle" font-size="10" fill="#94a3b8">worktree A</text>

  <rect x="630" y="242" width="120" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="690" y="264" text-anchor="middle" font-size="11.5" fill="#1e293b">codex-native</text>
  <text x="690" y="283" text-anchor="middle" font-size="10" fill="#94a3b8">worktree B</text>

  <rect x="765" y="242" width="120" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="825" y="264" text-anchor="middle" font-size="11.5" fill="#1e293b">pi</text>
  <text x="825" y="283" text-anchor="middle" font-size="10" fill="#94a3b8">worktree C</text>

  <path d="M 555 298 L 555 314" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 690 298 L 690 314" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 825 298 L 825 314" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 555 314 L 825 314" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 690 314 L 690 348" fill="none" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrP)"/>

  <rect x="560" y="352" width="260" height="56" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="690" y="374" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">reviewer · 另一家厂商</text>
  <text x="690" y="394" text-anchor="middle" font-size="11" fill="#94a3b8">只看 diff + 契约，不看对方 worktree</text>

  <path d="M 504 428 L 876 428" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <text x="504" y="452" font-size="12" fill="#475569">实现者写，另一家审；交叉验证是目的本身。</text>
  <text x="504" y="472" font-size="12" fill="#475569">Polly 不合并，PR 由人决定。</text>
</svg>
