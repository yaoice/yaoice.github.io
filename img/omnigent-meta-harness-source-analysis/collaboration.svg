<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="524" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">协作：一个会话，多端同步，四级权限</text>
  <text x="480" y="64" text-anchor="middle" font-size="12.5" fill="#94a3b8">不是"把聊天记录发给别人"，而是把同一条会话流扇出给多个客户端</text>

  <rect x="60" y="86" width="250" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="185" y="112" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">权限四级</text>

  <rect x="80" y="126" width="210" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="150" font-size="12.5" fill="#1e293b" font-weight="600">READ · 1</text>
  <text x="100" y="170" font-size="11.5" fill="#475569">订阅 SSE 事件流</text>
  <text x="100" y="189" font-size="11.5" fill="#475569">读消息 / 文件 / 只读终端</text>

  <rect x="80" y="206" width="210" height="76" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="100" y="230" font-size="12.5" fill="#1e293b" font-weight="600">EDIT · 2</text>
  <text x="100" y="250" font-size="11.5" fill="#475569">给 agent 发新指令</text>
  <text x="100" y="269" font-size="11.5" fill="#475569">评论文件 / 响应审批</text>

  <rect x="80" y="286" width="210" height="76" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="100" y="310" font-size="12.5" fill="#1e293b" font-weight="600">MANAGE · 3</text>
  <text x="100" y="330" font-size="11.5" fill="#475569">授予 / 回收他人权限</text>
  <text x="100" y="349" font-size="11.5" fill="#475569">管理会话成员</text>

  <rect x="80" y="366" width="210" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="390" font-size="12.5" fill="#1e293b" font-weight="600">OWNER · 4</text>
  <text x="100" y="410" font-size="11.5" fill="#475569">删除会话 / 拉起主机 / 写 PTY</text>
  <text x="100" y="429" font-size="11.5" fill="#94a3b8">创建时给定，不可转让</text>

  <rect x="340" y="86" width="280" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="112" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">扇出</text>

  <rect x="390" y="126" width="180" height="56" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="480" y="148" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">会话（唯一真相源）</text>
  <text x="480" y="168" text-anchor="middle" font-size="11" fill="#94a3b8">消息 / 子 agent / 终端 / 文件</text>
  <path d="M 480 182 L 480 200" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="366" y="204" width="228" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="224" text-anchor="middle" font-size="11.5" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">GET /v1/sessions/{id}/stream</text>
  <text x="480" y="242" text-anchor="middle" font-size="10.5" fill="#94a3b8">SSE · 连上先发快照 · 结束时 [DONE]</text>

  <path d="M 480 252 L 480 274" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 380 274 L 580 274" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 380 274 L 380 284" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 580 274 L 580 284" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="362" y="288" width="118" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="421" y="313" text-anchor="middle" font-size="12" fill="#1e293b">终端 CLI</text>
  <rect x="500" y="288" width="118" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="559" y="313" text-anchor="middle" font-size="12" fill="#1e293b">Web</text>
  <rect x="362" y="336" width="118" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="421" y="361" text-anchor="middle" font-size="12" fill="#1e293b">iOS / Android</text>
  <rect x="500" y="336" width="118" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="559" y="361" text-anchor="middle" font-size="12" fill="#1e293b">桌面 App</text>
  <rect x="362" y="384" width="118" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="421" y="409" text-anchor="middle" font-size="12" fill="#1e293b">编辑插件</text>
  <rect x="500" y="384" width="118" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="559" y="409" text-anchor="middle" font-size="12" fill="#1e293b">Python SDK</text>

  <text x="480" y="450" text-anchor="middle" font-size="11.5" fill="#475569">同一条流，六个入口</text>
  <text x="480" y="468" text-anchor="middle" font-size="11.5" fill="#94a3b8">presence 按会话树根记录在线者</text>

  <rect x="650" y="86" width="250" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="775" y="112" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">从同一会话派生</text>

  <rect x="670" y="126" width="210" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="690" y="150" font-size="12.5" fill="#1e293b" font-weight="600">Share link</text>
  <text x="690" y="170" font-size="11.5" fill="#475569">发一个链接，对方实时旁观</text>
  <text x="690" y="189" font-size="11.5" fill="#475569">可在文件上留评论</text>

  <rect x="670" y="206" width="210" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="690" y="230" font-size="12.5" fill="#1e293b" font-weight="600">/comments/send</text>
  <text x="690" y="250" font-size="11.5" fill="#475569">评论直接变成给 agent 的指令</text>
  <text x="690" y="269" font-size="11.5" fill="#475569">不必抢占会话</text>

  <rect x="670" y="286" width="210" height="76" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="690" y="310" font-size="12.5" fill="#1e293b" font-weight="600">omnigent attach</text>
  <text x="690" y="330" font-size="11.5" fill="#475569">共同驾驶：对方的消息</text>
  <text x="690" y="349" font-size="11.5" fill="#475569">在你的机器上执行</text>

  <rect x="670" y="366" width="210" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="690" y="390" font-size="12.5" fill="#1e293b" font-weight="600">--fork</text>
  <text x="690" y="410" font-size="11.5" fill="#475569">克隆到自己的机器</text>
  <text x="690" y="429" font-size="11.5" fill="#475569">从分叉点独立继续</text>

  <text x="480" y="504" text-anchor="middle" font-size="11.5" fill="#94a3b8">角色是数字等级而非枚举：管理员可绕过、父 agent 可委派给子 agent、"__public__" 满足只读</text>
</svg>
