<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="660" fill="#f8fafc"/>

  <text x="480" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Codex CLI 分层架构总览</text>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#64748b">一个 Rust workspace、上百个 crate：入口层各走各的协议，最终都汇聚到 codex-core 的同一个事件循环</text>

  <!-- 入口层 -->
  <rect x="40" y="92" width="880" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="116" font-size="12" fill="#94a3b8">入口层</text>
  <g text-anchor="middle">
    <rect x="52" y="128" width="202" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="153" y="151" font-size="13" font-weight="700" fill="#1e293b">TUI 交互终端</text>
    <text x="153" y="170" font-size="11" fill="#64748b">codex（默认）· ratatui 渲染</text>
    <rect x="270" y="128" width="202" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="371" y="151" font-size="13" font-weight="700" fill="#1e293b">codex exec</text>
    <text x="371" y="170" font-size="11" fill="#64748b">非交互 · CI/脚本 · JSONL 输出</text>
    <rect x="488" y="128" width="202" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="589" y="151" font-size="13" font-weight="700" fill="#1e293b">app-server</text>
    <text x="589" y="170" font-size="11" fill="#64748b">JSON-RPC · VS Code 扩展等 IDE</text>
    <rect x="706" y="128" width="202" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="807" y="151" font-size="13" font-weight="700" fill="#1e293b">桌面 / Web</text>
    <text x="807" y="170" font-size="11" fill="#64748b">codex app · ChatGPT 桌面端</text>
  </g>

  <!-- 核心层 -->
  <rect x="40" y="232" width="880" height="128" rx="10" fill="#ffffff" stroke="#3b82f6" filter="url(#soft)"/>
  <text x="60" y="256" font-size="12" fill="#3b82f6">核心编排层 · codex-core</text>
  <g text-anchor="middle">
    <rect x="52" y="268" width="204" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="154" y="292" font-size="13" font-weight="700" fill="#1e293b">Session · run_turn</text>
    <text x="154" y="310" font-size="11" fill="#64748b">事件驱动主循环</text>
    <text x="154" y="326" font-size="11" fill="#64748b">Op 进 / EventMsg 出</text>
    <rect x="272" y="268" width="204" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="374" y="292" font-size="13" font-weight="700" fill="#1e293b">Tools Orchestrator</text>
    <text x="374" y="310" font-size="11" fill="#64748b">工具注册 / 路由 / 审批</text>
    <text x="374" y="326" font-size="11" fill="#64748b">exec · apply_patch · MCP</text>
    <rect x="492" y="268" width="204" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="594" y="292" font-size="13" font-weight="700" fill="#1e293b">Context Manager</text>
    <text x="594" y="310" font-size="11" fill="#64748b">对话历史 · 上下文注入</text>
    <text x="594" y="326" font-size="11" fill="#64748b">compaction 自动压缩</text>
    <rect x="712" y="268" width="196" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="810" y="292" font-size="13" font-weight="700" fill="#1e293b">Multi-Agent</text>
    <text x="810" y="310" font-size="11" fill="#64748b">spawn / mailbox</text>
    <text x="810" y="326" font-size="11" fill="#64748b">review 审查 agent</text>
  </g>

  <!-- 能力层 -->
  <rect x="40" y="388" width="880" height="164" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="412" font-size="12" fill="#94a3b8">能力层（独立 crate，按需被 core 组合）</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <rect x="52" y="424" width="128" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="116" y="449">model-provider 模型抽象</text>
    <rect x="192" y="424" width="128" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="256" y="449">execpolicy 命令策略</text>
    <rect x="332" y="424" width="128" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="396" y="449">sandboxing 三平台沙箱</text>
    <rect x="472" y="424" width="128" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="536" y="449">codex-mcp MCP 客户端</text>
    <rect x="612" y="424" width="128" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="676" y="449">thread-store 持久化</text>
    <rect x="752" y="424" width="156" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="830" y="449">plugins / skills / hooks</text>
    <rect x="52" y="476" width="128" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="116" y="501">cloud-config 云端配置</text>
    <rect x="192" y="476" width="128" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="256" y="501">login OAuth / API Key</text>
    <rect x="332" y="476" width="128" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="396" y="501">protocol 事件协议</text>
    <rect x="472" y="476" width="128" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="536" y="501">exec-server 执行服务</text>
    <rect x="612" y="476" width="128" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="676" y="501">features 灰度开关</text>
    <rect x="752" y="476" width="156" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="830" y="501">agent-identity 身份凭证</text>
  </g>

  <!-- 外部层 -->
  <rect x="40" y="580" width="880" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="160" y="603">OpenAI Responses API</text>
    <text x="160" y="619" font-size="11">SSE / WebSocket 流式</text>
    <text x="400" y="603">MCP 服务器</text>
    <text x="400" y="619" font-size="11">stdio / streamable-http</text>
    <text x="640" y="603">本地沙箱环境</text>
    <text x="640" y="619" font-size="11">bwrap · Seatbelt · AppContainer</text>
    <text x="840" y="603">~/.codex</text>
    <text x="840" y="619" font-size="11">SQLite + rollout</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.2" fill="none" marker-end="url(#arr)">
    <line x1="480" y1="204" x2="480" y2="228"/>
    <line x1="480" y1="360" x2="480" y2="384"/>
    <line x1="480" y1="552" x2="480" y2="576"/>
  </g>
</svg>
