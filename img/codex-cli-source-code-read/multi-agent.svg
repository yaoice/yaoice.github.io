<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>

  <text x="480" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">多 Agent 协作拓扑</text>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#64748b">主 agent 通过 AgentRegistry 派生子 agent：RAII 占位防超发，mailbox 异步投递，父子关系落库可恢复</text>

  <!-- primary -->
  <rect x="360" y="100" width="240" height="72" rx="10" fill="#ffffff" stroke="#3b82f6" filter="url(#soft)"/>
  <text x="480" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Primary Agent（/root）</text>
  <text x="480" y="146" text-anchor="middle" font-size="11" fill="#64748b">用户对话主线程 · 独占 Session</text>
  <text x="480" y="160" text-anchor="middle" font-size="11" fill="#64748b">reserve_spawn_slot → commit（超发保护）</text>

  <!-- registry -->
  <rect x="60" y="214" width="220" height="88" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="170" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">AgentRegistry</text>
  <text x="170" y="258" text-anchor="middle" font-size="11" fill="#475569">agent_tree 路径 → 元数据</text>
  <text x="170" y="274" text-anchor="middle" font-size="11" fill="#475569">SpawnReservation：Drop 即回滚</text>
  <text x="170" y="290" text-anchor="middle" font-size="11" fill="#475569">thread_spawn_edges 落库</text>

  <!-- subagents -->
  <g text-anchor="middle">
    <rect x="330" y="214" width="150" height="88" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="405" y="240" font-size="12" font-weight="700" fill="#1e293b">Explorer</text>
    <text x="405" y="260" font-size="11" fill="#475569">探索类子任务</text>
    <text x="405" y="276" font-size="11" fill="#475569">fork：复制 N 轮历史</text>
    <text x="405" y="292" font-size="11" fill="#475569">能力收敛（role 配置）</text>
    <rect x="510" y="214" width="150" height="88" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="585" y="240" font-size="12" font-weight="700" fill="#1e293b">Worker</text>
    <text x="585" y="260" font-size="11" fill="#475569">执行类子任务</text>
    <text x="585" y="276" font-size="11" fill="#475569">禁用 shell/apps/插件</text>
    <text x="585" y="292" font-size="11" fill="#475569">独立线程 + 独立身份</text>
  </g>

  <!-- mailbox -->
  <rect x="330" y="344" width="300" height="88" rx="10" fill="#ecfdf5" stroke="#86efac"/>
  <text x="480" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Mailbox 消息投递</text>
  <text x="480" y="388" text-anchor="middle" font-size="11" fill="#475569">send_message：入队不触发（QueueOnly）</text>
  <text x="480" y="404" text-anchor="middle" font-size="11" fill="#475569">followup_task：投递并触发新 turn</text>
  <text x="480" y="420" text-anchor="middle" font-size="11" fill="#475569">MailboxDeliveryPhase 状态机</text>

  <!-- review + identity -->
  <rect x="690" y="214" width="230" height="88" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="805" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Review Agent</text>
  <text x="805" y="258" text-anchor="middle" font-size="11" fill="#475569">ReviewTask 单次运行</text>
  <text x="805" y="274" text-anchor="middle" font-size="11" fill="#475569">输出 ReviewOutputEvent</text>
  <text x="805" y="290" text-anchor="middle" font-size="11" fill="#475569">审查结果回注主线程</text>

  <rect x="690" y="344" width="230" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="805" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">agent-identity</text>
  <text x="805" y="388" text-anchor="middle" font-size="11" fill="#475569">ed25519 密钥对</text>
  <text x="805" y="404" text-anchor="middle" font-size="11" fill="#475569">JWT/JWKS 后端身份</text>
  <text x="805" y="420" text-anchor="middle" font-size="11" fill="#475569">audience: codex-app-server</text>

  <!-- 恢复 -->
  <rect x="330" y="472" width="300" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="480" y="496" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">会话恢复（resume）</text>
  <text x="480" y="514" text-anchor="middle" font-size="11" fill="#64748b">BFS 沿 thread_spawn_edges 恢复所有 open 子线程</text>

  <g stroke="#94a3b8" stroke-width="1.2" fill="none" marker-end="url(#arr)">
    <line x1="440" y1="172" x2="170" y2="210"/>
    <line x1="460" y1="172" x2="405" y2="210"/>
    <line x1="520" y1="172" x2="585" y2="210"/>
    <line x1="480" y1="172" x2="805" y2="210"/>
    <line x1="405" y1="302" x2="480" y2="340"/>
    <line x1="585" y1="302" x2="480" y2="340"/>
    <line x1="630" y1="432" x2="480" y2="468"/>
    <line x1="805" y1="432" x2="630" y2="468"/>
    <path d="M745 302 L805 302 L805 340"/>
  </g>
</svg>
