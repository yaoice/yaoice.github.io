<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="上下文预算与渐进式披露：两种加载曲线">
  <defs>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .h{font-size:14px;font-weight:700}
      .s{font-size:12px;fill:#334155}
      .cap{font-size:10.5px;fill:#94a3b8}
      .ax{font-size:10.5px;fill:#94a3b8}
      .lg{font-size:11.5px;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="620" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="40" text-anchor="middle">上下文预算：单体入口的「一次性成本」与三层披露的「按需成本」</text>
  <text class="f st" x="600" y="62" text-anchor="middle">Skill 设计的真实约束不是"写得全不全"，而是"每一次任务要为多少无关内容付费"</text>

  <!-- chart -->
  <rect x="40" y="86" width="700" height="360" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f h" x="64" y="114" fill="#1e293b">典型任务的入口加载量（Markdown 行数量级）</text>

  <!-- axes -->
  <line x1="120" y1="400" x2="700" y2="400" stroke="#cbd5e1"/>
  <line x1="120" y1="140" x2="120" y2="400" stroke="#cbd5e1"/>
  <g class="f ax">
    <text x="112" y="404" text-anchor="end">0</text>
    <text x="112" y="340" text-anchor="end">100</text>
    <text x="112" y="276" text-anchor="end">200</text>
    <text x="112" y="212" text-anchor="end">300</text>
    <text x="112" y="148" text-anchor="end">400</text>
  </g>
  <g stroke="#f1f5f9">
    <line x1="120" y1="340" x2="700" y2="340"/>
    <line x1="120" y1="276" x2="700" y2="276"/>
    <line x1="120" y1="212" x2="700" y2="212"/>
    <line x1="120" y1="148" x2="700" y2="148"/>
  </g>

  <!-- group 1: 发一条消息 -->
  <g class="f">
    <rect x="160" y="210" width="46" height="190" rx="3" fill="#f59e0b"/>
    <text class="cap" x="183" y="204" text-anchor="middle" fill="#b45309">296</text>
    <rect x="214" y="238" width="46" height="162" rx="3" fill="#3b82f6"/>
    <text class="cap" x="237" y="232" text-anchor="middle" fill="#1d4ed8">253</text>
    <text class="ax" x="210" y="420" text-anchor="middle">发一条群消息</text>
    <text class="cap" x="210" y="434" text-anchor="middle">A=全域索引 · B=lark-shared</text>
  </g>

  <!-- group 2: 读表格 -->
  <g class="f">
    <rect x="320" y="210" width="46" height="190" rx="3" fill="#f59e0b"/>
    <text class="cap" x="343" y="204" text-anchor="middle" fill="#b45309">296</text>
    <rect x="374" y="238" width="46" height="162" rx="3" fill="#3b82f6"/>
    <text class="cap" x="397" y="232" text-anchor="middle" fill="#1d4ed8">253</text>
    <text class="ax" x="370" y="420" text-anchor="middle">读取一张表格</text>
    <text class="cap" x="370" y="434" text-anchor="middle">入口成本恒定，与任务无关</text>
  </g>

  <!-- group 3: 深入 base -->
  <g class="f">
    <rect x="480" y="210" width="46" height="190" rx="3" fill="#f59e0b"/>
    <text class="cap" x="503" y="204" text-anchor="middle" fill="#b45309">296</text>
    <rect x="534" y="146" width="46" height="254" rx="3" fill="#3b82f6"/>
    <text class="cap" x="557" y="140" text-anchor="middle" fill="#1d4ed8">400+</text>
    <text class="ax" x="530" y="420" text-anchor="middle">配置 Base 工作流</text>
    <text class="cap" x="530" y="434" text-anchor="middle">B 下钻 2 层，读到需要的深度</text>
  </g>

  <!-- group 4: total -->
  <g class="f">
    <rect x="620" y="356" width="46" height="44" rx="3" fill="#cbd5e1"/>
    <text class="cap" x="643" y="350" text-anchor="middle" fill="#64748b">1.3k</text>
    <text class="ax" x="643" y="420" text-anchor="middle">A 全部内容</text>
    <text class="cap" x="643" y="434" text-anchor="middle">写不下更多了</text>
  </g>

  <g class="f lg">
    <rect x="480" y="122" width="12" height="12" rx="2" fill="#f59e0b"/>
    <text x="498" y="132">WorkBuddy 套件（单入口）</text>
    <rect x="620" y="122" width="12" height="12" rx="2" fill="#3b82f6"/>
    <text x="638" y="132">larksuite/cli（三层）</text>
  </g>

  <!-- right column -->
  <rect x="760" y="86" width="400" height="174" rx="10" fill="#ffffff" stroke="#fcd34d"/>
  <rect x="760" y="86" width="400" height="4" rx="2" fill="#f59e0b"/>
  <text class="f h" x="784" y="116" fill="#b45309">A 的天花板是「入口大小」</text>
  <text class="f cap" x="784" y="138">11 个域压在 296 行里，平均每域只有 20 行余量。</text>
  <text class="f cap" x="784" y="156">结果是每个域只能给到"有哪些 shortcut"的目录级信息，</text>
  <text class="f cap" x="784" y="174">拿不到"参数怎么填、什么时候会踩坑、失败了怎么退避"。</text>
  <text class="f cap" x="784" y="196">而这些恰恰是 Agent 真正会失败的地方。</text>
  <text class="f cap" x="784" y="222">要补细节就得加长入口 → 每次任务都为无关内容付费；</text>
  <text class="f cap" x="784" y="240">不加就只能靠模型猜 → 猜错了没有兜底。这是死结。</text>

  <rect x="760" y="272" width="400" height="174" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="760" y="272" width="400" height="4" rx="2" fill="#3b82f6"/>
  <text class="f h" x="784" y="302" fill="#1d4ed8">B 用「必读清单」把成本转成条件成本</text>
  <text class="f cap" x="784" y="324">lark-doc 的入口不讲细节，只给一张判定表：</text>
  <text class="f cap" x="784" y="346">读文档 → 必读 lark-doc-fetch.md</text>
  <text class="f cap" x="784" y="364">写内容 → 必读 lark-doc-xml.md + lark-doc-style.md</text>
  <text class="f cap" x="784" y="382">改已有 → 再加 lark-doc-update.md 与其 workflow</text>
  <text class="f cap" x="784" y="406">并配一句硬话：「未读完以上文件就执行会导致参数错误」。</text>
  <text class="f cap" x="784" y="428">把"该读什么"变成可判定规则，而不是靠模型自觉。</text>

  <!-- bottom: layer anatomy -->
  <rect x="40" y="462" width="1120" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f h" x="64" y="490" fill="#1e293b">B 的三层解剖：以 lark-whiteboard（30 文件 / 4.9k 行）为例</text>

  <g class="f">
    <rect x="64" y="504" width="250" height="80" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="s" x="80" y="526" font-weight="700" fill="#1d4ed8">L1 · SKILL.md</text>
    <text class="cap" x="80" y="545">只做路由：判断该走 DSL、Mermaid</text>
    <text class="cap" x="80" y="561">还是 SVG，以及是否要隔离到 SubAgent</text>
    <text class="cap" x="80" y="577">常驻上下文的只有这一层</text>

    <rect x="330" y="504" width="250" height="80" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="s" x="346" y="526" font-weight="700" fill="#6d28d9">L2 · routes/ + references/</text>
    <text class="cap" x="346" y="545">按输入形态分流：dsl.md / mermaid.md</text>
    <text class="cap" x="346" y="561">/ svg.md / svg-edit.md</text>
    <text class="cap" x="346" y="577">确定路线后才加载对应一份</text>

    <rect x="596" y="504" width="290" height="80" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text class="s" x="612" y="526" font-weight="700" fill="#047857">L3 · scenes/ + elements/</text>
    <text class="cap" x="612" y="545">15 个图表场景各一文件（泳道图、漏斗、</text>
    <text class="cap" x="612" y="561">鱼骨、飞轮、树图、里程碑…）</text>
    <text class="cap" x="612" y="577">画什么才读什么，其余永不入上下文</text>

    <rect x="902" y="504" width="234" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="s" x="918" y="526" font-weight="700">被 embed 排除的一层</text>
    <text class="cap" x="918" y="545">scripts/ 与 assets/ 不进上下文，</text>
    <text class="cap" x="918" y="561">但随发行版落到磁盘供调用：</text>
    <text class="cap" x="918" y="577">如 slides 的 108KB 排版 lint 脚本</text>
  </g>
</svg>
