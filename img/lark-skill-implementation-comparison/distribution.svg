<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="内容分发链路对比：文件系统快照 vs 二进制内嵌">
  <defs>
    <filter id="sh3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .h{font-size:14px;font-weight:700}
      .s{font-size:12px;fill:#334155}
      .cap{font-size:10.5px;fill:#94a3b8}
      .code{font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="600" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="40" text-anchor="middle">内容分发链路：谁保证「文档写的」等于「CLI 能跑的」</text>
  <text class="f st" x="600" y="62" text-anchor="middle">这是两种实现最本质的工程差异</text>

  <!-- Track A -->
  <rect x="40" y="86" width="1120" height="212" rx="10" fill="#ffffff" stroke="#fcd34d"/>
  <rect x="40" y="86" width="1120" height="4" rx="2" fill="#f59e0b"/>
  <text class="f h" x="64" y="118" fill="#b45309">链路 A · WorkBuddy 飞书套件：内容与二进制解耦（跨组织快照式）</text>

  <g class="f">
    <rect x="64" y="136" width="150" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="s" x="139" y="160" text-anchor="middle" font-weight="700">WorkBuddy 侧读上游</text>
    <text class="cap" x="139" y="177" text-anchor="middle">读 CLI help / 官方文档</text>
    <text class="cap" x="139" y="190" text-anchor="middle">提炼成 Markdown</text>

    <rect x="248" y="136" width="150" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="s" x="323" y="160" text-anchor="middle" font-weight="700">写入 SKILL.md</text>
    <text class="cap" x="323" y="177" text-anchor="middle">version: 1.0.0 手填</text>
    <text class="cap" x="323" y="190" text-anchor="middle">无自动校验</text>

    <rect x="432" y="136" width="150" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="s" x="507" y="160" text-anchor="middle" font-weight="700">发布到 Skill 市场</text>
    <text class="cap" x="507" y="177" text-anchor="middle">skillId + installedAt</text>
    <text class="cap" x="507" y="190" text-anchor="middle">_skillhub_meta.json</text>

    <rect x="616" y="136" width="150" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="s" x="691" y="160" text-anchor="middle" font-weight="700">安装到本地目录</text>
    <text class="cap" x="691" y="177" text-anchor="middle">~/.workbuddy/skills/</text>
    <text class="cap" x="691" y="190" text-anchor="middle">或 ~/.aimea/skills/</text>

    <rect x="800" y="136" width="150" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text class="s" x="875" y="160" text-anchor="middle" font-weight="700">npm 装 CLI</text>
    <text class="cap" x="875" y="177" text-anchor="middle">npm i -g @larksuite/cli</text>
    <text class="cap" x="875" y="190" text-anchor="middle">取到的是 latest</text>

    <rect x="984" y="136" width="152" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text class="s" x="1060" y="160" text-anchor="middle" font-weight="700" fill="#b91c1c">两条线各自漂移</text>
    <text class="cap" x="1060" y="177" text-anchor="middle" fill="#b91c1c">skill 停在写作那天</text>
    <text class="cap" x="1060" y="190" text-anchor="middle" fill="#b91c1c">CLI 一直往前走</text>
  </g>
  <g stroke="#f59e0b" fill="none" marker-end="url(#b1)">
    <path d="M214 167 L244 167"/><path d="M398 167 L428 167"/>
    <path d="M582 167 L612 167"/><path d="M766 167 L796 167"/>
    <path d="M950 167 L980 167"/>
  </g>

  <rect x="64" y="214" width="1072" height="68" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text class="f" x="84" y="236" font-size="12.5" font-weight="700" fill="#b91c1c">实测漂移证据（对照 larksuite/cli main 分支源码逐条核验）</text>
  <g class="f code">
    <text x="84" y="256">config show / config view / config use-config / config set-default / config import-env → 现网 config 仅有 init · show · default-as · risk-control · plugins…</text>
    <text x="84" y="272">~/.lark/config.toml → 实际为 ~/.lark-cli 目录；contact +me / +users-search → 实际是 +get-user / +search-user；im +chat-messages-list 存在但 +messages-mget 语义已变</text>
  </g>

  <!-- Track B -->
  <rect x="40" y="316" width="1120" height="256" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="40" y="316" width="1120" height="4" rx="2" fill="#3b82f6"/>
  <text class="f h" x="64" y="348" fill="#1d4ed8">链路 B · larksuite/cli：内容与二进制强绑定（编译期锁定）</text>

  <g class="f">
    <rect x="64" y="366" width="164" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="s" x="146" y="390" text-anchor="middle" font-weight="700">skills/ 与 cmd/ 同仓</text>
    <text class="cap" x="146" y="407" text-anchor="middle">改 shortcut 的 PR 里</text>
    <text class="cap" x="146" y="420" text-anchor="middle">同时改 SKILL.md</text>

    <rect x="262" y="366" width="164" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="s" x="344" y="390" text-anchor="middle" font-weight="700">go:embed 白名单</text>
    <text class="cap" x="344" y="407" text-anchor="middle">SKILL.md + references</text>
    <text class="cap" x="344" y="420" text-anchor="middle">+ routes + scenes</text>

    <rect x="460" y="366" width="164" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="s" x="542" y="390" text-anchor="middle" font-weight="700">编译进单个二进制</text>
    <text class="cap" x="542" y="407" text-anchor="middle">内容成为程序的一部分</text>
    <text class="cap" x="542" y="420" text-anchor="middle">不可能与 CLI 版本错位</text>

    <rect x="658" y="366" width="164" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="s" x="740" y="390" text-anchor="middle" font-weight="700">skills read 读取</text>
    <text class="cap" x="740" y="407" text-anchor="middle">Agent 走 CLI 子命令取</text>
    <text class="cap" x="740" y="420" text-anchor="middle">而不是猜文件路径</text>

    <rect x="856" y="366" width="280" height="66" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text class="s" x="996" y="390" text-anchor="middle" font-weight="700" fill="#047857">skills-state.json 漂移哨兵</text>
    <text class="cap" x="996" y="407" text-anchor="middle" fill="#047857">本地已装 skill 版本 ≠ 二进制版本</text>
    <text class="cap" x="996" y="420" text-anchor="middle" fill="#047857">→ 输出 _notice.skills 提示 lark-cli update</text>
  </g>
  <g stroke="#3b82f6" fill="none" marker-end="url(#b2)">
    <path d="M228 399 L258 399"/><path d="M426 399 L456 399"/>
    <path d="M624 399 L654 399"/><path d="M822 399 L852 399"/>
  </g>

  <rect x="64" y="448" width="528" height="108" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="f" x="84" y="470" font-size="12.5" font-weight="700" fill="#1e293b">go:embed 是白名单，不是黑名单</text>
  <g class="f code">
    <text x="84" y="492">//go:embed skills/*/SKILL.md skills/*/references</text>
    <text x="84" y="508">            skills/*/routes skills/*/scenes affordance/*.md</text>
  </g>
  <text class="f cap" x="84" y="530">assets/ 与 scripts/ 被刻意排除：机器资源不进上下文，</text>
  <text class="f cap" x="84" y="546">新增内容类型如果没登记进 embed 列表，就默认不下发。</text>

  <rect x="608" y="448" width="528" height="108" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="f" x="628" y="470" font-size="12.5" font-weight="700" fill="#1e293b">降级策略：内容是 nice-to-have，不是 load-bearing</text>
  <text class="f cap" x="628" y="492">embed 装配失败时只向 stderr 打 warning，不 panic——</text>
  <text class="f cap" x="628" y="508">CLI 主体功能照常可用，只是 skills 子命令不可用。</text>
  <text class="f cap" x="628" y="530">另有单文件预览构建（go build ./main.go）故意不带内容，</text>
  <text class="f cap" x="628" y="546">保持产物自包含。这是明确写在注释里的设计取舍。</text>
</svg>
