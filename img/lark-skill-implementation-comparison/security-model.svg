<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="安全模型对比：文本劝导与运行时门禁">
  <defs>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .h{font-size:14px;font-weight:700}
      .s{font-size:12px;fill:#334155}
      .cap{font-size:10.5px;fill:#94a3b8}
      .code{font-family:'SFMono-Regular',Consolas,monospace;font-size:10.5px;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="560" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="40" text-anchor="middle">安全模型：写在文档里的"请注意"，与写在退出码里的"过不去"</text>
  <text class="f st" x="600" y="62" text-anchor="middle">Agent 会执行破坏性操作，差别在于约束是建议性的还是强制性的</text>

  <!-- A -->
  <rect x="40" y="86" width="556" height="300" rx="10" fill="#ffffff" stroke="#fcd34d"/>
  <rect x="40" y="86" width="556" height="4" rx="2" fill="#f59e0b"/>
  <text class="f h" x="64" y="116" fill="#b45309">A · WorkBuddy 飞书套件：纯文本层面的软约束</text>

  <g class="f">
    <rect x="64" y="132" width="508" height="34" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="s" x="80" y="153">「写入/删除操作前必须确认用户意图」</text>
    <text class="cap" x="500" y="153" text-anchor="end">— 建议</text>

    <rect x="64" y="174" width="508" height="34" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="s" x="80" y="195">「用 --dry-run 预览危险请求」</text>
    <text class="cap" x="500" y="195" text-anchor="end">— 建议</text>

    <rect x="64" y="216" width="508" height="34" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="s" x="80" y="237">「禁止输出 appSecret / accessToken 到终端」</text>
    <text class="cap" x="500" y="237" text-anchor="end">— 建议</text>

    <rect x="64" y="258" width="508" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text class="s" x="80" y="279" fill="#b91c1c">未提及：exit 10 强制确认门禁的存在与处理协议</text>
    <text class="cap" x="500" y="279" text-anchor="end" fill="#b91c1c">— 缺口</text>
  </g>

  <rect x="64" y="304" width="508" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="f" x="84" y="326" font-size="12.5" font-weight="700" fill="#1e293b">为什么这是缺口</text>
  <text class="f cap" x="84" y="346">上游对高风险写操作会以退出码 10 拒绝执行。skill 没教这件事，</text>
  <text class="f cap" x="84" y="362">Agent 遇到就会当成普通失败——要么放弃任务，要么盲加 --yes 重试。</text>

  <!-- B -->
  <rect x="620" y="86" width="540" height="300" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="620" y="86" width="540" height="4" rx="2" fill="#3b82f6"/>
  <text class="f h" x="644" y="116" fill="#1d4ed8">B · larksuite/cli：CLI 侧硬门禁 + Skill 侧协议教学</text>

  <g class="f">
    <rect x="644" y="132" width="200" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text class="s" x="744" y="151" text-anchor="middle" font-weight="700">Agent 调高风险命令</text>
    <text class="cap" x="744" y="167" text-anchor="middle">如 drive +delete，未带 --yes</text>

    <rect x="880" y="132" width="256" height="44" rx="6" fill="#fef2f2" stroke="#ef4444"/>
    <text class="s" x="1008" y="151" text-anchor="middle" font-weight="700" fill="#b91c1c">CLI 直接 exit 10，不执行</text>
    <text class="code" x="1008" y="167" text-anchor="middle">error.subtype = confirmation_required</text>
  </g>
  <path d="M844 154 L876 154" stroke="#94a3b8" fill="none" marker-end="url(#d1)"/>

  <g class="f">
    <rect x="644" y="192" width="492" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="s" x="660" y="208" font-weight="700">Step 1 识别</text>
    <text class="cap" x="660" y="224">退出码 10 且 error.type == "confirmation" → 这不是普通错误，不许当失败放弃</text>

    <rect x="644" y="238" width="492" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="s" x="660" y="254" font-weight="700">Step 2 上报</text>
    <text class="cap" x="660" y="270">把 error.action / error.risk 和关键参数摊给用户，明确说"这是高风险操作"</text>

    <rect x="644" y="284" width="492" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text class="s" x="660" y="300" font-weight="700" fill="#047857">Step 3 同意 → 在原始 argv 末尾追加 --yes 重试</text>
    <text class="cap" x="660" y="316" fill="#047857">要求用 exec.Command(argv...) 数组形式，禁止 sh -c 拼串，避免参数被 shell 解析</text>

    <rect x="644" y="330" width="492" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text class="s" x="660" y="346" font-weight="700" fill="#b91c1c">Step 4 拒绝 → 终止，不得改写参数绕过</text>
    <text class="cap" x="660" y="362" fill="#b91c1c">明确列为「绝对不允许」：见 exit 10 就默认加 --yes 静默重试，等于禁用门禁</text>
  </g>

  <!-- bottom -->
  <rect x="40" y="404" width="1120" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f h" x="64" y="432" fill="#1e293b">纵深防御的其余几层（均为 B 独有）</text>
  <g class="f">
    <rect x="64" y="446" width="256" height="82" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="s" x="80" y="468" font-weight="700">路径逃逸拦截</text>
    <text class="cap" x="80" y="486">--file / --output / @file 等路径参数</text>
    <text class="cap" x="80" y="502">只接受 cwd 下相对路径，传绝对路径</text>
    <text class="cap" x="80" y="518">直接报 unsafe file path</text>

    <rect x="336" y="446" width="256" height="82" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="s" x="352" y="468" font-weight="700">身份纠错护栏</text>
    <text class="cap" x="352" y="486">bot 缺权限时明确禁止跑 auth login，</text>
    <text class="cap" x="352" y="502">改为把 console_url 原样交给用户；</text>
    <text class="cap" x="352" y="518">避免 Agent 在两种身份间盲目重试</text>

    <rect x="608" y="446" width="256" height="82" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="s" x="624" y="468" font-weight="700">成功判定契约</text>
    <text class="cap" x="624" y="486">必须用 ok == true 或退出码判断，</text>
    <text class="cap" x="624" y="502">不能沿用 OpenAPI 的 code == 0——</text>
    <text class="cap" x="624" y="518">误判会绕过幂等逻辑导致重复写入</text>

    <rect x="880" y="446" width="256" height="82" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="s" x="896" y="468" font-weight="700">风控信号与开关</text>
    <text class="cap" x="896" y="486">默认随 OpenAPI 请求上报最小风控</text>
    <text class="cap" x="896" y="502">信号（OS 类型 + 机型）识别异常调用，</text>
    <text class="cap" x="896" y="518">可用 config risk-control off 按工作区关闭</text>
  </g>
</svg>
