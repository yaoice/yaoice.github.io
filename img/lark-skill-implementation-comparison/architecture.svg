<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="架构分层对比：单体扇出与领域路由网络">
  <defs>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .h{font-size:14px;font-weight:700}
      .bx{font-size:11.5px;fill:#334155}
      .l{font-size:12px;fill:#475569}
      .cap{font-size:11px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="660" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="40" text-anchor="middle">架构分层：一次扇出 vs 逐级路由</text>
  <text class="f st" x="600" y="62" text-anchor="middle">同样面向 lark-cli，上下文的组织拓扑完全不同</text>

  <!-- divider -->
  <line x1="600" y1="86" x2="600" y2="640" stroke="#e2e8f0" stroke-dasharray="4 4"/>

  <!-- LEFT: monolith -->
  <text class="f h" x="60" y="110" fill="#b45309">A · WorkBuddy 飞书套件：单入口扇出（扁平两层）</text>

  <g filter="url(#sh2)">
    <rect x="150" y="128" width="300" height="52" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text class="f" x="300" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">SKILL.md（296 行 · 唯一入口）</text>
  <text class="f cap" x="300" y="168" text-anchor="middle">11 个域索引 + 全局约定 + 禁令 + 示例</text>

  <!-- fan out lines -->
  <g stroke="#cbd5e1" fill="none" marker-end="url(#a1)">
    <path d="M300 180 L300 200 L80 200 L80 224"/>
    <path d="M300 180 L300 200 L170 200 L170 224"/>
    <path d="M300 180 L300 200 L260 200 L260 224"/>
    <path d="M300 180 L300 200 L350 200 L350 224"/>
    <path d="M300 180 L300 200 L440 200 L440 224"/>
    <path d="M300 180 L300 200 L530 200 L530 224"/>
  </g>

  <g class="f">
    <rect x="44" y="226" width="72" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="bx" x="80" y="247" text-anchor="middle">lark-im</text>
    <rect x="134" y="226" width="72" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="bx" x="170" y="247" text-anchor="middle">lark-doc</text>
    <rect x="224" y="226" width="72" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="bx" x="260" y="247" text-anchor="middle">lark-base</text>
    <rect x="314" y="226" width="72" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="bx" x="350" y="247" text-anchor="middle">lark-sheets</text>
    <rect x="404" y="226" width="72" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="bx" x="440" y="247" text-anchor="middle">…共 12 份</text>
    <rect x="494" y="226" width="72" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="3 2"/>
    <text class="bx" x="530" y="243" text-anchor="middle" fill="#b91c1c">6 个引用</text>
    <text class="bx" x="530" y="255" text-anchor="middle" fill="#b91c1c">指向空文件</text>
  </g>
  <text class="f cap" x="300" y="282" text-anchor="middle">references/ 扁平一层，无跨域跳转，无二级下钻</text>

  <g filter="url(#sh2)">
    <rect x="150" y="302" width="300" height="46" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  </g>
  <text class="f" x="300" y="322" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">scripts/lark_setup.py（215 行）</text>
  <text class="f cap" x="300" y="338" text-anchor="middle">在 skill 内重写认证 device flow</text>

  <path d="M300 348 L300 380" stroke="#cbd5e1" marker-end="url(#a1)" fill="none"/>
  <rect x="150" y="382" width="300" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="f" x="300" y="408" text-anchor="middle" font-size="12.5" fill="#475569">npm 全局包 @larksuite/cli（版本不锁）</text>

  <rect x="44" y="444" width="522" height="176" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f" x="64" y="468" font-size="13" font-weight="700" fill="#1e293b">这个拓扑的代价</text>
  <g class="f l">
    <text x="64" y="494">1. 入口无法瘦身：11 个域的索引必须常驻上下文</text>
    <text x="64" y="518">2. 无路由语义：文档不说"这件事不该我做，去哪个域"</text>
    <text x="64" y="542">3. 无版本轴：整包一个 1.0.0，改任一域都是全量变更</text>
    <text x="64" y="566">4. 断链无人发现：没有构建期校验，坏引用可长期存在</text>
    <text x="64" y="590">5. 认证逻辑二次实现，上游 endpoint 变更即静默失效</text>
  </g>
  <rect x="64" y="600" width="482" height="0" fill="none"/>

  <!-- RIGHT: domain routing -->
  <text class="f h" x="640" y="110" fill="#1d4ed8">B · larksuite/cli：领域路由网络（三层披露）</text>

  <g filter="url(#sh2)">
    <rect x="640" y="128" width="240" height="52" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text class="f" x="760" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">lark-shared（认证基座）</text>
  <text class="f cap" x="760" y="168" text-anchor="middle">所有 skill 头部 CRITICAL 强制先读</text>

  <g filter="url(#sh2)">
    <rect x="900" y="128" width="252" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text class="f" x="1026" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">description 负路由</text>
  <text class="f cap" x="1026" y="168" text-anchor="middle">"不负责 X，走 lark-Y" 写进 frontmatter</text>

  <g stroke="#8b5cf6" fill="none" stroke-dasharray="3 3">
    <path d="M760 180 L760 202 L700 202 L700 218"/>
    <path d="M760 180 L760 202 L860 202 L860 218"/>
    <path d="M760 180 L760 202 L1010 202 L1010 218"/>
  </g>

  <g class="f">
    <rect x="640" y="220" width="120" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text class="bx" x="700" y="238" text-anchor="middle" fill="#1d4ed8">lark-doc v2.0.0</text>
    <text x="700" y="252" text-anchor="middle" font-size="10" fill="#94a3b8">19 文件 / 1.8k 行</text>
    <rect x="778" y="220" width="120" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text class="bx" x="838" y="238" text-anchor="middle" fill="#1d4ed8">lark-sheets v3.0.2</text>
    <text x="838" y="252" text-anchor="middle" font-size="10" fill="#94a3b8">21 文件 / 4.3k 行</text>
    <rect x="916" y="220" width="120" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text class="bx" x="976" y="238" text-anchor="middle" fill="#1d4ed8">lark-base v1.2.3</text>
    <text x="976" y="252" text-anchor="middle" font-size="10" fill="#94a3b8">27 文件 / 8.0k 行</text>
    <rect x="1054" y="220" width="98" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text class="bx" x="1103" y="244" text-anchor="middle">…共 27 个</text>
  </g>

  <g stroke="#3b82f6" fill="none" marker-end="url(#a2)">
    <path d="M700 260 L700 288"/>
    <path d="M838 260 L838 288"/>
    <path d="M976 260 L976 288"/>
  </g>

  <rect x="640" y="290" width="512" height="44" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text class="f" x="660" y="311" font-size="12.5" font-weight="700" fill="#1d4ed8">第二层 references/：按 shortcut 一文一档</text>
  <text class="f cap" x="660" y="327">lark-base 有 26 份专题文档，用到哪个 shortcut 才读哪一份</text>

  <path d="M896 334 L896 356" stroke="#3b82f6" marker-end="url(#a2)" fill="none"/>
  <rect x="640" y="358" width="512" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text class="f" x="660" y="379" font-size="12.5" font-weight="700" fill="#1d4ed8">第三层 领域专属目录：把知识切到题材粒度</text>
  <text class="f cap" x="660" y="396">lark-whiteboard = elements/ + routes/ + scenes/（15 种图表场景各一文件）</text>
  <text class="f cap" x="660" y="411">lark-im = references/card/components/ 下 29 个卡片组件独立文档</text>

  <rect x="640" y="444" width="512" height="176" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f" x="660" y="468" font-size="13" font-weight="700" fill="#1e293b">这个拓扑换来什么</text>
  <g class="f l">
    <text x="660" y="494">1. 入口极薄：只加载命中的那个域，token 花在正确的地方</text>
    <text x="660" y="518">2. 路由可判定：负向描述让 Agent 主动"转诊"而非硬做</text>
    <text x="660" y="542">3. 版本各自演进：sheets 已到 3.x，base 1.2.x，互不牵连</text>
    <text x="660" y="566">4. 交叉引用可校验：../lark-foo/SKILL.md 形式受构建期约束</text>
    <text x="660" y="590">5. 认证只有一处实现，27 个 skill 共享，改一次全都生效</text>
  </g>
</svg>
