<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="两种飞书 Skill 实现全景对比">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .h{font-size:15px;font-weight:700}
      .l{font-size:12.5px;fill:#475569}
      .n{font-size:26px;font-weight:700}
      .nl{font-size:11px;fill:#94a3b8}
      .tag{font-size:11px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="620" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="42" text-anchor="middle">同一个飞书 CLI，两种 Skill 封装范式</text>
  <text class="f st" x="600" y="64" text-anchor="middle">左：WorkBuddy 飞书套件 lark-unified（第三方封装） · 右：larksuite/cli skills（CLI 作者自维护）</text>

  <!-- LEFT -->
  <g filter="url(#sh)">
    <rect x="40" y="90" width="520" height="420" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="40" y="90" width="520" height="4" rx="2" fill="#f59e0b"/>
  <text class="f h" x="64" y="124" fill="#b45309">WorkBuddy 飞书套件 lark-unified</text>
  <text class="f l" x="64" y="146">1 个 SKILL.md 收口 11 个业务域，references/ 扁平分域</text>
  <rect x="64" y="160" width="88" height="20" rx="10" fill="#fef3c7"/>
  <text class="f tag" x="108" y="174" text-anchor="middle" fill="#b45309">手工快照</text>
  <rect x="158" y="160" width="88" height="20" rx="10" fill="#fef3c7"/>
  <text class="f tag" x="202" y="174" text-anchor="middle" fill="#b45309">市场分发</text>
  <rect x="252" y="160" width="100" height="20" rx="10" fill="#fef3c7"/>
  <text class="f tag" x="302" y="174" text-anchor="middle" fill="#b45309">自带引导脚本</text>

  <line x1="64" y1="196" x2="536" y2="196" stroke="#e2e8f0"/>
  <g class="f l">
    <text x="64" y="222">▸ 目录：SKILL.md + references/×12 + scripts/×1 + meta</text>
    <text x="64" y="248">▸ 入口即全景：296 行讲完 11 个域的能力索引</text>
    <text x="64" y="274">▸ 认证：自带 215 行 Python 复刻 device flow，绕开 TTY</text>
    <text x="64" y="300">▸ 显式禁令：禁跑 config init --new / set-default</text>
    <text x="64" y="326">▸ 依赖外部 npm 全局包 @larksuite/cli，版本不锁</text>
    <text x="64" y="352">▸ 引用用相对路径 references/x.md，靠宿主 Read 工具</text>
  </g>

  <rect x="64" y="374" width="472" height="52" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text class="f" x="80" y="396" font-size="12.5" font-weight="700" fill="#b45309">定位：把上游能力压成一份"够用的地图"</text>
  <text class="f l" x="80" y="416">优势是启动成本极低；代价是与上游真实契约会随时间漂移</text>

  <g class="f">
    <text class="n" x="120" y="470" text-anchor="middle" fill="#f59e0b">16</text>
    <text class="nl" x="120" y="490" text-anchor="middle">文件总数</text>
    <text class="n" x="260" y="470" text-anchor="middle" fill="#f59e0b">~1.3k</text>
    <text class="nl" x="260" y="490" text-anchor="middle">Markdown 行</text>
    <text class="n" x="400" y="470" text-anchor="middle" fill="#f59e0b">1</text>
    <text class="nl" x="400" y="490" text-anchor="middle">Skill 单元</text>
    <text class="n" x="510" y="470" text-anchor="middle" fill="#ef4444">6/16</text>
    <text class="nl" x="510" y="490" text-anchor="middle">引用断链</text>
  </g>

  <!-- VS -->
  <circle cx="600" cy="300" r="24" fill="#1e293b"/>
  <text class="f" x="600" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">VS</text>

  <!-- RIGHT -->
  <g filter="url(#sh)">
    <rect x="640" y="90" width="520" height="420" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="640" y="90" width="520" height="4" rx="2" fill="#3b82f6"/>
  <text class="f h" x="664" y="124" fill="#1d4ed8">larksuite/cli · 官方内置 skills</text>
  <text class="f l" x="664" y="146">27 个独立 Skill，各自版本演进，共享 lark-shared 认证基座</text>
  <rect x="664" y="160" width="88" height="20" rx="10" fill="#dbeafe"/>
  <text class="f tag" x="708" y="174" text-anchor="middle" fill="#1d4ed8">go:embed</text>
  <rect x="758" y="160" width="100" height="20" rx="10" fill="#dbeafe"/>
  <text class="f tag" x="808" y="174" text-anchor="middle" fill="#1d4ed8">版本漂移检测</text>
  <rect x="864" y="160" width="88" height="20" rx="10" fill="#dbeafe"/>
  <text class="f tag" x="908" y="174" text-anchor="middle" fill="#1d4ed8">质量门禁</text>

  <line x1="664" y1="196" x2="1136" y2="196" stroke="#e2e8f0"/>
  <g class="f l">
    <text x="664" y="222">▸ 内容与二进制同仓同版本，随 CLI 一起编译进可执行文件</text>
    <text x="664" y="248">▸ 三层披露：SKILL.md → references/ → elements/routes/scenes</text>
    <text x="664" y="274">▸ 认证：CLI 原生 split-flow（--no-wait / --device-code）</text>
    <text x="664" y="300">▸ 高风险写操作强制门禁：exit 10 + confirmation_required</text>
    <text x="664" y="326">▸ 重型脚本随 skill 下发（108KB 排版 lint、33KB 校验器）</text>
    <text x="664" y="352">▸ Agent 用 lark-cli skills read 取内容，不依赖文件系统布局</text>
  </g>

  <rect x="664" y="374" width="472" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="f" x="680" y="396" font-size="12.5" font-weight="700" fill="#1d4ed8">定位：把 Skill 当产品代码维护，和 CLI 锁死同步</text>
  <text class="f l" x="680" y="416">优势是契约永不失真；代价是内容体量大、构建链路更重</text>

  <g class="f">
    <text class="n" x="720" y="470" text-anchor="middle" fill="#3b82f6">458</text>
    <text class="nl" x="720" y="490" text-anchor="middle">文件总数</text>
    <text class="n" x="860" y="470" text-anchor="middle" fill="#3b82f6">57.5k</text>
    <text class="nl" x="860" y="490" text-anchor="middle">Markdown 行</text>
    <text class="n" x="1000" y="470" text-anchor="middle" fill="#3b82f6">27</text>
    <text class="nl" x="1000" y="490" text-anchor="middle">Skill 单元</text>
    <text class="n" x="1110" y="470" text-anchor="middle" fill="#10b981">0</text>
    <text class="nl" x="1110" y="490" text-anchor="middle">引用断链</text>
  </g>

  <rect x="40" y="534" width="1120" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f" x="60" y="558" font-size="12.5" font-weight="700" fill="#1e293b">核心分歧点</text>
  <text class="f l" x="60" y="578">Skill 内容是「独立可分发的文档资产」，还是「必须与 CLI 二进制同生命周期的编译产物」——这一个选择决定了其余全部设计差异。</text>
</svg>
