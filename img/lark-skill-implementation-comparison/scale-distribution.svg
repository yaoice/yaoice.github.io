<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="27 个官方 Skill 的规模分布与职责切分">
  <defs>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .h{font-size:14px;font-weight:700;fill:#1e293b}
      .nm{font-size:11px;fill:#334155}
      .vl{font-size:10.5px;fill:#94a3b8}
      .cap{font-size:10.5px;fill:#94a3b8}
      .lg{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="520" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="40" text-anchor="middle">官方 27 个 Skill 的规模分布：能力密度不是均匀的</text>
  <text class="f st" x="600" y="62" text-anchor="middle">横轴为该 Skill 的 Markdown 总行数，可见「有多少知识需要沉淀」在域之间差 100 倍</text>

  <!-- legend -->
  <g class="f lg">
    <rect x="880" y="80" width="12" height="12" rx="2" fill="#3b82f6"/><text x="898" y="90">文档与内容</text>
    <rect x="990" y="80" width="12" height="12" rx="2" fill="#10b981"/><text x="1008" y="90">协作办公</text>
    <rect x="1084" y="80" width="12" height="12" rx="2" fill="#8b5cf6"/><text x="1102" y="90">平台能力</text>
  </g>

  <rect x="40" y="100" width="1120" height="290" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- bars: scale 8127 -> 700px -->
  <g class="f">
    <text class="nm" x="180" y="132" text-anchor="end">lark-drive</text>
    <rect x="192" y="122" width="700" height="13" rx="3" fill="#3b82f6"/>
    <text class="vl" x="900" y="132">8127 行 / 58 文件</text>

    <text class="nm" x="180" y="152" text-anchor="end">lark-base</text>
    <rect x="192" y="142" width="692" height="13" rx="3" fill="#3b82f6"/>
    <text class="vl" x="900" y="152">8033 行 / 27 文件</text>

    <text class="nm" x="180" y="172" text-anchor="end">lark-im</text>
    <rect x="192" y="162" width="481" height="13" rx="3" fill="#10b981"/>
    <text class="vl" x="900" y="172">5585 行 / 59 文件</text>

    <text class="nm" x="180" y="192" text-anchor="end">lark-whiteboard</text>
    <rect x="192" y="182" width="420" height="13" rx="3" fill="#3b82f6"/>
    <text class="vl" x="900" y="192">4881 行 / 30 文件</text>

    <text class="nm" x="180" y="212" text-anchor="end">lark-sheets</text>
    <rect x="192" y="202" width="370" height="13" rx="3" fill="#3b82f6"/>
    <text class="vl" x="900" y="212">4298 行 / 21 文件</text>

    <text class="nm" x="180" y="232" text-anchor="end">lark-mail</text>
    <rect x="192" y="222" width="355" height="13" rx="3" fill="#10b981"/>
    <text class="vl" x="900" y="232">4121 行 / 34 文件</text>

    <text class="nm" x="180" y="252" text-anchor="end">lark-slides</text>
    <rect x="192" y="242" width="308" height="13" rx="3" fill="#3b82f6"/>
    <text class="vl" x="900" y="252">3581 行 / 29 文件</text>

    <text class="nm" x="180" y="272" text-anchor="end">lark-apps</text>
    <rect x="192" y="262" width="275" height="13" rx="3" fill="#8b5cf6"/>
    <text class="vl" x="900" y="272">3192 行 / 54 文件</text>

    <text class="nm" x="180" y="292" text-anchor="end">lark-okr</text>
    <rect x="192" y="282" width="235" height="13" rx="3" fill="#10b981"/>
    <text class="vl" x="900" y="292">2731 行 / 19 文件</text>

    <text class="nm" x="180" y="312" text-anchor="end">lark-approval</text>
    <rect x="192" y="302" width="202" height="13" rx="3" fill="#10b981"/>
    <text class="vl" x="900" y="312">2342 行 / 17 文件</text>

    <text class="nm" x="180" y="332" text-anchor="end">lark-doc</text>
    <rect x="192" y="322" width="158" height="13" rx="3" fill="#3b82f6"/>
    <text class="vl" x="900" y="332">1832 行 / 19 文件</text>

    <text class="nm" x="180" y="352" text-anchor="end">lark-shared</text>
    <rect x="192" y="342" width="22" height="13" rx="3" fill="#8b5cf6"/>
    <text class="vl" x="900" y="352">253 行 / 2 文件（刻意保持极薄）</text>

    <text class="nm" x="180" y="372" text-anchor="end">lark-attendance</text>
    <rect x="192" y="362" width="5" height="13" rx="3" fill="#10b981"/>
    <text class="vl" x="900" y="372">57 行 / 1 文件（简单域就该简单）</text>
  </g>

  <!-- insight -->
  <rect x="40" y="404" width="366" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f h" x="60" y="428">头部两域吃掉 28% 的内容</text>
  <text class="f cap" x="60" y="450">drive 与 base 各 8k 行，因为它们是"结构最复杂、</text>
  <text class="f cap" x="60" y="466">调用参数最容易填错"的域：字段类型、公式、lookup、</text>
  <text class="f cap" x="60" y="482">权限角色、导入导出格式，每一项都值得单独一份文档。</text>
  <text class="f cap" x="60" y="498">复杂度不是被抽象掉，而是被显式沉淀下来。</text>

  <rect x="418" y="404" width="366" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f h" x="438" y="428">文件数与行数不成正比</text>
  <text class="f cap" x="438" y="450">lark-im 59 个文件只有 5.6k 行，平均每文件不到 100 行——</text>
  <text class="f cap" x="438" y="466">因为它把 29 个卡片组件各自拆成一份小文档。</text>
  <text class="f cap" x="438" y="482">这是刻意的：Agent 要画一个按钮，就只读 button.md，</text>
  <text class="f cap" x="438" y="498">不必把整套 Card 2.0 Schema 拖进上下文。</text>

  <rect x="796" y="404" width="364" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f h" x="816" y="428">最重要的 Skill 反而最薄</text>
  <text class="f cap" x="816" y="450">lark-shared 只有 253 行，却被 27 个 skill 在头部以</text>
  <text class="f cap" x="816" y="466">CRITICAL 强制引用。它薄是因为它必须薄：</text>
  <text class="f cap" x="816" y="482">这是每次任务都要付的固定成本，多写一行，</text>
  <text class="f cap" x="816" y="498">就是给所有域的所有调用都加一行税。</text>
</svg>
