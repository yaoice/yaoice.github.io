<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="命令契约漂移实测：本地 skill 声称的命令与上游源码逐条核对">
  <defs>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .th{font-size:11.5px;font-weight:700;fill:#64748b}
      .code{font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;fill:#334155}
      .codeg{font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;fill:#047857}
      .coder{font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;fill:#b91c1c}
      .n{font-size:11px;fill:#64748b}
      .big{font-size:30px;font-weight:700}
      .bl{font-size:11px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="580" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="40" text-anchor="middle">契约漂移实测：把 WorkBuddy 飞书套件写的命令拿去和上游源码对账</text>
  <text class="f st" x="600" y="62" text-anchor="middle">核对基准：larksuite/cli main 分支的 cmd/config、shortcuts/*、internal/core/workspace.go</text>

  <!-- score strip -->
  <rect x="40" y="86" width="1120" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <g class="f">
    <text class="big" x="130" y="128" text-anchor="middle" fill="#ef4444">5</text>
    <text class="bl" x="130" y="148" text-anchor="middle">config 子命令不存在</text>
    <line x1="240" y1="102" x2="240" y2="146" stroke="#e2e8f0"/>
    <text class="big" x="350" y="128" text-anchor="middle" fill="#ef4444">3</text>
    <text class="bl" x="350" y="148" text-anchor="middle">shortcut 名对不上</text>
    <line x1="460" y1="102" x2="460" y2="146" stroke="#e2e8f0"/>
    <text class="big" x="570" y="128" text-anchor="middle" fill="#f59e0b">1</text>
    <text class="bl" x="570" y="148" text-anchor="middle">配置文件路径与格式误述</text>
    <line x1="700" y1="102" x2="700" y2="146" stroke="#e2e8f0"/>
    <text class="big" x="810" y="128" text-anchor="middle" fill="#ef4444">6</text>
    <text class="bl" x="810" y="148" text-anchor="middle">references 引用指向空文件</text>
    <line x1="950" y1="102" x2="950" y2="146" stroke="#e2e8f0"/>
    <text class="big" x="1055" y="128" text-anchor="middle" fill="#f59e0b">0</text>
    <text class="bl" x="1055" y="148" text-anchor="middle">提及 exit 10 风险门禁</text>
  </g>

  <!-- table -->
  <rect x="40" y="178" width="1120" height="298" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f th" x="64" y="202">SKILL.md / references 中写的</text>
  <text class="f th" x="500" y="202">上游 main 分支的真实情况</text>
  <text class="f th" x="920" y="202">后果</text>
  <line x1="56" y1="212" x2="1144" y2="212" stroke="#cbd5e1"/>

  <g class="f">
    <rect x="56" y="216" width="1088" height="30" fill="#fef2f2"/>
    <text class="coder" x="64" y="236">lark-cli config show / config view</text>
    <text class="code" x="500" y="236">仅 show 存在；view 从未注册</text>
    <text class="n" x="920" y="236">「验证配置」这一步直接失败</text>

    <rect x="56" y="248" width="1088" height="30" fill="#fef2f2"/>
    <text class="coder" x="64" y="268">config use-config &lt;name&gt; 切换多套配置</text>
    <text class="code" x="500" y="268">无此命令；多环境走全局 --profile</text>
    <text class="n" x="920" y="268">多环境用法教错，Agent 会反复试错</text>

    <rect x="56" y="280" width="1088" height="30" fill="#fef2f2"/>
    <text class="coder" x="64" y="300">config set-default（被列为 FORBIDDEN）</text>
    <text class="code" x="500" y="300">现在叫 config default-as [user|bot|auto]</text>
    <text class="n" x="920" y="300">禁令指向一个已不存在的命令</text>

    <rect x="56" y="312" width="1088" height="30" fill="#fef2f2"/>
    <text class="coder" x="64" y="332">config import-env（配环境变量凭据）</text>
    <text class="code" x="500" y="332">未找到该子命令</text>
    <text class="n" x="920" y="332">安全最佳实践段落不可执行</text>

    <rect x="56" y="344" width="1088" height="30" fill="#fef2f2"/>
    <text class="coder" x="64" y="364">配置存于 ~/.lark/config.toml（含 TOML 示例）</text>
    <text class="code" x="500" y="364">实为 ~/.lark-cli（或 LARKSUITE_CLI_CONFIG_DIR）</text>
    <text class="n" x="920" y="364">路径与格式双错，排障会走偏</text>

    <rect x="56" y="376" width="1088" height="30" fill="#fef2f2"/>
    <text class="coder" x="64" y="396">contact +me / +users-search / +departments-list</text>
    <text class="code" x="500" y="396">实为 +get-user / +search-user / +search-bot</text>
    <text class="n" x="920" y="396">通讯录三个 shortcut 全部叫不出来</text>

    <rect x="56" y="408" width="1088" height="30" fill="#fffbeb"/>
    <text class="coder" x="64" y="428">sheets +spreadsheets-read / -append / -create</text>
    <text class="code" x="500" y="428">实为 +cells-get / +cells-set / +workbook-create</text>
    <text class="n" x="920" y="428">表格域的示例命令基本无法直接跑</text>

    <rect x="56" y="440" width="1088" height="30" fill="#fffbeb"/>
    <text class="coder" x="64" y="460">--table / --csv / --yaml / --raw 输出开关</text>
    <text class="code" x="500" y="460">统一为 --format json|pretty|table|ndjson|csv</text>
    <text class="n" x="920" y="460">无 yaml/raw；参数形态也已改变</text>
  </g>

  <rect x="40" y="492" width="1120" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f" x="60" y="516" font-size="12.5" font-weight="700" fill="#1e293b">这不是「谁写得更认真」的问题</text>
  <text class="f n" x="60" y="538">lark-unified 的漂移是范式的必然结果：把上游能力抄成独立快照，就必然要为同步付出人力，而人力同步不会发生。反过来说，</text>
  <text class="f n" x="60" y="552">larksuite/cli 用 go:embed 把内容钉在二进制上，本质是用编译期约束替代了「记得更新文档」这条注定失效的人类流程。</text>
</svg>
