<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="扩展性对比与选型决策路径">
  <defs>
    <marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .f{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .t{font-size:18px;font-weight:700;fill:#1e293b}
      .st{font-size:13px;fill:#94a3b8}
      .h{font-size:14px;font-weight:700}
      .s{font-size:12px;fill:#334155}
      .cap{font-size:10.5px;fill:#94a3b8}
      .q{font-size:12px;font-weight:700;fill:#1e293b}
      .yn{font-size:10.5px;font-weight:700;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="600" rx="10" fill="#f8fafc"/>
  <text class="f t" x="600" y="40" text-anchor="middle">扩展性：加一个新能力，两种范式各要动几处</text>
  <text class="f st" x="600" y="62" text-anchor="middle">以及一条给实践者的选型判定路径</text>

  <!-- extension comparison -->
  <rect x="40" y="86" width="556" height="240" rx="10" fill="#ffffff" stroke="#fcd34d"/>
  <rect x="40" y="86" width="556" height="4" rx="2" fill="#f59e0b"/>
  <text class="f h" x="64" y="116" fill="#b45309">A · 扩展点只有一个：往 SKILL.md 再加一节</text>
  <g class="f">
    <rect x="64" y="132" width="140" height="40" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="s" x="134" y="149" text-anchor="middle">加一段域介绍</text>
    <text class="cap" x="134" y="164" text-anchor="middle">入口再长几十行</text>
    <rect x="222" y="132" width="140" height="40" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="s" x="292" y="149" text-anchor="middle">加一份 references</text>
    <text class="cap" x="292" y="164" text-anchor="middle">扁平目录再多一个</text>
    <rect x="380" y="132" width="192" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text class="s" x="476" y="149" text-anchor="middle" fill="#b91c1c">整包 version 一起动</text>
    <text class="cap" x="476" y="164" text-anchor="middle" fill="#b91c1c">无法只发布一个域</text>
  </g>
  <g stroke="#94a3b8" fill="none" marker-end="url(#e1)">
    <path d="M204 152 L218 152"/><path d="M362 152 L376 152"/>
  </g>
  <rect x="64" y="188" width="508" height="122" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="f s" x="84" y="210" font-weight="700">缺失的扩展设施</text>
  <g class="f cap">
    <text x="84" y="232">· 没有 skill 之间的依赖声明（无 requires / siblings 语义）</text>
    <text x="84" y="250">· 没有 cliHelp 之类的"能力自查入口"，Agent 无法自行核对命令是否存在</text>
    <text x="84" y="268">· 没有第三层目录约定，重型知识（如卡片组件、图表场景）无处安放</text>
    <text x="84" y="286">· 没有构建期检查，新增引用写错也不会有人知道</text>
    <text x="84" y="304">· 复制这份 skill 做二次开发时，唯一可行的路径是继续加长同一个文件</text>
  </g>

  <rect x="620" y="86" width="540" height="240" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="620" y="86" width="540" height="4" rx="2" fill="#3b82f6"/>
  <text class="f h" x="644" y="116" fill="#1d4ed8">B · 扩展是一条有配套设施的既定流水线</text>
  <g class="f">
    <rect x="644" y="132" width="118" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text class="s" x="703" y="149" text-anchor="middle">skill-maker</text>
    <text class="cap" x="703" y="164" text-anchor="middle">给出标准模板</text>
    <rect x="778" y="132" width="118" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text class="s" x="837" y="149" text-anchor="middle">openapi-explorer</text>
    <text class="cap" x="837" y="164" text-anchor="middle">挖未封装的接口</text>
    <rect x="912" y="132" width="108" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text class="s" x="966" y="149" text-anchor="middle">skill-template</text>
    <text class="cap" x="966" y="164" text-anchor="middle">13 个域模板</text>
    <rect x="1036" y="132" width="100" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text class="s" x="1086" y="149" text-anchor="middle" fill="#047857">独立版本号</text>
    <text class="cap" x="1086" y="164" text-anchor="middle" fill="#047857">单域可发布</text>
  </g>
  <g stroke="#94a3b8" fill="none" marker-end="url(#e1)">
    <path d="M762 152 L774 152"/><path d="M896 152 L908 152"/><path d="M1020 152 L1032 152"/>
  </g>
  <rect x="644" y="188" width="492" height="122" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="f s" x="664" y="210" font-weight="700">skill-maker 给的不只是模板，还是一条优先级铁律</text>
  <g class="f cap">
    <text x="664" y="232">Shortcut &gt; 已注册 API &gt; lark-cli api 裸调 —— 先查 --help 和 schema，</text>
    <text x="664" y="250">确实没有封装才允许打穿到原生 OpenAPI，避免每个新 skill 都重造轮子。</text>
    <text x="664" y="272">frontmatter 里的 metadata.requires.bins / siblings 声明依赖，cliHelp 给出</text>
    <text x="664" y="290">自查命令；description 强制写「当用户需要…时使用」，把路由当第一公民。</text>
  </g>

  <!-- decision path -->
  <rect x="40" y="344" width="1120" height="234" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="f h" x="64" y="372" fill="#1e293b">选型判定路径：你在造哪一种 Skill</text>

  <g class="f">
    <rect x="64" y="388" width="188" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="q" x="158" y="410" text-anchor="middle">你能控制被封装的</text>
    <text class="q" x="158" y="428" text-anchor="middle">那个 CLI / API 吗？</text>

    <rect x="312" y="366" width="200" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text class="s" x="412" y="388" text-anchor="middle" font-weight="700" fill="#1d4ed8">能 → 同仓 + 编译内嵌</text>
    <text class="cap" x="412" y="404" text-anchor="middle">让 CI 保证契约，别靠人记得改</text>

    <rect x="312" y="428" width="200" height="52" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text class="s" x="412" y="450" text-anchor="middle" font-weight="700" fill="#b45309">不能 → 必须建对账机制</text>
    <text class="cap" x="412" y="466" text-anchor="middle">定期跑 --help diff，或钉死版本</text>

    <rect x="572" y="388" width="188" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="q" x="666" y="410" text-anchor="middle">覆盖面超过 3 个</text>
    <text class="q" x="666" y="428" text-anchor="middle">业务域了吗？</text>

    <rect x="820" y="366" width="200" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text class="s" x="920" y="388" text-anchor="middle" font-weight="700" fill="#1d4ed8">是 → 拆域 + 共享基座</text>
    <text class="cap" x="920" y="404" text-anchor="middle">认证只写一份，域间用负向描述转诊</text>

    <rect x="820" y="428" width="200" height="52" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text class="s" x="920" y="450" text-anchor="middle" font-weight="700" fill="#047857">否 → 单文件反而更好</text>
    <text class="cap" x="920" y="466" text-anchor="middle">别为了架构而架构，拆分有心智成本</text>
  </g>
  <g stroke="#94a3b8" fill="none" marker-end="url(#e1)">
    <path d="M252 404 L286 404 L286 392 L308 392"/>
    <path d="M252 424 L286 424 L286 454 L308 454"/>
    <path d="M512 392 L540 392 L540 414 L568 414"/>
    <path d="M760 404 L790 404 L790 392 L816 392"/>
    <path d="M760 424 L790 424 L790 454 L816 454"/>
  </g>
  <g class="f yn">
    <text x="268" y="386">能</text>
    <text x="268" y="446">不能</text>
    <text x="798" y="384">是</text>
    <text x="798" y="446">否</text>
  </g>

  <rect x="64" y="496" width="1072" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="f s" x="84" y="518" font-weight="700">第三个必答问题：这个 Skill 会触发不可逆操作吗？</text>
  <text class="f cap" x="84" y="538">如果会——约束必须落到运行时（退出码、门禁、路径校验），文档里的「请谨慎」只能作为补充说明，不能作为唯一防线。</text>
  <text class="f cap" x="84" y="554">Agent 的行为是概率性的，任何依赖"模型会自觉遵守"的安全设计，在足够多次调用后都会失效一次；而不可逆操作只需要失效一次。</text>
</svg>
