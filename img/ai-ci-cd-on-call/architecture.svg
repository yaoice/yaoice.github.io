<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="值班智能体四要素与双层工作流架构">
  <rect width="1200" height="700" rx="16" fill="#0b1220"/>
  <text x="600" y="58" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="28" font-weight="900" fill="#f8fafc">值班智能体的四要素与双层工作流</text>
  <text x="600" y="90" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" fill="#94a3b8">缺一不可的骨架 · 一个大脑指挥多个手的动态工作流</text>
  <g font-family="PingFang SC, sans-serif">
    <rect x="60" y="120" width="255" height="150" rx="14" fill="#111a2e" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="188" y="158" text-anchor="middle" font-size="18" font-weight="800" fill="#93c5fd">记忆</text>
    <text x="188" y="188" text-anchor="middle" font-size="13" fill="#cbd5e1">跨会话上下文</text>
    <text x="188" y="210" text-anchor="middle" font-size="13" fill="#cbd5e1">记得上次查到哪</text>
    <text x="188" y="232" text-anchor="middle" font-size="13" fill="#cbd5e1">同类问题怎么修的</text>
    <rect x="335" y="120" width="255" height="150" rx="14" fill="#111a2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="463" y="158" text-anchor="middle" font-size="18" font-weight="800" fill="#6ee7b7">连接与访问</text>
    <text x="463" y="188" text-anchor="middle" font-size="13" fill="#cbd5e1">独立服务账户</text>
    <text x="463" y="210" text-anchor="middle" font-size="13" fill="#cbd5e1">MCP Connectors</text>
    <text x="463" y="232" text-anchor="middle" font-size="13" fill="#cbd5e1">Datadog / Grafana / GitHub…</text>
    <rect x="610" y="120" width="255" height="150" rx="14" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="738" y="158" text-anchor="middle" font-size="18" font-weight="800" fill="#fcd34d">调度</text>
    <text x="738" y="188" text-anchor="middle" font-size="13" fill="#cbd5e1">自然语言例行任务</text>
    <text x="738" y="210" text-anchor="middle" font-size="13" fill="#cbd5e1">"每周一 9:00 EST"</text>
    <text x="738" y="232" text-anchor="middle" font-size="13" fill="#cbd5e1">CI 交接 / 报告生成</text>
    <rect x="885" y="120" width="255" height="150" rx="14" fill="#111a2e" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1013" y="158" text-anchor="middle" font-size="18" font-weight="800" fill="#c4b5fd">指令</text>
    <text x="1013" y="188" text-anchor="middle" font-size="13" fill="#cbd5e1">Markdown 技能文件</text>
    <text x="1013" y="210" text-anchor="middle" font-size="13" fill="#cbd5e1">路由 / 策略 / lessons.md</text>
    <text x="1013" y="232" text-anchor="middle" font-size="13" fill="#cbd5e1">代码评审方式迭代</text>
  </g>
  <text x="600" y="322" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" font-weight="800" fill="#e2e8f0">动态工作流：编排代理 + 执行子代理</text>
  <rect x="60" y="352" width="230" height="170" rx="14" fill="#111a2e" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="390" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" font-weight="800" fill="#93c5fd">编排代理</text>
  <text x="175" y="418" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#cbd5e1">派生子代理并行调查</text>
  <text x="175" y="442" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#cbd5e1">汇总各方回报</text>
  <text x="175" y="466" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#cbd5e1">综合成 SITREP</text>
  <rect x="175" y="498" width="0" height="0"/>
  <rect x="150" y="540" width="0" height="0"/>
  <rect x="330" y="352" width="180" height="60" rx="10" fill="#1e293b"/>
  <text x="420" y="380" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">Grafana</text>
  <text x="420" y="400" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#64748b">指标</text>
  <rect x="330" y="424" width="180" height="60" rx="10" fill="#1e293b"/>
  <text x="420" y="452" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">日志存储</text>
  <text x="420" y="472" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#64748b">trace</text>
  <rect x="330" y="496" width="180" height="60" rx="10" fill="#1e293b"/>
  <text x="420" y="524" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">PagerDuty</text>
  <text x="420" y="544" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#64748b">告警</text>
  <rect x="525" y="352" width="180" height="60" rx="10" fill="#1e293b"/>
  <text x="615" y="380" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">GitHub</text>
  <text x="615" y="400" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#64748b">PR / CI</text>
  <rect x="525" y="424" width="180" height="60" rx="10" fill="#1e293b"/>
  <text x="615" y="452" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">Kubernetes</text>
  <text x="615" y="472" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#64748b">节点 / 部署</text>
  <rect x="525" y="496" width="180" height="60" rx="10" fill="#1e293b"/>
  <text x="615" y="524" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">Slack 事件频道</text>
  <text x="615" y="544" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#64748b">上下文</text>
  <rect x="930" y="390" width="210" height="140" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="2"/>
  <text x="1035" y="428" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="800" fill="#6ee7b7">SITREP 态势报告</text>
  <text x="1035" y="458" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#cbd5e1">单点责任 · 完整可回溯</text>
  <text x="1035" y="482" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#cbd5e1">通常 15 分钟内发布</text>
  <text x="1035" y="506" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#cbd5e1">根因点名最快 4 分钟</text>
  <path d="M 290 437 L 326 437" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <polygon points="326,437 316,432 316,442" fill="#3b82f6"/>
  <path d="M 510 437 L 521 437" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <polygon points="521,437 511,432 511,442" fill="#3b82f6"/>
  <path d="M 705 437 L 716 437" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <polygon points="716,437 706,432 706,442" fill="#3b82f6"/>
  <path d="M 900 460 L 926 460" stroke="#10b981" stroke-width="2" fill="none"/>
  <polygon points="926,460 916,455 916,465" fill="#10b981"/>
  <text x="600" y="636" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-style="italic" fill="#64748b">技能即代码：调查技能以 Markdown 提交 GitHub，像管理代码一样多人迭代</text>
</svg>
