<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="oncall-kit 四步落地路径">
  <rect width="1200" height="660" rx="16" fill="#0b1220"/>
  <text x="600" y="58" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="28" font-weight="900" fill="#f8fafc">从 0 到 1：oncall-kit 落地四步</text>
  <text x="600" y="90" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" fill="#94a3b8">开源工具包 · 数小时搭建 · 10 分钟演示（虚构团队历史）</text>
  <g font-family="PingFang SC, sans-serif">
    <rect x="46" y="130" width="255" height="300" rx="14" fill="#111a2e" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="86" cy="166" r="20" fill="#3b82f6"/>
    <text x="86" y="172" text-anchor="middle" font-size="15" font-weight="900" fill="#f8fafc">1</text>
    <text x="118" y="174" font-size="16" font-weight="800" fill="#93c5fd">加入频道</text>
    <text x="66" y="216" font-size="13" fill="#cbd5e1">组织所有者通过</text>
    <text x="66" y="238" font-size="13" fill="#cbd5e1">Claude Tag 将 Claude</text>
    <text x="66" y="260" font-size="13" fill="#cbd5e1">添加到值班 Slack 频道</text>
    <rect x="66" y="286" width="215" height="56" rx="8" fill="#1e293b"/>
    <text x="174" y="312" text-anchor="middle" font-size="12" fill="#94a3b8">需要 Claude Team /</text>
    <text x="174" y="330" text-anchor="middle" font-size="12" fill="#94a3b8">Enterprise 套餐</text>
    <rect x="321" y="130" width="255" height="300" rx="14" fill="#111a2e" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="361" cy="166" r="20" fill="#8b5cf6"/>
    <text x="361" y="172" text-anchor="middle" font-size="15" font-weight="900" fill="#f8fafc">2</text>
    <text x="393" y="174" font-size="16" font-weight="800" fill="#c4b5fd">连接工具</text>
    <text x="341" y="216" font-size="13" fill="#cbd5e1">连接相应 connectors</text>
    <text x="341" y="238" font-size="13" fill="#cbd5e1">Datadog / Grafana /</text>
    <text x="341" y="260" font-size="13" fill="#cbd5e1">PagerDuty / GitHub…</text>
    <rect x="341" y="286" width="215" height="56" rx="8" fill="#1e293b"/>
    <text x="449" y="312" text-anchor="middle" font-size="12" fill="#94a3b8">配置 GitHub 仓库</text>
    <text x="449" y="330" text-anchor="middle" font-size="12" fill="#94a3b8">设置 Claude Code Remote</text>
    <rect x="596" y="130" width="255" height="300" rx="14" fill="#111a2e" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="636" cy="166" r="20" fill="#10b981"/>
    <text x="636" y="172" text-anchor="middle" font-size="15" font-weight="900" fill="#f8fafc">3</text>
    <text x="668" y="174" font-size="16" font-weight="800" fill="#6ee7b7">下发指令</text>
    <text x="616" y="216" font-size="13" fill="#cbd5e1">将 Claude 加入事故频道</text>
    <text x="616" y="238" font-size="13" fill="#cbd5e1">指示它监控事故</text>
    <text x="616" y="260" font-size="13" fill="#cbd5e1">立即分类</text>
    <rect x="616" y="286" width="215" height="56" rx="8" fill="#1e293b"/>
    <text x="724" y="312" text-anchor="middle" font-size="12" fill="#94a3b8">值班流程仍活在 Slack</text>
    <text x="724" y="330" text-anchor="middle" font-size="12" fill="#94a3b8">只是 Claude 加入了频道</text>
    <rect x="871" y="130" width="283" height="300" rx="14" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="911" cy="166" r="20" fill="#f59e0b"/>
    <text x="911" y="172" text-anchor="middle" font-size="15" font-weight="900" fill="#0b1220">4</text>
    <text x="943" y="174" font-size="16" font-weight="800" fill="#fcd34d">模板起步</text>
    <text x="891" y="216" font-size="13" fill="#cbd5e1">用 oncall-kit 模板起步</text>
    <text x="891" y="238" font-size="13" fill="#cbd5e1">ONCALL.md 指令模板</text>
    <text x="891" y="260" font-size="13" fill="#cbd5e1">triage 分类技能</text>
    <rect x="891" y="286" width="243" height="56" rx="8" fill="#1e293b"/>
    <text x="1013" y="312" text-anchor="middle" font-size="12" fill="#94a3b8">跑一遍测试夹具演示</text>
    <text x="1013" y="330" text-anchor="middle" font-size="12" fill="#94a3b8">约 10 分钟</text>
  </g>
  <g>
    <path d="M 301 280 L 317 280" stroke="#64748b" stroke-width="2.5" fill="none"/>
    <polygon points="317,280 308,275 308,285" fill="#64748b"/>
    <path d="M 576 280 L 592 280" stroke="#64748b" stroke-width="2.5" fill="none"/>
    <polygon points="592,280 583,275 583,285" fill="#64748b"/>
    <path d="M 851 280 L 867 280" stroke="#64748b" stroke-width="2.5" fill="none"/>
    <polygon points="867,280 858,275 858,285" fill="#64748b"/>
  </g>
  <rect x="46" y="470" width="1108" height="140" rx="14" fill="#111a2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="510" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" font-weight="800" fill="#93c5fd">上线之后：自我改进闭环</text>
  <text x="600" y="544" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#cbd5e1">事故自动沉淀 lessons.md → 规则自动调优 → 技能随 PR 迭代 → ci-weather 按时出报告</text>
  <text x="600" y="576" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#94a3b8">质量底线不放松：每个 PR 具名负责人 · 变更审批后合并 · 同一套 CI 门禁</text>
  <path d="M 600 440 L 600 466" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <polygon points="600,470 595,462 605,462" fill="#3b82f6"/>
</svg>
