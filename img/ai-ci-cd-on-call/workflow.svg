    <text x="783" y="178" font-size="18" font-weight="800" fill="#6ee7b7">验证</text>
    <text x="729" y="222" font-size="13" font-weight="700" fill="#e2e8f0">同一套工具复查</text>
    <text x="729" y="252" font-size="12" fill="#cbd5e1">用调查的 MCP Connectors</text>
    <text x="729" y="272" font-size="12" fill="#cbd5e1">验证修复效果</text>
    <text x="729" y="302" font-size="12" fill="#cbd5e1">不是"改完就算"</text>
    <text x="729" y="322" font-size="12" fill="#94a3b8">开头案例：3 分钟后</text>
    <text x="729" y="342" font-size="12" fill="#94a3b8">确认错误率恢复基线</text>
    <rect x="930" y="130" width="224" height="330" rx="14" fill="#111a2e" stroke="#475569" stroke-width="1.5"/>
    <circle cx="970" cy="170" r="22" fill="#475569"/>
    <text x="970" y="176" text-anchor="middle" font-size="16" font-weight="900" fill="#f8fafc">5</text>
