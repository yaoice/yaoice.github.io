    <text x="950" y="252" font-size="12" fill="#cbd5e1">post-mortem 自动写入</text>
    <text x="950" y="272" font-size="12" fill="#cbd5e1">lessons.md 沉淀经验</text>
    <text x="950" y="302" font-size="12" fill="#cbd5e1">重复模式升级进技能</text>
    <text x="950" y="332" font-size="12" fill="#cbd5e1">ci-weather 聚合发布</text>
    <text x="950" y="352" font-size="12" fill="#94a3b8">周一生成交接报告</text>
