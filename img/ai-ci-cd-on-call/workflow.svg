  <rect x="46" y="500" width="1108" height="120" rx="14" fill="#111a2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="536" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" font-weight="800" fill="#93c5fd">自我改进闭环</text>
  <text x="600" y="566" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" fill="#cbd5e1">每起事故 → lessons.md → 同一模式反复出现 → 升级为调查技能 → 下一次事故调查更快</text>
