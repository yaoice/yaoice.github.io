<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="AI 值班五阶段全流程时间线">
  <rect width="1200" height="680" rx="16" fill="#0b1220"/>
  <text x="600" y="58" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="28" font-weight="900" fill="#f8fafc">从告警到交接：AI 值班五阶段</text>
  <text x="600" y="90" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" fill="#94a3b8">检测是确定性的 · 升级路径则兼具确定性与智能体自主性</text>
  <g font-family="PingFang SC, sans-serif">
    <rect x="46" y="130" width="205" height="330" rx="14" fill="#111a2e" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="86" cy="170" r="22" fill="#3b82f6"/>
    <text x="86" y="176" text-anchor="middle" font-size="16" font-weight="900" fill="#f8fafc">1</text>
    <text x="120" y="178" font-size="18" font-weight="800" fill="#93c5fd">检测</text>
    <text x="66" y="222" font-size="13" font-weight="700" fill="#e2e8f0">三条路径进事故</text>
    <text x="66" y="252" font-size="12" fill="#cbd5e1">告警规则自动调优</text>
    <text x="66" y="272" font-size="12" fill="#cbd5e1">修过宽 / 过窄的规则</text>
    <text x="66" y="302" font-size="12" fill="#cbd5e1">自动分流 oncall.md</text>
    <text x="66" y="322" font-size="12" fill="#94a3b8">错误率&gt;2% 持续 5 分钟</text>
    <text x="66" y="342" font-size="12" fill="#94a3b8">且非部署窗口 → 传呼</text>
    <text x="66" y="372" font-size="12" fill="#cbd5e1">人工上报</text>
    <text x="66" y="392" font-size="12" fill="#94a3b8">值班频道 / 内部页面</text>
    <rect x="46" y="426" width="205" height="0"/>
    <rect x="267" y="130" width="205" height="330" rx="14" fill="#111a2e" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="307" cy="170" r="22" fill="#8b5cf6"/>
    <text x="307" y="176" text-anchor="middle" font-size="16" font-weight="900" fill="#f8fafc">2</text>
    <text x="341" y="178" font-size="18" font-weight="800" fill="#c4b5fd">分类</text>
    <text x="287" y="222" font-size="13" font-weight="700" fill="#e2e8f0">先查数据，再提理论</text>
    <text x="287" y="252" font-size="12" fill="#cbd5e1">配置说可能出什么问题</text>
    <text x="287" y="272" font-size="12" fill="#cbd5e1">指标说实际出了什么</text>
    <text x="287" y="302" font-size="12" fill="#cbd5e1">分级调查指南</text>
    <text x="287" y="322" font-size="12" fill="#94a3b8">shadow divergence</text>
    <text x="287" y="342" font-size="12" fill="#94a3b8">617 行调查技能文件</text>
    <text x="287" y="372" font-size="12" fill="#cbd5e1">多智能体协作排查</text>
    <text x="287" y="392" font-size="12" fill="#94a3b8">工程师可实时引导方向</text>
    <rect x="488" y="130" width="205" height="330" rx="14" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="528" cy="170" r="22" fill="#f59e0b"/>
    <text x="528" y="176" text-anchor="middle" font-size="16" font-weight="900" fill="#0b1220">3</text>
    <text x="562" y="178" font-size="18" font-weight="800" fill="#fcd34d">解决</text>
    <text x="508" y="222" font-size="13" font-weight="700" fill="#e2e8f0">分级修复路径</text>
    <text x="508" y="252" font-size="12" fill="#cbd5e1">功能开关渐进式部署</text>
    <text x="508" y="272" font-size="12" fill="#94a3b8">管理金丝雀流量</text>
    <text x="508" y="292" font-size="12" fill="#94a3b8">自动调高 / 调低开关</text>
    <text x="508" y="322" font-size="12" fill="#cbd5e1">K8s 节点排水 / 隔离</text>
    <text x="508" y="342" font-size="12" fill="#cbd5e1">扩容指令</text>
    <text x="508" y="372" font-size="12" fill="#cbd5e1">代码修复以 PR 提交</text>
    <text x="508" y="392" font-size="12" fill="#94a3b8">人保留最终合并权</text>
    <rect x="709" y="130" width="205" height="330" rx="14" fill="#111a2e" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="749" cy="170" r="22" fill="#10b981"/>
