<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="AI 值班 vs 人肉值班对比与关键数据">
  <rect width="1200" height="640" rx="16" fill="#0b1220"/>
  <text x="600" y="58" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="28" font-weight="900" fill="#f8fafc">值班的第一性优势：AI 不疲劳</text>
  <text x="600" y="90" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" fill="#94a3b8">工程师季度代码交付量是 2021–2025 年的 8 倍 —— 跟上它的唯一方法是 agentic CI</text>
  <g font-family="PingFang SC, sans-serif">
    <rect x="46" y="130" width="530" height="180" rx="14" fill="#111a2e" stroke="#ef4444" stroke-width="1.5"/>
    <text x="311" y="172" text-anchor="middle" font-size="19" font-weight="800" fill="#fca5a5">人肉值班</text>
    <rect x="76" y="192" width="235" height="40" rx="8" fill="#1e293b"/>
    <text x="194" y="218" text-anchor="middle" font-size="13" fill="#e2e8f0">注意力被迫分配</text>
    <rect x="331" y="192" width="215" height="40" rx="8" fill="#1e293b"/>
    <text x="439" y="218" text-anchor="middle" font-size="13" fill="#e2e8f0">告警一多只挑最响的</text>
    <rect x="76" y="244" width="235" height="40" rx="8" fill="#1e293b"/>
    <text x="194" y="270" text-anchor="middle" font-size="13" fill="#e2e8f0">夜间被叫醒 · 状态差</text>
    <rect x="331" y="244" width="215" height="40" rx="8" fill="#1e293b"/>
    <text x="439" y="270" text-anchor="middle" font-size="13" fill="#e2e8f0">经验留在个人脑子里</text>
    <rect x="624" y="130" width="530" height="180" rx="14" fill="#111a2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="889" y="172" text-anchor="middle" font-size="19" font-weight="800" fill="#6ee7b7">AI 值班</text>
    <rect x="654" y="192" width="235" height="40" rx="8" fill="#1e293b"/>
    <text x="772" y="218" text-anchor="middle" font-size="13" fill="#e2e8f0">同时盯住所有相关信号</text>
    <rect x="909" y="192" width="215" height="40" rx="8" fill="#1e293b"/>
    <text x="1017" y="218" text-anchor="middle" font-size="13" fill="#e2e8f0">不会疲劳 · 不会漏</text>
    <rect x="654" y="244" width="235" height="40" rx="8" fill="#1e293b"/>
    <text x="772" y="270" text-anchor="middle" font-size="13" fill="#e2e8f0">经验沉淀进 lessons.md</text>
    <rect x="909" y="244" width="215" height="40" rx="8" fill="#1e293b"/>
    <text x="1017" y="270" text-anchor="middle" font-size="13" fill="#e2e8f0">事故全程可回溯</text>
  </g>
  <text x="600" y="366" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" font-weight="800" fill="#e2e8f0">Anthropic 实测数据</text>
  <g font-family="PingFang SC, sans-serif">
    <rect x="46" y="392" width="260" height="150" rx="14" fill="#0f1b33" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="176" y="442" text-anchor="middle" font-size="38" font-weight="900" fill="#93c5fd">15 分钟</text>
    <text x="176" y="474" text-anchor="middle" font-size="14" fill="#cbd5e1">首份 SITREP 发布</text>
    <text x="176" y="498" text-anchor="middle" font-size="12" fill="#94a3b8">对比：过去约 1 小时</text>
    <rect x="326" y="392" width="260" height="150" rx="14" fill="#0f1b33" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="456" y="442" text-anchor="middle" font-size="38" font-weight="900" fill="#c4b5fd">14 分钟</text>
    <text x="456" y="474" text-anchor="middle" font-size="14" fill="#cbd5e1">首份基于证据的分析</text>
    <text x="456" y="498" text-anchor="middle" font-size="12" fill="#94a3b8">事故开启后（中位数）</text>
    <rect x="606" y="392" width="260" height="150" rx="14" fill="#0f1b33" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="736" y="442" text-anchor="middle" font-size="38" font-weight="900" fill="#fcd34d">4 分钟</text>
    <text x="736" y="474" text-anchor="middle" font-size="14" fill="#cbd5e1">最快点名根因</text>
    <text x="736" y="498" text-anchor="middle" font-size="12" fill="#94a3b8">出现在首份报告中</text>
    <rect x="886" y="392" width="268" height="150" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.5"/>
    <text x="1020" y="442" text-anchor="middle" font-size="38" font-weight="900" fill="#6ee7b7">8 倍</text>
    <text x="1020" y="474" text-anchor="middle" font-size="14" fill="#cbd5e1">季度代码交付量</text>
    <text x="1020" y="498" text-anchor="middle" font-size="12" fill="#94a3b8">2021–2025 年基线</text>
  </g>
  <text x="600" y="606" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-style="italic" fill="#64748b">整套系统搭建时间：数小时，而非数天</text>
</svg>
