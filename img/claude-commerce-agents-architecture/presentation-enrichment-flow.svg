<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Presentation Tool 的服务端 enrichment 流程</title>
  <desc id="desc">展示模型发出展示工具调用后，服务端如何校验 payload、检查 provenance、补全真实数据并交给前端渲染。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:14px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .warn{stroke:#f59e0b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="500" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">Presentation Tool 的服务端 enrichment 流程</text>
  <text x="32" y="55" class="t small">模型提交选择与解释，服务端补全事实，前端只消费验证后的事件</text>

  <rect x="32" y="96" width="166" height="62" class="box" fill="#eff6ff"/>
  <text x="115" y="122" text-anchor="middle" class="t label">模型调用 present_*</text>
  <text x="115" y="143" text-anchor="middle" class="t small">id + layout + reason</text>
  <path d="M198 127 H226" class="line"/>

  <rect x="226" y="96" width="166" height="62" class="box" fill="#ffffff"/>
  <text x="309" y="122" text-anchor="middle" class="t label">Pydantic schema</text>
  <text x="309" y="143" text-anchor="middle" class="t small">字段、数量、长度</text>
  <path d="M392 127 H420" class="line"/>

  <rect x="420" y="96" width="166" height="62" class="box" fill="#fffbeb"/>
  <text x="503" y="122" text-anchor="middle" class="t label">Provenance</text>
  <text x="503" y="143" text-anchor="middle" class="t small">session seen ids</text>
  <path d="M586 127 H614" class="line"/>

  <rect x="614" y="96" width="166" height="62" class="box" fill="#ecfdf5"/>
  <text x="697" y="122" text-anchor="middle" class="t label">Server enrichment</text>
  <text x="697" y="143" text-anchor="middle" class="t small">join backend records</text>
  <path d="M780 127 H808" class="line"/>

  <rect x="808" y="96" width="120" height="62" class="box" fill="#ffffff"/>
  <text x="868" y="122" text-anchor="middle" class="t label">AgentEvent</text>
  <text x="868" y="143" text-anchor="middle" class="t small">ui / partial</text>

  <path d="M868 158 V220" class="line"/>
  <rect x="718" y="220" width="210" height="66" class="box" fill="#ffffff"/>
  <text x="823" y="247" text-anchor="middle" class="t label">web-shared</text>
  <text x="823" y="268" text-anchor="middle" class="t small">protocol + turn hook</text>
  <path d="M718 253 H688" class="line"/>

  <rect x="458" y="220" width="230" height="66" class="box" fill="#ffffff"/>
  <text x="573" y="247" text-anchor="middle" class="t label">Vertical component</text>
  <text x="573" y="268" text-anchor="middle" class="t small">cards / calendar / map / portal</text>
  <path d="M458 253 H428" class="line"/>

  <rect x="198" y="220" width="230" height="66" class="box" fill="#ecfdf5"/>
  <text x="313" y="247" text-anchor="middle" class="t label">最终可展示事实</text>
  <text x="313" y="268" text-anchor="middle" class="t small">标题、价格、指标、diff</text>

  <path d="M503 158 V342 H428 V370" class="warn"/>
  <rect x="198" y="370" width="230" height="62" class="box" fill="#fffbeb"/>
  <text x="313" y="396" text-anchor="middle" class="t label">拒绝或裁剪</text>
  <text x="313" y="417" text-anchor="middle" class="t small">invalid payload / unknown id</text>

  <rect x="458" y="370" width="470" height="62" class="box" fill="#f1f5f9"/>
  <text x="693" y="396" text-anchor="middle" class="t label">核心边界</text>
  <text x="693" y="417" text-anchor="middle" class="t small">模型不能凭空编造商品价格、指标或变更内容</text>
</svg>
