<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">三种 Agent 运行路径</title>
  <desc id="desc">比较 Messages API、Agent SDK 和 Managed Agents 三种运行路径，并展示它们如何汇合到相同的角色核心、执行器和后端接口。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:14px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">三种 Agent 运行路径</text>
  <text x="32" y="55" class="t small">运行时负责适配，角色核心负责契约，公共执行器负责安全</text>

  <rect x="32" y="82" width="896" height="52" class="box" fill="#ffffff"/>
  <text x="480" y="114" text-anchor="middle" class="t label">宿主输入：user.message + session identity + persisted state</text>

  <path d="M184 134 V164" class="line"/>
  <path d="M480 134 V164" class="line"/>
  <path d="M776 134 V164" class="line"/>

  <rect x="32" y="164" width="272" height="124" class="box" fill="#eff6ff"/>
  <text x="168" y="191" text-anchor="middle" class="t label">Messages API</text>
  <text x="52" y="218" class="t small">orchestrator.py</text>
  <text x="52" y="239" class="t small">tool_choice / streaming</text>
  <text x="52" y="260" class="t small">grounding / eager dispatch</text>
  <text x="52" y="281" class="t small">SSE AgentEvent</text>

  <rect x="344" y="164" width="272" height="124" class="box" fill="#eff6ff"/>
  <text x="480" y="191" text-anchor="middle" class="t label">Claude Agent SDK</text>
  <text x="364" y="218" class="t small">ClaudeAgentOptions</text>
  <text x="364" y="239" class="t small">in-process MCP toolset</text>
  <text x="364" y="260" class="t small">host prefetch / collect</text>
  <text x="364" y="281" class="t small">SDK hook closes turn</text>

  <rect x="656" y="164" width="272" height="124" class="box" fill="#eff6ff"/>
  <text x="792" y="191" text-anchor="middle" class="t label">Managed Agents</text>
  <text x="676" y="218" class="t small">agent.yaml + system.md</text>
  <text x="676" y="239" class="t small">平台负责 loop / tool choice</text>
  <text x="676" y="260" class="t small">远程 MCP + vault credential</text>
  <text x="676" y="281" class="t small">custom tool / requires_action</text>

  <path d="M168 288 V320 H480 V350" class="line"/>
  <path d="M480 288 V350" class="line"/>
  <path d="M792 288 V320 H480 V350" class="line"/>

  <rect x="180" y="350" width="600" height="76" class="box" fill="#f1f5f9"/>
  <text x="480" y="379" text-anchor="middle" class="t label">角色核心与公共执行边界</text>
  <text x="480" y="402" text-anchor="middle" class="t small">tool registry · SkillRegistry · BaseToolExecutor · fencing · gates · presentation</text>

  <path d="M480 426 V456" class="line"/>
  <rect x="180" y="456" width="600" height="42" class="box" fill="#ecfdf5"/>
  <text x="480" y="482" text-anchor="middle" class="t label">StorefrontBackend / MerchantBackend → 企业业务系统</text>
</svg>
