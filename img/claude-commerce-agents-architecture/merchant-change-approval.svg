<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Merchant Agent 变更审批生命周期</title>
  <desc id="desc">展示商户写操作从 stage、guardrail、preview 到 host approval、apply 和 audit 的状态流转。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:14px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .warn{stroke:#f59e0b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .ok{stroke:#10b981;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">Merchant Agent 变更审批生命周期</text>
  <text x="32" y="55" class="t small">模型提出变更，宿主批准变更，后端应用变更</text>

  <rect x="34" y="98" width="154" height="62" class="box" fill="#eff6ff"/>
  <text x="111" y="124" text-anchor="middle" class="t label">stage_*</text>
  <text x="111" y="145" text-anchor="middle" class="t small">按用户意图提出</text>
  <path d="M188 129 H218" class="line"/>

  <rect x="218" y="98" width="154" height="62" class="box" fill="#fffbeb"/>
  <text x="295" y="124" text-anchor="middle" class="t label">Guardrails</text>
  <text x="295" y="145" text-anchor="middle" class="t small">数量 / 价格 / 保护字段</text>
  <path d="M372 129 H402" class="line"/>

  <rect x="402" y="98" width="154" height="62" class="box" fill="#ffffff"/>
  <text x="479" y="124" text-anchor="middle" class="t label">STAGED</text>
  <text x="479" y="145" text-anchor="middle" class="t small">change_id + before/after</text>
  <path d="M556 129 H586" class="line"/>

  <rect x="586" y="98" width="154" height="62" class="box" fill="#ffffff"/>
  <text x="663" y="124" text-anchor="middle" class="t label">Preview Card</text>
  <text x="663" y="145" text-anchor="middle" class="t small">diff + margin + notes</text>
  <path d="M740 129 H770" class="warn"/>

  <rect x="770" y="98" width="154" height="62" class="box" fill="#fffbeb"/>
  <text x="847" y="124" text-anchor="middle" class="t label">Host Approval</text>
  <text x="847" y="145" text-anchor="middle" class="t small">按钮或 always_ask</text>

  <path d="M847 160 V222" class="line"/>
  <rect x="694" y="222" width="230" height="68" class="box" fill="#fffbeb"/>
  <text x="809" y="250" text-anchor="middle" class="t label">check_apply_change</text>
  <text x="809" y="272" text-anchor="middle" class="t small">provenance → guardrail → approval</text>
  <path d="M694 256 H664" class="line"/>

  <rect x="464" y="222" width="200" height="68" class="box" fill="#ecfdf5"/>
  <text x="564" y="250" text-anchor="middle" class="t label">apply_change</text>
  <text x="564" y="272" text-anchor="middle" class="t small">唯一触达 live state 的调用</text>
  <path d="M464 256 H434" class="ok"/>

  <rect x="234" y="222" width="200" height="68" class="box" fill="#ffffff"/>
  <text x="334" y="250" text-anchor="middle" class="t label">MerchantBackend</text>
  <text x="334" y="272" text-anchor="middle" class="t small">平台事务、业务规则、幂等</text>
  <path d="M234 256 H204" class="line"/>

  <rect x="34" y="222" width="170" height="68" class="box" fill="#ecfdf5"/>
  <text x="119" y="250" text-anchor="middle" class="t label">APPLIED</text>
  <text x="119" y="272" text-anchor="middle" class="t small">actor + timestamp + audit</text>

  <path d="M479 160 V352 H334 V390" class="warn"/>
  <rect x="234" y="390" width="200" height="62" class="box" fill="#ffffff"/>
  <text x="334" y="416" text-anchor="middle" class="t label">DISCARDED</text>
  <text x="334" y="437" text-anchor="middle" class="t small">operator 或 agent 放弃提案</text>

  <rect x="464" y="390" width="460" height="62" class="box" fill="#f1f5f9"/>
  <text x="694" y="416" text-anchor="middle" class="t label">关键原则</text>
  <text x="694" y="437" text-anchor="middle" class="t small">预览不等于批准；聊天中的“approve”不写 approved_change_ids</text>
</svg>
