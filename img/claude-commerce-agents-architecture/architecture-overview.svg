<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude Commerce Agents 分层架构</title>
  <desc id="desc">展示宿主示例、三种运行时、购物与商户角色核心、公共执行内核和业务后端之间的依赖关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="620" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">Claude Commerce Agents 分层架构</text>
  <text x="32" y="55" class="t small">同一套工具契约与安全机制，覆盖双角色和三种运行路径</text>

  <rect x="32" y="78" width="896" height="76" class="box" fill="#e2e8f0"/>
  <text x="52" y="106" class="t label">宿主与交付层</text>
  <text x="52" y="130" class="t small">examples/：FastAPI + Next.js · retail · travel · telecom · entertainment</text>
  <text x="690" y="106" class="t small">plugins/commerce-builder</text>
  <text x="690" y="130" class="t small">docs / scripts / tests</text>

  <path d="M480 154 V176" class="line"/>
  <rect x="32" y="176" width="896" height="92" class="box" fill="#ffffff"/>
  <text x="52" y="202" class="t label">三种运行路径</text>
  <rect x="52" y="216" width="250" height="36" class="box" fill="#eff6ff"/>
  <text x="177" y="239" text-anchor="middle" class="t small">Messages API · 自有 turn loop</text>
  <rect x="355" y="216" width="250" height="36" class="box" fill="#eff6ff"/>
  <text x="480" y="239" text-anchor="middle" class="t small">Agent SDK · 进程内 MCP</text>
  <rect x="658" y="216" width="250" height="36" class="box" fill="#eff6ff"/>
  <text x="783" y="239" text-anchor="middle" class="t small">Managed Agents · 远程 MCP</text>

  <path d="M240 268 V294" class="line"/>
  <path d="M720 268 V294" class="line"/>
  <rect x="32" y="294" width="896" height="92" class="box" fill="#ffffff"/>
  <text x="52" y="320" class="t label">角色核心层</text>
  <rect x="52" y="334" width="400" height="36" class="box" fill="#eff6ff"/>
  <text x="252" y="357" text-anchor="middle" class="t label">shopping-agent/core</text>
  <rect x="508" y="334" width="400" height="36" class="box" fill="#ecfdf5"/>
  <text x="708" y="357" text-anchor="middle" class="t label">merchant-agent/core</text>

  <path d="M252 386 V414" class="line"/>
  <path d="M708 386 V414" class="line"/>
  <rect x="32" y="414" width="896" height="82" class="box" fill="#f1f5f9"/>
  <text x="52" y="441" class="t label">commerce-common</text>
  <text x="52" y="466" class="t small">fencing · memory · skills · grounding · presentation · execution · streaming · turn · MCP</text>

  <path d="M252 496 V524" class="line"/>
  <path d="M708 496 V524" class="line"/>
  <rect x="32" y="524" width="896" height="62" class="box" fill="#ffffff"/>
  <text x="52" y="551" class="t label">业务后端端口与适配器</text>
  <text x="52" y="573" class="t small">StorefrontBackend：目录 / 购物车 / 订单 · MerchantBackend：指标 / listing / 库存 / 定价 / 活动</text>
</svg>
