<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Merchant Agent 运营闭环</title>
  <desc id="desc">展示商户请求从指标 grounding、分析与建议，到 listing 读取、staging、预览和审批应用的运营流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:14px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .warn{stroke:#f59e0b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .ok{stroke:#10b981;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">Merchant Agent 运营闭环</text>
  <text x="32" y="55" class="t small">读数据可以自动完成，写 live state 必须经过变更与审批链</text>

  <rect x="32" y="92" width="170" height="62" class="box" fill="#ffffff"/>
  <text x="117" y="118" text-anchor="middle" class="t label">运营人员请求</text>
  <text x="117" y="139" text-anchor="middle" class="t small">看表现或改变业务</text>
  <path d="M202 123 H232" class="line"/>

  <rect x="232" y="92" width="170" height="62" class="box" fill="#eff6ff"/>
  <text x="317" y="118" text-anchor="middle" class="t label">Grounding</text>
  <text x="317" y="139" text-anchor="middle" class="t small">snapshot / queue / record</text>
  <path d="M402 123 H432" class="line"/>

  <rect x="432" y="92" width="170" height="62" class="box" fill="#eff6ff"/>
  <text x="517" y="118" text-anchor="middle" class="t label">读取与分析</text>
  <text x="517" y="139" text-anchor="middle" class="t small">metrics / listings / delegate</text>
  <path d="M602 123 H632" class="line"/>

  <rect x="632" y="92" width="170" height="62" class="box" fill="#ffffff"/>
  <text x="717" y="118" text-anchor="middle" class="t label">建议与 UI</text>
  <text x="717" y="139" text-anchor="middle" class="t small">metrics / digest card</text>
  <path d="M802 123 H832" class="line"/>

  <rect x="832" y="92" width="96" height="62" class="box" fill="#f1f5f9"/>
  <text x="880" y="118" text-anchor="middle" class="t label">继续？</text>
  <text x="880" y="139" text-anchor="middle" class="t small">变更意图</text>

  <path d="M880 154 V214" class="warn"/>
  <rect x="698" y="214" width="230" height="70" class="box" fill="#fffbeb"/>
  <text x="813" y="242" text-anchor="middle" class="t label">目标记录与当前值</text>
  <text x="813" y="264" text-anchor="middle" class="t small">listing / pricing / inventory provenance</text>
  <path d="M698 249 H668" class="line"/>

  <rect x="468" y="214" width="200" height="70" class="box" fill="#fffbeb"/>
  <text x="568" y="242" text-anchor="middle" class="t label">stage_*</text>
  <text x="568" y="264" text-anchor="middle" class="t small">guardrails + change_id</text>
  <path d="M468 249 H438" class="line"/>

  <rect x="238" y="214" width="200" height="70" class="box" fill="#ffffff"/>
  <text x="338" y="242" text-anchor="middle" class="t label">Preview Card</text>
  <text x="338" y="264" text-anchor="middle" class="t small">before / after / margin</text>
  <path d="M238 249 H208" class="line"/>

  <rect x="32" y="214" width="176" height="70" class="box" fill="#fffbeb"/>
  <text x="120" y="242" text-anchor="middle" class="t label">Host Approval</text>
  <text x="120" y="264" text-anchor="middle" class="t small">per change / explicit</text>

  <path d="M120 284 V352 H208 V390" class="ok"/>
  <rect x="32" y="390" width="176" height="70" class="box" fill="#ecfdf5"/>
  <text x="120" y="418" text-anchor="middle" class="t label">apply_change</text>
  <text x="120" y="440" text-anchor="middle" class="t small">唯一写 live state</text>
  <path d="M208 425 H238" class="ok"/>

  <rect x="238" y="390" width="200" height="70" class="box" fill="#ecfdf5"/>
  <text x="338" y="418" text-anchor="middle" class="t label">MerchantBackend</text>
  <text x="338" y="440" text-anchor="middle" class="t small">事务、业务规则、审计</text>
  <path d="M438 425 H468" class="ok"/>

  <rect x="468" y="390" width="200" height="70" class="box" fill="#ffffff"/>
  <text x="568" y="418" text-anchor="middle" class="t label">APPLIED / DISCARDED</text>
  <text x="568" y="440" text-anchor="middle" class="t small">状态和 actor 留在 ledger</text>

  <rect x="698" y="390" width="230" height="70" class="box" fill="#f1f5f9"/>
  <text x="813" y="418" text-anchor="middle" class="t label">分析路径仍是只读</text>
  <text x="813" y="440" text-anchor="middle" class="t small">不会增加可写 provenance</text>
</svg>
