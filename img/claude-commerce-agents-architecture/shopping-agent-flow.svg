<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Shopping Agent 购物流程与写入边界</title>
  <desc id="desc">展示消费者请求从读取商品和政策，到服务端展示、购物车闸门和宿主结账交接的流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:14px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .warn{stroke:#f59e0b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">Shopping Agent 购物流程与写入边界</text>
  <text x="32" y="55" class="t small">先读取并建立 provenance，再允许购物车发生变化；checkout 不触达支付</text>

  <rect x="32" y="96" width="166" height="62" class="box" fill="#ffffff"/>
  <text x="115" y="122" text-anchor="middle" class="t label">消费者意图</text>
  <text x="115" y="143" text-anchor="middle" class="t small">找、比、规划、加购</text>
  <path d="M198 127 H226" class="line"/>

  <rect x="226" y="96" width="166" height="62" class="box" fill="#eff6ff"/>
  <text x="309" y="122" text-anchor="middle" class="t label">Grounding read</text>
  <text x="309" y="143" text-anchor="middle" class="t small">search / policy / order</text>
  <path d="M392 127 H420" class="line"/>

  <rect x="420" y="96" width="166" height="62" class="box" fill="#eff6ff"/>
  <text x="503" y="122" text-anchor="middle" class="t label">Session provenance</text>
  <text x="503" y="143" text-anchor="middle" class="t small">seen_products / variants</text>
  <path d="M586 127 H614" class="line"/>

  <rect x="614" y="96" width="166" height="62" class="box" fill="#ffffff"/>
  <text x="697" y="122" text-anchor="middle" class="t label">UI recommendation</text>
  <text x="697" y="143" text-anchor="middle" class="t small">products / compare / plan</text>
  <path d="M780 127 H808" class="line"/>

  <rect x="808" y="96" width="120" height="62" class="box" fill="#fffbeb"/>
  <text x="868" y="122" text-anchor="middle" class="t label">客户选择</text>
  <text x="868" y="143" text-anchor="middle" class="t small">具体 variant</text>

  <path d="M868 158 V218" class="line"/>
  <rect x="686" y="218" width="242" height="72" class="box" fill="#fffbeb"/>
  <text x="807" y="247" text-anchor="middle" class="t label">Cart gates</text>
  <text x="807" y="269" text-anchor="middle" class="t small">provenance → options → quantity → lock</text>
  <path d="M686 254 H656" class="line"/>

  <rect x="454" y="218" width="202" height="72" class="box" fill="#ecfdf5"/>
  <text x="555" y="247" text-anchor="middle" class="t label">Cart backend</text>
  <text x="555" y="269" text-anchor="middle" class="t small">add / update / remove</text>
  <path d="M454 254 H424" class="line"/>

  <rect x="222" y="218" width="202" height="72" class="box" fill="#ffffff"/>
  <text x="323" y="247" text-anchor="middle" class="t label">cart_update</text>
  <text x="323" y="269" text-anchor="middle" class="t small">whole cart → host UI</text>
  <path d="M222 254 H192" class="line"/>

  <rect x="32" y="218" width="160" height="72" class="box" fill="#ffffff"/>
  <text x="112" y="247" text-anchor="middle" class="t label">Checkout card</text>
  <text x="112" y="269" text-anchor="middle" class="t small">summary + handoff URL</text>

  <path d="M807 290 V350 H656 V382" class="warn"/>
  <rect x="454" y="382" width="202" height="62" class="box" fill="#fffbeb"/>
  <text x="555" y="408" text-anchor="middle" class="t label">Gate held</text>
  <text x="555" y="429" text-anchor="middle" class="t small">重新读取或补齐选项</text>

  <rect x="686" y="382" width="242" height="62" class="box" fill="#f1f5f9"/>
  <text x="807" y="408" text-anchor="middle" class="t label">支付与下单</text>
  <text x="807" y="429" text-anchor="middle" class="t small">由宿主应用完成，Agent 不收费</text>
</svg>
