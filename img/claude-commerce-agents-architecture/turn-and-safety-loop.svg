<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent turn 的执行与安全路径</title>
  <desc id="desc">展示一次对话轮次从用户消息、上下文预取、模型流式生成，到共享执行器、代码闸门、事件流和记忆提取的流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:14px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#3b82f6;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">Agent turn 的执行与安全路径</text>
  <text x="32" y="55" class="t small">模型负责选择，执行器负责校验，宿主负责渲染与持久化</text>

  <rect x="52" y="88" width="196" height="56" class="box" fill="#ffffff"/>
  <text x="150" y="113" text-anchor="middle" class="t label">用户消息 + Session</text>
  <text x="150" y="132" text-anchor="middle" class="t small">messages / state / principal</text>
  <path d="M248 116 H296" class="line"/>

  <rect x="296" y="88" width="196" height="56" class="box" fill="#eff6ff"/>
  <text x="394" y="113" text-anchor="middle" class="t label">并行预取</text>
  <text x="394" y="132" text-anchor="middle" class="t small">profile · cart · context · memory</text>
  <path d="M492 116 H540" class="line"/>

  <rect x="540" y="88" width="196" height="56" class="box" fill="#eff6ff"/>
  <text x="638" y="113" text-anchor="middle" class="t label">动态上下文</text>
  <text x="638" y="132" text-anchor="middle" class="t small">static system + fenced context</text>
  <path d="M736 116 H784" class="line"/>

  <rect x="784" y="88" width="124" height="56" class="box" fill="#ffffff"/>
  <text x="846" y="113" text-anchor="middle" class="t label">模型轮次</text>
  <text x="846" y="132" text-anchor="middle" class="t small">stream</text>

  <path d="M846 144 V190" class="line"/>
  <rect x="664" y="190" width="244" height="62" class="box" fill="#eff6ff"/>
  <text x="786" y="216" text-anchor="middle" class="t label">EagerDispatcher</text>
  <text x="786" y="236" text-anchor="middle" class="t small">tool input 闭合即启动并发执行</text>
  <path d="M664 221 H616" class="line"/>

  <rect x="368" y="190" width="248" height="62" class="box" fill="#ffffff"/>
  <text x="492" y="216" text-anchor="middle" class="t label">BaseToolExecutor</text>
  <text x="492" y="236" text-anchor="middle" class="t small">统一 dispatch / failure ladder</text>
  <path d="M368 221 H320" class="line"/>

  <rect x="72" y="190" width="248" height="62" class="box" fill="#fffbeb"/>
  <text x="196" y="216" text-anchor="middle" class="t label">Fence + Gates</text>
  <text x="196" y="236" text-anchor="middle" class="t small">provenance · caps · approval · schema</text>

  <path d="M196 252 V304" class="line"/>
  <rect x="72" y="304" width="248" height="62" class="box" fill="#ffffff"/>
  <text x="196" y="330" text-anchor="middle" class="t label">Backend / Presentation</text>
  <text x="196" y="350" text-anchor="middle" class="t small">服务端取数、enrichment、真实写入</text>
  <path d="M320 335 H368" class="line"/>

  <rect x="368" y="304" width="248" height="62" class="box" fill="#ecfdf5"/>
  <text x="492" y="330" text-anchor="middle" class="t label">AgentEvent</text>
  <text x="492" y="350" text-anchor="middle" class="t small">text · tool · ui · cart/change · progress</text>
  <path d="M616 335 H664" class="line"/>

  <rect x="664" y="304" width="244" height="62" class="box" fill="#ffffff"/>
  <text x="786" y="330" text-anchor="middle" class="t label">宿主渲染</text>
  <text x="786" y="350" text-anchor="middle" class="t small">SSE / SDK console / Web UI</text>

  <path d="M786 366 V416 H638 V446" class="loop"/>
  <rect x="368" y="416" width="270" height="62" class="box" fill="#eff6ff"/>
  <text x="503" y="442" text-anchor="middle" class="t label">下一模型轮次或结束</text>
  <text x="503" y="462" text-anchor="middle" class="t small">tool result → auto / none / close_on_presentation</text>
  <path d="M503 416 V272 H846 V144" class="loop"/>

  <rect x="72" y="416" width="248" height="62" class="box" fill="#f1f5f9"/>
  <text x="196" y="442" text-anchor="middle" class="t label">turn_complete</text>
  <text x="196" y="462" text-anchor="middle" class="t small">usage · elapsed · history compaction</text>
  <path d="M368 447 H320" class="line"/>

  <rect x="72" y="502" width="836" height="34" class="box" fill="#ffffff"/>
  <text x="490" y="524" text-anchor="middle" class="t small">turn 结束后：transcript_text → memory extraction → MemoryStore（仅保存通过过滤的事实）</text>
</svg>
