<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">什么时候用 Pro 模式</title>
  <desc id="d">先看任务是否足够难、边际质量提升是否有实质影响、有没有明确评估标准；再在同一代表任务上对比标准模式与 Pro 模式的成功率、完整性、token、延迟与成本。</desc>
  <rect width="960" height="440" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">什么时候用 Pro 模式：先问三个问题，再做对比实验</text>

  <!-- 三个问题 -->
  <text x="480" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">三个前置问题（全部为"是"才考虑 Pro）</text>
  <rect x="60" y="100" width="260" height="66" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">① 边际提升有实质影响？</text>
  <text x="190" y="148" text-anchor="middle" font-size="10.5" fill="#475569">复杂优化 · 高价值编码或审查</text>
  <rect x="350" y="100" width="260" height="66" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">② 任务足够难？</text>
  <text x="480" y="148" text-anchor="middle" font-size="10.5" fill="#475569">有明确评估标准的深度分析</text>
  <rect x="640" y="100" width="260" height="66" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="770" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">③ 评估过才有发言权？</text>
  <text x="770" y="148" text-anchor="middle" font-size="10.5" fill="#475569">不要假设最高强度总是最优</text>

  <!-- 决策 -->
  <path d="M480 168 L480 192" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="330" y="196" width="300" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="480" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">在相同代表任务上：标准模式 vs Pro 模式</text>

  <!-- 对比 -->
  <rect x="60" y="256" width="400" height="140" rx="10" fill="#fff" stroke="#94a3b8"/>
  <rect x="60" y="256" width="400" height="34" rx="10" fill="#f1f5f9"/>
  <text x="260" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">标准模式（reasoning.effort 同基线）</text>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#475569">常规 · 延迟敏感 · 高吞吐量</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#475569">默认 medium 推理强度</text>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#475569">成本与延迟的基准线</text>

  <rect x="500" y="256" width="400" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="500" y="256" width="400" height="34" rx="10" fill="#3b82f6"/>
  <text x="700" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Pro 模式（reasoning.mode:"pro"）</text>
  <text x="700" y="318" text-anchor="middle" font-size="11" fill="#475569">更多模型工作 → 返回单一最终答案</text>
  <text x="700" y="340" text-anchor="middle" font-size="11" fill="#475569">提示词保持成果导向，不要写"请更努力思考"</text>
  <text x="700" y="362" text-anchor="middle" font-size="11" fill="#1e40af">衡量：成功率 · 完整性 · 证据 · token · 延迟 · 成本</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
</svg>
