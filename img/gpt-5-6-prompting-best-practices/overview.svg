<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GPT-5.6 官方 5 条 Prompting 最佳实践总览</title>
  <desc id="d">五条最佳实践分别为精简提示词、定义自主性与审批边界、设置响应长度与风格、Pro 模式、编程工具调用；每条给出核心动作与官方关键数据。</desc>
  <rect width="960" height="560" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">GPT-5.6 官方 5 条 Prompting Best Practices</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#475569">共同主线：提示词不是越详细越好，而是越"准"越好</text>

  <!-- 卡片 1 -->
  <rect x="40" y="90" width="860" height="78" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="40" y="90" width="120" height="78" rx="10" fill="#3b82f6"/>
  <text x="100" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">01</text>
  <text x="182" y="116" font-size="14" font-weight="700" fill="#1e293b">精简提示词（Favor leaner prompts）</text>
  <text x="182" y="140" font-size="11.5" fill="#475569">删重复指令与示例、简化工具描述 → 一次只删一组，重新跑评估</text>
  <text x="182" y="158" font-size="11" fill="#1e40af">评估 +10~15% · token −41~66% · 成本 −33~67%</text>

  <!-- 卡片 2 -->
  <rect x="40" y="180" width="860" height="78" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="40" y="180" width="120" height="78" rx="10" fill="#3b82f6"/>
  <text x="100" y="222" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">02</text>
  <text x="182" y="206" font-size="14" font-weight="700" fill="#1e293b">定义自主性与审批边界</text>
  <text x="182" y="230" font-size="11.5" fill="#475569">安全范围内直接干，外部写入 / 破坏性操作 / 大额购买前停下确认</text>
  <text x="182" y="248" font-size="11" fill="#1e40af">策略放一处 · 每条只说一次 · 别重复"先询问"</text>

  <!-- 卡片 3 -->
  <rect x="40" y="270" width="860" height="78" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="40" y="270" width="120" height="78" rx="10" fill="#3b82f6"/>
  <text x="100" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">03</text>
  <text x="182" y="296" font-size="14" font-weight="700" fill="#1e293b">设置响应长度与风格</text>
  <text x="182" y="320" font-size="11.5" fill="#475569">text.verbosity 设默认详细度；"结论先行 + 证据 + 下一步"；把语气写成具体写作选择</text>
  <text x="182" y="338" font-size="11" fill="#1e40af">GPT-5.6 默认更简洁，迁移时重新检查"Be concise"是否还需要</text>

  <!-- 卡片 4 -->
  <rect x="40" y="360" width="860" height="78" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="40" y="360" width="120" height="78" rx="10" fill="#3b82f6"/>
  <text x="100" y="402" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">04</text>
  <text x="182" y="386" font-size="14" font-weight="700" fill="#1e293b">Pro 模式（Pro mode）</text>
  <text x="182" y="410" font-size="11.5" fill="#475569">reasoning.mode:"pro" 多花模型工作换可靠性；适合复杂优化 / 高价值审查 / 有明确评估标准</text>
  <text x="182" y="428" font-size="11" fill="#1e40af">不要假设最高强度最优 · 先在代表任务上对比质量与成本</text>

  <!-- 卡片 5 -->
  <rect x="40" y="450" width="860" height="78" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="40" y="450" width="120" height="78" rx="10" fill="#8b5cf6"/>
  <text x="100" y="492" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">05</text>
  <text x="182" y="476" font-size="14" font-weight="700" fill="#1e293b">编程工具调用（Programmatic Tool Calling）</text>
  <text x="182" y="500" font-size="11.5" fill="#475569">有界阶段用 JS 编排工具：过滤 / 连接 / 排序 / 聚合 / 验证；路由指令必须任务特定化</text>
  <text x="182" y="518" font-size="11" fill="#6d28d9">program_output 与最终 message 是两个独立输出，必须同时评估</text>
</svg>
