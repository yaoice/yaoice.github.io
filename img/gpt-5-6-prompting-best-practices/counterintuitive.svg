<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">3 个反常识判断</title>
  <desc id="d">更精简的提示词反而更好；最高推理强度并非最优，要逐档对比；显式提示缓存写入要付 1.25 倍价格，缓存不是免费午餐。</desc>
  <rect width="960" height="460" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">这份文档里最值得记住的 3 个反常识判断</text>

  <!-- 卡片 1 -->
  <rect x="40" y="76" width="880" height="110" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="40" y="76" width="120" height="110" rx="10" fill="#3b82f6"/>
  <text x="100" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">反常识 1</text>
  <text x="182" y="104" font-size="14" font-weight="700" fill="#1e293b">提示词不是越详细越好，而是越精简越好</text>
  <text x="182" y="128" font-size="11.5" fill="#475569">直觉：写得更细 → 控制更强。事实：删重复指令、简化工具描述后，评估分数反而 +10~15%，token −41~66%。</text>
  <text x="182" y="148" font-size="11.5" fill="#475569">正确做法：从一个能用的提示词出发，一次只删一组，重跑同一个评估，删到分数开始掉为止。</text>
  <text x="182" y="170" font-size="11" fill="#1e40af">例：官方把"Be concise"这种宽泛指令，换成了"以结论开头 + 保留必要证据 + 先删引言与重复"的优先级说明</text>

  <!-- 卡片 2 -->
  <rect x="40" y="198" width="880" height="110" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="40" y="198" width="120" height="110" rx="10" fill="#8b5cf6"/>
  <text x="100" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">反常识 2</text>
  <text x="182" y="226" font-size="14" font-weight="700" fill="#1e293b">最高推理强度不是默认答案，也不等于最优权衡</text>
  <text x="182" y="250" font-size="11.5" fill="#475569">官方原话建议：从当前基线出发，先测低一档；medium 是均衡起点，max 只留给最难、质量优先的工作负载。</text>
  <text x="182" y="270" font-size="11.5" fill="#475569">Pro 模式同理：与标准模式用相同模型和强度，在代表任务上比较，质量收益不成立就回退。</text>
  <text x="182" y="292" font-size="11" fill="#6d28d9">例：迁移时"保留当前推理强度为基线，再测试低一档"，而不是直接拉满</text>

  <!-- 卡片 3 -->
  <rect x="40" y="320" width="880" height="110" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="40" y="320" width="120" height="110" rx="10" fill="#f59e0b"/>
  <text x="100" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">反常识 3</text>
  <text x="182" y="348" font-size="14" font-weight="700" fill="#1e293b">提示缓存不是免费午餐：写入按 1.25 倍价计费</text>
  <text x="182" y="372" font-size="11.5" fill="#475569">直觉：缓存 = 省钱。事实：显式缓存写入按未缓存输入的 1.25 倍计费；读才有折扣，写要付溢价。</text>
  <text x="182" y="392" font-size="11.5" fill="#475569">正确做法：只缓存真正复用的前缀；用显式断点避免不必要的写入；跟踪 cached_tokens 与 cache_write_tokens。</text>
  <text x="182" y="414" font-size="11" fill="#9a3412">例：prompt_cache_options.mode:"explicit" + ttl 替代 prompt_cache_retention</text>
</svg>
