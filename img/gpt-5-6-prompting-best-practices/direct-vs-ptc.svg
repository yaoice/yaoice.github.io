<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">直接工具调用 还是 编程工具调用（PTC）</title>
  <desc id="d">符合任一"直接调用"特征的场景走直接工具调用；有界阶段、可预测处理、需要归并多个中间结果时，把路由指令写得任务特定化再交给 PTC。</desc>
  <rect width="960" height="460" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">直接工具调用 vs 编程工具调用（PTC）：按任务形态选</text>

  <!-- 左：直接调用 -->
  <rect x="40" y="76" width="420" height="324" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="40" y="76" width="420" height="34" rx="10" fill="#f59e0b"/>
  <text x="250" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">优先直接调用（命中任意一条）</text>
  <g font-size="11.5">
    <circle cx="74" cy="132" r="5" fill="#f59e0b"/>
    <text x="88" y="136" fill="#334155">一次调用就足够，不需要归并</text>
    <circle cx="74" cy="166" r="5" fill="#f59e0b"/>
    <text x="88" y="170" fill="#334155">中间输出已经很小</text>
    <circle cx="74" cy="200" r="5" fill="#f59e0b"/>
    <text x="88" y="204" fill="#334155">每个结果可能改变模型下一步决策</text>
    <circle cx="74" cy="234" r="5" fill="#f59e0b"/>
    <text x="88" y="238" fill="#334155">操作需要审批</text>
    <circle cx="74" cy="268" r="5" fill="#f59e0b"/>
    <text x="88" y="272" fill="#334155">最终输出必须保留引用 / 原生工件</text>
    <circle cx="74" cy="302" r="5" fill="#f59e0b"/>
    <text x="88" y="306" fill="#334155">编写程序前无法确定返回形状</text>
  </g>
  <rect x="60" y="330" width="380" height="56" rx="8" fill="#fff7ed"/>
  <text x="250" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">"多个 / 并行 / 依赖的调用"本身</text>
  <text x="250" y="370" text-anchor="middle" font-size="10.5" fill="#475569">不能证明就该用 PTC</text>

  <!-- 右：PTC -->
  <rect x="500" y="76" width="420" height="324" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="500" y="76" width="420" height="34" rx="10" fill="#8b5cf6"/>
  <text x="710" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">用 PTC（有界 + 可预测处理）</text>
  <g font-size="11.5">
    <circle cx="534" cy="132" r="5" fill="#8b5cf6"/>
    <text x="548" y="136" fill="#334155">有界工作流：代码能处理多个工具结果</text>
    <circle cx="534" cy="166" r="5" fill="#8b5cf6"/>
    <text x="548" y="170" fill="#334155">大型中间输出，归并成小的结构化结果</text>
    <circle cx="534" cy="200" r="5" fill="#8b5cf6"/>
    <text x="548" y="204" fill="#334155">过滤 · 连接 · 排序 · 去重 · 聚合 · 验证</text>
  </g>
  <rect x="520" y="228" width="380" height="120" rx="8" fill="#f5f3ff"/>
  <text x="710" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b21b6">路由指令必须任务特定化（不能只写"高效使用 PTC"）</text>
  <text x="710" y="276" text-anchor="middle" font-size="10.5" fill="#475569">哪个有界阶段用 PTC · 可调哪些工具</text>
  <text x="710" y="294" text-anchor="middle" font-size="10.5" fill="#475569">精确输出模式 · 并发 / 重试 / 停止限制</text>
  <text x="710" y="312" text-anchor="middle" font-size="10.5" fill="#475569">哪些工作保持直接调用（语义判断 / 审批 / 最终验证）</text>
  <text x="710" y="336" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b21b6">工具描述要记录返回字段、类型与错误行为</text>

  <!-- 底部评估 -->
  <rect x="60" y="416" width="840" height="30" rx="8" fill="#f1f5f9"/>
  <text x="480" y="435" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">评估：program_output 与最终 message 是两个独立输出，必须同时测试 · 只有通过现有评估，更少的调用 / 轮次才算改进</text>
</svg>
