<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">从 GPT-5.5 / 5.4 迁移到 GPT-5.6 的检查清单</title>
  <desc id="d">六项检查：推理强度逐档对比、Pro 模式用参数而非换模型、持久化推理默认 all_turns、缓存写入计费与显式断点、PTC 双输出评估、响应风格改用 verbosity。</desc>
  <rect width="960" height="560" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">从 GPT-5.5 / 5.4 迁移到 GPT-5.6 · 六项检查清单</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#475569">原则：先保住基线质量，再用评估验证每一项"省"是否成立</text>

  <g font-size="12">
    <!-- 1 -->
    <rect x="60" y="90" width="840" height="66" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="60" y="90" width="34" height="66" rx="8" fill="#10b981"/>
    <text x="77" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✓</text>
    <text x="120" y="114" font-size="13" font-weight="700" fill="#1e293b">推理强度逐档对比，不要直接拉满</text>
    <text x="120" y="136" font-size="11" fill="#475569">保留当前强度为基线 → 测试低一档；medium 起步，high / xhigh 仅在可测出提升时用，max 留给最难任务</text>

    <!-- 2 -->
    <rect x="60" y="166" width="840" height="66" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="60" y="166" width="34" height="66" rx="8" fill="#10b981"/>
    <text x="77" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✓</text>
    <text x="120" y="190" font-size="13" font-weight="700" fill="#1e293b">Pro 模式用参数开，不要换模型 slug</text>
    <text x="120" y="212" font-size="11" fill="#475569">reasoning.mode:"pro" 即可；省略 reasoning.effort 时默认 medium；提示词保持成果导向</text>

    <!-- 3 -->
    <rect x="60" y="242" width="840" height="66" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="60" y="242" width="34" height="66" rx="8" fill="#10b981"/>
    <text x="77" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✓</text>
    <text x="120" y="266" font-size="13" font-weight="700" fill="#1e293b">持久化推理：确认默认值已变为 all_turns</text>
    <text x="120" y="288" font-size="11" fill="#475569">任务目标 / 假设 / 优先级跨轮次稳定 → 用 all_turns（新默认）；早期推理不再相关 → 用 current_turn</text>

    <!-- 4 -->
    <rect x="60" y="318" width="840" height="66" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="60" y="318" width="34" height="66" rx="8" fill="#f59e0b"/>
    <text x="77" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">!</text>
    <text x="120" y="342" font-size="13" font-weight="700" fill="#1e293b">提示缓存：写入要 1.25 倍价，管住写</text>
    <text x="120" y="364" font-size="11" fill="#475569">跟踪 cached_tokens 与 cache_write_tokens；用显式断点或 mode:"explicit" 避免不必要写入；ttl 替代 prompt_cache_retention</text>

    <!-- 5 -->
    <rect x="60" y="394" width="840" height="66" rx="8" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="60" y="394" width="34" height="66" rx="8" fill="#8b5cf6"/>
    <text x="77" y="434" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✓</text>
    <text x="120" y="418" font-size="13" font-weight="700" fill="#1e293b">PTC：program_output 与最终 message 分开评估</text>
    <text x="120" y="440" font-size="11" fill="#475569">对比成功率 · 答案完整性 · 所需证据 · token · 延迟 · 成本；只有通过现有评估，更少调用才算改进</text>

    <!-- 6 -->
    <rect x="60" y="470" width="840" height="66" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="60" y="470" width="34" height="66" rx="8" fill="#3b82f6"/>
    <text x="77" y="510" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">✓</text>
    <text x="120" y="494" font-size="13" font-weight="700" fill="#1e293b">响应风格：改用 verbosity，复查"Be concise"</text>
    <text x="120" y="516" font-size="11" fill="#475569">text.verbosity 设默认详细度（low / medium / high）；宽泛简洁性指令可能让回答过短，保留前先验证</text>
  </g>
</svg>
