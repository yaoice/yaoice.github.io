<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GPT-5.6 Prompting Best Practices：更精简的提示词，更高的分数</title>
  <desc id="d">从冗长提示词到精简提示词再到最终结构，五个最佳实践把提示词越写越短，同时把评估分数提高 10~15%、token 减少 41~66%。</desc>
  <rect width="960" height="540" fill="#f8fafc" rx="10"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">GPT-5.6 Prompting Best Practices 深度解读</text>
  <text x="480" y="74" text-anchor="middle" font-size="14" fill="#475569">官方 5 条最佳实践 + 3 个反常识判断 + 一份可直接照抄的迁移清单</text>

  <!-- 精简漏斗 -->
  <rect x="150" y="120" width="240" height="60" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="270" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">原始提示词</text>
  <text x="270" y="164" text-anchor="middle" font-size="10" fill="#64748b">重复指令 · 堆形容词 · 多余示例</text>

  <path d="M270 180 L270 208 L160 252 L160 260 L380 260 L380 252 L270 208" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="270" y="244" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e40af">每条指令只说一次 · 删冗余 · 只留必要工具</text>

  <rect x="130" y="270" width="280" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="270" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">精简后提示词</text>
  <text x="270" y="314" text-anchor="middle" font-size="10" fill="#475569">更少 token · 更清晰的自主边界 · 点名图的位置</text>

  <!-- 右侧数据 -->
  <rect x="560" y="120" width="260" height="60" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="690" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">评估分数 +10~15%</text>
  <text x="690" y="164" text-anchor="middle" font-size="10" fill="#475569">官方编码代理评测样本</text>

  <rect x="560" y="200" width="260" height="60" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="690" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">总 token −41~66%</text>
  <text x="690" y="244" text-anchor="middle" font-size="10" fill="#475569">成本同时下降 33~67%</text>

  <rect x="560" y="280" width="260" height="60" rx="8" fill="#fff5f5" stroke="#ef4444"/>
  <text x="690" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">但：不是无脑删</text>
  <text x="690" y="324" text-anchor="middle" font-size="10" fill="#475569">示例与风格指南若编码了产品需求，要保留</text>

  <path d="M460 300 L558 300" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- 五条实践条 -->
  <text x="480" y="408" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">官方 5 条最佳实践</text>
  <g font-size="11.5">
    <rect x="60" y="428" width="160" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="140" y="450" text-anchor="middle" font-weight="700" fill="#1e293b">① 精简提示词</text>
    <text x="140" y="468" text-anchor="middle" fill="#64748b">删冗余，每条只说一次</text>
    <rect x="230" y="428" width="160" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="310" y="450" text-anchor="middle" font-weight="700" fill="#1e293b">② 自主性边界</text>
    <text x="310" y="468" text-anchor="middle" fill="#64748b">明确哪些要审批</text>
    <rect x="400" y="428" width="160" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="480" y="450" text-anchor="middle" font-weight="700" fill="#1e293b">③ 长度与风格</text>
    <text x="480" y="468" text-anchor="middle" fill="#64748b">verbosity + 结论先行</text>
    <rect x="570" y="428" width="160" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="650" y="450" text-anchor="middle" font-weight="700" fill="#1e293b">④ Pro 模式</text>
    <text x="650" y="468" text-anchor="middle" fill="#64748b">难任务多花模型工作</text>
    <rect x="740" y="428" width="160" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="820" y="450" text-anchor="middle" font-weight="700" fill="#1e293b">⑤ 编程工具调用</text>
    <text x="820" y="468" text-anchor="middle" fill="#64748b">有界阶段交给程序</text>
  </g>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
</svg>
