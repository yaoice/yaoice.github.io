<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-label="typed host request 时序">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="660" rx="10" fill="#f8fafc"/>

  <text x="480" y="40" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e293b">typed host request：Python 向 TS 宿主发起类型化请求并 await 结果</text>

  <!-- Lifeline headers -->
  <rect x="40" y="70" width="210" height="44" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="145" y="97" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#047857">Python Kernel</text>

  <rect x="270" y="70" width="180" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="97" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#334155">Comm 通道</text>

  <rect x="470" y="70" width="200" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="570" y="97" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">TS Host Handler</text>

  <rect x="690" y="70" width="230" height="44" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="805" y="97" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#6d28d9">AgentSession</text>

  <!-- Lifelines -->
  <line x1="145" y1="114" x2="145" y2="600" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="360" y1="114" x2="360" y2="600" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="570" y1="114" x2="570" y2="600" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="805" y1="114" x2="805" y2="600" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 1 -->
  <rect x="55" y="130" width="180" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="145" y="148" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#334155">await host_request("rlm.run")</text>
  <line x1="145" y1="158" x2="360" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#64748b">comm.open({payload, type})</text>

  <!-- 2 -->
  <rect x="300" y="180" width="120" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="360" y="198" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#334155">comm_open / msg</text>
  <line x1="360" y1="208" x2="570" y2="208" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect x="480" y="230" width="180" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="570" y="248" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#334155">handleHostRequest 分派</text>
  <line x1="570" y1="258" x2="805" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="655" y="250" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#64748b">runRlmChild()</text>

  <!-- 4 -->
  <rect x="700" y="280" width="210" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="805" y="298" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#334155">创建子会话 runtime</text>
  <text x="805" y="313" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#94a3b8">admit 任务 · 可选独立 kernel</text>

  <!-- 5 -->
  <rect x="700" y="340" width="210" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="805" y="358" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#334155">返回 spawn handle</text>
  <line x1="805" y1="368" x2="570" y2="368" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="650" y="360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#64748b">rlm_child_id / session_dir</text>

  <!-- 6 -->
  <rect x="480" y="392" width="180" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="570" y="410" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#334155">comm_msg({status:"ok", ...})</text>
  <line x1="570" y1="420" x2="360" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7 -->
  <rect x="280" y="444" width="160" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="360" y="462" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#334155">_on_msg 回调</text>
  <line x1="360" y1="472" x2="145" y2="472" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="464" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#64748b">status === "ok"</text>

  <!-- 8 -->
  <rect x="55" y="496" width="180" height="28" rx="5" fill="#ffffff" stroke="#10b981"/>
  <text x="145" y="514" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#047857">future.resolve → 返回结果</text>

  <text x="480" y="570" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">错误路径：status === "error" → future.set_exception(RuntimeError)，模型端抛异常</text>
  <text x="480" y="594" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">安全细节：request_type 位于 payload 末尾，防 payload 内 type 键劫持路由</text>
</svg>
