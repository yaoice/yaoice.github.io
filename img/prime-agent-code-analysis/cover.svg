<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Prime Agent 源码解析封面">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="380" rx="10" fill="#f8fafc"/>

  <text x="480" y="72" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="700" fill="#1e293b">Prime Agent</text>
  <text x="480" y="108" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#475569">一个会自我改进的递归语言模型（RLM）智能体 · 源码深度解析</text>

  <line x1="200" y1="130" x2="760" y2="130" stroke="#cbd5e1" stroke-width="1"/>

  <g filter="url(#shadow)">
    <rect x="60" y="170" width="260" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="60" y="170" width="260" height="6" rx="3" fill="#3b82f6"/>
    <text x="190" y="205" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">一切皆程序</text>
    <text x="190" y="232" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#475569">持久 IPython 是内置模型工具</text>
    <text x="190" y="254" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#475569">文件 / Shell / 工具调用全走代码</text>
    <text x="190" y="290" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#94a3b8">prompt-as-a-variable</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="170" width="260" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="350" y="170" width="260" height="6" rx="3" fill="#8b5cf6"/>
    <text x="480" y="205" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">子代理内建</text>
    <text x="480" y="232" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#475569">rlm(...) 派发真实子代理</text>
    <text x="480" y="254" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#475569">并行 / 后台 / 结果程序化返回</text>
    <text x="480" y="290" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#94a3b8">programmatic /sub-agent calling</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="170" width="260" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="640" y="170" width="260" height="6" rx="3" fill="#10b981"/>
    <text x="770" y="205" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">持续自我改进</text>
    <text x="770" y="232" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#475569">/refine 复盘并沉淀经验</text>
    <text x="770" y="254" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#475569">记忆 / 技能 / 子代理规格可回滚</text>
    <text x="770" y="290" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#94a3b8">continual harness</text>
