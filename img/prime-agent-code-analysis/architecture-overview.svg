<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img" aria-label="Prime Agent 整体架构"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs><g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif"><rect width="960" height="780" rx="10" fill="#f8fafc"/><text x="480" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Prime Agent 整体架构：客户端渲染 · 守护进程编排 · Worker 执行 · Kernel 控制</text><text x="480" y="64" text-anchor="middle" font-size="13" fill="#64748b">Worker 与 Kernel 是独立进程：隔离生命周期与故障，而非安全沙箱</text><g filter="url(#shadow)"><rect x="40" y="90" width="560" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="60" y="114" font-size="13" font-weight="700" fill="#1e293b">Client 层（只渲染与输入，不执行）</text><rect x="60" y="126" width="170" height="26" rx="6" fill="#eef2ff" stroke="#3b82f6"/><text x="145" y="143" text-anchor="middle" font-size="12" fill="#1d4ed8">Interactive TUI</text><rect x="244" y="126" width="170" height="26" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/><text x="329" y="143" text-anchor="middle" font-size="12" fill="#6d28d9">Print / JSON / RPC</text><rect x="428" y="126" width="150" height="26" rx="6" fill="#f0fdf4" stroke="#10b981"/><text x="503" y="143" text-anchor="middle" font-size="12" fill="#047857">ACP / headless</text></g><line x1="320" y1="164" x2="320" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="190" width="560" height="44" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="320" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">AgentConnection（客户端侧执行边界 · 快照 / 重放 / 重连）</text><line x1="320" y1="234" x2="320" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="40" y="260" width="560" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="60" y="284" font-size="13" font-weight="700" fill="#1e293b">Daemon Supervisor（发现 · 路由 · 附件 · 恢复）</text><rect x="60" y="296" width="250" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="185" y="313" text-anchor="middle" font-size="12" fill="#b45309">本地 daemon 协议 · lease</text><rect x="330" y="296" width="250" height="26" rx="6" fill="#fee2e2" stroke="#ef4444"/><text x="455" y="313" text-anchor="middle" font-size="12" fill="#b91c1c">Catalog：会话扫描</text></g><line x1="320" y1="334" x2="320" y2="358" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="40" y="360" width="560" height="360" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="60" y="386" font-size="14" font-weight="700" fill="#1e293b">Session Worker · 一个根会话树</text><rect x="60" y="400" width="520" height="40" rx="6" fill="#eff6ff"/><text x="320" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">AgentSessionRuntime（生命周期外壳）</text><rect x="60" y="456" width="360" height="86" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="240" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Root AgentSession（~11k 行）</text><text x="240" y="502" text-anchor="middle" font-size="11.5" fill="#475569">主循环 · queue · 工具 · compaction · goals</text><text x="240" y="522" text-anchor="middle" font-size="11.5" fill="#475569">provider 调用 · 子代理生命周期 · 写入 transcript</text><rect x="434" y="456" width="146" height="40" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/><text x="507" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Scheduler</text><line x1="320" y1="542" x2="320" y2="566" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="568" width="260" height="52" rx="6" fill="#f0fdf4" stroke="#10b981"/><text x="190" y="592" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Root IPython Kernel</text><text x="190" y="610" text-anchor="middle" font-size="11" fill="#475569">ZMQ + host.request comm 桥</text><rect x="60" y="634" width="260" height="52" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/><text x="190" y="658" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">RLM 子运行（session + 可选 kernel）</text><text x="190" y="676" text-anchor="middle" font-size="11" fill="#475569">并行 / 后台执行</text><rect x="340" y="568" width="240" height="118" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="460" y="592" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">Heartbeat · Schedule · Goal</text><text x="460" y="616" text-anchor="middle" font-size="11" fill="#475569">长任务持续续跑</text><text x="460" y="640" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">Autonomous 模式</text><text x="460" y="664" text-anchor="middle" font-size="11" fill="#475569">turn / token / time 预算 + 质量门</text></g><g filter="url(#shadow)"><rect x="640" y="360" width="280" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="780" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Model Providers</text><text x="780" y="412" text-anchor="middle" font-size="11.5" fill="#475569">31 个 provider · 统一事件流</text><text x="780" y="432" text-anchor="middle" font-size="11.5" fill="#475569">text / tool_call / thinking</text><text x="780" y="452" text-anchor="middle" font-size="11.5" fill="#475569">usage / stop 五种粒度</text><rect x="660" y="470" width="240" height="26" rx="6" fill="#eff6ff" stroke="#3b82f6"/><text x="780" y="487" text-anchor="middle" font-size="12" fill="#1d4ed8">stream() / streamSimple() 门面</text></g><g filter="url(#shadow)"><rect x="640" y="530" width="280" height="190" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="780" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">持久化</text><text x="780" y="582" text-anchor="middle" font-size="11.5" fill="#475569">Session JSONL transcript + 工件</text><text x="780" y="602" text-anchor="middle" font-size="11.5" fill="#475569">harness 状态（prompt / memory / skill）</text><text x="780" y="622" text-anchor="middle" font-size="11.5" fill="#475569">refinements.jsonl 精化历史</text><rect x="660" y="642" width="240" height="26" rx="6" fill="#f0fdf4" stroke="#10b981"/><text x="780" y="659" text-anchor="middle" font-size="12" fill="#047857">会话快照 · 可回滚</text><rect x="660" y="680" width="240" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="780" y="697" text-anchor="middle" font-size="12" fill="#b45309">session lease（进程间锁）</text></g><line x1="600" y1="420" x2="640" y2="440" stroke="#94a3b8" stroke-width="1.5"/><line x1="600" y1="660" x2="640" y2="640" stroke="#94a3b8" stroke-width="1.5"/></g></svg>
