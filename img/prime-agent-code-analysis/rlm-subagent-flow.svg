<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="RLM 子代理流程">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="500" rx="10" fill="#f8fafc"/>

  <text x="480" y="40" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e293b">RLM 子代理：主会话把子任务当函数调用，返回可编程使用的句柄</text>

  <!-- Main session -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="240" height="300" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="160" y="120" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">主 AgentSession</text>
    <text x="160" y="148" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#64748b">模型在主循环中调用 ipython</text>
    <rect x="60" y="170" width="200" height="52" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1"/>
    <text x="160" y="192" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#047857">await rlm("子任务")</text>
    <text x="160" y="212" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#475569">rlm 是可调用的 Python 模块</text>
    <text x="160" y="252" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">→ host_request("rlm.run")</text>
    <text x="160" y="272" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">→ TS 侧 runRlmChild()</text>
    <text x="160" y="330" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#94a3b8">/rlm-max-depth 限制递归深度</text>
  </g>

  <line x1="280" y1="210" x2="330" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Children -->
  <g filter="url(#shadow)">
    <rect x="340" y="90" width="180" height="140" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="430" y="118" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">RLM Child 1</text>
    <text x="430" y="142" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">独立 session runtime</text>
    <text x="430" y="162" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">可选独立 kernel</text>
    <text x="430" y="182" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">可指定 model 选择器</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="250" width="180" height="140" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="480" y="278" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">RLM Child 2</text>
    <text x="480" y="302" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">并行 / 后台执行</text>
    <text x="480" y="322" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">会话可后续 attach</text>
  </g>

  <line x1="520" y1="210" x2="520" y2="250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="230" x2="430" y2="250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="320" y="200" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#64748b">分派</text>

  <!-- Returns -->
  <rect x="610" y="140" width="310" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="765" y="172" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#b45309">RLMSpawnHandle</text>
  <text x="765" y="196" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">rlm_child_id · name · session_dir · model</text>
  <text x="765" y="216" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">子代理一旦 admit 即返回，非阻塞</text>
  <text x="765" y="236" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">后续可 rlm_observe 订阅子会话事件</text>

  <rect x="610" y="280" width="310" height="110" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="765" y="312" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#047857">程序化收口</text>
  <text x="765" y="336" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">结果写回主会话上下文</text>
  <text x="765" y="356" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">子代理可互相发现与通信</text>
  <text x="765" y="376" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">daemon 断开后子代理继续运行</text>

  <line x1="520" y1="160" x2="610" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="250" x2="610" y2="250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
