<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="harness refine 工作流">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="10" fill="#f8fafc"/>

  <text x="480" y="40" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e293b">Continual Harness：/refine 用证据支撑的小更新沉淀可复用状态</text>
  <text x="480" y="64" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#64748b">永不重写不可变的基础 system prompt · 快照支持回滚 · 默认仅作用于当前会话</text>

  <!-- Step 1: trajectory -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="250" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="165" y="130" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e293b">会话轨迹</text>
    <text x="165" y="156" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">当前 turn 的执行历史</text>
    <text x="165" y="178" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">工具调用 · 结果 · 模型反思</text>
    <text x="165" y="204" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#94a3b8">/refine 以此为复盘素材</text>
  </g>
  <line x1="290" y1="160" x2="350" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: propose -->
  <g filter="url(#shadow)">
    <rect x="360" y="100" width="250" height="120" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="485" y="130" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">模型提交 RefinementProposal</text>
    <text x="485" y="156" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">edits：create / update / delete</text>
    <text x="485" y="178" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">目标条目：prompt · memory</text>
    <text x="485" y="200" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">skill · subagent 规格</text>
  </g>
  <line x1="610" y1="160" x2="670" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: validate -->
  <g filter="url(#shadow)">
    <rect x="680" y="100" width="240" height="120" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="800" y="130" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#b45309">逐条校验</text>
    <text x="800" y="156" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">validateEdit 结构合法性</text>
    <text x="800" y="178" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">baseline 比对防并发覆盖</text>
    <text x="800" y="200" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">失败条目跳过，不阻塞整体</text>
  </g>

  <line x1="800" y1="220" x2="800" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: apply -->
  <g filter="url(#shadow)">
    <rect x="680" y="290" width="240" height="120" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="800" y="320" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">applyRefinementProposal</text>
    <text x="800" y="346" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">version +1 · updated_at 刷新</text>
    <text x="800" y="368" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">记录到 refinements.jsonl</text>
    <text x="800" y="390" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">harness 快照支持 rollback</text>
  </g>

  <line x1="610" y1="350" x2="680" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: harness state -->
  <g filter="url(#shadow)">
    <rect x="360" y="290" width="250" height="120" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="485" y="320" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#047857">HarnessState（持久化 JSON）</text>
    <text x="485" y="346" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">prompt / memory / skill / subagent</text>
    <text x="485" y="368" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">local / global 双作用域</text>
    <text x="485" y="390" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">harness.py 的 CRUD 存储</text>
  </g>
  <line x1="360" y1="350" x2="290" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: benefit future sessions -->
  <g filter="url(#shadow)">
    <rect x="40" y="290" width="250" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="165" y="320" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e293b">未来会话受益</text>
    <text x="165" y="346" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">补充 prompt / 记忆 / 技能描述</text>
    <text x="165" y="368" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">在后续 prompt 中自动注入</text>
  </g>

  <!-- Loop back arrow -->
  <path d="M 165 410 C 165 470, 480 480, 485 430" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <text x="470" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#64748b">持续改进循环</text>
</svg>
