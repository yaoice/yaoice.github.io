<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="安装部署流程">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="10" fill="#f8fafc"/>

  <text x="480" y="40" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e293b">安装部署：一键脚本 + 校验 + npm 包 + Python 内核自举</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="165" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="122" y="110" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e293b">下载安装脚本</text>
    <text x="122" y="136" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">curl install.sh</text>
    <text x="122" y="156" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">macOS / Linux</text>
    <text x="122" y="176" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">含终端进度动画</text>
  </g>
  <line x1="205" y1="140" x2="235" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="245" y="80" width="165" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="327" y="110" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e293b">下载版本化包</text>
    <text x="327" y="136" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">releases/vX.Y.Z.tgz</text>
    <text x="327" y="156" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">release channel: stable</text>
    <text x="327" y="176" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">可 PRIME_AGENT_* 覆盖</text>
  </g>
  <line x1="410" y1="140" x2="440" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="450" y="80" width="165" height="120" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="532" y="110" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#b45309">SHA-256 校验</text>
    <text x="532" y="136" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">比对发布校验和</text>
    <text x="532" y="156" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">失败即中止安装</text>
  </g>
  <line x1="615" y1="140" x2="645" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="655" y="80" width="265" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="787" y="110" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e293b">npm 全局安装 + 内核准备</text>
    <text x="787" y="136" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">安装 prime-agent 命令</text>
    <text x="787" y="156" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">postinstall 自举 IPython venv</text>
    <text x="787" y="176" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">prime-agent-runtime wheel 安装</text>
  </g>

  <!-- Row 2: run -->
  <g filter="url(#shadow)">
    <rect x="40" y="230" width="240" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="160" y="262" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1d4ed8">启动与登录</text>
    <text x="160" y="286" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">prime-agent → /login 选 provider</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="230" width="250" height="80" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="435" y="262" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#6d28d9">后台会话管理</text>
    <text x="435" y="286" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">agents / attach / status / doctor</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="590" y="230" width="330" height="80" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="755" y="262" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#047857">两种分发形态</text>
    <text x="755" y="286" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11.5" fill="#475569">npm 包（tsx/预构建）· bun compile 单文件二进制</text>
  </g>
</svg>
