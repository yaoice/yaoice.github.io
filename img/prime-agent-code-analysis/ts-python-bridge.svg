<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="TS 宿主与 Python 内核协作"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/></filter></defs><g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif"><rect width="960" height="560" rx="10" fill="#f8fafc"/><text x="480" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">双语言架构：TS 负责策略与执行，Python 负责模型可执行的薄封装</text><text x="480" y="64" text-anchor="middle" font-size="13" fill="#64748b">重逻辑（凭据、子代理、授权、持久化）都在 TS 宿主侧，Python 侧保持"可被模型直接 import 调用"</text><g filter="url(#shadow)"><rect x="40" y="96" width="330" height="420" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="205" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">TypeScript 宿主</text><text x="205" y="148" text-anchor="middle" font-size="11.5" fill="#64748b">AgentSession · ~11k 行主循环</text><rect x="60" y="168" width="290" height="40" rx="6" fill="#eff6ff"/><text x="205" y="186" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">host request 分派与授权</text><text x="205" y="202" text-anchor="middle" font-size="10.5" fill="#64748b">按 type 路由到 handler</text><rect x="60" y="220" width="290" height="40" rx="6" fill="#eff6ff"/><text x="205" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">凭据管理</text><text x="205" y="254" text-anchor="middle" font-size="10.5" fill="#64748b">env-api-keys.ts · auth.json</text><rect x="60" y="272" width="290" height="40" rx="6" fill="#eff6ff"/><text x="205" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">子代理执行</text><text x="205" y="306" text-anchor="middle" font-size="10.5" fill="#64748b">rlm-runtime.ts · runRlmChild()</text><rect x="60" y="324" width="290" height="40" rx="6" fill="#eff6ff"/><text x="205" y="342" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">持久化 · 压缩 · 目标</text><text x="205" y="358" text-anchor="middle" font-size="10.5" fill="#64748b">session-manager · compaction · goals</text><rect x="60" y="376" width="290" height="40" rx="6" fill="#eff6ff"/><text x="205" y="394" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">harness / refine 状态</text><text x="205" y="410" text-anchor="middle" font-size="10.5" fill="#64748b">refinement.ts · applyRefinementProposal</text><text x="205" y="454" text-anchor="middle" font-size="11.5" fill="#475569">执行模型生成的 Python 代码</text><text x="205" y="474" text-anchor="middle" font-size="11.5" fill="#f59e0b" font-weight="700">注意：Worker/Kernel 隔离非安全沙箱</text></g><g filter="url(#shadow)"><rect x="400" y="150" width="160" height="300" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="480" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Jupyter 桥</text><text x="480" y="206" text-anchor="middle" font-size="11" fill="#475569">ZeroMQ 通道</text><text x="480" y="226" text-anchor="middle" font-size="11" fill="#475569">comm target:</text><text x="480" y="244" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">"host.request"</text><line x1="440" y1="260" x2="520" y2="260" stroke="#cbd5e1" stroke-width="1"/><text x="480" y="286" text-anchor="middle" font-size="11.5" fill="#0f766e" font-weight="700">▲ typed host request</text><text x="480" y="306" text-anchor="middle" font-size="10.5" fill="#64748b">Python → TS，await 回复</text><text x="480" y="336" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">▼ ipython 工具调用</text><text x="480" y="356" text-anchor="middle" font-size="10.5" fill="#64748b">模型代码 → 内核执行</text><text x="480" y="396" text-anchor="middle" font-size="10.5" fill="#64748b">防劫持：request_type 放在</text><text x="480" y="414" text-anchor="middle" font-size="10.5" fill="#64748b">payload 最后，不可被覆盖</text></g><g filter="url(#shadow)"><rect x="590" y="96" width="330" height="420" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/><text x="755" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">Python Kernel · prime-agent-runtime</text><text x="755" y="148" text-anchor="middle" font-size="11.5" fill="#64748b">ipykernel · nest-asyncio · tyro</text><rect x="610" y="168" width="290" height="40" rx="6" fill="#f0fdf4"/><text x="755" y="186" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">rlm 模块（可 await 调用）</text><text x="755" y="202" text-anchor="middle" font-size="10.5" fill="#64748b">host_request() · run() · find_models()</text><rect x="610" y="220" width="290" height="40" rx="6" fill="#f0fdf4"/><text x="755" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">harness.py · HarnessState</text><text x="755" y="254" text-anchor="middle" font-size="10.5" fill="#64748b">prompt / memory / skill / subagent CRUD</text><rect x="610" y="272" width="290" height="40" rx="6" fill="#f0fdf4"/><text x="755" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">mcp_base.py · McpIntegration</text><text x="755" y="306" text-anchor="middle" font-size="10.5" fill="#64748b">动态绑定 MCP 服务器工具</text><rect x="610" y="324" width="290" height="40" rx="6" fill="#f0fdf4"/><text x="755" y="342" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">skill.py · tyro CLI</text><text x="755" y="358" text-anchor="middle" font-size="10.5" fill="#64748b">类型签名自动生成参数解析</text><text x="755" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">模型视角</text><text x="755" y="442" text-anchor="middle" font-size="11" fill="#475569">import rlm; await rlm("子任务")</text><text x="755" y="462" text-anchor="middle" font-size="11" fill="#475569">像调用函数一样派发子代理</text></g></g></svg>
