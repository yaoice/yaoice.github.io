<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="560" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">分层架构：从入口到底层存储</text>
  <text x="480" y="64" text-anchor="middle" font-size="12.5" fill="#94a3b8">数据流自上而下，每一层的抽象都可替换</text>

  <path d="M 80 96 L 80 540" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 80 536 L 80 538" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="110" y="96" width="790" height="64" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="134" y="122" font-size="14" fill="#1e293b" font-weight="600">入口</text>
  <text x="200" y="122" font-size="12" fill="#94a3b8">CLI + MCP</text>
  <text x="134" y="146" font-size="12.5" fill="#475569">zg 命令 · MCP Server（protocol 2.0）· 一次调用返回最相关片段</text>
  <text x="884" y="122" text-anchor="end" font-size="11" fill="#94a3b8">cli / mcp</text>

  <rect x="110" y="172" width="790" height="64" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="134" y="198" font-size="14" fill="#1e293b" font-weight="600">Service 服务编排</text>
  <text x="300" y="198" font-size="12" fill="#94a3b8">查询规划与上下文选择</text>
  <text x="134" y="222" font-size="12.5" fill="#475569">searchPlan 路由展开 · 跨组覆盖率优先排序 · 远程 embedding 授权包装</text>
  <text x="884" y="198" text-anchor="end" font-size="11" fill="#94a3b8">engine/service</text>

  <rect x="110" y="248" width="790" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="134" y="274" font-size="14" fill="#1e293b" font-weight="600">Pipeline 管线</text>
  <text x="276" y="274" font-size="12" fill="#94a3b8">检索 + 索引</text>
  <text x="134" y="298" font-size="12.5" fill="#475569">search：自适应召回 + RRF 融合 · indexing：增量 diff + 分批 embed + commit</text>
  <text x="884" y="274" text-anchor="end" font-size="11" fill="#94a3b8">engine/pipeline</text>

  <rect x="110" y="324" width="790" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="134" y="350" font-size="14" fill="#1e293b" font-weight="600">Extraction 抽取</text>
  <text x="306" y="350" font-size="12" fill="#94a3b8">结构感知切分</text>
  <text x="134" y="374" font-size="12.5" fill="#475569">CodeExtractor（tree-sitter 结构感知）· Markdown · Text · Image</text>
  <text x="884" y="350" text-anchor="end" font-size="11" fill="#94a3b8">engine/extraction</text>

  <rect x="110" y="400" width="790" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="134" y="426" font-size="14" fill="#1e293b" font-weight="600">Storage 存储</text>
  <text x="278" y="426" font-size="12" fill="#94a3b8">本地 SQLite</text>
  <text x="134" y="450" font-size="12.5" fill="#475569">FTS5 全文 · 向量表 · 文件 / 实体 / 片段元数据 · 增量读写</text>
  <text x="884" y="426" text-anchor="end" font-size="11" fill="#94a3b8">engine/storage</text>

  <rect x="110" y="476" width="790" height="64" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="134" y="502" font-size="14" fill="#1e293b" font-weight="600">Models 模型</text>
  <text x="274" y="502" font-size="12" fill="#94a3b8">可插拔 EmbeddingModel</text>
  <text x="134" y="526" font-size="12.5" fill="#475569">本地 transformers · 远程 qwen · 索引 / 查询可分别指定模型</text>
  <text x="884" y="502" text-anchor="end" font-size="11" fill="#94a3b8">engine/models</text>

  <text x="480" y="556" text-anchor="middle" font-size="11.5" fill="#94a3b8">Daemon（watch / runtime / job-scheduler）与 Authorization（远程 embedding 守卫）作为横切面贯穿 service 与 models</text>
</svg>
