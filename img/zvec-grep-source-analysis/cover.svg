<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="430" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">zvec-grep：把三种检索统一成一个 local-first 接口</text>
  <text x="480" y="64" text-anchor="middle" font-size="12.5" fill="#94a3b8">词法 · 全文 · 向量各自召回，RRF 融合，一条命令服务 coding agent</text>

  <rect x="30" y="96" width="286" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="124" font-size="14" fill="#1e293b" font-weight="600">词法检索</text>
  <text x="50" y="147" font-size="12" fill="#94a3b8">ripgrep 引擎（托管二进制）</text>
  <text x="50" y="170" font-size="12.5" fill="#475569">精确符号 · 正则 · 路径过滤</text>

  <rect x="337" y="96" width="286" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="357" y="124" font-size="14" fill="#1e293b" font-weight="600">全文检索</text>
  <text x="357" y="147" font-size="12" fill="#94a3b8">SQLite FTS5 / BM25</text>
  <text x="357" y="170" font-size="12.5" fill="#475569">关键词打分 · 排序召回</text>

  <rect x="644" y="96" width="286" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="664" y="124" font-size="14" fill="#1e293b" font-weight="600">语义检索</text>
  <text x="664" y="147" font-size="12" fill="#94a3b8">向量相似度（ANN）</text>
  <text x="664" y="170" font-size="12.5" fill="#475569">意思相近 · 跨语言</text>

  <path d="M 173 192 L 400 246" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 480 192 L 480 246" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 787 192 L 560 246" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="280" y="250" width="400" height="72" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="480" y="278" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">RRF 融合</text>
  <text x="480" y="300" text-anchor="middle" font-size="12" fill="#475569">score = Σ 1 / (60 + rank)</text>

  <path d="M 480 322 L 480 356" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="280" y="360" width="400" height="56" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="383" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">统一接口：zg CLI · MCP Server</text>
  <text x="480" y="403" text-anchor="middle" font-size="11.5" fill="#94a3b8">一次调用拿到最相关片段，带证据与 trace</text>
</svg>
