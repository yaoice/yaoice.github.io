<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="560" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">检索管线：多路召回，RRF 融合</text>
  <text x="480" y="64" text-anchor="middle" font-size="12.5" fill="#94a3b8">左：主流程六步；右：两个关键算法</text>

  <!-- left flow -->
  <rect x="30" y="96" width="500" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="117" font-size="13" fill="#1e293b" font-weight="600">① 校验 &amp; 归一化</text>
  <text x="50" y="136" font-size="12" fill="#475569">routes / limit / include·exclude / globs / fileTypes</text>

  <path d="M 280 146 L 280 160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="30" y="164" width="500" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="185" font-size="13" fill="#1e293b" font-weight="600">② 路由展开</text>
  <text x="50" y="204" font-size="12" fill="#475569">fts · vector · prefer-symbol（追加符号 FTS 路由）</text>

  <path d="M 280 214 L 280 228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="30" y="232" width="500" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="253" font-size="13" fill="#1e293b" font-weight="600">③ 查询向量化</text>
  <text x="50" y="272" font-size="12" fill="#475569">仅 vector 路由，按 maxBatchSize 分批 embed</text>

  <path d="M 280 282 L 280 296" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="30" y="300" width="500" height="50" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="321" font-size="13" fill="#1e293b" font-weight="600">④ 自适应召回</text>
  <text x="50" y="340" font-size="12" fill="#475569">depth 200 → 400 → 800 → 1600（上限 2000）</text>

  <path d="M 280 350 L 280 364" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="30" y="368" width="500" height="50" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="389" font-size="13" fill="#1e293b" font-weight="600">⑤ RRF 融合</text>
  <text x="50" y="408" font-size="12" fill="#475569">score += 1 / (60 + rank)</text>

  <path d="M 280 418 L 280 432" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="30" y="436" width="500" height="50" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="50" y="457" font-size="13" fill="#1e293b" font-weight="600">⑥ 截断 &amp; 物化</text>
  <text x="50" y="476" font-size="12" fill="#475569">top-k 命中，带 evidence + trace</text>

  <!-- right cards -->
  <rect x="560" y="96" width="370" height="190" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="580" y="122" font-size="13.5" fill="#1e293b" font-weight="600">自适应召回：越找不到越深挖</text>
  <text x="580" y="146" font-size="12" fill="#475569">目标候选数 = max(limit × 5, 50)</text>
  <text x="580" y="170" font-size="12" fill="#475569">每轮取 depth 条，判断是否“饱和”：</text>
  <text x="580" y="192" font-size="12" fill="#475569">· 命中数 ≥ depth → 结果可能被截断</text>
  <text x="580" y="214" font-size="12" fill="#475569">· depth 翻倍重试，直到够用或到上限</text>
  <text x="580" y="242" font-size="12" fill="#94a3b8">代价可控：只深挖真正需要的情况</text>
  <text x="580" y="264" font-size="12" fill="#3b82f6">depth：200 → 400 → 800 → 1600（封顶 2000）</text>

  <rect x="560" y="302" width="370" height="184" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="580" y="328" font-size="13.5" fill="#1e293b" font-weight="600">RRF：排名倒数求和</text>
  <text x="580" y="352" font-size="12" fill="#475569">同一实体可在多条 route / 多轮里被命中，</text>
  <text x="580" y="374" font-size="12" fill="#475569">把每条的 rank 换成贡献分求和：</text>
  <text x="580" y="402" font-size="13" fill="#1e293b" font-weight="600">score = Σ 1 / (K + rank)，K = 60</text>
  <text x="580" y="428" font-size="12" fill="#475569">· 免调参，天然融合 fts 与 vector</text>
  <text x="580" y="450" font-size="12" fill="#475569">· matchedBy 标注：fts / vector / fts+vector</text>
  <text x="580" y="472" font-size="12" fill="#94a3b8">诊断：trackEntityId 可追踪“为何没进 top-k”</text>
</svg>
