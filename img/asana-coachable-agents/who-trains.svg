<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">谁可以教练这个 agent</title>
  <desc id="d">所有人都能给出任务级反馈，只有 admins 与 editors 能把反馈写入 agent 的永久记忆。</desc>
  <rect width="800" height="360" fill="#f8fafc" rx="10"/>
  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">谁可以教练这个 agent？</text>
  <text x="400" y="58" text-anchor="middle" font-size="11" fill="#64748b">"用"和"训练"被刻意拆开：反馈人人可给，改写行为的权力只给少数人</text>

  <rect x="40" y="80" width="200" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="80" width="200" height="28" rx="10" fill="#475569"/>
  <text x="140" y="99" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">所有人</text>
  <text x="58" y="132" font-size="10" fill="#1e293b">可以就任务给反馈</text>
  <text x="58" y="156" font-size="10" fill="#64748b">反馈只对当前任务生效</text>
  <text x="58" y="180" font-size="10" fill="#64748b">下一次运行不会记住</text>
  <text x="58" y="204" font-size="10" fill="#64748b">改不动 agent 的行为</text>

  <rect x="300" y="80" width="200" height="150" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <rect x="300" y="80" width="200" height="28" rx="10" fill="#3b82f6"/>
  <text x="400" y="99" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">共享记忆</text>
  <text x="318" y="132" font-size="10" fill="#1e293b">保留此前指令中的信息</text>
  <text x="318" y="156" font-size="10" fill="#64748b">多个用户复用同一条记忆</text>
  <text x="318" y="180" font-size="10" fill="#64748b">因此更快完成任务</text>
  <text x="318" y="204" font-size="10" fill="#64748b">可被撤销、可被删除</text>

  <rect x="560" y="80" width="200" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="560" y="80" width="200" height="28" rx="10" fill="#8b5cf6"/>
  <text x="660" y="99" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">admins / editors</text>
  <text x="578" y="132" font-size="10" fill="#1e293b">把反馈写入永久记忆</text>
  <text x="578" y="156" font-size="10" fill="#64748b">有权撤销或删除记忆</text>
  <text x="578" y="180" font-size="10" fill="#64748b">治理 agent 的访问与行为</text>
  <text x="578" y="204" font-size="10" fill="#64748b">是它真正的"教练"</text>

  <line x1="240" y1="155" x2="290" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="288,150 297,155 288,160" fill="#94a3b8"/>
  <text x="269" y="146" text-anchor="middle" font-size="9" fill="#64748b">任务级</text>

  <line x1="560" y1="155" x2="510" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="512,150 503,155 512,160" fill="#94a3b8"/>
  <text x="531" y="146" text-anchor="middle" font-size="9" fill="#64748b">写记忆</text>

  <rect x="40" y="248" width="720" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="272" font-size="10.5" fill="#475569">例：Communications 团队掌握公司语气 → 是写作 agent 的 editors；CPO 可以用它起草，但不能修改它的行为。</text>
  <text x="64" y="292" font-size="10.5" fill="#475569">团队不必人人都懂 skills / behavior / memory —— 一两个人变成专家、配置正确，其余人共享收益。</text>

  <text x="400" y="334" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">把教练权交给"拥有这套标准的人"，agent 才不会在众声喧哗里被改坏</text>
</svg>
