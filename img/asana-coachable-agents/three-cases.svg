<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Asana 交给 agent 的三类工作</title>
  <desc id="d">Slack 频道产品答疑、高管风险续约简报、用 Command 规划工程迭代，三类工作的原状与 agent 做法对照。</desc>
  <rect width="800" height="470" fill="#f8fafc" rx="10"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Asana 交给 agent 的三类工作</text>

  <rect x="40" y="66" width="720" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="70" cy="98" r="14" fill="#3b82f6"/>
  <text x="70" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="96" y="96" font-size="13" font-weight="700" fill="#1e293b">Slack 频道里的产品问答</text>
  <text x="96" y="113" font-size="9.5" fill="#94a3b8">Answering product questions from a Slack channel</text>
  <line x1="352" y1="80" x2="352" y2="170" stroke="#e2e8f0"/>
  <text x="96" y="138" font-size="10.5" fill="#64748b">同一问题被反复发帖，</text>
  <text x="96" y="156" font-size="10.5" fill="#64748b">每次都要 @ 领域专家</text>
  <text x="96" y="174" font-size="10.5" fill="#64748b">可搜索知识库答不准</text>
  <text x="372" y="138" font-size="10.5" fill="#475569">问题仍发在 Slack：频道里的 Asana app 把它转成 task，agent 接手</text>
  <text x="372" y="156" font-size="10.5" fill="#475569">有已批准指引 → 直接答并附来源；指向产品空白 → 进 intake backlog</text>
  <text x="372" y="174" font-size="10.5" fill="#475569">同一问题反复出现 → 建 task 给 enablement 更新培训材料</text>

  <rect x="40" y="198" width="720" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="70" cy="230" r="14" fill="#3b82f6"/>
  <text x="70" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="96" y="228" font-size="13" font-weight="700" fill="#1e293b">有流失风险的续约简报</text>
  <text x="96" y="245" font-size="9.5" fill="#94a3b8">Briefing executives on at-risk renewals</text>
  <line x1="352" y1="212" x2="352" y2="302" stroke="#e2e8f0"/>
  <text x="96" y="270" font-size="10.5" fill="#64748b">CCO 每周手动做一次，</text>
  <text x="96" y="288" font-size="10.5" fill="#64748b">全球数千账户持续更新，</text>
  <text x="96" y="306" font-size="10.5" fill="#64748b">数据没更新就发现不了问题</text>
  <text x="372" y="270" font-size="10.5" fill="#475569">At-Risk Renewal agent 读遍每个 at-risk task 的更新、备注与评论</text>
  <text x="372" y="288" font-size="10.5" fill="#475569">产出每日 digest，分三桶：正向势头 / 负向势头 / 建议跟进</text>
  <text x="372" y="306" font-size="10.5" fill="#475569">先全球后区域，每天早上自动推送给 CCO、CRO 与区域负责人</text>

  <rect x="40" y="330" width="720" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="70" cy="362" r="14" fill="#3b82f6"/>
  <text x="70" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="96" y="360" font-size="13" font-weight="700" fill="#1e293b">用 Command 规划工程迭代</text>
  <text x="96" y="377" font-size="9.5" fill="#94a3b8">Planning engineering cycles with Command</text>
  <line x1="352" y1="344" x2="352" y2="434" stroke="#e2e8f0"/>
  <text x="96" y="402" font-size="10.5" fill="#64748b">自动编码循环把变更灌进 cycle，</text>
  <text x="96" y="420" font-size="10.5" fill="#64748b">cycle time 与发布开始滑坡</text>
  <text x="96" y="438" font-size="10.5" fill="#64748b">瓶颈从写代码转移到规划</text>
  <text x="372" y="402" font-size="10.5" fill="#475569">agent 从客户反馈与 Slack 频道拉 ticket，填满 unplanned board</text>
  <text x="372" y="420" font-size="10.5" fill="#475569">人决定哪些进 cycle；Command 给出乐观 / 平衡 / 保守三档预估</text>
  <text x="372" y="438" font-size="10.5" fill="#475569">ticket 可派给人或 coding agent；数据经 MCP 暴露给 Claude</text>
</svg>
