<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">让团队知识复利，而不是蒸发</title>
  <desc id="d">一对一的 AI 让知识停在个人窗口，共享的 AI teammate 让每一次纠正沉淀为团队资产。</desc>
  <rect width="800" height="380" fill="#f8fafc" rx="10"/>
  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">让团队知识复利，而不是蒸发</text>

  <rect x="40" y="64" width="290" height="210" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="40" y="64" width="290" height="32" rx="10" fill="#64748b"/>
  <text x="185" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">一对一的 AI</text>
  <text x="62" y="122" font-size="10.5" fill="#64748b">提示词留在个人窗口里</text>
  <text x="62" y="148" font-size="10.5" fill="#64748b">审阅者看不到来回过程</text>
  <text x="62" y="174" font-size="10.5" fill="#64748b">不认同你的指引也无法对齐</text>
  <text x="62" y="200" font-size="10.5" fill="#64748b">换个人来，上下文从头再来</text>
  <text x="62" y="226" font-size="10.5" fill="#64748b">团队知识不断蒸发</text>

  <line x1="344" y1="169" x2="452" y2="169" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="448,163 460,169 448,175" fill="#94a3b8"/>
  <text x="402" y="158" text-anchor="middle" font-size="9.5" fill="#64748b">搬进共享任务</text>

  <rect x="470" y="64" width="290" height="210" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <rect x="470" y="64" width="290" height="32" rx="10" fill="#3b82f6"/>
  <text x="615" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">共享的 AI teammate</text>
  <text x="492" y="122" font-size="10.5" fill="#475569">请求、步骤、产出都在同一个 task 上</text>
  <text x="492" y="148" font-size="10.5" fill="#475569">谁在做、做了什么，一目了然</text>
  <text x="492" y="174" font-size="10.5" fill="#475569">审阅者可以直接改写指令</text>
  <text x="492" y="200" font-size="10.5" fill="#475569">记忆被教练、被审计、被复用</text>
  <text x="492" y="226" font-size="10.5" fill="#475569">团队知识不断复利</text>

  <rect x="40" y="296" width="720" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="320" font-size="10.5" fill="#64748b">一对一用 AI，你也能拿到高质量产出 —— 但那只是个人的收益，组织什么都没有学到。</text>
  <text x="64" y="340" font-size="10.5" font-weight="700" fill="#1e293b">把 agent 放进共享任务，每一次纠正都变成团队的资产。</text>
</svg>
