<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">四条策略：从结构化工作到可见协作</title>
  <desc id="d">先结构化工作、给角色与权限、使用与训练分离、工作留在明处，四条策略依次解决前提、边界、治理与信任。</desc>
  <rect width="800" height="400" fill="#f8fafc" rx="10"/>
  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">四条策略：从结构化工作到可见协作</text>
  <text x="400" y="60" text-anchor="middle" font-size="11" fill="#64748b">前两条解决"能不能干"，后两条解决"干得好不好、敢不敢放手"</text>

  <rect x="40" y="80" width="352" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="80" width="352" height="4" rx="2" fill="#3b82f6"/>
  <circle cx="70" cy="108" r="13" fill="#3b82f6"/>
  <text x="70" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="92" y="113" font-size="12.5" font-weight="700" fill="#1e293b">先结构化工作，再让 agent 行动</text>
  <text x="58" y="140" font-size="10" fill="#64748b">人把想法、Slack 对话、会议录音、报表</text>
  <text x="58" y="158" font-size="10" fill="#64748b">先和 Claude 谈透，再"泵入" projects 与 tasks</text>
  <text x="58" y="176" font-size="10" fill="#64748b">结构就位，agent 才有地方落脚</text>

  <rect x="408" y="80" width="352" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="408" y="80" width="352" height="4" rx="2" fill="#3b82f6"/>
  <circle cx="438" cy="108" r="13" fill="#3b82f6"/>
  <text x="438" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="460" y="113" font-size="12.5" font-weight="700" fill="#1e293b">给角色，也给权限</text>
  <text x="426" y="140" font-size="10" fill="#64748b">每个 agent 有 profile：用途、可用者、管理员、</text>
  <text x="426" y="158" font-size="10" fill="#64748b">指令、skills、integrations、权限</text>
  <text x="426" y="176" font-size="10" fill="#64748b">权限可精确到项目集 / 文档集 / 应用组合</text>

  <rect x="40" y="214" width="352" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="214" width="352" height="4" rx="2" fill="#8b5cf6"/>
  <circle cx="70" cy="242" r="13" fill="#8b5cf6"/>
  <text x="70" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="92" y="247" font-size="12.5" font-weight="700" fill="#1e293b">使用与训练分离</text>
  <text x="58" y="274" font-size="10" fill="#64748b">任何人都能就任务给反馈，但反馈只对当前任务生效</text>
  <text x="58" y="292" font-size="10" fill="#64748b">只有 admin / editor 能把反馈写进永久记忆</text>
  <text x="58" y="310" font-size="10" fill="#64748b">他们同时握有撤销与删除记忆的权力</text>

  <rect x="408" y="214" width="352" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="408" y="214" width="352" height="4" rx="2" fill="#8b5cf6"/>
  <circle cx="438" cy="242" r="13" fill="#8b5cf6"/>
  <text x="438" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="460" y="247" font-size="12.5" font-weight="700" fill="#1e293b">让工作留在明处</text>
  <text x="426" y="274" font-size="10" fill="#64748b">agent 公布 research plan 与每一步骤</text>
  <text x="426" y="292" font-size="10" fill="#64748b">请求、反驳、产出同处一地</text>
  <text x="426" y="310" font-size="10" fill="#64748b">审阅输出的人，也能改产生它的指令</text>

  <text x="400" y="366" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">① ② 是前提，③ ④ 决定这套协作能不能规模化并长期可信</text>
</svg>
