<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">可教练的 agent：Asana 的人机团队</title>
  <desc id="d">人类团队与 AI teammates 共用同一张 Work Graph，agent 拥有角色、任务与可见的工作记录。</desc>
  <rect width="800" height="340" fill="#f8fafc" rx="10"/>
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">可教练的 agent：Asana 的人机团队</text>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#64748b">不是给每个人配一个 AI 助理，而是让 agent 成为团队里一个有角色的成员</text>

  <rect x="60" y="86" width="300" height="112" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="60" y="86" width="300" height="30" rx="10" fill="#475569"/>
  <text x="210" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">人类团队</text>
  <text x="82" y="140" font-size="11" fill="#1e293b">· 把零散想法谈成结构</text>
  <text x="82" y="162" font-size="11" fill="#1e293b">· 设定方向、审阅产出</text>
  <text x="82" y="184" font-size="11" fill="#1e293b">· 决定谁可以教练 agent</text>

  <rect x="440" y="86" width="300" height="112" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <rect x="440" y="86" width="300" height="30" rx="10" fill="#3b82f6"/>
  <text x="590" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">AI teammates</text>
  <text x="462" y="140" font-size="11" fill="#1e293b">· 有角色、有 skills、有集成</text>
  <text x="462" y="162" font-size="11" fill="#1e293b">· 有独立身份与访问边界</text>
  <text x="462" y="184" font-size="11" fill="#1e293b">· 记忆可被教练、可被审计</text>

  <line x1="210" y1="198" x2="210" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="205,236 215,236 210,246" fill="#94a3b8"/>
  <line x1="590" y1="198" x2="590" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="585,236 595,236 590,246" fill="#94a3b8"/>

  <rect x="60" y="246" width="680" height="52" rx="10" fill="#1e293b"/>
  <text x="400" y="269" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Work Graph® — 同一张工作图：task / project / goal / conversation</text>
  <text x="400" y="288" text-anchor="middle" font-size="10" fill="#cbd5e1">每个对象都带 owner、contributor 和 dependency</text>

  <text x="400" y="324" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">agent 不另立一套上下文，它和人类出现在同一份名册、同一份工作产物里</text>
</svg>
