<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">不为 AI 另立一套上下文：让 agent 进入同一张工作图</title>
  <desc id="d">agent 在 Work Graph 中拥有角色、任务、消息读写与活动流记录，同时受显式访问控制与触发者权限上限约束。</desc>
  <rect width="800" height="366" fill="#f8fafc" rx="10"/>
  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">不为 AI 另立一套上下文：让 agent 进入同一张工作图</text>

  <rect x="40" y="62" width="720" height="46" rx="10" fill="#1e293b"/>
  <text x="400" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Work Graph®：task / project / goal / conversation 的关系网</text>
  <text x="400" y="99" text-anchor="middle" font-size="10" fill="#cbd5e1">每个对象都带 owner、contributor 和 dependency</text>

  <line x1="124" y1="108" x2="124" y2="132" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="308" y1="108" x2="308" y2="132" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="492" y1="108" x2="492" y2="132" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="676" y1="108" x2="676" y2="132" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="40" y="140" width="168" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="140" width="168" height="4" rx="2" fill="#3b82f6"/>
  <text x="58" y="172" font-size="11.5" font-weight="700" fill="#1e293b">有定义好的角色</text>
  <text x="58" y="196" font-size="10" fill="#64748b">写清 purpose 与指令</text>
  <text x="58" y="216" font-size="10" fill="#64748b">配有评估标准</text>

  <rect x="224" y="140" width="168" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="224" y="140" width="168" height="4" rx="2" fill="#3b82f6"/>
  <text x="242" y="172" font-size="11.5" font-weight="700" fill="#1e293b">被分配任务</text>
  <text x="242" y="196" font-size="10" fill="#64748b">和人类同事一样</text>
  <text x="242" y="216" font-size="10" fill="#64748b">在 project 里领活</text>

  <rect x="408" y="140" width="168" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="408" y="140" width="168" height="4" rx="2" fill="#3b82f6"/>
  <text x="426" y="172" font-size="11.5" font-weight="700" fill="#1e293b">读写消息</text>
  <text x="426" y="196" font-size="10" fill="#64748b">读上下文、写产出</text>
  <text x="426" y="216" font-size="10" fill="#64748b">在同一线程里协作</text>

  <rect x="592" y="140" width="168" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="592" y="140" width="168" height="4" rx="2" fill="#3b82f6"/>
  <text x="610" y="172" font-size="11.5" font-weight="700" fill="#1e293b">出现在活动流</text>
  <text x="610" y="196" font-size="10" fill="#64748b">谁在做事一目了然</text>
  <text x="610" y="216" font-size="10" fill="#64748b">贡献与访问可审计</text>

  <rect x="40" y="256" width="720" height="86" rx="10" fill="#ffffff" stroke="#fde68a"/>
  <text x="64" y="280" font-size="11.5" font-weight="700" fill="#92400e">额外的安全措施：agent 不是"像人一样"被授权就够了</text>
  <text x="64" y="305" font-size="10.5" fill="#475569">① 显式访问控制：可授权特定项目集、特定文档集，或文档与应用的组合</text>
  <text x="64" y="327" font-size="10.5" fill="#475569">② 有效权限上限：agent 能触碰什么，由触发它的那个人的权限来界定</text>
</svg>
