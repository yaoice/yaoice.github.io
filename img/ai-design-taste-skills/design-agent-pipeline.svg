<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">三层能力串成的 Design Agent 流水线</title>
  <desc id="d">参考层收敛方向、身份层定义边界、判断层约束决策、执行层产出实现，渲染后由评审层检测与修正，最后交付并保留回到生成的回边。</desc>
  <rect width="800" height="420" fill="#f8fafc" rx="10"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">三层能力串成的 Design Agent 流水线</text>
  <text x="400" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">每一层交出什么给下一层，最后一环是回到生成的回边</text>
  <text x="506" y="72" font-size="11" fill="#94a3b8">这一层的产出</text>

  <rect x="60" y="78" width="430" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="76" y="101" font-size="12.5" fill="#1e293b">参考层 · Minimal Gallery　收敛方向</text>
  <text x="506" y="101" font-size="11.5" fill="#64748b">一族参考 + 可复述原则</text>
  <path d="M275 114 V119" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="271,119 279,119 275,125" fill="#94a3b8"/>

  <rect x="60" y="124" width="430" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="76" y="147" font-size="12.5" fill="#1e293b">身份层 · Branding / PRODUCT.md　定义边界</text>
  <text x="506" y="147" font-size="11.5" fill="#64748b">受众 / 场景 / 禁区</text>
  <path d="M275 160 V165" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="271,165 279,165 275,171" fill="#94a3b8"/>

  <rect x="60" y="170" width="430" height="36" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="76" y="193" font-size="12.5" fill="#1e293b">判断层 · taste-skill　约束决策</text>
  <text x="506" y="193" font-size="11.5" fill="#64748b">字号 · 间距 · 动效规则</text>
  <path d="M275 206 V211" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="271,211 279,211 275,217" fill="#94a3b8"/>

  <rect x="60" y="216" width="430" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="76" y="239" font-size="12.5" fill="#1e293b">执行层 · Agent Coding　产出实现</text>
  <text x="506" y="239" font-size="11.5" fill="#64748b">HTML / 组件</text>
  <path d="M275 252 V257" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="271,257 279,257 275,263" fill="#94a3b8"/>

  <rect x="60" y="262" width="430" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="76" y="285" font-size="12.5" fill="#1e293b">观察 · Render　拿到真实视觉输出</text>
  <text x="506" y="285" font-size="11.5" fill="#64748b">截图 / 实时预览</text>
  <path d="M275 298 V303" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="271,303 279,303 275,309" fill="#94a3b8"/>

  <rect x="60" y="308" width="430" height="36" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="76" y="331" font-size="12.5" fill="#1e293b">评审层 · Impeccable　检测 / 批评 / 修正</text>
  <text x="506" y="331" font-size="11.5" fill="#64748b">问题清单 + 修正动作</text>
  <path d="M275 344 V349" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="271,349 279,349 275,355" fill="#94a3b8"/>

  <rect x="60" y="354" width="430" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="76" y="377" font-size="12.5" fill="#1e293b">交付 · Production UI</text>
  <text x="506" y="377" font-size="11.5" fill="#64748b">可验证的成品</text>

  <path d="M60 326 H34 V234 H54" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="54,230 54,238 61,234" fill="#10b981"/>
  <text transform="translate(24 280) rotate(-90)" text-anchor="middle" font-size="11" fill="#10b981">修正后重新生成</text>
</svg>
