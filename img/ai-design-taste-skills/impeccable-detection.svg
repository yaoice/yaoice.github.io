<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Impeccable 的两条检测通道</title>
  <desc id="d">确定性规则负责可枚举的检查，离线毫秒级返回；LLM 只处理无法规则化的主观判断。两条通道汇成修正动作，再回到下一轮生成。</desc>
  <rect width="800" height="300" fill="#f8fafc" rx="10"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Impeccable 的两条检测通道</text>
  <text x="400" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">能用规则判定的，不交给模型</text>

  <rect x="28" y="118" width="118" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="87" y="142" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">生成产物</text>
  <text x="87" y="160" text-anchor="middle" font-size="11" fill="#64748b">HTML / 组件</text>

  <rect x="176" y="74" width="330" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="192" y="98" font-size="12.5" font-weight="600" fill="#1e293b">确定性规则 · 61 条</text>
  <text x="192" y="116" font-size="11.5" fill="#475569">检查渐变、字号层级、间距网格、对比度</text>

  <rect x="176" y="172" width="330" height="54" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="192" y="196" font-size="12.5" font-weight="600" fill="#1e293b">LLM 评审</text>
  <text x="192" y="214" font-size="11.5" fill="#475569">判断视觉层级、信息清晰度、情感共鸣</text>

  <path d="M146 146 C158 146 158 101 168 101" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="168,97 168,105 175,101" fill="#94a3b8"/>
  <path d="M146 154 C158 154 158 199 168 199" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="168,195 168,203 175,199" fill="#94a3b8"/>

  <path d="M506 101 C526 101 526 140 544 140" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="544,136 544,144 551,140" fill="#94a3b8"/>
  <path d="M506 199 C526 199 526 162 544 162" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="544,158 544,166 551,162" fill="#94a3b8"/>

  <rect x="546" y="118" width="126" height="64" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="609" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">修正动作</text>
  <text x="609" y="158" text-anchor="middle" font-size="11" fill="#475569">bolder / quieter</text>
  <text x="609" y="174" text-anchor="middle" font-size="11" fill="#475569">distill / polish</text>

  <path d="M609 186 V248 H87 V190" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="83,190 91,190 87,183" fill="#10b981"/>
  <text x="348" y="266" text-anchor="middle" font-size="11.5" fill="#10b981">修正结果落回下一轮生成——规则通道快而便宜，主观判断才走模型</text>
</svg>
