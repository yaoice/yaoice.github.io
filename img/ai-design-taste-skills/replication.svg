<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">三个模型的复现实验：装饰痕迹在 V1 之后归零</title>
  <desc id="d">3 个模型各 3 次采样：裸生成阶段三个模型的装饰痕迹中位数分别为 38、19、11，加入参考方向后全部归零；评审档的耗时相差 8 倍，gpt-5.6-sol 还需超过 25 轮工具调用。</desc>
  <rect width="800" height="330" fill="#f8fafc" rx="10"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">三个模型的复现实验：装饰痕迹在 V1 之后归零</text>
  <text x="400" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">3 个模型 × 3 次采样 × 4 档 = 36 次运行，每格取中位数</text>

  <text x="60" y="82" font-size="12" font-weight="600" fill="#475569">装饰痕迹 = 渐变 + 阴影 + card 提及</text>
  <path d="M130 250 H406" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M130 174 H406" stroke="#e8edf3" stroke-width="1"/>
  <path d="M130 98 H406" stroke="#e8edf3" stroke-width="1"/>

  <polyline points="130,98 220,250 310,250 400,250" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polyline points="130,174 220,250 310,250 400,250" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <polyline points="130,206 220,244 310,246 400,246" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="130" cy="98" r="3.5" fill="#3b82f6"/><circle cx="220" cy="250" r="3.5" fill="#3b82f6"/>
  <circle cx="310" cy="250" r="3.5" fill="#3b82f6"/><circle cx="400" cy="250" r="3.5" fill="#3b82f6"/>
  <circle cx="130" cy="174" r="3.5" fill="#8b5cf6"/><circle cx="220" cy="250" r="3.5" fill="#8b5cf6"/>
  <circle cx="310" cy="250" r="3.5" fill="#8b5cf6"/><circle cx="400" cy="250" r="3.5" fill="#8b5cf6"/>
  <circle cx="130" cy="206" r="3.5" fill="#10b981"/><circle cx="220" cy="244" r="3.5" fill="#10b981"/>
  <circle cx="310" cy="246" r="3.5" fill="#10b981"/><circle cx="400" cy="246" r="3.5" fill="#10b981"/>
  <text x="124" y="95" text-anchor="end" font-size="10.5" fill="#3b82f6">claude 38</text>
  <text x="124" y="171" text-anchor="end" font-size="10.5" fill="#8b5cf6">gemini 19</text>
  <text x="124" y="203" text-anchor="end" font-size="10.5" fill="#10b981">gpt 11</text>
  <text x="320" y="226" text-anchor="middle" font-size="11" fill="#475569">V1 之后三个模型全部归零</text>
  <text x="130" y="270" text-anchor="middle" font-size="11" fill="#64748b">V0</text>
  <text x="220" y="270" text-anchor="middle" font-size="11" fill="#64748b">V1</text>
  <text x="310" y="270" text-anchor="middle" font-size="11" fill="#64748b">V2</text>
  <text x="400" y="270" text-anchor="middle" font-size="11" fill="#64748b">V3</text>

  <path d="M446 84 V276" stroke="#e2e8f0" stroke-width="1"/>
  <text x="470" y="82" font-size="12" font-weight="600" fill="#475569">V3 一档的耗时（秒）</text>
  <text x="470" y="125" font-size="10.5" fill="#64748b">claude-opus-4.6</text>
  <rect x="562" y="113" width="42" height="16" rx="3" fill="#3b82f6"/>
  <text x="611" y="125" font-size="10.5" fill="#3b82f6">128 s</text>
  <text x="470" y="173" font-size="10.5" fill="#64748b">gemini-3.1-pro</text>
  <rect x="562" y="161" width="21" height="16" rx="3" fill="#8b5cf6"/>
  <text x="590" y="173" font-size="10.5" fill="#8b5cf6">63 s</text>
  <text x="470" y="221" font-size="10.5" fill="#64748b">gpt-5.6-sol</text>
  <rect x="562" y="209" width="170" height="16" rx="3" fill="#10b981"/>
  <text x="739" y="221" font-size="10.5" fill="#10b981">517 s</text>
  <text x="470" y="252" font-size="10.5" fill="#475569">gpt 还需超过 25 轮：25 轮上限下三次都没跑完</text>
  <text x="400" y="308" text-anchor="middle" font-size="11.5" fill="#64748b">同一份评审提示词、同一份产物，三个模型的执行成本相差 8 倍——可移植性不只是文件格式，还有预算</text>
</svg>
