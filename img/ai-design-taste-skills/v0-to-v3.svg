<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 344" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">V0 到 V3 的四档实测痕迹</title>
  <desc id="d">同一 harness、同一模型的单样本对照：V0 裸生成留下 17 处渐变与 41 处 card，V1 靠参考方向全部归零，V2 收敛强调色，V3 补上对比度、网格与断点。</desc>
  <rect width="800" height="344" fill="#f8fafc" rx="10"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">V0 到 V3 的四档实测痕迹</text>
  <text x="400" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">同一 harness、同一模型、每档只改上下文：每档各自留下了什么可测量的痕迹</text>

  <rect x="32" y="84" width="172" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="33" y="85" width="170" height="30" rx="7" fill="#f1f5f9"/>
  <text x="118" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">V0 · 裸 Agent</text>
  <text x="46" y="134" font-size="11" font-weight="600" fill="#94a3b8">输入</text>
  <text x="46" y="152" font-size="11.5" fill="#475569">一句 prompt</text>
  <text x="46" y="176" font-size="11" font-weight="600" fill="#94a3b8">实测痕迹</text>
  <text x="46" y="194" font-size="11.5" fill="#1e293b">17 处渐变 / 12 处阴影</text>
  <text x="46" y="212" font-size="11.5" fill="#475569">41 处 card / 8 种圆角</text>
  <text x="46" y="230" font-size="11.5" fill="#475569">强调色 #7c5cfc + 发光</text>

  <rect x="216" y="84" width="172" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="217" y="85" width="170" height="30" rx="7" fill="#eff6ff"/>
  <text x="302" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3b82f6">V1 · + Reference</text>
  <text x="230" y="134" font-size="11" font-weight="600" fill="#94a3b8">输入</text>
  <text x="230" y="152" font-size="11.5" fill="#475569">7 条参考共性</text>
  <text x="230" y="176" font-size="11" font-weight="600" fill="#94a3b8">实测痕迹</text>
  <text x="230" y="194" font-size="11.5" fill="#1e293b">渐变 / 阴影 / 卡片归零</text>
  <text x="230" y="212" font-size="11.5" fill="#475569">圆角收到 2 种</text>
  <text x="230" y="230" font-size="11.5" fill="#475569">section 7 → 4，密度同降</text>

  <rect x="400" y="84" width="172" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="401" y="85" width="170" height="30" rx="7" fill="#f5f3ff"/>
  <text x="486" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8b5cf6">V2 · + Branding / Taste</text>
  <text x="414" y="134" font-size="11" font-weight="600" fill="#94a3b8">输入</text>
  <text x="414" y="152" font-size="11.5" fill="#475569">品牌规则 + 反模式</text>
  <text x="414" y="176" font-size="11" font-weight="600" fill="#94a3b8">实测痕迹</text>
  <text x="414" y="194" font-size="11.5" fill="#1e293b">0 处 card、圆角 3/5px</text>
  <text x="414" y="212" font-size="11.5" fill="#475569">强调色收敛为一个</text>
  <text x="414" y="230" font-size="11.5" fill="#475569">section 数不变，但不像模板</text>

  <rect x="584" y="84" width="184" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="585" y="85" width="182" height="30" rx="7" fill="#ecfdf5"/>
  <text x="676" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#10b981">V3 · + 评审修正</text>
  <text x="598" y="134" font-size="11" font-weight="600" fill="#94a3b8">输入</text>
  <text x="598" y="152" font-size="11.5" fill="#475569">audit / critique / polish</text>
  <text x="598" y="176" font-size="11" font-weight="600" fill="#94a3b8">实测痕迹</text>
  <text x="598" y="194" font-size="11.5" fill="#1e293b">对比度 5 处补到达标</text>
  <text x="598" y="212" font-size="11.5" fill="#475569">间距对齐 8px 网格</text>
  <text x="598" y="230" font-size="11.5" fill="#475569">断点 1 → 3、补减少动效</text>

  <rect x="32" y="296" width="736" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="400" y="317" text-anchor="middle" font-size="11.5" fill="#475569">视觉上最大的跳跃在 V0→V1；最贵的一档（V3，143.8 秒）在首屏截图上几乎看不出来</text>
</svg>
