<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">设计能力的三层结构</title>
  <desc id="d">Reference 层回答什么是好的，Taste 层回答应该怎么做，Quality 层回答做得够不够好；三层分别对应 Minimal Gallery、taste-skill 与 Impeccable。</desc>
  <rect width="800" height="350" fill="#f8fafc" rx="10"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">设计能力的三层结构</text>
  <text x="400" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">每层回答一个不同的问题，缺任何一层，产出都无法证伪</text>

  <rect x="28" y="78" width="232" height="222" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="29" y="79" width="230" height="30" rx="7" fill="#eff6ff"/>
  <text x="144" y="99" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3b82f6">Reference 层</text>
  <text x="44" y="134" font-size="13" font-weight="600" fill="#1e293b">什么是好的？</text>
  <rect x="44" y="146" width="200" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="144" y="166" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Minimal Gallery</text>
  <text x="44" y="200" font-size="11.5" fill="#475569">· 手工策展的极简案例</text>
  <text x="44" y="220" font-size="11.5" fill="#475569">· 抽规则，不抄页面</text>
  <text x="44" y="240" font-size="11.5" fill="#475569">· 收敛设计搜索空间</text>

  <rect x="284" y="78" width="232" height="222" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="285" y="79" width="230" height="30" rx="7" fill="#f5f3ff"/>
  <text x="400" y="99" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8b5cf6">Taste 层</text>
  <text x="300" y="134" font-size="13" font-weight="600" fill="#1e293b">应该怎么做？</text>
  <rect x="300" y="146" width="200" height="32" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="400" y="166" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">taste-skill</text>
  <text x="300" y="200" font-size="11.5" fill="#475569">· 一组 SKILL.md 规则</text>
  <text x="300" y="220" font-size="11.5" fill="#475569">· 反模式清单（不要什么）</text>
  <text x="300" y="240" font-size="11.5" fill="#475569">· 字号 / 间距 / 动效判断</text>

  <rect x="540" y="78" width="232" height="222" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="541" y="79" width="230" height="30" rx="7" fill="#ecfdf5"/>
  <text x="656" y="99" text-anchor="middle" font-size="12.5" font-weight="600" fill="#10b981">Quality 层</text>
  <text x="556" y="134" font-size="13" font-weight="600" fill="#1e293b">够不够好？</text>
  <rect x="556" y="146" width="200" height="32" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="656" y="166" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Impeccable</text>
  <text x="556" y="200" font-size="11.5" fill="#475569">· 61 条确定性规则</text>
  <text x="556" y="220" font-size="11.5" fill="#475569">· audit / critique / polish</text>
  <text x="556" y="240" font-size="11.5" fill="#475569">· 修正之后再评审</text>

  <path d="M262 189 H280" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="280,185 280,193 287,189" fill="#cbd5e1"/>
  <path d="M518 189 H536" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="536,185 536,193 543,189" fill="#cbd5e1"/>
  <text x="400" y="330" text-anchor="middle" font-size="11.5" fill="#64748b">三层串联才构成可迭代回路：单层只改变这一版，三层的回边改变的是系统还能不能自己变好</text>
</svg>
