<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Agent 能力的五级演进</title>
  <desc id="d">从 Code Generation 到 Expert Agent，每一级新增的能力分别是生成、工具、规则、评估与领域内的长期一致性。</desc>
  <rect width="800" height="340" fill="#f8fafc" rx="10"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Agent 能力的五级演进</text>
  <text x="400" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">每一级新增的能力不同：生成 → 工具 → 规则 → 评估 → 长期一致性</text>

  <path d="M22 296 V92" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="17,98 27,98 22,86" fill="#94a3b8"/>

  <rect x="34" y="240" width="140" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="104" y="264" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Code Generation</text>
  <text x="104" y="282" text-anchor="middle" font-size="11" fill="#64748b">会写代码</text>

  <rect x="182" y="202" width="140" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="252" y="226" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Task Execution</text>
  <text x="252" y="244" text-anchor="middle" font-size="11" fill="#64748b">会完成任务</text>

  <rect x="330" y="164" width="140" height="56" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="400" y="188" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Skill-driven</text>
  <text x="400" y="206" text-anchor="middle" font-size="11" fill="#64748b">会按专家规则做</text>

  <rect x="478" y="126" width="140" height="56" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="548" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Feedback-driven</text>
  <text x="548" y="168" text-anchor="middle" font-size="11" fill="#64748b">会自己判断</text>

  <rect x="626" y="88" width="140" height="56" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="696" y="112" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Expert Agent</text>
  <text x="696" y="130" text-anchor="middle" font-size="11" fill="#64748b">会长期做得对</text>

  <text x="400" y="322" text-anchor="middle" font-size="12" fill="#475569">关键变化不是模型更大，而是 Skill、工具与反馈闭环越来越丰富</text>
</svg>
