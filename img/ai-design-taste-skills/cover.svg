<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">从「能生成 UI」到「有设计品味」</title>
  <desc id="d">裸生成会落在训练集众数，三层设计能力——参考、判断、评审——让输出偏离众数，并形成能回到生成的回边。</desc>
  <defs>
    <g id="pg">
      <rect width="148" height="48" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
      <rect x="10" y="10" width="12" height="12" rx="3" fill="#cbd5e1"/>
      <rect x="28" y="11" width="52" height="8" rx="3" fill="#cbd5e1"/>
      <rect x="10" y="30" width="128" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="10" y="38" width="96" height="5" rx="2.5" fill="#e2e8f0"/>
    </g>
  </defs>
  <rect width="800" height="340" fill="#f8fafc" rx="10"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">从「能生成 UI」到「有设计品味」</text>
  <text x="400" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">三层设计能力 · 一条能自己判断的回边</text>

  <rect x="30" y="82" width="352" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="46" y="106" font-size="12.5" font-weight="600" fill="#475569">裸生成：落在训练集众数</text>
  <use href="#pg" x="48" y="118"/>
  <use href="#pg" x="216" y="118"/>
  <use href="#pg" x="48" y="174"/>
  <use href="#pg" x="216" y="174"/>

  <rect x="418" y="82" width="352" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="434" y="106" font-size="12.5" font-weight="600" fill="#475569">三层能力：偏离众数</text>
  <rect x="434" y="118" width="320" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="434" y="118" width="4" height="32" rx="2" fill="#3b82f6"/>
  <text x="452" y="139" font-size="12.5" fill="#1e293b">参考层 · Minimal Gallery</text>
  <text x="746" y="139" text-anchor="end" font-size="11.5" fill="#64748b">什么是好的</text>
  <rect x="434" y="154" width="320" height="32" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="434" y="154" width="4" height="32" rx="2" fill="#8b5cf6"/>
  <text x="452" y="175" font-size="12.5" fill="#1e293b">判断层 · taste-skill</text>
  <text x="746" y="175" text-anchor="end" font-size="11.5" fill="#64748b">应该怎么做</text>
  <rect x="434" y="190" width="320" height="32" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <rect x="434" y="190" width="4" height="32" rx="2" fill="#10b981"/>
  <text x="452" y="211" font-size="12.5" fill="#1e293b">评审层 · Impeccable</text>
  <text x="746" y="211" text-anchor="end" font-size="11.5" fill="#64748b">够不够好</text>

  <rect x="30" y="252" width="740" height="68" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="57" y="262" width="96" height="30" rx="6" fill="#ffffff" stroke="#3b82f6"/>
  <text x="105" y="281" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">参考</text>
  <path d="M157 277 H171" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="171,273 171,281 178,277" fill="#cbd5e1"/>
  <rect x="179" y="262" width="96" height="30" rx="6" fill="#ffffff" stroke="#475569"/>
  <text x="227" y="281" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">身份</text>
  <path d="M279 277 H293" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="293,273 293,281 300,277" fill="#cbd5e1"/>
  <rect x="301" y="262" width="96" height="30" rx="6" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="349" y="281" text-anchor="middle" font-size="12" font-weight="600" fill="#8b5cf6">判断</text>
  <path d="M401 277 H415" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="415,273 415,281 422,277" fill="#cbd5e1"/>
  <rect x="423" y="262" width="96" height="30" rx="6" fill="#ffffff" stroke="#475569"/>
  <text x="471" y="281" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">生成</text>
  <path d="M523 277 H537" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="537,273 537,281 544,277" fill="#cbd5e1"/>
  <rect x="545" y="262" width="96" height="30" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="593" y="281" text-anchor="middle" font-size="12" font-weight="600" fill="#10b981">评审</text>
  <path d="M645 277 H659" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="659,273 659,281 666,277" fill="#cbd5e1"/>
  <rect x="667" y="262" width="96" height="30" rx="6" fill="#ffffff" stroke="#3b82f6"/>
  <text x="715" y="281" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">修正</text>
  <text x="400" y="308" text-anchor="middle" font-size="11.5" fill="#64748b">评审之后能回到生成——这是设计任务与一次性生成的分界</text>
</svg>
