<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Skill、Agent、Harness、Feedback Loop 的分工</title>
  <desc id="d">Skill 负责知道怎么做，Agent 负责执行，Harness 负责组织整个过程，Feedback Loop 负责判断做得好不好；Harness 决定另外三者的能力上限。</desc>
  <rect width="800" height="300" fill="#f8fafc" rx="10"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Skill、Agent、Harness、Feedback Loop 的分工</text>
  <text x="400" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">四者各管一段，回边把判断结果送回输入</text>

  <rect x="200" y="76" width="400" height="26" rx="6" fill="#fef3c7" stroke="#fde68a"/>
  <text x="400" y="94" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">Harness 决定另外三者的能力上限</text>

  <rect x="30" y="118" width="164" height="76" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="112" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Skill</text>
  <text x="112" y="162" text-anchor="middle" font-size="11.5" fill="#475569">我知道怎么做</text>
  <text x="112" y="178" text-anchor="middle" font-size="11.5" fill="#475569">声明式、可版本化</text>

  <rect x="222" y="118" width="164" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="304" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Agent</text>
  <text x="304" y="162" text-anchor="middle" font-size="11.5" fill="#475569">我来执行</text>
  <text x="304" y="178" text-anchor="middle" font-size="11.5" fill="#475569">翻译成工具调用</text>

  <rect x="414" y="118" width="164" height="76" rx="8" fill="#fef3c7" stroke="#fde68a"/>
  <text x="496" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Harness</text>
  <text x="496" y="162" text-anchor="middle" font-size="11.5" fill="#475569">我来组织整个过程</text>
  <text x="496" y="178" text-anchor="middle" font-size="11.5" fill="#475569">加载与 hook 挂载</text>

  <rect x="606" y="118" width="164" height="76" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="688" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Feedback Loop</text>
  <text x="688" y="162" text-anchor="middle" font-size="11.5" fill="#475569">我来判断够不够好</text>
  <text x="688" y="178" text-anchor="middle" font-size="11.5" fill="#475569">规则检测 + 主观评审</text>

  <path d="M194 156 H210" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="210,152 210,160 217,156" fill="#94a3b8"/>
  <path d="M386 156 H402" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="402,152 402,160 409,156" fill="#94a3b8"/>
  <path d="M578 156 H594" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="594,152 594,160 601,156" fill="#94a3b8"/>

  <path d="M688 194 V252 H112 V200" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="108,200 116,200 112,193" fill="#10b981"/>
  <text x="400" y="246" text-anchor="middle" font-size="11.5" fill="#10b981">评估结果变成下一次的输入</text>
  <text x="400" y="280" text-anchor="middle" font-size="11.5" fill="#64748b">同一份 Skill 在不同 harness 上能力并不等价：hooks、子代理、占位符、字段支持各不相同</text>
</svg>
