<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">传统生成链路与设计决策链路</title>
  <desc id="d">传统 Agent 在生成处结束，设计链路在生成处才开始：参考在前、方向在中、评审在后，且评审必须能回到生成。</desc>
  <rect width="800" height="280" fill="#f8fafc" rx="10"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">传统生成链路与设计决策链路</text>
  <text x="400" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">差别不在中间那一步，而在两端：入口多一层方向，出口多一层评审</text>

  <text x="30" y="74" font-size="12.5" font-weight="600" fill="#475569">传统 Agent</text>
  <rect x="150" y="84" width="140" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="220" y="108" text-anchor="middle" font-size="12.5" fill="#1e293b">Prompt</text>
  <path d="M294 103 H314" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="314,99 314,107 321,103" fill="#94a3b8"/>
  <rect x="322" y="84" width="140" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="392" y="108" text-anchor="middle" font-size="12.5" fill="#1e293b">Generate Code</text>
  <path d="M466 103 H486" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="486,99 486,107 493,103" fill="#94a3b8"/>
  <rect x="494" y="84" width="140" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="564" y="108" text-anchor="middle" font-size="12.5" fill="#1e293b">Done</text>
  <text x="650" y="108" font-size="11.5" fill="#64748b">在生成处结束</text>

  <text x="30" y="168" font-size="12.5" font-weight="600" fill="#475569">设计 Agent</text>
  <rect x="33" y="180" width="104" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="85" y="204" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">参考</text>
  <path d="M141 199 H153" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="153,195 153,203 160,199" fill="#94a3b8"/>
  <rect x="161" y="180" width="104" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="213" y="204" text-anchor="middle" font-size="12.5" fill="#1e293b">设计方向</text>
  <path d="M269 199 H281" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="281,195 281,203 288,199" fill="#94a3b8"/>
  <rect x="289" y="180" width="104" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="341" y="204" text-anchor="middle" font-size="12.5" fill="#1e293b">生成</text>
  <path d="M397 199 H409" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="409,195 409,203 416,199" fill="#94a3b8"/>
  <rect x="417" y="180" width="104" height="38" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="469" y="204" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">评审</text>
  <path d="M525 199 H537" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="537,195 537,203 544,199" fill="#94a3b8"/>
  <rect x="545" y="180" width="104" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="597" y="204" text-anchor="middle" font-size="12.5" fill="#1e293b">修正</text>
  <path d="M653 199 H665" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="665,195 665,203 672,199" fill="#94a3b8"/>
  <rect x="673" y="180" width="96" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="721" y="204" text-anchor="middle" font-size="12.5" fill="#1e293b">交付</text>

  <path d="M469 218 V246 H341 V222" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="337,222 345,222 341,215" fill="#10b981"/>
  <text x="405" y="262" text-anchor="middle" font-size="11.5" fill="#10b981">评审不通过就回到生成——这条回边才是设计链路的分界</text>
</svg>
