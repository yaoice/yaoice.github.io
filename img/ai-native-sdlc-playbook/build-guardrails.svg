<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="360" fill="#f8fafc"/>

  <text x="480" y="46" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">Build 阶段护栏三件套</text>
  <text x="480" y="70" text-anchor="middle" font-size="12" fill="#64748b">把制度知识从"人脑里的默契"变成仓库里可执行的约束</text>

  <g filter="url(#s)">
    <rect x="50" y="110" width="270" height="200" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="185" y="142" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">CLAUDE.md</text>
    <text x="185" y="164" text-anchor="middle" font-size="11" fill="#64748b">项目上下文 · 始终加载</text>
    <line x1="75" y1="178" x2="295" y2="178" stroke="#e2e8f0"/>
    <g font-size="11" fill="#475569">
      <text x="75" y="200">· 构建与测试命令</text>
      <text x="75" y="222">· 架构与代码约定</text>
      <text x="75" y="244">· agent 常犯的错误</text>
      <text x="75" y="266">· 控制在 1 页以内</text>
    </g>
    <text x="75" y="294" font-size="10" fill="#94a3b8">同一错误犯两次就写进文件</text>

    <rect x="345" y="110" width="270" height="200" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="480" y="142" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">Skills</text>
    <text x="480" y="164" text-anchor="middle" font-size="11" fill="#64748b">制度知识 · 按需加载</text>
    <line x1="370" y1="178" x2="590" y2="178" stroke="#e2e8f0"/>
    <g font-size="11" fill="#475569">
      <text x="370" y="200">· .claude/skills/&lt;name&gt;/SKILL.md</text>
      <text x="370" y="222">· 认证 / 输入校验 / 审计</text>
      <text x="370" y="244">· 数据分类与日志脱敏</text>
      <text x="370" y="266">· 可附带可执行脚本</text>
    </g>
    <text x="370" y="294" font-size="10" fill="#94a3b8">必须一致应用的规则写在这里</text>

    <rect x="640" y="110" width="270" height="200" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="775" y="142" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">Hooks</text>
    <text x="775" y="164" text-anchor="middle" font-size="11" fill="#64748b">确定性护栏 · 强制执行</text>
    <line x1="665" y1="178" x2="885" y2="178" stroke="#e2e8f0"/>
    <g font-size="11" fill="#475569">
      <text x="665" y="200">· 阻止编辑受保护路径</text>
      <text x="665" y="222">· 自动跑 formatter / linter</text>
      <text x="665" y="244">· 拦截凭证进入 diff</text>
      <text x="665" y="266">· 不满足条件 exit 2 阻断</text>
    </g>
    <text x="665" y="294" font-size="10" fill="#94a3b8">不依赖模型自觉，确定生效</text>
  </g>

  <text x="480" y="336" text-anchor="middle" font-size="12" fill="#475569">加载成本递增，执行确定性递增：上下文 → 知识 → 强制</text>
</svg>
