<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="400" fill="#f8fafc"/>

  <text x="480" y="62" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">代码不再是瓶颈，SDLC 本身才是</text>
  <text x="480" y="90" text-anchor="middle" font-size="13" fill="#64748b">AI 原生软件开发生命周期：从线性阶段到自动循环</text>

  <rect x="60" y="130" width="360" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#s)"/>
  <text x="240" y="160" text-anchor="middle" font-size="14" fill="#475569" font-weight="600">传统 SDLC · 线性阶段</text>

  <g font-size="12" fill="#475569">
    <rect x="90" y="180" width="90" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="135" y="202" text-anchor="middle">Plan</text>
    <rect x="190" y="180" width="90" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="235" y="202" text-anchor="middle">Design</text>
    <rect x="290" y="180" width="90" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="335" y="202" text-anchor="middle">Build</text>
    <rect x="90" y="228" width="90" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="135" y="250" text-anchor="middle">Test</text>
    <rect x="190" y="228" width="90" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="235" y="250" text-anchor="middle">Deploy</text>
    <rect x="290" y="228" width="90" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="335" y="250" text-anchor="middle">Maintain</text>
  </g>

  <rect x="285" y="175" width="100" height="44" rx="6" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="240" y="292" text-anchor="middle" font-size="12" fill="#ef4444">瓶颈：人工手写代码</text>
  <text x="240" y="312" text-anchor="middle" font-size="11" fill="#94a3b8">每阶段等待人工签字流转</text>

  <path d="M436 235 H512" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M512 235 l-9 -5 v10 z" fill="#94a3b8"/>

  <rect x="540" y="130" width="360" height="210" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#s)"/>
  <text x="720" y="160" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">AI 原生 SDLC · 自动循环</text>

  <g font-size="11" fill="#1e293b">
    <rect x="600" y="180" width="80" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="640" y="199" text-anchor="middle">intent.md</text>
    <rect x="694" y="180" width="80" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="734" y="199" text-anchor="middle">spec.md</text>
    <rect x="788" y="180" width="80" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="828" y="199" text-anchor="middle">plan.md</text>
    <rect x="788" y="226" width="80" height="30" rx="6" fill="#dcfce7" stroke="#10b981"/>
    <text x="828" y="245" text-anchor="middle">diff+tests</text>
    <rect x="694" y="272" width="80" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="734" y="291" text-anchor="middle">PR+review</text>
    <rect x="600" y="272" width="80" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="640" y="291" text-anchor="middle">incident</text>
  </g>

  <path d="M600 265 V201" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <path d="M600 195 l-5 10 h10 z" fill="#3b82f6"/>
  <text x="720" y="326" text-anchor="middle" font-size="12" fill="#3b82f6">每个阶段提交工件，下一阶段自动触发</text>
</svg>
