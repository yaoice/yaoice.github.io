<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="340" fill="#f8fafc"/>

  <text x="480" y="46" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">Maintain 阶段：控制带驱动的自愈循环</text>
  <text x="480" y="70" text-anchor="middle" font-size="12" fill="#64748b">偏离程度决定 agent 自治等级，越界则交还人类</text>

  <!-- band 3 -->
  <rect x="60" y="100" width="380" height="62" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#s)"/>
  <text x="84" y="126" font-size="13" fill="#1e293b" font-weight="600">3σ · 严重偏离</text>
  <text x="84" y="146" font-size="11" fill="#ef4444">开 PR 或触发预批准 runbook（如回滚）</text>

  <!-- band 2 -->
  <rect x="60" y="172" width="380" height="62" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#s)"/>
  <text x="84" y="198" font-size="13" fill="#1e293b" font-weight="600">2σ · 明显偏离</text>
  <text x="84" y="218" font-size="11" fill="#b45309">agent 只读诊断，输出根因分析</text>

  <!-- band 1 -->
  <rect x="60" y="244" width="380" height="62" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#s)"/>
  <text x="84" y="270" font-size="13" fill="#1e293b" font-weight="600">1σ · 正常波动</text>
  <text x="84" y="290" font-size="11" fill="#047857">仅记录日志，不触发动作</text>

  <!-- right: loop -->
  <rect x="490" y="100" width="410" height="206" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#s)"/>
  <text x="695" y="128" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">检测 → 诊断 → 回写 → 修复</text>

  <g font-size="11" fill="#1e293b">
    <rect x="516" y="146" width="100" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="566" y="167" text-anchor="middle">监控指标</text>
    <rect x="636" y="146" width="100" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="686" y="167" text-anchor="middle">对照控制带</text>
    <rect x="756" y="146" width="114" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="813" y="167" text-anchor="middle">写回 intent.md</text>

    <rect x="756" y="200" width="114" height="34" rx="6" fill="#dcfce7" stroke="#10b981"/>
    <text x="813" y="221" text-anchor="middle">CI 中固化为 eval</text>
    <rect x="636" y="200" width="100" height="34" rx="6" fill="#dcfce7" stroke="#10b981"/>
    <text x="686" y="221" text-anchor="middle">提交修复 PR</text>
    <rect x="516" y="200" width="100" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="566" y="221" text-anchor="middle">agent 介入</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M616 163 H632"/>
    <path d="M736 163 H752"/>
    <path d="M756 234 V217"/>
    <path d="M636 234 V217"/>
  </g>
  <g fill="#94a3b8">
    <path d="M632 163 l-8 -5 v10 z"/>
    <path d="M752 163 l-8 -5 v10 z"/>
    <path d="M756 234 l-5 -9 h10 z"/>
    <path d="M636 234 l-5 -9 h10 z"/>
  </g>

  <text x="695" y="266" text-anchor="middle" font-size="11" fill="#475569">每个生产事故都变成一条永久 eval，不再重复踩坑</text>

  <text x="480" y="325" text-anchor="middle" font-size="12" fill="#475569">bands.yaml 定义阈值与自治边界：CI 失败率、部署后 5xx、延迟分位</text>
</svg>
