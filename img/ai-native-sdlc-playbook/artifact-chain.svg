<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="320" fill="#f8fafc"/>

  <text x="480" y="46" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">六阶段工件链：提交即审计轨迹</text>
  <text x="480" y="70" text-anchor="middle" font-size="12" fill="#64748b">每个阶段以提交一个版本化工件结束，下一阶段读取它并自动触发</text>

  <g filter="url(#s)">
    <rect x="40" y="110" width="130" height="90" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="105" y="140" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">Plan</text>
    <text x="105" y="164" text-anchor="middle" font-size="11" fill="#3b82f6">intent.md</text>
    <text x="105" y="184" text-anchor="middle" font-size="10" fill="#94a3b8">问题/约束/开放项</text>

    <rect x="192" y="110" width="130" height="90" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="257" y="140" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">Design</text>
    <text x="257" y="164" text-anchor="middle" font-size="11" fill="#3b82f6">spec.md</text>
    <text x="257" y="184" text-anchor="middle" font-size="10" fill="#94a3b8">需求+设计合并</text>

    <rect x="344" y="110" width="130" height="90" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="409" y="140" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">Build</text>
    <text x="409" y="164" text-anchor="middle" font-size="11" fill="#10b981">plan.md → diff</text>
    <text x="409" y="184" text-anchor="middle" font-size="10" fill="#94a3b8">+ tests</text>

    <rect x="496" y="110" width="130" height="90" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="561" y="140" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">Test</text>
    <text x="561" y="164" text-anchor="middle" font-size="11" fill="#10b981">evals 结果</text>
    <text x="561" y="184" text-anchor="middle" font-size="10" fill="#94a3b8">持续评估</text>

    <rect x="648" y="110" width="130" height="90" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="713" y="140" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">Deploy</text>
    <text x="713" y="164" text-anchor="middle" font-size="11" fill="#f59e0b">PR + review</text>
    <text x="713" y="184" text-anchor="middle" font-size="10" fill="#94a3b8">人工门禁</text>

    <rect x="800" y="110" width="130" height="90" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="865" y="140" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">Maintain</text>
    <text x="865" y="164" text-anchor="middle" font-size="11" fill="#f59e0b">incident 记录</text>
    <text x="865" y="184" text-anchor="middle" font-size="10" fill="#94a3b8">写回新 intent.md</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M170 155 H188"/>
    <path d="M322 155 H340"/>
    <path d="M474 155 H492"/>
    <path d="M626 155 H644"/>
    <path d="M778 155 H796"/>
  </g>
  <g fill="#94a3b8">
    <path d="M188 155 l-8 -5 v10 z"/>
    <path d="M340 155 l-8 -5 v10 z"/>
    <path d="M492 155 l-8 -5 v10 z"/>
    <path d="M644 155 l-8 -5 v10 z"/>
    <path d="M796 155 l-8 -5 v10 z"/>
  </g>

  <path d="M865 200 V255 H105 V200" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <path d="M105 200 l-5 10 h10 z" fill="#3b82f6"/>
  <rect x="400" y="242" width="170" height="26" rx="6" fill="#f8fafc"/>
  <text x="485" y="259" text-anchor="middle" font-size="11" fill="#3b82f6">闭环：异常回写为新意图</text>

  <text x="480" y="295" text-anchor="middle" font-size="12" fill="#475569">谁要求什么 → agent 产出什么 → 谁批准，全部沉淀在版本控制中</text>
</svg>
