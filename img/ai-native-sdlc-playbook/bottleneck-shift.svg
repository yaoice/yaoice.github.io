<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="340" fill="#f8fafc"/>

  <text x="480" y="46" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">瓶颈向左向右转移</text>
  <text x="480" y="70" text-anchor="middle" font-size="12" fill="#64748b">AI 把 Build 压到小时级，未被压缩的仍是人类速度</text>

  <!-- axis -->
  <line x1="90" y1="248" x2="880" y2="248" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="160" y="270">Plan</text>
    <text x="300" y="270">Design</text>
    <text x="440" y="270">Build</text>
    <text x="580" y="270">Test</text>
    <text x="720" y="270">Deploy</text>
    <text x="850" y="270">Maintain</text>
  </g>

  <!-- before bars (human) -->
  <g>
    <rect x="130" y="150" width="60" height="98" rx="4" fill="#cbd5e1"/>
    <rect x="270" y="130" width="60" height="118" rx="4" fill="#cbd5e1"/>
    <rect x="410" y="70" width="60" height="178" rx="4" fill="#94a3b8"/>
    <rect x="550" y="140" width="60" height="108" rx="4" fill="#cbd5e1"/>
    <rect x="690" y="160" width="60" height="88" rx="4" fill="#cbd5e1"/>
    <rect x="820" y="150" width="60" height="98" rx="4" fill="#cbd5e1"/>
  </g>
  <text x="90" y="120" font-size="11" fill="#94a3b8" text-anchor="start">传统耗时</text>

  <!-- after bars (AI) -->
  <g>
    <rect x="130" y="196" width="60" height="52" rx="4" fill="#f59e0b"/>
    <rect x="270" y="204" width="60" height="44" rx="4" fill="#f59e0b"/>
    <rect x="410" y="228" width="60" height="20" rx="4" fill="#10b981"/>
    <rect x="550" y="200" width="60" height="48" rx="4" fill="#f59e0b"/>
    <rect x="690" y="210" width="60" height="38" rx="4" fill="#f59e0b"/>
    <rect x="820" y="192" width="60" height="56" rx="4" fill="#f59e0b"/>
  </g>

  <g font-size="11">
    <text x="440" y="222" text-anchor="middle" fill="#10b981">大幅压缩</text>
    <text x="160" y="186" text-anchor="middle" fill="#b45309">仍是人类速度</text>
    <text x="720" y="200" text-anchor="middle" fill="#b45309">仍是人类速度</text>
  </g>

  <rect x="100" y="290" width="330" height="34" rx="8" fill="#ffffff" stroke="#f59e0b" filter="url(#s)"/>
  <text x="265" y="311" text-anchor="middle" font-size="12" fill="#b45309">左侧：意图澄清慢 · 右侧：评审与治理慢</text>

  <rect x="530" y="290" width="330" height="34" rx="8" fill="#ffffff" stroke="#10b981" filter="url(#s)"/>
  <text x="695" y="311" text-anchor="middle" font-size="12" fill="#047857">中间：编码已被 agent 压缩到小时级</text>
</svg>
