<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">WorkBuddy 能力组装栈</title><desc id="desc">专家、Skill、RAG 和 MCP 分别解决角色、操作、知识和连接问题</desc>
<rect width="960" height="540" rx="10" fill="#f8fafc"/>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<text x="48" y="50" font-size="18" font-weight="700" fill="#1e293b">WorkBuddy 能力组装栈</text><text x="48" y="76" font-size="13" fill="#64748b">先判断缺的是专业角色、执行方法、事实资料，还是外部连接</text>
<g transform="translate(198 110)">
<rect width="564" height="76" rx="10" fill="#1e293b"/><text x="28" y="32" font-size="17" font-weight="700" fill="#fff">专家模式</text><text x="28" y="57" font-size="13" fill="#cbd5e1">定义角色、方法论、SOP 与安全边界</text><text x="532" y="45" text-anchor="end" font-size="14" font-weight="700" fill="#fff">回答「以谁的方式做」</text>
<rect y="94" width="564" height="76" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text x="28" y="126" font-size="17" font-weight="700" fill="#1e293b">Skill</text><text x="28" y="151" font-size="13" fill="#475569">操作手册、工具包、脚本与可复用工作流</text><text x="532" y="139" text-anchor="end" font-size="14" font-weight="700" fill="#3b82f6">回答「具体怎么做」</text>
<rect y="188" width="564" height="76" rx="10" fill="#f0fdf4" stroke="#10b981"/><text x="28" y="220" font-size="17" font-weight="700" fill="#1e293b">RAG / 知识库</text><text x="28" y="245" font-size="13" fill="#475569">先检索企业资料，再基于命中的证据生成</text><text x="532" y="233" text-anchor="end" font-size="14" font-weight="700" fill="#10b981">回答「依据什么事实」</text>
<rect y="282" width="564" height="76" rx="10" fill="#fff" stroke="#94a3b8"/><text x="28" y="314" font-size="17" font-weight="700" fill="#1e293b">MCP / 连接器</text><text x="28" y="339" font-size="13" fill="#475569">把邮箱、文档、OA 等系统包装成标准工具</text><text x="532" y="327" text-anchor="end" font-size="14" font-weight="700" fill="#475569">回答「连接到哪里」</text>
</g>
<g transform="translate(48 486)"><text font-size="13" fill="#64748b">选择口诀：</text><text x="78" font-size="13" font-weight="700" fill="#1e293b">不专业 → 专家</text><text x="212" font-size="13" fill="#94a3b8">｜</text><text x="232" font-size="13" font-weight="700" fill="#1e293b">不会做 → Skill</text><text x="370" font-size="13" fill="#94a3b8">｜</text><text x="390" font-size="13" font-weight="700" fill="#1e293b">不知道 → RAG</text><text x="532" font-size="13" fill="#94a3b8">｜</text><text x="552" font-size="13" font-weight="700" fill="#1e293b">访问不了 → MCP</text></g>
</g></svg>
