<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">WorkBuddy 数据安全边界</title><desc id="desc">数据分级、最小授权和人工验证组成的三层安全防线</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs>
<rect width="960" height="560" rx="10" fill="#f8fafc"/>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<text x="48" y="50" font-size="18" font-weight="700" fill="#1e293b">安全不是一个开关，而是三层连续判断</text><text x="48" y="76" font-size="13" fill="#64748b">输入前分级，执行时最小授权，输出后由人核实并承担最终责任</text>
<g transform="translate(48 112)">
<text x="0" y="22" font-size="15" font-weight="700" fill="#1e293b">第一层 · 输入数据分级</text>
<rect y="42" width="490" height="58" rx="8" fill="#f0fdf4" stroke="#10b981"/><text x="18" y="68" font-size="15" font-weight="700" fill="#10b981">80% 直接用</text><text x="150" y="68" font-size="13" fill="#475569">通知、普通文案、公开数据</text><text x="150" y="88" font-size="12" fill="#64748b">无可识别个人信息，仍需核实事实</text>
<rect y="112" width="490" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b"/><text x="18" y="138" font-size="15" font-weight="700" fill="#b45309">15% 先脱敏</text><text x="150" y="138" font-size="13" fill="#475569">客户反馈、报表、简历</text><text x="150" y="158" font-size="12" fill="#64748b">替换姓名，删除联系方式，只传必要字段</text>
<rect y="182" width="490" height="58" rx="8" fill="#fef2f2" stroke="#ef4444"/><text x="18" y="208" font-size="15" font-weight="700" fill="#ef4444">5% 不输入</text><text x="150" y="208" font-size="13" fill="#475569">Key、Token、密码、生产配置</text><text x="150" y="228" font-size="12" fill="#64748b">不上传、不写文档、不截图传播</text>
<g transform="translate(536)"><text x="0" y="22" font-size="15" font-weight="700" fill="#1e293b">第二层 · 执行最小授权</text>
<rect y="42" width="328" height="198" rx="10" fill="#fff" stroke="#94a3b8"/>
<g font-size="13" fill="#475569"><circle cx="28" cy="74" r="13" fill="#1e293b"/><text x="28" y="79" text-anchor="middle" fill="#fff">1</text><text x="54" y="79">新建临时目录</text>
<circle cx="28" cy="116" r="13" fill="#1e293b"/><text x="28" y="121" text-anchor="middle" fill="#fff">2</text><text x="54" y="121">只放任务所需副本</text>
<circle cx="28" cy="158" r="13" fill="#1e293b"/><text x="28" y="163" text-anchor="middle" fill="#fff">3</text><text x="54" y="163">只授权这个目录</text>
<circle cx="28" cy="200" r="13" fill="#1e293b"/><text x="28" y="205" text-anchor="middle" fill="#fff">4</text><text x="54" y="205">完成后撤销授权</text></g></g>
<path d="M432 272V306" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text x="0" y="330" font-size="15" font-weight="700" fill="#1e293b">第三层 · 输出验证</text>
<g transform="translate(0 350)"><rect width="272" height="112" rx="10" fill="#fff" stroke="#3b82f6"/><text x="20" y="35" font-size="16" font-weight="700" fill="#3b82f6">核数据</text><text x="20" y="64" font-size="13" fill="#475569">数字、日期、人名有来源吗？</text><text x="20" y="87" font-size="12" fill="#64748b">找不到原始依据 → 标「待验证」</text>
<rect x="296" width="272" height="112" rx="10" fill="#fff" stroke="#3b82f6"/><text x="316" y="35" font-size="16" font-weight="700" fill="#3b82f6">核逻辑</text><text x="316" y="64" font-size="13" fill="#475569">结论是否被前文证据支撑？</text><text x="316" y="87" font-size="12" fill="#64748b">有推理断点 → 补证据或重算</text>
<rect x="592" width="272" height="112" rx="10" fill="#fff" stroke="#3b82f6"/><text x="612" y="35" font-size="16" font-weight="700" fill="#3b82f6">核场景</text><text x="612" y="64" font-size="13" fill="#475569">适合当前公司、客户和流程吗？</text><text x="612" y="87" font-size="12" fill="#64748b">不匹配 → 人工调整后再交付</text></g>
</g></g></svg>
