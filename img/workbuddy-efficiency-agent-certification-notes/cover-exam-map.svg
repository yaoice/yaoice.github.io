<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">WorkBuddy 认证考试地图</title><desc id="desc">考试参数与六大模块权重分布</desc>
<rect width="960" height="600" rx="10" fill="#f8fafc"/>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<text x="48" y="52" font-size="18" font-weight="700" fill="#1e293b">WorkBuddy 效率智能体应用师认证 · 考试地图</text>
<text x="48" y="78" font-size="13" fill="#64748b">先按权重分配时间，再用场景题串联概念、操作与安全边界</text>
<g transform="translate(48 108)">
<rect width="864" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/>
<g text-anchor="middle"><text x="86" y="31" font-size="13" fill="#64748b">考试形式</text><text x="86" y="59" font-size="17" font-weight="700" fill="#1e293b">线下理论</text>
<text x="258" y="31" font-size="13" fill="#64748b">题量</text><text x="258" y="59" font-size="17" font-weight="700" fill="#1e293b">40 单选 + 20 多选</text>
<text x="430" y="31" font-size="13" fill="#64748b">时长</text><text x="430" y="59" font-size="17" font-weight="700" fill="#1e293b">120 分钟</text>
<text x="602" y="31" font-size="13" fill="#64748b">通过线</text><text x="602" y="59" font-size="17" font-weight="700" fill="#10b981">70 / 100</text>
<text x="774" y="31" font-size="13" fill="#64748b">多选规则</text><text x="774" y="59" font-size="17" font-weight="700" fill="#ef4444">错选漏选均 0 分</text></g>
</g>
<text x="48" y="236" font-size="15" font-weight="700" fill="#1e293b">六大知识域</text>
<g transform="translate(48 258)">
<rect width="270" height="94" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text x="20" y="31" font-size="15" font-weight="700" fill="#1e293b">高效对话技巧</text><text x="236" y="31" font-size="20" font-weight="700" text-anchor="end" fill="#3b82f6">20%</text><text x="20" y="61" font-size="12" fill="#475569">上下文 · Prompt · 追问 · 权限模式</text>
<rect x="297" width="270" height="94" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text x="317" y="31" font-size="15" font-weight="700" fill="#1e293b">职场实战应用</text><text x="533" y="31" font-size="20" font-weight="700" text-anchor="end" fill="#3b82f6">20%</text><text x="317" y="61" font-size="12" fill="#475569">读 · 写 · 析 · 多文档 · PPT</text>
<rect x="594" width="270" height="94" rx="10" fill="#f0fdf4" stroke="#10b981"/><text x="614" y="31" font-size="15" font-weight="700" fill="#1e293b">进阶功能探索</text><text x="830" y="31" font-size="20" font-weight="700" text-anchor="end" fill="#10b981">18%</text><text x="614" y="61" font-size="12" fill="#475569">专家 · Skill · RAG · MCP</text>
<rect y="116" width="270" height="94" rx="10" fill="#f0fdf4" stroke="#10b981"/><text x="20" y="147" font-size="15" font-weight="700" fill="#1e293b">安全与合规</text><text x="236" y="147" font-size="20" font-weight="700" text-anchor="end" fill="#10b981">18%</text><text x="20" y="177" font-size="12" fill="#475569">数据流 · 最小授权 · 输出验证</text>
<rect x="297" y="116" width="270" height="94" rx="10" fill="#fff" stroke="#94a3b8"/><text x="317" y="147" font-size="15" font-weight="700" fill="#1e293b">初识 WorkBuddy</text><text x="533" y="147" font-size="20" font-weight="700" text-anchor="end" fill="#64748b">12%</text><text x="317" y="177" font-size="12" fill="#475569">产品 · 界面 · 模型 · 工作模式</text>
<rect x="594" y="116" width="270" height="94" rx="10" fill="#fff" stroke="#94a3b8"/><text x="614" y="147" font-size="15" font-weight="700" fill="#1e293b">企业构建与管理</text><text x="830" y="147" font-size="20" font-weight="700" text-anchor="end" fill="#64748b">12%</text><text x="614" y="177" font-size="12" fill="#475569">资产 · Runtime · Session · 治理</text>
</g>
<g transform="translate(48 502)"><rect width="864" height="58" rx="10" fill="#1e293b"/><text x="24" y="24" font-size="13" fill="#cbd5e1">复习顺序</text><text x="108" y="37" font-size="14" font-weight="700" fill="#fff">对话 + 实战（40%）</text><text x="304" y="37" font-size="16" fill="#94a3b8">→</text><text x="346" y="37" font-size="14" font-weight="700" fill="#fff">进阶 + 安全（36%）</text><text x="542" y="37" font-size="16" fill="#94a3b8">→</text><text x="584" y="37" font-size="14" font-weight="700" fill="#fff">产品 + 企业（24%）</text></g>
</g></svg>
