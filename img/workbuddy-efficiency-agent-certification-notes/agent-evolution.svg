<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">从语言模型到可执行智能体</title><desc id="desc">AI 四阶段演进和 Agent 补齐的四项能力</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs>
<rect width="960" height="500" rx="10" fill="#f8fafc"/>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<text x="48" y="50" font-size="18" font-weight="700" fill="#1e293b">从语言模型到可执行智能体</text><text x="48" y="76" font-size="13" fill="#64748b">Agent 没有替换 LLM，而是在语言能力之外补上执行闭环</text>
<g transform="translate(48 112)" text-anchor="middle">
<rect width="180" height="70" rx="10" fill="#fff" stroke="#94a3b8"/><text x="90" y="31" font-size="15" font-weight="700" fill="#1e293b">规则驱动</text><text x="90" y="53" font-size="12" fill="#64748b">人写规则，机器执行</text>
<path d="M188 35H222" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="228" width="180" height="70" rx="10" fill="#fff" stroke="#94a3b8"/><text x="318" y="31" font-size="15" font-weight="700" fill="#1e293b">数据驱动</text><text x="318" y="53" font-size="12" fill="#64748b">从样本中学习模式</text>
<path d="M416 35H450" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="456" width="180" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text x="546" y="31" font-size="15" font-weight="700" fill="#1e293b">语言驱动</text><text x="546" y="53" font-size="12" fill="#64748b">理解与生成自然语言</text>
<path d="M644 35H678" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
<rect x="684" width="180" height="70" rx="10" fill="#1e293b"/><text x="774" y="31" font-size="15" font-weight="700" fill="#fff">Agent</text><text x="774" y="53" font-size="12" fill="#cbd5e1">规划、行动、观察、迭代</text>
</g>
<text x="48" y="238" font-size="15" font-weight="700" fill="#1e293b">LLM 的短板</text><text x="528" y="238" font-size="15" font-weight="700" fill="#1e293b">Agent 的补齐方式</text>
<g transform="translate(48 262)">
<g font-size="14"><rect width="360" height="46" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="18" y="29" fill="#475569">不能动手：只能生成文本</text>
<rect y="58" width="360" height="46" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="18" y="87" fill="#475569">不能连接：默认访问不了外部系统</text>
<rect y="116" width="360" height="46" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="18" y="145" fill="#475569">不能记住：上下文之外缺少长期记忆</text>
<rect y="174" width="360" height="46" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="18" y="203" fill="#475569">不可控：执行过程缺少权限边界</text></g>
<g transform="translate(480)" font-size="14"><rect width="384" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6"/><text x="18" y="29" fill="#1e293b">自主规划：把目标拆成步骤</text>
<rect y="58" width="384" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6"/><text x="18" y="87" fill="#1e293b">工具调用：读写文件、应用和业务系统</text>
<rect y="116" width="384" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6"/><text x="18" y="145" fill="#1e293b">持续记忆：跨会话和项目保留关键信息</text>
<rect y="174" width="384" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6"/><text x="18" y="203" fill="#1e293b">权限管控：授权、确认、沙箱与审计</text></g>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><path d="M370 23H466"/><path d="M370 81H466"/><path d="M370 139H466"/><path d="M370 197H466"/></g></g>
</g></svg>
