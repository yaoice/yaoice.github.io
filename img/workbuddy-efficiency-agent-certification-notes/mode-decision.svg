<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Ask、Plan、Craft 模式选择</title><desc id="desc">根据任务是否需要执行以及风险是否可控选择工作模式</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="520" rx="10" fill="#f8fafc"/>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<text x="48" y="50" font-size="18" font-weight="700" fill="#1e293b">Ask、Plan、Craft：用执行需求和风险做选择</text><text x="48" y="76" font-size="13" fill="#64748b">架构级改动先规划，细节级调整快速执行；模式可以在任务中切换</text>
<g text-anchor="middle">
<rect x="350" y="108" width="260" height="66" rx="10" fill="#fff" stroke="#475569"/><text x="480" y="136" font-size="15" font-weight="700" fill="#1e293b">AI 需要操作文件或应用吗？</text><text x="480" y="158" font-size="12" fill="#64748b">不是只回答、解释或讨论</text>
<path d="M350 141H206V224" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="268" y="128" font-size="12" fill="#64748b">不需要</text>
<rect x="72" y="232" width="268" height="124" rx="10" fill="#fff" stroke="#94a3b8"/><text x="206" y="267" font-size="22" font-weight="700" fill="#475569">Ask</text><text x="206" y="294" font-size="13" fill="#475569">问答 · 分析 · 解释 · 建议</text><text x="206" y="321" font-size="12" fill="#64748b">主要风险：答案可能不准确</text>
<path d="M610 141H750V224" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="688" y="128" font-size="12" fill="#64748b">需要</text>
<rect x="620" y="232" width="260" height="66" rx="10" fill="#fff" stroke="#475569"/><text x="750" y="260" font-size="15" font-weight="700" fill="#1e293b">步骤明确且风险可控吗？</text><text x="750" y="282" font-size="12" fill="#64748b">范围、目标和验收都已清楚</text>
<path d="M620 265H500V358" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="552" y="252" font-size="12" fill="#64748b">不确定</text>
<rect x="366" y="366" width="268" height="124" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text x="500" y="401" font-size="22" font-weight="700" fill="#3b82f6">Plan</text><text x="500" y="428" font-size="13" fill="#475569">澄清 → 方案 → 确认 → 执行</text><text x="500" y="455" font-size="12" fill="#64748b">适合复杂、跨文件、架构级任务</text>
<path d="M750 298V358" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="778" y="336" font-size="12" fill="#64748b">明确</text>
<rect x="646" y="366" width="268" height="124" rx="10" fill="#f0fdf4" stroke="#10b981"/><text x="780" y="401" font-size="22" font-weight="700" fill="#10b981">Craft</text><text x="780" y="428" font-size="13" fill="#475569">直接执行 · 调工具 · 自主迭代</text><text x="780" y="455" font-size="12" fill="#64748b">适合清晰、重复、可回退的任务</text>
</g>
</g></svg>
