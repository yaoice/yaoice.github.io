<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">企业智能体三层架构与治理</title><desc id="desc">Agent 配置层、Runtime 运行层、Session 会话层与企业治理维度</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="570" rx="10" fill="#f8fafc"/>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<text x="48" y="50" font-size="18" font-weight="700" fill="#1e293b">企业智能体：配置、运行、会话分层治理</text><text x="48" y="76" font-size="13" fill="#64748b">能力最小化，环境相互隔离，操作全程可追溯</text>
<g transform="translate(48 112)">
<rect width="610" height="112" rx="10" fill="#1e293b"/><text x="28" y="37" font-size="20" font-weight="700" fill="#fff">Agent · 配置层</text><text x="28" y="69" font-size="13" fill="#cbd5e1">名称 / System Prompt / Skill / 专家 / MCP / 知识库</text><text x="28" y="92" font-size="13" fill="#cbd5e1">渠道 / 自动化 / 发布状态</text><text x="576" y="65" text-anchor="end" font-size="14" font-weight="700" fill="#fff">定义「它是谁、会什么」</text>
<path d="M305 112V144" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect y="152" width="610" height="112" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text x="28" y="189" font-size="20" font-weight="700" fill="#1e293b">Runtime · 运行层</text><text x="28" y="221" font-size="13" fill="#475569">计算资源 / 运行状态 / 测试环境 / 正式环境</text><text x="28" y="244" font-size="13" fill="#475569">一个 Agent 可以部署多个 Runtime</text><text x="576" y="217" text-anchor="end" font-size="14" font-weight="700" fill="#3b82f6">定义「在哪里跑」</text>
<path d="M305 264V296" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect y="304" width="610" height="112" rx="10" fill="#f0fdf4" stroke="#10b981"/><text x="28" y="341" font-size="20" font-weight="700" fill="#1e293b">Session · 会话层</text><text x="28" y="373" font-size="13" fill="#475569">上下文 / 消息历史 / 文件 / 工具调用链</text><text x="28" y="396" font-size="13" fill="#475569">不同用户和任务的 Session 相互隔离</text><text x="576" y="369" text-anchor="end" font-size="14" font-weight="700" fill="#10b981">记录「每次发生了什么」</text>
<g transform="translate(650)"><rect width="214" height="416" rx="10" fill="#fff" stroke="#94a3b8"/><text x="24" y="38" font-size="17" font-weight="700" fill="#1e293b">横向治理</text>
<g font-size="14" fill="#475569"><text x="24" y="82">组织架构</text><text x="24" y="130">资产管理</text><text x="24" y="178">权限控制</text><text x="24" y="226">用量统计</text><text x="24" y="274">安全审计</text><text x="24" y="322">成本管理</text></g>
<g fill="#3b82f6"><rect x="168" y="67" width="20" height="20" rx="4"/><rect x="168" y="115" width="20" height="20" rx="4"/><rect x="168" y="163" width="20" height="20" rx="4"/><rect x="168" y="211" width="20" height="20" rx="4"/><rect x="168" y="259" width="20" height="20" rx="4"/><rect x="168" y="307" width="20" height="20" rx="4"/></g><path d="M24 356H190" stroke="#cbd5e1"/><text x="24" y="382" font-size="12" fill="#64748b">发布前测试</text><text x="24" y="402" font-size="12" fill="#64748b">运行中监控 · 异常可追溯</text></g>
</g>
<g transform="translate(48 548)"><text font-size="13" fill="#64748b">上线原则：</text><text x="72" font-size="13" font-weight="700" fill="#1e293b">先跑通一个最小业务闭环，再逐步扩展到更多部门和能力</text></g>
</g></svg>
