<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">WorkBuddy 读写析工作流</title><desc id="desc">三类职场任务从输入到验证的完整流程</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs>
<rect width="960" height="520" rx="10" fill="#f8fafc"/>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<text x="48" y="50" font-size="18" font-weight="700" fill="#1e293b">读、写、析：职场任务的三条主线</text><text x="48" y="76" font-size="13" fill="#64748b">每条工作流都要补上最后一步：验证，而不是把 AI 输出直接交付</text>
<g transform="translate(48 112)">
<rect width="864" height="104" rx="10" fill="#fff" stroke="#3b82f6"/><rect width="104" height="104" rx="10" fill="#3b82f6"/><text x="52" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">读</text>
<g text-anchor="middle"><text x="184" y="34" font-size="12" fill="#64748b">输入</text><text x="184" y="63" font-size="14" font-weight="700" fill="#1e293b">文档 / 文件夹</text><text x="360" y="34" font-size="12" fill="#64748b">选择读法</text><text x="360" y="63" font-size="14" font-weight="700" fill="#1e293b">速览 / 精读 / 定向</text><text x="552" y="34" font-size="12" fill="#64748b">结构化输出</text><text x="552" y="63" font-size="14" font-weight="700" fill="#1e293b">摘要 / 差异 / 来源</text><text x="754" y="34" font-size="12" fill="#64748b">人工验证</text><text x="754" y="63" font-size="14" font-weight="700" fill="#ef4444">数字 · 日期 · 人名</text></g>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><path d="M244 52H280"/><path d="M442 52H470"/><path d="M634 52H662"/></g>
<rect y="128" width="864" height="104" rx="10" fill="#fff" stroke="#10b981"/><rect y="128" width="104" height="104" rx="10" fill="#10b981"/><text x="52" y="190" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">写</text>
<g text-anchor="middle"><text x="184" y="162" font-size="12" fill="#64748b">输入</text><text x="184" y="191" font-size="14" font-weight="700" fill="#1e293b">已核实素材</text><text x="360" y="162" font-size="12" fill="#64748b">指定结构</text><text x="360" y="191" font-size="14" font-weight="700" fill="#1e293b">五要素 / 四模块</text><text x="552" y="162" font-size="12" fill="#64748b">一稿多用</text><text x="552" y="191" font-size="14" font-weight="700" fill="#1e293b">邮件 / 周报 / PPT</text><text x="754" y="162" font-size="12" fill="#64748b">人工验证</text><text x="754" y="191" font-size="14" font-weight="700" fill="#ef4444">口径 · 语气 · 授权</text></g>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><path d="M244 180H280"/><path d="M442 180H470"/><path d="M634 180H662"/></g>
<rect y="256" width="864" height="104" rx="10" fill="#fff" stroke="#475569"/><rect y="256" width="104" height="104" rx="10" fill="#475569"/><text x="52" y="318" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">析</text>
<g text-anchor="middle"><text x="184" y="290" font-size="12" fill="#64748b">输入</text><text x="184" y="319" font-size="14" font-weight="700" fill="#1e293b">明确口径的数据</text><text x="360" y="290" font-size="12" fill="#64748b">分析目标</text><text x="360" y="319" font-size="14" font-weight="700" fill="#1e293b">统计 / 分组 / 趋势</text><text x="552" y="290" font-size="12" fill="#64748b">表达结果</text><text x="552" y="319" font-size="14" font-weight="700" fill="#1e293b">结论 / 图表 / 异常</text><text x="754" y="290" font-size="12" fill="#64748b">人工验证</text><text x="754" y="319" font-size="14" font-weight="700" fill="#ef4444">来源 · 逻辑 · 场景</text></g>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><path d="M244 308H280"/><path d="M442 308H470"/><path d="M634 308H662"/></g>
</g></g></svg>
