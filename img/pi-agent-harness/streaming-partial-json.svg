<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="流式 tool call 参数解析与截断防御" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="620" rx="10" fill="#f8fafc"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">流式 tool call 参数解析：partial-json 增量解析</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">所有 provider 适配器共用同一策略：累积 partialJson → parseStreamingJson → 增量更新 arguments</text>

  <text x="195" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">① provider 事件流</text>
  <text x="495" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">② partialJson 累积缓冲</text>
  <text x="795" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">③ arguments 增量更新</text>

  <rect x="60" y="96" width="270" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="76" y="122" font-size="12" font-weight="700" fill="#1e3a8a">toolcall_start</text>
  <text x="76" y="142" font-size="10.5" fill="#475569">收到首个参数片段</text>
  <rect x="360" y="96" width="270" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="376" y="122" font-size="10.5" fill="#1e3a8a">partialJson = '{ "name": "pi"'</text>
  <text x="376" y="142" font-size="10.5" fill="#475569">缓冲开始累积</text>
  <rect x="660" y="96" width="270" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="676" y="122" font-size="11" fill="#1e293b">arguments = &#123; &#125;</text>
  <text x="676" y="142" font-size="10.5" fill="#475569">尚无法解析出完整字段</text>

  <rect x="60" y="172" width="270" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="76" y="198" font-size="12" font-weight="700" fill="#1e3a8a">toolcall_delta</text>
  <text x="76" y="218" font-size="10.5" fill="#475569">+ '"repo": "earendil-works",'</text>
  <rect x="360" y="172" width="270" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="376" y="198" font-size="10.5" fill="#1e3a8a">partialJson += delta</text>
  <text x="376" y="218" font-size="10.5" fill="#475569">'&#123; "name": "pi", "repo": "earen…'</text>
  <rect x="660" y="172" width="270" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="676" y="198" font-size="11" fill="#1e293b">arguments = &#123; name: "pi" &#125;</text>
  <text x="676" y="218" font-size="10.5" fill="#475569">增量解析：已能读到首个字段</text>

  <rect x="60" y="248" width="270" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="76" y="274" font-size="12" font-weight="700" fill="#1e3a8a">toolcall_delta</text>
  <text x="76" y="294" font-size="10.5" fill="#475569">+ '"mode": "tui" &#125;'</text>
  <rect x="360" y="248" width="270" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="376" y="274" font-size="10.5" fill="#1e3a8a">完整 JSON 就绪</text>
  <text x="376" y="294" font-size="10.5" fill="#475569">'&#123; "name": "pi", "repo": "earendil-works", "mode": "tui" &#125;'</text>
  <rect x="660" y="248" width="270" height="60" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2"/>
  <text x="676" y="274" font-size="11" fill="#166534">arguments = &#123; name, repo, mode &#125;</text>
  <text x="676" y="294" font-size="10.5" fill="#475569">字段逐步补全</text>

  <rect x="60" y="324" width="270" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="76" y="350" font-size="12" font-weight="700" fill="#1e3a8a">toolcall_end</text>
  <text x="76" y="370" font-size="10.5" fill="#475569">清理 scratch 缓冲</text>
  <rect x="360" y="324" width="270" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="376" y="350" font-size="10.5" fill="#1e293b">删除 partialJson（不落库）</text>
  <text x="376" y="370" font-size="10.5" fill="#475569">回放只携带已解析 arguments</text>
  <rect x="660" y="324" width="270" height="60" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2"/>
  <text x="676" y="350" font-size="11" fill="#166534">进入工具执行</text>
  <text x="676" y="370" font-size="10.5" fill="#475569">validateToolArguments 校验</text>

  <g stroke="#94a3b8" stroke-width="1.2" fill="none">
    <path d="M330,126 L356,126" marker-end="url(#arr)"/>
    <path d="M630,126 L656,126" marker-end="url(#arr)"/>
    <path d="M330,202 L356,202" marker-end="url(#arr)"/>
    <path d="M630,202 L656,202" marker-end="url(#arr)"/>
    <path d="M330,278 L356,278" marker-end="url(#arr)"/>
    <path d="M630,278 L656,278" marker-end="url(#arr)"/>
    <path d="M330,354 L356,354" marker-end="url(#arr)"/>
    <path d="M630,354 L656,354" marker-end="url(#arr)"/>
  </g>

  <path d="M40,96 L40,384" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="28" y="240" transform="rotate(-90 28 240)" text-anchor="middle" font-size="11" fill="#94a3b8">时间 →</text>

  <rect x="60" y="420" width="870" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="452" font-size="13" font-weight="700" fill="#92400e">④ 截断防御：length 型停止的兜底</text>
  <text x="90" y="478" font-size="11" fill="#78350f">当 stopReason == "length"（输出被 token 上限截断），流式参数虽已解析、校验甚至通过，但内容可能是"静默不完整"的。</text>
  <text x="90" y="500" font-size="11" fill="#78350f">failToolCallsFromTruncatedMessage 会拒绝执行本批所有工具调用，回灌错误信息，让模型重新发出完整参数。</text>
  <text x="90" y="522" font-size="11" fill="#78350f">关键源码：packages/ai/src/api/anthropic-messages.ts（L654-660）、packages/agent/src/agent-loop.ts（L381-406）</text>
</svg>
