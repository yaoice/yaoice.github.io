<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="包依赖 DAG" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="620" rx="10" fill="#f8fafc"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">包依赖 DAG：四层单向依赖，无环</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">箭头 = "依赖方向"（指向被依赖包）；基础层不依赖任何内部包，应用层只依赖下方层级</text>

  <!-- 层标签 -->
  <g font-size="11" font-weight="700" fill="#94a3b8">
    <text x="18" y="96">应用层</text>
    <text x="18" y="226">运行时</text>
    <text x="18" y="356">抽象层</text>
    <text x="18" y="486">基础层</text>
  </g>

  <!-- 箭头（依赖方 → 被依赖方） -->
  <g stroke="#94a3b8" stroke-width="1.2" fill="none">
    <!-- coding-agent → 下层 -->
    <path d="M420,114 C400,140 330,170 278,200" marker-end="url(#arr)"/>
    <path d="M430,114 C410,180 260,250 210,330" marker-end="url(#arr)"/>
    <path d="M480,114 L480,326" marker-end="url(#arr)"/>
    <path d="M500,114 C520,200 525,330 518,460" marker-end="url(#arr)"/>
    <path d="M540,114 C600,220 700,340 808,460" marker-end="url(#arr)"/>
    <!-- agent → 下层 -->
    <path d="M225,244 C210,270 200,300 190,330" marker-end="url(#arr)"/>
    <path d="M250,244 C250,300 210,380 178,460" marker-end="url(#arr)"/>
    <!-- sqlite-node → agent / ai -->
    <path d="M650,244 C590,270 430,290 350,262" marker-end="url(#arr)"/>
    <path d="M640,244 C580,280 300,290 210,330" marker-end="url(#arr)"/>
    <!-- server → ai / protocol -->
    <path d="M740,374 C680,395 420,395 282,370" marker-end="url(#arr)"/>
    <path d="M760,374 C755,400 620,430 560,460" marker-end="url(#arr)"/>
    <!-- client → protocol -->
    <path d="M500,374 C510,400 515,430 516,460" marker-end="url(#arr)"/>
  </g>

  <!-- 层3：coding-agent -->
  <rect x="380" y="70" width="200" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">pi-coding-agent</text>
  <text x="480" y="106" text-anchor="middle" font-size="10" fill="#475569">CLI · 内置工具 · 扩展系统</text>

  <!-- 层2 -->
  <rect x="150" y="200" width="200" height="44" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="250" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">pi-agent-core</text>
  <text x="250" y="236" text-anchor="middle" font-size="10" fill="#475569">工具调用循环 · 状态管理</text>

  <rect x="600" y="200" width="200" height="44" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="700" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">pi-session-backend</text>
  <text x="700" y="236" text-anchor="middle" font-size="10" fill="#475569">sqlite-node 会话持久化</text>

  <!-- 层1 -->
  <rect x="80" y="330" width="200" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">pi-ai</text>
  <text x="180" y="366" text-anchor="middle" font-size="10" fill="#475569">统一 LLM API · 40+ Provider</text>

  <rect x="380" y="330" width="200" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">pi-client</text>
  <text x="480" y="366" text-anchor="middle" font-size="10" fill="#475569">远端会话 · 传输中立</text>

  <rect x="660" y="330" width="200" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="760" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">pi-server</text>
  <text x="760" y="366" text-anchor="middle" font-size="10" fill="#475569">远端服务端 · 实验性</text>

  <!-- 层0 -->
  <rect x="50" y="460" width="200" height="44" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="150" y="481" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">pi-telemetry</text>
  <text x="150" y="496" text-anchor="middle" font-size="10" fill="#475569">厂商中立遥测契约</text>

  <rect x="420" y="460" width="200" height="44" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="520" y="481" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">pi-protocol</text>
  <text x="520" y="496" text-anchor="middle" font-size="10" fill="#475569">CBOR 编解码 + 帧封装</text>

  <rect x="730" y="460" width="200" height="44" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="830" y="481" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">pi-tui</text>
  <text x="830" y="496" text-anchor="middle" font-size="10" fill="#475569">差分渲染终端 UI</text>

  <text x="480" y="586" text-anchor="middle" font-size="11" fill="#94a3b8">全部依赖共 13 条边：coding-agent→{agent, ai, client, protocol, tui}，sqlite-node→{agent, ai}，agent→{ai, telemetry}</text>
  <text x="480" y="606" text-anchor="middle" font-size="11" fill="#94a3b8">server→{ai, protocol}，client→protocol，ai→telemetry；无环 → 可按依赖序安全构建</text>
</svg>
