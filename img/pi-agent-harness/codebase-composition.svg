<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="代码库文件类型构成" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect width="960" height="600" rx="10" fill="#f8fafc"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">代码库文件构成：一个"纯 TypeScript 工程"</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">共 1388 个文件（排除 node_modules / dist）；TypeScript 占据绝对主导，其余为文档与配置</text>

  <!-- 环形图中心 (330, 330)，外径 190 内径 115 -->
  <!-- TS 1121 (80.8%) 0~290.7° -->
  <path d="M330 140 A 190 190 0 1 1 152.3 262.9 L 217.7 287.6 A 115 115 0 1 0 330 215 Z" fill="#3b82f6"/>
  <!-- md 99 (7.1%) 290.7~316.4° -->
  <path d="M152.3 262.9 A 190 190 0 0 1 199.0 192.4 L 247.2 243.1 A 115 115 0 0 0 217.7 287.6 Z" fill="#8b5cf6"/>
  <!-- json 47 (3.4%) 316.4~328.6° -->
  <path d="M199.0 192.4 A 190 190 0 0 1 231.1 167.8 L 267.5 227.5 A 115 115 0 0 0 247.2 243.1 Z" fill="#f59e0b"/>
  <!-- mjs 28 (2.0%) 328.6~335.9° -->
  <path d="M231.1 167.8 A 190 190 0 0 1 252.4 156.5 L 281.0 220.5 A 115 115 0 0 0 267.5 227.5 Z" fill="#10b981"/>
  <!-- 其他 93 (6.7%) 335.9~360° -->
  <path d="M252.4 156.5 A 190 190 0 0 1 330 140 L 330 215 A 115 115 0 0 0 281.0 220.5 Z" fill="#94a3b8"/>

  <text x="330" y="318" text-anchor="middle" font-size="22" font-weight="800" fill="#1e293b">1388</text>
  <text x="330" y="342" text-anchor="middle" font-size="12" fill="#64748b">文件总数</text>
  <text x="330" y="364" text-anchor="middle" font-size="11" fill="#94a3b8">含源码 / 测试 / 文档</text>

  <!-- 图例 -->
  <g font-size="13">
    <rect x="600" y="140" width="16" height="16" rx="3" fill="#3b82f6"/>
    <text x="628" y="154" font-weight="700" fill="#1e293b">TypeScript .ts</text>
    <text x="820" y="154" text-anchor="end" font-weight="700" fill="#1e293b">1121</text>
    <text x="880" y="154" text-anchor="end" font-size="11" fill="#64748b">80.8%</text>

    <rect x="600" y="192" width="16" height="16" rx="3" fill="#8b5cf6"/>
    <text x="628" y="206" font-weight="700" fill="#1e293b">Markdown .md</text>
    <text x="820" y="206" text-anchor="end" font-weight="700" fill="#1e293b">99</text>
    <text x="880" y="206" text-anchor="end" font-size="11" fill="#64748b">7.1%</text>

    <rect x="600" y="244" width="16" height="16" rx="3" fill="#f59e0b"/>
    <text x="628" y="258" font-weight="700" fill="#1e293b">JSON .json</text>
    <text x="820" y="258" text-anchor="end" font-weight="700" fill="#1e293b">47</text>
    <text x="880" y="258" text-anchor="end" font-size="11" fill="#64748b">3.4%</text>

    <rect x="600" y="296" width="16" height="16" rx="3" fill="#10b981"/>
    <text x="628" y="310" font-weight="700" fill="#1e293b">ESM 脚本 .mjs</text>
    <text x="820" y="310" text-anchor="end" font-weight="700" fill="#1e293b">28</text>
    <text x="880" y="310" text-anchor="end" font-size="11" fill="#64748b">2.0%</text>

    <rect x="600" y="348" width="16" height="16" rx="3" fill="#94a3b8"/>
    <text x="628" y="362" font-weight="700" fill="#1e293b">其他（yml/sh/js/c/png…）</text>
    <text x="820" y="362" text-anchor="end" font-weight="700" fill="#1e293b">93</text>
    <text x="880" y="362" text-anchor="end" font-size="11" fill="#64748b">6.7%</text>
  </g>

  <text x="600" y="420" font-size="12" font-weight="700" fill="#1e293b">解读</text>
  <text x="600" y="442" font-size="11.5" fill="#475569">① 全栈单语言：模型层、Agent 层、CLI、TUI 全部用 TS 实现，</text>
  <text x="600" y="460" font-size="11.5" fill="#475569">    类型在包边界间全程可检查；</text>
  <text x="600" y="480" font-size="11.5" fill="#475569">② 99 个 .md 文档：每个包自带 README / CHANGELOG，</text>
  <text x="600" y="498" font-size="11.5" fill="#475569">    编码 Agent 也依赖 AGENTS.md 等作为上下文；</text>
  <text x="600" y="518" font-size="11.5" fill="#475569">③ 47 个 JSON：package.json × 9 包 + 主题 / 配置 / 测试数据。</text>
</svg>
