<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="TUI 差分渲染机制">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="620" rx="10" fill="#f8fafc"/>

  <text x="480" y="30" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e293b">TUI 差分渲染：只重写变化的单元格</text>
  <text x="480" y="50" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#64748b">维护终端缓冲副本，逐行比较新旧 buffer，把差异转换为最小 ANSI 序列（tui-main-screen.ts）</text>

  <!-- 旧缓冲 -->
  <rect x="70" y="92" width="380" height="268" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="90" y="118" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#1e293b">旧缓冲 previousLines</text>
  <text x="90" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#475569">┌ pi session ─────────────┐</text>
  <text x="90" y="178" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#475569">▶ read src/a.ts</text>
  <text x="90" y="206" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#475569">├ ✓ file read ok ──────────┤</text>
  <rect x="78" y="216" width="364" height="26" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="90" y="234" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#92400e">▶ bash make test</text>
  <text x="90" y="270" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#475569">└ ─────────────────────────┘</text>
  <text x="90" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#94a3b8">第 4 行内容不同（bash → edit）</text>

  <!-- 新缓冲 -->
  <rect x="510" y="92" width="380" height="268" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="530" y="118" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#1e293b">新缓冲 newLines</text>
  <text x="530" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#475569">┌ pi session ─────────────┐</text>
  <text x="530" y="178" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#475569">▶ read src/a.ts</text>
  <text x="530" y="206" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#475569">├ ✓ file read ok ──────────┤</text>
  <rect x="518" y="216" width="364" height="26" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="530" y="234" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#92400e">▶ edit src/a.ts</text>
  <text x="530" y="270" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12.5" fill="#475569">└ ─────────────────────────┘</text>
  <text x="530" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#94a3b8">其余行完全一致，无需重绘</text>

  <!-- 比较箭头 -->
  <path d="M455,226 L506,226" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="480" y="216" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">逐行</text>
  <text x="480" y="262" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">diff</text>

  <!-- 差分输出 -->
  <rect x="70" y="392" width="820" height="150" rx="10" fill="#0f172a"/>
  <text x="90" y="418" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">差分输出：只对变化区域发射 ANSI 序列</text>
  <text x="90" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#7dd3fc">\x1b[?2026h        ← 同步输出开始（防撕裂）</text>
  <text x="90" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#7dd3fc">\x1b[4A           ← 光标上移到变化区首行</text>
  <text x="90" y="494" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#7dd3fc">\x1b[2K  ▶ edit src/a.ts   ← 清行 + 写入新内容</text>
  <text x="90" y="518" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#7dd3fc">\x1b[?2026l        ← 同步输出结束</text>

  <text x="480" y="586" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#94a3b8">触发全量重绘（fullRender）的场景：终端宽度 / 高度变化，或首个变化行位于上次视口上方（firstChanged &lt; viewportTop）</text>
</svg>
