<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-label="Agent 工具调用主循环 runLoop">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <filter id="keyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="680" rx="10" fill="#f8fafc"/>

  <text x="480" y="30" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e293b">Agent 工具调用主循环（runLoop）</text>
  <text x="480" y="50" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#64748b">双层循环：内层处理 tool call，外层承接 follow-up 消息；出错或满足停止条件即退出</text>

  <!-- ① 注入 -->
  <rect x="350" y="70" width="260" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="96" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e293b">① 注入 pending 消息</text>
  <text x="480" y="116" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">steering / follow-up</text>

  <!-- ② LLM 流式调用 -->
  <rect x="350" y="210" width="260" height="96" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#keyShadow)"/>
  <text x="480" y="242" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">② LLM 流式调用</text>
  <text x="480" y="263" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#3b82f6">streamAssistantResponse</text>
  <text x="480" y="284" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#475569">AgentMessage → Message 转换 · 流式事件</text>

  <!-- ③ 解析 -->
  <rect x="690" y="70" width="230" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="805" y="96" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e293b">③ 解析 toolCall</text>
  <text x="805" y="116" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">类型过滤 · 参数校验</text>

  <!-- ④ 截断防御 -->
  <rect x="690" y="250" width="230" height="70" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="805" y="280" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e">④ 截断防御</text>
  <text x="805" y="300" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#92400e">stopReason==length →</text>
  <text x="805" y="316" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#92400e">全部判失败并回灌错误</text>

  <!-- ⑤ 执行工具 -->
  <rect x="690" y="470" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="805" y="500" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#166534">⑤ 执行工具</text>
  <text x="805" y="522" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#166534">顺序 / 并行 · before/after</text>
  <text x="805" y="540" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#166534">钩子 · 可整批 terminate</text>

  <!-- ⑥ 回灌 -->
  <rect x="40" y="470" width="260" height="80" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="170" y="500" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#5b21b6">⑥ 回灌 tool_result</text>
  <text x="170" y="522" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#6d28d9">写入 context / newMessages</text>
  <text x="170" y="540" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#6d28d9">并 emit 消息事件</text>

  <!-- ⑦ agent_end -->
  <rect x="350" y="580" width="260" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="607" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#475569">agent_end（本轮运行结束）</text>

  <!-- 主循环箭头 -->
  <g stroke="#64748b" stroke-width="1.4" fill="none">
    <path d="M480,130 L480,206" marker-end="url(#arr)"/>
    <path d="M610,252 L650,252 L650,100 L686,100" marker-end="url(#arr)"/>
    <path d="M750,130 L750,246" marker-end="url(#arr)"/>
    <path d="M770,320 L770,466" marker-end="url(#arr)"/>
    <path d="M690,510 L308,510" marker-end="url(#arr)"/>
    <path d="M170,470 L170,240 L342,240" marker-end="url(#arr)"/>
  </g>

  <!-- ③→⑤ 正常路径（右槽位） -->
  <path d="M850,130 L935,130 L935,510 L924,510" stroke="#10b981" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="947" y="330" transform="rotate(90 947 330)" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#10b981">正常路径（未截断）</text>

  <!-- ② 异常退出 -->
  <path d="M610,235 L655,235 L655,585 L614,585" stroke="#ef4444" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
  <text x="668" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#ef4444">error / aborted</text>
  <text x="668" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="10.5" fill="#ef4444">→ 终止</text>

  <!-- 外层循环 -->
  <path d="M350,602 L340,602 L340,100 L346,100" stroke="#8b5cf6" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="264" y="430" transform="rotate(-90 264 430)" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#8b5cf6">有 follow-up → 外层循环</text>

  <text x="480" y="658" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#94a3b8">无 toolCall 时检查 shouldStopAfterTurn：为真 → agent_end；否则取 follow-up 消息进入外层循环</text>
</svg>
