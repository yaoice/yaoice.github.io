<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Agent 事件流时间线" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="500" rx="10" fill="#f8fafc"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">一次 Agent 运行的事件流时间线</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">事件由 runLoop 顺序发射，UI / 遥测 / 远程 RPC 共同订阅同一份事件流（agent-loop.ts）</text>

  <!-- 主轴线 -->
  <line x1="55" y1="260" x2="865" y2="260" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 节点（x 从 70 起，间距 95） -->
  <g>
    <!-- 1 agent_start -->
    <circle cx="70" cy="260" r="13" fill="#475569"/>
    <text x="70" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">agent_start</text>
    <text x="70" y="294" text-anchor="middle" font-size="10" fill="#475569">运行开始</text>
    <text x="70" y="310" text-anchor="middle" font-size="10" fill="#475569">首个事件</text>

    <!-- 2 turn_start -->
    <circle cx="165" cy="260" r="13" fill="#475569"/>
    <text x="165" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">turn_start</text>
    <text x="165" y="294" text-anchor="middle" font-size="10" fill="#475569">新一轮开始</text>
    <text x="165" y="310" text-anchor="middle" font-size="10" fill="#475569">多轮时重复</text>

    <!-- 3 user message -->
    <circle cx="260" cy="260" r="13" fill="#3b82f6"/>
    <text x="260" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">user message</text>
    <text x="260" y="294" text-anchor="middle" font-size="10" fill="#475569">用户消息 / steering</text>
    <text x="260" y="310" text-anchor="middle" font-size="10" fill="#475569">注入上下文</text>

    <!-- 4 assistant stream -->
    <circle cx="355" cy="260" r="13" fill="#3b82f6"/>
    <text x="355" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">assistant stream</text>
    <text x="355" y="294" text-anchor="middle" font-size="10" fill="#475569">打字机式 delta 更新</text>
    <text x="355" y="310" text-anchor="middle" font-size="10" fill="#475569">message_update ×N</text>

    <!-- 5 parse toolCall -->
    <circle cx="450" cy="260" r="13" fill="#3b82f6"/>
    <text x="450" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">parse toolCall</text>
    <text x="450" y="294" text-anchor="middle" font-size="10" fill="#475569">过滤 + 参数校验</text>
    <text x="450" y="310" text-anchor="middle" font-size="10" fill="#475569">length 型截断防御</text>

    <!-- 6 execute tools -->
    <circle cx="545" cy="260" r="13" fill="#10b981"/>
    <text x="545" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">execute tools</text>
    <text x="545" y="294" text-anchor="middle" font-size="10" fill="#475569">顺序 / 并行</text>
    <text x="545" y="310" text-anchor="middle" font-size="10" fill="#475569">before / after 钩子</text>

    <!-- 7 toolResult -->
    <circle cx="640" cy="260" r="13" fill="#10b981"/>
    <text x="640" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">toolResult</text>
    <text x="640" y="294" text-anchor="middle" font-size="10" fill="#475569">结果回灌上下文</text>
    <text x="640" y="310" text-anchor="middle" font-size="10" fill="#475569">进入下一轮循环</text>

    <!-- 8 turn_end -->
    <circle cx="735" cy="260" r="13" fill="#8b5cf6"/>
    <text x="735" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">turn_end</text>
    <text x="735" y="294" text-anchor="middle" font-size="10" fill="#475569">检查 shouldStop</text>
    <text x="735" y="310" text-anchor="middle" font-size="10" fill="#475569">取 steering / follow-up</text>

    <!-- 9 agent_end -->
    <circle cx="830" cy="260" r="13" fill="#8b5cf6"/>
    <text x="830" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">agent_end</text>
    <text x="830" y="294" text-anchor="middle" font-size="10" fill="#475569">事件流终止</text>
    <text x="830" y="310" text-anchor="middle" font-size="10" fill="#475569">返回消息数组</text>
  </g>

  <!-- 节点间箭头 -->
  <g stroke="#94a3b8" stroke-width="1.2" fill="none">
    <line x1="83" y1="260" x2="152" y2="260" marker-end="url(#arr)"/>
    <line x1="178" y1="260" x2="247" y2="260" marker-end="url(#arr)"/>
    <line x1="273" y1="260" x2="342" y2="260" marker-end="url(#arr)"/>
    <line x1="368" y1="260" x2="437" y2="260" marker-end="url(#arr)"/>
    <line x1="463" y1="260" x2="532" y2="260" marker-end="url(#arr)"/>
    <line x1="558" y1="260" x2="627" y2="260" marker-end="url(#arr)"/>
    <line x1="653" y1="260" x2="722" y2="260" marker-end="url(#arr)"/>
    <line x1="748" y1="260" x2="817" y2="260" marker-end="url(#arr)"/>
  </g>

  <!-- 阶段色带 -->
  <g font-size="11" font-weight="700">
    <rect x="55" y="370" width="158" height="34" rx="6" fill="#e2e8f0"/>
    <text x="134" y="391" text-anchor="middle" fill="#475569">① 准备</text>

    <rect x="213" y="370" width="285" height="34" rx="6" fill="#eff6ff"/>
    <text x="355" y="391" text-anchor="middle" fill="#1d4ed8">② 生成（LLM 流式 + 解析）</text>

    <rect x="498" y="370" width="190" height="34" rx="6" fill="#f0fdf4"/>
    <text x="593" y="391" text-anchor="middle" fill="#15803d">③ 执行（工具调用）</text>

    <rect x="688" y="370" width="178" height="34" rx="6" fill="#faf5ff"/>
    <text x="777" y="391" text-anchor="middle" fill="#6d28d9">④ 收尾</text>
  </g>

  <text x="480" y="440" text-anchor="middle" font-size="11" fill="#94a3b8">一个"turn" = 一次 LLM 调用 + 其触发的工具执行；直到 shouldStopAfterTurn 通过或没有 follow-up 消息才终止整个 agent</text>
</svg>
