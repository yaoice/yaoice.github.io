    <text x="813" y="111" font-size="12" font-weight="700" fill="#1d4ed8">199</text>

    <text x="238" y="159" text-anchor="end" font-size="12.5" font-weight="700" fill="#1e293b">ai</text>
    <rect x="250" y="146" width="487" height="26" rx="4" fill="#1d4ed8"/>
    <text x="743" y="163" font-size="12" font-weight="700" fill="#1d4ed8">174</text>

    <text x="238" y="211" text-anchor="end" font-size="12.5" font-weight="700" fill="#1e293b">agent</text>
    <rect x="250" y="198" width="137" height="26" rx="4" fill="#3b82f6"/>
    <text x="393" y="215" font-size="12" font-weight="700" fill="#3b82f6">49</text>

    <text x="238" y="263" text-anchor="end" font-size="12.5" font-weight="700" fill="#1e293b">tui</text>
