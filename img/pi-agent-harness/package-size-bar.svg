<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="各包 TypeScript 源码规模" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect width="960" height="600" rx="10" fill="#f8fafc"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">各包 TypeScript 源码规模（src/ 下 .ts 文件数）</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">数据来自 monorepo 各包 src/ 目录；编码 Agent 与模型抽象层占了 ~80% 的源码体量</text>

  <!-- 刻度线 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="250" y1="82" x2="250" y2="552"/>
    <line x1="390" y1="82" x2="390" y2="552" stroke-dasharray="3 4"/>
    <line x1="530" y1="82" x2="530" y2="552" stroke-dasharray="3 4"/>
    <line x1="670" y1="82" x2="670" y2="552" stroke-dasharray="3 4"/>
