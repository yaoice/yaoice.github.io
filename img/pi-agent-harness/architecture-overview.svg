<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-label="Pi Agent Harness 整体架构与包依赖">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="660" rx="10" fill="#f8fafc"/>

  <text x="480" y="30" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#1e293b">Pi Agent Harness 整体架构：五层包依赖</text>
  <text x="480" y="50" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#64748b">依赖自底向上（箭头 = 被依赖方向），每层只依赖下方层级；完整依赖集见正文表格</text>

  <!-- 应用层 -->
  <rect x="20" y="92" width="920" height="86" rx="10" fill="#f1f5f9"/>
  <text x="38" y="116" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#64748b">应用层</text>
  <rect x="230" y="126" width="500" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="145" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">pi-coding-agent（CLI / TUI 入口）</text>
  <text x="480" y="162" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">内置工具 · 会话管理 · 扩展系统 · 交互模式</text>

  <!-- 协议与持久化层 -->
  <rect x="20" y="192" width="920" height="86" rx="10" fill="#f8fafc"/>
  <text x="38" y="216" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#64748b">协议与持久化层</text>
  <rect x="120" y="226" width="230" height="42" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="235" y="245" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#5b21b6">pi-session-backend-sqlite</text>
  <text x="235" y="262" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#6d28d9">node:sqlite 会话持久化</text>
  <rect x="395" y="226" width="230" height="42" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="510" y="245" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#5b21b6">pi-client</text>
  <text x="510" y="262" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#6d28d9">远端会话传输中立客户端</text>
  <rect x="670" y="226" width="230" height="42" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="785" y="245" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#5b21b6">pi-server（实验性）</text>
  <text x="785" y="262" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#6d28d9">远端会话服务端</text>

  <!-- 运行时层 -->
  <rect x="20" y="292" width="920" height="86" rx="10" fill="#f1f5f9"/>
  <text x="38" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#64748b">Agent 运行时层</text>
  <rect x="230" y="326" width="500" height="42" rx="8" fill="#eef2ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="480" y="345" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#4338ca">pi-agent-core（Agent 运行时）</text>
  <text x="480" y="362" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">工具调用循环 · 状态管理 · transport 抽象 · attachments</text>

  <!-- 模型抽象层 -->
  <rect x="20" y="392" width="920" height="86" rx="10" fill="#f8fafc"/>
  <text x="38" y="416" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#64748b">模型抽象层</text>
  <rect x="230" y="426" width="500" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="445" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">pi-ai（统一多厂商 LLM API）</text>
  <text x="480" y="462" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">Provider 适配器 · 模型发现 · OAuth · 流式解析</text>

  <!-- 基础层 -->
  <rect x="20" y="492" width="920" height="86" rx="10" fill="#f1f5f9"/>
  <text x="38" y="516" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" font-weight="700" fill="#64748b">基础层</text>
  <rect x="120" y="526" width="230" height="42" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="235" y="545" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e293b">pi-telemetry</text>
  <text x="235" y="562" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">厂商中立遥测契约</text>
  <rect x="395" y="526" width="230" height="42" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="510" y="545" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e293b">pi-tui</text>
  <text x="510" y="562" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">差分渲染终端 UI 库</text>
  <rect x="670" y="526" width="230" height="42" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="785" y="545" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e293b">pi-protocol</text>
  <text x="785" y="562" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#475569">CBOR 帧协议 + schema</text>

  <!-- 关键依赖箭头（从被依赖方指向依赖方，即自下而上） -->
  <g stroke="#94a3b8" stroke-width="1.2" fill="none">
    <!-- agent-core -> ai -->
    <path d="M480,426 L480,370" marker-end="url(#arr)"/>
    <!-- ai -> telemetry -->
    <path d="M235,526 L235,470" marker-end="url(#arr)"/>
    <!-- client -> protocol -->
    <path d="M670,547 L627,547" marker-end="url(#arr)"/>
    <!-- sqlite -> agent-core -->
    <path d="M235,226 L235,205 L300,205 L300,370" marker-end="url(#arr)"/>
    <!-- coding-agent -> agent-core -->
    <path d="M480,370 L480,172" marker-end="url(#arr)"/>
    <!-- coding-agent -> client -->
    <path d="M510,226 L510,185 L560,185 L560,172" marker-end="url(#arr)"/>
  </g>

  <text x="480" y="628" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#94a3b8">本图仅绘制每包的主依赖链；pi-agent-core→pi-telemetry、pi-server→pi-ai/pi-protocol、pi-coding-agent→pi-tui/pi-protocol 等边见正文</text>
  <text x="480" y="648" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" fill="#94a3b8">根构建顺序：tui → telemetry → ai → agent → sqlite-node → protocol → client → server → coding-agent</text>
</svg>
