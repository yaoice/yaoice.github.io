<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="680" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">纵深防御：从 OS 硬边界到智能审批</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">任何一层不确定，即拒绝并升级 —— 全链路 fail-closed</text>

  <!-- 第一层：三平台 OS 沙箱 -->
  <text x="24" y="104" font-size="12" fill="#475569" font-weight="600">OS 硬边界</text>
  <rect x="130" y="74" width="250" height="104" rx="10" fill="#fef2f2" stroke="#ef4444" filter="url(#s)"/>
  <text x="255" y="98" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">macOS · Seatbelt</text>
  <text x="255" y="120" text-anchor="middle" font-size="10" fill="#475569">/usr/bin/sandbox-exec + SBPL 策略</text>
  <text x="255" y="138" text-anchor="middle" font-size="10" fill="#475569">deny default 起步 · 动态拼接</text>
  <text x="255" y="156" text-anchor="middle" font-size="10" fill="#475569">可写根 / 只读白名单（仿 Chrome）</text>
  <rect x="398" y="74" width="250" height="104" rx="10" fill="#fef2f2" stroke="#ef4444" filter="url(#s)"/>
  <text x="523" y="98" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">Linux · bubblewrap + seccomp</text>
  <text x="523" y="120" text-anchor="middle" font-size="10" fill="#475569">user namespace 文件系统隔离</text>
  <text x="523" y="138" text-anchor="middle" font-size="10" fill="#475569">no_new_privs + seccomp 网络过滤</text>
  <text x="523" y="156" text-anchor="middle" font-size="10" fill="#475569">Landlock 为 legacy 回退 · netns 桥接</text>
  <rect x="666" y="74" width="250" height="104" rx="10" fill="#fef2f2" stroke="#ef4444" filter="url(#s)"/>
  <text x="791" y="98" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">Windows · 降权令牌</text>
  <text x="791" y="120" text-anchor="middle" font-size="10" fill="#475569">CreateRestrictedToken 专用沙箱用户</text>
  <text x="791" y="138" text-anchor="middle" font-size="10" fill="#475569">ACL / DACL 文件管控</text>
  <text x="791" y="156" text-anchor="middle" font-size="10" fill="#475569">WFP 过滤器阻断直连网络</text>
  <line x1="523" y1="180" x2="523" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ad)"/>

  <!-- 第二层：网络管控 -->
  <text x="24" y="252" font-size="12" fill="#475569" font-weight="600">网络管控</text>
  <rect x="130" y="208" width="786" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" filter="url(#s)"/>
  <text x="523" y="232" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">network-proxy：沙箱内只认环回代理</text>
  <text x="523" y="252" text-anchor="middle" font-size="10" fill="#475569">仅放行 127.0.0.1 上的 HTTP CONNECT / SOCKS5 · 注入 HTTP(S)_PROXY 环境变量强制走代理</text>
  <text x="523" y="270" text-anchor="middle" font-size="10" fill="#475569">域名白名单逐连接裁决（deny 优先）· 拦截非公网 IP · 可选 TLS MITM 凭据代理</text>
  <line x1="523" y1="286" x2="523" y2="310" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ad)"/>

  <!-- 第三层：决策矩阵 -->
  <text x="24" y="358" font-size="12" fill="#475569" font-weight="600">决策矩阵</text>
  <rect x="130" y="314" width="250" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="255" y="338" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">审批策略 AskForApproval</text>
  <text x="255" y="360" text-anchor="middle" font-size="10" fill="#475569">untrusted · 未信任项目逐条审批</text>
  <text x="255" y="376" text-anchor="middle" font-size="10" fill="#475569">on-request · 模型决定何时请求（默认）</text>
  <text x="255" y="392" text-anchor="middle" font-size="10" fill="#475569">never · 全自动 · granular · 细粒度</text>
  <rect x="398" y="314" width="250" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="523" y="338" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">沙箱模式 SandboxMode</text>
  <text x="523" y="360" text-anchor="middle" font-size="10" fill="#475569">read-only · 只读（默认）</text>
  <text x="523" y="376" text-anchor="middle" font-size="10" fill="#475569">workspace-write · 工作区可写</text>
  <text x="523" y="392" text-anchor="middle" font-size="10" fill="#475569">danger-full-access · 完全放开</text>
  <rect x="666" y="314" width="250" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="791" y="338" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">裁决输出</text>
  <text x="791" y="362" text-anchor="middle" font-size="11" fill="#10b981" font-weight="600">Allow · 沙箱兜底直接放行</text>
  <text x="791" y="382" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="600">Prompt · 升级到审批</text>
  <text x="791" y="402" text-anchor="middle" font-size="11" fill="#ef4444" font-weight="600">Forbidden · 危险命令拒绝</text>
  <text x="523" y="434" text-anchor="middle" font-size="10" fill="#94a3b8">规则：危险命令或无沙箱保护时，Never 也升级为 Forbidden</text>

  <!-- 第四层：规则引擎 + guardian -->
  <text x="24" y="490" font-size="12" fill="#475569" font-weight="600">智能增强</text>
  <rect x="130" y="450" width="386" height="110" rx="10" fill="#f5f3ff" stroke="#8b5cf6" filter="url(#s)"/>
  <text x="323" y="474" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">execpolicy · Starlark 规则引擎</text>
  <text x="323" y="496" text-anchor="middle" font-size="10" fill="#475569">prefix_rule(pattern, decision=allow/prompt/forbidden)</text>
  <text x="323" y="512" text-anchor="middle" font-size="10" fill="#475569">host_executable 锁定可执行文件绝对路径</text>
  <text x="323" y="528" text-anchor="middle" font-size="10" fill="#475569">match / not_match 示例即内置单测，加载期校验</text>
  <text x="323" y="546" text-anchor="middle" font-size="10" fill="#475569">策略文件：$CODEX_HOME/rules/*.rules</text>
  <rect x="540" y="450" width="376" height="110" rx="10" fill="#f5f3ff" stroke="#8b5cf6" filter="url(#s)"/>
  <text x="728" y="474" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">guardian · LLM 自动审批子代理</text>
  <text x="728" y="496" text-anchor="middle" font-size="10" fill="#475569">重建精简 transcript → 独立评审会话输出严格 JSON</text>
  <text x="728" y="512" text-anchor="middle" font-size="10" fill="#475569">风险等级 / 授权范围 / 结论 / 理由四元组</text>
  <text x="728" y="528" text-anchor="middle" font-size="10" fill="#475569">90s 超时或异常即 fail-closed，只采纳显式 allow/deny</text>
  <text x="728" y="546" text-anchor="middle" font-size="10" fill="#475569">同 turn 连续拒绝达阈值触发熔断中断</text>

  <text x="480" y="608" text-anchor="middle" font-size="11" fill="#94a3b8">四层递进：OS 沙箱划硬边界 → 环回代理管网络 → 策略矩阵定裁决 → 规则与 LLM 减少人工打扰</text>
  <text x="480" y="630" text-anchor="middle" font-size="11" fill="#94a3b8">设计取向：默认最小权限，自动化审批只在沙箱兜底成立时才被允许</text>
</svg>
