<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#10b981"/>
    </marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">一次 Turn 的完整生命周期：SQ / EQ 事件驱动循环</text>

  <!-- 顶部：前端与 Session 的双队列通信 -->
  <rect x="130" y="64" width="300" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="280" y="88" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">前端（TUI / exec / IDE / SDK）</text>
  <text x="280" y="106" text-anchor="middle" font-size="10" fill="#475569">提交 Op · 消费 Event</text>
  <rect x="630" y="64" width="220" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="740" y="88" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">codex-core Session</text>
  <text x="740" y="106" text-anchor="middle" font-size="10" fill="#475569">单任务运行 · 可被打断</text>
  <line x1="434" y1="80" x2="626" y2="80" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="530" y="72" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="600">提交队列 SQ（UserTurn / Interrupt）</text>
  <line x1="626" y1="104" x2="434" y2="104" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="530" y="122" text-anchor="middle" font-size="10" fill="#475569">事件队列 EQ（delta / item / 审批请求）</text>
  <line x1="740" y1="122" x2="740" y2="146" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>

  <!-- 流水线五步 -->
  <rect x="130" y="150" width="150" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="205" y="176" text-anchor="middle" font-size="12" fill="#3b82f6" font-weight="600">① 组装上下文</text>
  <text x="205" y="196" text-anchor="middle" font-size="10" fill="#475569">hooks · skills</text>
  <text x="205" y="212" text-anchor="middle" font-size="10" fill="#475569">AGENTS.md · 环境信息</text>
  <rect x="296" y="150" width="150" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="371" y="176" text-anchor="middle" font-size="12" fill="#3b82f6" font-weight="600">② 模型流式请求</text>
  <text x="371" y="196" text-anchor="middle" font-size="10" fill="#475569">Responses API</text>
  <text x="371" y="212" text-anchor="middle" font-size="10" fill="#475569">SSE 增量响应</text>
  <rect x="462" y="150" width="150" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="537" y="176" text-anchor="middle" font-size="12" fill="#3b82f6" font-weight="600">③ 解析响应项</text>
  <text x="537" y="196" text-anchor="middle" font-size="10" fill="#475569">delta 实时流出 EQ</text>
  <text x="537" y="212" text-anchor="middle" font-size="10" fill="#475569">识别 function_call</text>
  <rect x="628" y="150" width="150" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="703" y="176" text-anchor="middle" font-size="12" fill="#3b82f6" font-weight="600">④ 工具调用分发</text>
  <text x="703" y="196" text-anchor="middle" font-size="10" fill="#475569">Tool Router / Registry</text>
  <text x="703" y="212" text-anchor="middle" font-size="10" fill="#475569">支持并行执行</text>
  <rect x="794" y="150" width="150" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" filter="url(#s)"/>
  <text x="869" y="176" text-anchor="middle" font-size="12" fill="#f59e0b" font-weight="600">⑤ 审批闸门</text>
  <text x="869" y="196" text-anchor="middle" font-size="10" fill="#475569">策略矩阵裁决</text>
  <text x="869" y="212" text-anchor="middle" font-size="10" fill="#475569">用户 / guardian 审批</text>
  <line x1="280" y1="188" x2="294" y2="188" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="446" y1="188" x2="460" y2="188" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="612" y1="188" x2="626" y2="188" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="778" y1="188" x2="792" y2="188" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="869" y1="228" x2="869" y2="262" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#aa)"/>

  <!-- 沙箱执行 -->
  <rect x="130" y="266" width="640" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" filter="url(#s)"/>
  <text x="450" y="290" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">沙箱内执行工具</text>
  <text x="450" y="310" text-anchor="middle" font-size="10" fill="#475569">Seatbelt / bwrap+seccomp / RestrictedToken · 环回网络代理 + 域名白名单 · apply_patch 精确改文件</text>
  <path d="M 794 298 L 869 298" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#aa)"/>

  <!-- 回环 -->
  <path d="M 130 298 L 96 298 L 96 188 L 126 188" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <text x="88" y="250" text-anchor="middle" font-size="10" fill="#3b82f6" transform="rotate(-90 88 250)">回填工具结果 · 循环直到无工具调用</text>

  <!-- Turn 完成 -->
  <rect x="130" y="372" width="814" height="56" rx="10" fill="#ecfdf5" stroke="#10b981" filter="url(#s)"/>
  <text x="537" y="396" text-anchor="middle" font-size="13" fill="#10b981" font-weight="600">无工具调用 → Turn 完成</text>
  <text x="537" y="414" text-anchor="middle" font-size="10" fill="#475569">TurnCompleted 事件 · turn diff 汇总 · token 用量统计 · 全量落盘 rollout（可 resume）</text>
  <path d="M 450 330 L 450 368" stroke="#10b981" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- 约束注释 -->
  <rect x="130" y="462" width="814" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="537" y="486" text-anchor="middle" font-size="11" fill="#475569">Session 约束：同一时刻至多 1 个运行中任务 · Interrupt 可随时打断 · 用户输入可 Steering 改向当前任务</text>
  <text x="537" y="506" text-anchor="middle" font-size="11" fill="#475569">上下文治理：历史只增不改（缓存友好）· 注入片段有硬上限 · 逼近 token 上限触发 auto-compact 自动压缩</text>
</svg>
