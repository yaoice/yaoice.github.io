<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <style>
    .w{fill:#fff;stroke:#cbd5e1}
    .bl{fill:#eff6ff;stroke:#3b82f6}
    .pu{fill:#f5f3ff;stroke:#8b5cf6}
    .rd{fill:#fef2f2;stroke:#ef4444}
    .t{font-size:12px;fill:#1e293b;font-weight:600;text-anchor:middle}
    .s{font-size:10px;fill:#475569;text-anchor:middle}
    .l{font-size:12px;fill:#475569;font-weight:600}
  </style>
  <defs>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">Codex CLI 分层架构：一套 Rust 内核，多种前端形态</text>

  <text class="l" x="24" y="102">接入层</text>
  <rect class="bl" x="130" y="72" width="150" height="52" rx="10"/>
  <text class="t" x="205" y="93">TUI</text><text class="s" x="205" y="111">ratatui 终端交互</text>
  <rect class="bl" x="294" y="72" width="150" height="52" rx="10"/>
  <text class="t" x="369" y="93">exec</text><text class="s" x="369" y="111">非交互 · JSONL 事件流</text>
  <rect class="bl" x="458" y="72" width="150" height="52" rx="10"/>
  <text class="t" x="533" y="93">app-server</text><text class="s" x="533" y="111">JSON-RPC · IDE 集成</text>
  <rect class="bl" x="622" y="72" width="150" height="52" rx="10"/>
  <text class="t" x="697" y="93">MCP Server</text><text class="s" x="697" y="111">codex / codex-reply</text>
  <rect class="bl" x="786" y="72" width="150" height="52" rx="10"/>
  <text class="t" x="861" y="93">TS SDK</text><text class="s" x="861" y="111">Codex → Thread → Turn</text>
  <line x1="533" y1="126" x2="533" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="553" y1="148" x2="553" y2="126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <text class="l" x="24" y="186">协议层</text>
  <rect class="w" x="130" y="152" width="806" height="46" rx="10"/>
  <text x="533" y="180" text-anchor="middle" font-size="13" fill="#1e293b"><tspan font-weight="600">codex-protocol</tspan>　Op 提交队列（SQ）⇄ Event 事件队列（EQ）　·　Thread / Turn / Item</text>
  <line x1="533" y1="200" x2="533" y2="224" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="553" y1="224" x2="553" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <text class="l" x="24" y="278">核心层</text>
  <rect class="bl" filter="url(#f)" x="130" y="228" width="560" height="78" rx="10" stroke-width="1.5"/>
  <text class="t" x="410" y="252" font-size="13px">codex-core（Session：同一时刻至多 1 个运行中任务）</text>
  <text class="s" x="410" y="272">Turn Loop · Tool Router / Registry · Context 注入与自动压缩</text>
  <text class="s" x="410" y="290">Hooks 运行时 · MCP 管理器 · 多 Agent 编排</text>
  <rect class="pu" filter="url(#f)" x="716" y="228" width="220" height="78" rx="10" stroke-dasharray="6 4"/>
  <text class="t" x="826" y="258" font-size="13px">OpenAI Responses API</text>
  <text class="s" x="826" y="278">SSE 流式响应 · 工具调用</text>
  <line x1="690" y1="260" x2="712" y2="260" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="712" y1="274" x2="690" y2="274" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="410" y1="308" x2="410" y2="330" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <text class="l" x="24" y="372">能力层</text>
  <rect class="pu" x="130" y="336" width="126" height="52" rx="10"/>
  <text class="t" x="193" y="358">apply-patch</text><text class="s" x="193" y="374">V4A 补丁 · 流式解析</text>
  <rect class="pu" x="266" y="336" width="126" height="52" rx="10"/>
  <text class="t" x="329" y="358">skills</text><text class="s" x="329" y="374">SKILL.md · 渐进披露</text>
  <rect class="pu" x="402" y="336" width="126" height="52" rx="10"/>
  <text class="t" x="465" y="358">hooks</text><text class="s" x="465" y="374">11 个生命周期事件</text>
  <rect class="pu" x="538" y="336" width="126" height="52" rx="10"/>
  <text class="t" x="601" y="358">plugins</text><text class="s" x="601" y="374">内置扩展机制</text>
  <rect class="pu" x="674" y="336" width="126" height="52" rx="10"/>
  <text class="t" x="737" y="358">MCP 客户端</text><text class="s" x="737" y="374">rmcp · 外部工具接入</text>
  <rect class="pu" x="810" y="336" width="126" height="52" rx="10"/>
  <text class="t" x="873" y="358">code-mode</text><text class="s" x="873" y="374">内嵌 V8 跑 TS 工具</text>
  <line x1="410" y1="390" x2="410" y2="414" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <text class="l" x="24" y="466">安全层</text>
  <rect class="rd" x="130" y="420" width="192" height="64" rx="10"/>
  <text class="t" x="226" y="444">OS 沙箱</text>
  <text class="s" x="226" y="462">Seatbelt · bwrap+seccomp</text>
  <text class="s" x="226" y="476">RestrictedToken+WFP</text>
  <rect class="rd" x="334" y="420" width="192" height="64" rx="10"/>
  <text class="t" x="430" y="444">network-proxy</text>
  <text class="s" x="430" y="462">环回代理 · 域名白名单</text>
  <text class="s" x="430" y="476">逐连接裁决</text>
  <rect class="rd" x="538" y="420" width="192" height="64" rx="10"/>
  <text class="t" x="634" y="444">execpolicy</text>
  <text class="s" x="634" y="462">Starlark 规则引擎</text>
  <text class="s" x="634" y="476">allow / prompt / forbidden</text>
  <rect class="rd" x="742" y="420" width="192" height="64" rx="10"/>
  <text class="t" x="838" y="444">guardian</text>
  <text class="s" x="838" y="462">LLM 自动审批子代理</text>
  <text class="s" x="838" y="476">超时 fail-closed</text>
  <line x1="410" y1="486" x2="410" y2="510" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <text class="l" x="24" y="562">基础层</text>
  <rect class="w" x="130" y="516" width="152" height="46" rx="10"/>
  <text class="t" x="206" y="536">state</text><text class="s" x="206" y="552">SQLite 会话状态</text>
  <rect class="w" x="294" y="516" width="152" height="46" rx="10"/>
  <text class="t" x="370" y="536">rollout</text><text class="s" x="370" y="552">会话持久化 / resume</text>
  <rect class="w" x="458" y="516" width="152" height="46" rx="10"/>
  <text class="t" x="534" y="536">otel</text><text class="s" x="534" y="552">OTLP 遥测</text>
  <rect class="w" x="622" y="516" width="152" height="46" rx="10"/>
  <text class="t" x="698" y="536">config</text><text class="s" x="698" y="552">config.toml + JSON Schema</text>
  <rect class="w" x="786" y="516" width="152" height="46" rx="10"/>
  <text class="t" x="862" y="536">30+ utils</text><text class="s" x="862" y="552">路径 / 流解析 / 模板</text>

  <text x="480" y="598" text-anchor="middle" font-size="11" fill="#94a3b8">Cargo workspace · 90+ crates · Bazel 与 Cargo 双构建 · 接入层可插拔，安全层透明包裹核心层</text>
</svg>
