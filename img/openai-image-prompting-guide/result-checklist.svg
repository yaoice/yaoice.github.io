<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="ipg6-t ipg6-d">
  <title id="ipg6-t">输出验收四问</title>
  <desc id="ipg6-d">文字是否准确、身份是否保留、是否只改了要求改的部分、透明是否为真 alpha 通道；同时比较质量、延迟与成本。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .q{font-size:14px;font-weight:700;fill:#1e293b}
      .b{font-size:11.5px;fill:#64748b}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
    </style>
  </defs>
  <rect width="960" height="440" fill="#f8fafc"/>
  <text x="32" y="34" class="t title">验收四问：输出能不能用，看这四件事</text>
  <text x="32" y="57" class="t sub">换模型或改提示词时，在代表性输入上同时比较质量、延迟与成本</text>

  <rect x="32" y="80" width="430" height="120" class="box" fill="#ffffff"/>
  <rect x="32" y="80" width="6" height="120" rx="3" fill="#3b82f6"/>
  <text x="56" y="112" class="t q">① 文字对不对</text>
  <text x="56" y="142" class="t b">必需出现的文字是否准确、可读、只出现一次？</text>
  <text x="56" y="164" class="t b">图表里的标签与元素关系是否正确？</text>
  <text x="56" y="186" class="t b">小字与密集文字，是否用了更高的 quality 档位？</text>

  <rect x="498" y="80" width="430" height="120" class="box" fill="#ffffff"/>
  <rect x="498" y="80" width="6" height="120" rx="3" fill="#10b981"/>
  <text x="522" y="112" class="t q">② 身份有没有丢</text>
  <text x="522" y="142" class="t b">人物身份、面部特征是否还是同一个人？</text>
  <text x="522" y="164" class="t b">产品形状、标签与参考图里的细节是否完好？</text>
  <text x="522" y="186" class="t b">编辑序列跑完，主体是否仍然一致？</text>

  <rect x="32" y="220" width="430" height="120" class="box" fill="#ffffff"/>
  <rect x="32" y="220" width="6" height="120" rx="3" fill="#f59e0b"/>
  <text x="56" y="252" class="t q">③ 有没有越界</text>
  <text x="56" y="282" class="t b">这次编辑是否只改了要求改的部分？</text>
  <text x="56" y="304" class="t b">有没有顺手改掉版式、光线或背景？</text>
  <text x="56" y="326" class="t b">有没有出现你没要的文字、Logo 或水印？</text>

  <rect x="498" y="220" width="430" height="120" class="box" fill="#ffffff"/>
  <rect x="498" y="220" width="6" height="120" rx="3" fill="#8b5cf6"/>
  <text x="522" y="252" class="t q">④ 透明度是真的吗</text>
  <text x="522" y="282" class="t b">需要透明时，请求里是否显式指定了 transparent？</text>
  <text x="522" y="304" class="t b">输出格式是否为 PNG 或 WebP？</text>
  <text x="522" y="326" class="t b">文件里是真 alpha 通道，而不是画出来的背景？</text>

  <rect x="32" y="364" width="896" height="56" class="box" fill="#f1f5f9"/>
  <text x="52" y="388" class="t q">最后一步：质量 · 延迟 · 成本，三个一起比</text>
  <text x="52" y="408" class="t b">用你自己的代表性输入跑对比，而不是参考公开榜单或质量档位的字面含义。</text>
</svg>
