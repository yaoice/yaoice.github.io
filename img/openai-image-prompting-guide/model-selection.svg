<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="ipg2-t ipg2-d">
  <title id="ipg2-t">gpt-image-2.5 两档模型选型与弃用时间线</title>
  <desc id="ipg2-d">flare 优化速度，sunburst 优化质量；新工作流与迁移工作流各有不同的第一候选，旧模型将在 2026 年内关停。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12px;font-weight:700;fill:#334155}
      .s{font-size:11.5px;fill:#64748b}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
    </style>
  </defs>
  <rect width="960" height="500" fill="#f8fafc"/>
  <text x="32" y="34" class="t title">选型：先定模型，再调参数</text>
  <text x="32" y="57" class="t sub">同一个 quality 标签，不等于同样的画质与响应时间——必须在自己的负载上测量</text>

  <rect x="32" y="78" width="430" height="132" class="box" fill="#ffffff"/>
  <rect x="44" y="90" width="406" height="30" rx="8" fill="#eff6ff"/>
  <text x="58" y="110" class="t h">gpt-image-2.5-flare</text>
  <text x="58" y="142" class="t b">小模型 · 优化速度：画质与 GPT Image 2 相当</text>
  <text x="58" y="166" class="t s">适合先跑通流程、对延迟敏感的生成与编辑路径</text>
  <text x="58" y="190" class="t s">迁移起点：现用 GPT Image 2 已达标，先试它拿延迟收益</text>

  <rect x="498" y="78" width="430" height="132" class="box" fill="#ffffff"/>
  <rect x="510" y="90" width="406" height="30" rx="8" fill="#ecfdf5"/>
  <text x="524" y="110" class="t h">gpt-image-2.5-sunburst</text>
  <text x="524" y="142" class="t b">基础模型 · 优化质量：画质高于 GPT Image 2</text>
  <text x="524" y="166" class="t s">适合对画质有硬要求的生成与精确编辑</text>
  <text x="524" y="190" class="t s">迁移起点：GPT Image 2 质量不达标，先试它拿质量</text>

  <rect x="32" y="226" width="896" height="36" class="box" fill="#ffffff"/>
  <text x="48" y="249" class="t b">新工作流</text>
  <text x="152" y="249" class="t s">速度优先先试 flare；画质优先先试 sunburst</text>

  <rect x="32" y="270" width="896" height="36" class="box" fill="#ffffff"/>
  <text x="48" y="293" class="t b">迁移</text>
  <text x="152" y="293" class="t s">从当前画质档位出发；首轮只换模型，prompt / 参考图 / 尺寸 / 格式都不动</text>

  <rect x="32" y="314" width="896" height="36" class="box" fill="#ffffff"/>
  <text x="48" y="337" class="t b">交叉验证</text>
  <text x="152" y="337" class="t s">sunburst 过了质量关，再用同一组 prompt 试 flare；延迟没改善就保留 sunburst</text>

  <rect x="32" y="358" width="896" height="36" class="box" fill="#ffffff"/>
  <text x="48" y="381" class="t b">调参顺序</text>
  <text x="152" y="381" class="t s">先选模型 → 再调 quality → 最后改提示词；一次只改一个设置</text>

  <text x="32" y="424" class="t b">弃用时间线：迁移不是可选项</text>
  <rect x="32" y="436" width="288" height="48" class="box" fill="#fef2f2"/>
  <text x="48" y="456" class="t b">2026-10-23</text>
  <text x="48" y="474" class="t s">gpt-image-1 计划关停</text>
  <rect x="336" y="436" width="288" height="48" class="box" fill="#fef2f2"/>
  <text x="352" y="456" class="t b">2026-12-01</text>
  <text x="352" y="474" class="t s">gpt-image-1.5 计划关停</text>
  <rect x="640" y="436" width="288" height="48" class="box" fill="#eff6ff"/>
  <text x="656" y="456" class="t b">仍在支持</text>
  <text x="656" y="474" class="t s">gpt-image-2 作为参考模型</text>
</svg>
