<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="ipg4-t ipg4-d">
  <title id="ipg4-t">八条提示词原则分为三组</title>
  <desc id="ipg4-d">定义结果、描述可见细节、编辑与迭代三组共八条原则，格式没有特殊语法，可维护性优先。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .h{font-size:14px;font-weight:700}
      .it{font-size:12.5px;font-weight:700;fill:#1e293b}
      .ib{font-size:11px;fill:#64748b}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
    </style>
  </defs>
  <rect width="960" height="580" fill="#f8fafc"/>
  <text x="32" y="34" class="t title">八条提示词原则：分三组更好记</text>
  <text x="32" y="57" class="t sub">定义结果 → 描述可见细节 → 编辑与迭代；格式没有特殊语法，可维护性优先于魔法模板</text>

  <rect x="32" y="80" width="288" height="380" class="box" fill="#ffffff"/>
  <rect x="44" y="92" width="264" height="30" rx="8" fill="#eff6ff"/>
  <text x="58" y="112" class="t h">组一 · 定义结果</text>

  <text x="58" y="152" class="t it">① 先说清结果与用途</text>
  <text x="58" y="170" class="t ib">是产品图、广告还是图表，决定构图</text>
  <text x="58" y="186" class="t ib">与细节密度；复杂需求按场景 / 主体 /</text>
  <text x="58" y="202" class="t ib">细节 / 约束分段写，别糊成一段</text>

  <text x="58" y="240" class="t it">② 选可维护的格式</text>
  <text x="58" y="258" class="t ib">短句、段落、类 JSON、指令、标签都</text>
  <text x="58" y="274" class="t ib">能用，挑最容易读和改的那种；官方</text>
  <text x="58" y="290" class="t ib">明确说没有必须遵守的特殊语法</text>

  <rect x="44" y="330" width="264" height="112" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="356" class="t it">容易忽略的一点</text>
  <text x="60" y="378" class="t ib">提示词描述的是画面，不是愿望。</text>
  <text x="60" y="394" class="t ib">凡是画面里看不见的词（氛围、高级</text>
  <text x="60" y="410" class="t ib">感、有故事性），模型只能靠猜；</text>
  <text x="60" y="426" class="t ib">换成材质、光线、颜色、介质才有用。</text>

  <rect x="336" y="80" width="288" height="380" class="box" fill="#ffffff"/>
  <rect x="348" y="92" width="264" height="30" rx="8" fill="#f1f5f9"/>
  <text x="362" y="112" class="t h">组二 · 描述可见细节</text>

  <text x="362" y="152" class="t it">③ 描述材质、光线、颜色</text>
  <text x="362" y="170" class="t ib">要真实感就写明 photorealistic /</text>
  <text x="362" y="186" class="t ib">real photograph；相机参数只是外观</text>
  <text x="362" y="202" class="t ib">线索，不是物理模拟。夜景与霓虹要</text>
  <text x="362" y="218" class="t ib">给尺度、气氛与色彩，而不只给情绪词</text>

  <text x="362" y="256" class="t it">④ 指定人物与动作</text>
  <text x="362" y="274" class="t ib">取景范围、相对比例、视线方向、与</text>
  <text x="362" y="290" class="t ib">物体的交互。例：全身可见含脚；双手</text>
  <text x="362" y="306" class="t ib">自然握住车把——把手部写清楚</text>

  <text x="362" y="344" class="t it">⑤ 精确控制文字</text>
  <text x="362" y="362" class="t ib">原文用引号包住，说明位置与字体；</text>
  <text x="362" y="378" class="t ib">生僻词逐字母拼写；要求不要出现额外</text>
  <text x="362" y="394" class="t ib">文字；小字或密集文字用 medium /</text>
  <text x="362" y="410" class="t ib">high quality，输出后逐字核对</text>

  <rect x="640" y="80" width="288" height="380" class="box" fill="#ffffff"/>
  <rect x="652" y="92" width="264" height="30" rx="8" fill="#ecfdf5"/>
  <text x="666" y="112" class="t h">组三 · 编辑与迭代</text>

  <text x="666" y="152" class="t it">⑥ 变更与约束分离</text>
  <text x="666" y="170" class="t ib">只改 X；再列出必须保留的部分：身份、</text>
  <text x="666" y="186" class="t ib">几何、版式、光线、标签；最后声明排除</text>
  <text x="666" y="202" class="t ib">项——多余文字、Logo、水印</text>

  <text x="666" y="240" class="t it">⑦ 给参考图分配角色</text>
  <text x="666" y="258" class="t ib">按编号说明每张输入的用途：主体、</text>
  <text x="666" y="274" class="t ib">风格、服装还是背景；并解释它们</text>
  <text x="666" y="290" class="t ib">之间怎么组合，不要丢一堆图让模型猜</text>

  <text x="666" y="328" class="t it">⑧ 有意识地迭代</text>
  <text x="666" y="346" class="t ib">把上一轮输出作为下一轮输入；一次只</text>
  <text x="666" y="362" class="t ib">请求一处变更；复述要保留的细节；</text>
  <text x="666" y="378" class="t ib">结果开始漂移时，回头重申关键约束</text>

  <rect x="32" y="482" width="896" height="56" class="box" fill="#f1f5f9"/>
  <text x="52" y="505" class="t it">前两条决定模型有没有听懂任务，中间三条决定画面像不像，后三条决定改完之后还是不是原来那张图。</text>
  <text x="52" y="526" class="t ib">八条里真正被反复使用的只有一句：把「我要什么」和「不许动什么」写成两件事。</text>
</svg>
