<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ipg5-t ipg5-d">
  <title id="ipg5-t">编辑类提示词的三段结构：变更、保留、排除</title>
  <desc id="ipg5-d">编辑提示词要写清改什么、保什么、排除什么；四个官方示例都遵循同一结构，像素级一致的区域应改用合成。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .h{font-size:14px;font-weight:700}
      .b{font-size:12px;font-weight:700;fill:#334155}
      .s{font-size:11px;fill:#64748b}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .cell{stroke:#e2e8f0;stroke-width:1;rx:6}
    </style>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="32" y="34" class="t title">编辑类提示词的三段结构：变更 / 保留 / 排除</text>
  <text x="32" y="57" class="t sub">官方 8 个编辑示例几乎都以 Do not change anything else 收尾——难点不在改什么，而在不变什么</text>

  <rect x="32" y="78" width="288" height="190" class="box" fill="#eff6ff"/>
  <text x="48" y="106" class="t h">① 变更：只改这一处</text>
  <text x="48" y="136" class="t s">把白色椅子换成木椅</text>
  <text x="48" y="160" class="t s">把信息图上的文字翻译成西班牙语</text>
  <text x="48" y="184" class="t s">移除男子手中的花</text>
  <text x="48" y="208" class="t s">把狗放到女士旁边</text>
  <text x="48" y="240" class="t b">一句话原则</text>
  <text x="48" y="258" class="t s">一次只描述一个改动动作</text>

  <rect x="336" y="78" width="288" height="190" class="box" fill="#f1f5f9"/>
  <text x="352" y="106" class="t h">② 保留：明确不能动</text>
  <text x="352" y="136" class="t s">人物身份、面部特征与姿势</text>
  <text x="352" y="160" class="t s">产品几何形状与标签可读性</text>
  <text x="352" y="184" class="t s">版式、机位、光线与阴影</text>
  <text x="352" y="208" class="t s">背景与周围物体的相对关系</text>
  <text x="352" y="240" class="t b">一句话原则</text>
  <text x="352" y="258" class="t s">不写出来的部分，模型默认可以改</text>

  <rect x="640" y="78" width="288" height="190" class="box" fill="#fef2f2"/>
  <text x="656" y="106" class="t h">③ 排除：声明不要什么</text>
  <text x="656" y="136" class="t s">多余文字、重复标语、错拼</text>
  <text x="656" y="160" class="t s">Logo 与水印</text>
  <text x="656" y="184" class="t s">画出来的假背景、棋盘格、硬阴影</text>
  <text x="656" y="208" class="t s">概念图式的廉价光效</text>
  <text x="656" y="240" class="t b">一句话原则</text>
  <text x="656" y="258" class="t s">排除项比形容词更能收敛结果</text>

  <rect x="32" y="288" width="200" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="308" class="t b">编辑示例</text>
  <rect x="240" y="288" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="252" y="308" class="t b">变更</text>
  <rect x="528" y="288" width="400" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="540" y="308" class="t b">保留 / 排除</text>

  <rect x="32" y="324" width="200" height="30" class="cell" fill="#ffffff"/>
  <text x="44" y="344" class="t s">信息图翻译</text>
  <rect x="240" y="324" width="280" height="30" class="cell" fill="#ffffff"/>
  <text x="252" y="344" class="t s">文字换成西班牙语</text>
  <rect x="528" y="324" width="400" height="30" class="cell" fill="#ffffff"/>
  <text x="540" y="344" class="t s">版式、图形、配色一律不动</text>

  <rect x="32" y="360" width="200" height="30" class="cell" fill="#ffffff"/>
  <text x="44" y="380" class="t s">只换服装</text>
  <rect x="240" y="360" width="280" height="30" class="cell" fill="#ffffff"/>
  <text x="252" y="380" class="t s">替换衣服，其余保持</text>
  <rect x="528" y="360" width="400" height="30" class="cell" fill="#ffffff"/>
  <text x="540" y="380" class="t s">锁定面部、身份、姿势，并匹配光线</text>

  <rect x="32" y="396" width="200" height="30" class="cell" fill="#ffffff"/>
  <text x="44" y="416" class="t s">组合参考图</text>
  <rect x="240" y="396" width="280" height="30" class="cell" fill="#ffffff"/>
  <text x="252" y="416" class="t s">把图 2 的狗放进图 1 场景</text>
  <rect x="528" y="396" width="400" height="30" class="cell" fill="#ffffff"/>
  <text x="540" y="416" class="t s">场景与人物其余部分不要变化</text>

  <rect x="32" y="432" width="200" height="30" class="cell" fill="#ffffff"/>
  <text x="44" y="452" class="t s">透明抠图</text>
  <rect x="240" y="432" width="280" height="30" class="cell" fill="#ffffff"/>
  <text x="252" y="452" class="t s">产品隔离到全透明背景</text>
  <rect x="528" y="432" width="400" height="30" class="cell" fill="#ffffff"/>
  <text x="540" y="452" class="t s">几何与标签精确保留；不要背景、棋盘格、阴影</text>

  <rect x="32" y="476" width="896" height="36" class="box" fill="#fffbeb"/>
  <text x="52" y="500" class="t s">边界：需要像素级一致的区域，把已批准的编辑合成回原图——这是官方明确划出的提示词能力范围之外。</text>
</svg>
