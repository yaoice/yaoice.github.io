<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="ipg3-t ipg3-d">
  <title id="ipg3-t">图像模型迁移的六步工作流</title>
  <desc id="ipg3-d">从保存基线到按工作流放量，六步依次执行；质量未通过时不测延迟，需要像素级一致的区域用合成而非提示词。</desc>
  <defs>
    <marker id="ipg3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .b{font-size:13px;font-weight:700;fill:#1e293b}
      .s{font-size:11px;fill:#64748b}
      .n{font-size:12px;font-weight:700;fill:#ffffff}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#ipg3-arrow)}
    </style>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <text x="32" y="34" class="t title">迁移六步：把换模型变成可回滚的工程动作</text>
  <text x="32" y="57" class="t sub">每一步都有明确的通过条件；质量没过，不测延迟</text>

  <rect x="32" y="96" width="280" height="112" class="box" fill="#ffffff"/>
  <rect x="46" y="110" width="24" height="24" rx="6" fill="#3b82f6"/>
  <text x="58" y="127" text-anchor="middle" class="t n">1</text>
  <text x="80" y="127" class="t b">保存基线</text>
  <text x="46" y="156" class="t s">收好代表性 prompt 与参考图</text>
  <text x="46" y="174" class="t s">记录模型、参数与当时的输出</text>
  <text x="46" y="192" class="t s">难点编辑、精确文字、人脸优先入库</text>

  <path d="M312 152 H336" class="line"/>

  <rect x="340" y="96" width="280" height="112" class="box" fill="#ffffff"/>
  <rect x="354" y="110" width="24" height="24" rx="6" fill="#3b82f6"/>
  <text x="366" y="127" text-anchor="middle" class="t n">2</text>
  <text x="388" y="127" class="t b">选第一候选</text>
  <text x="354" y="156" class="t s">速度优先 flare，质量优先 sunburst</text>
  <text x="354" y="174" class="t s">首轮只换模型，其余变量全部锁定</text>
  <text x="354" y="192" class="t s">否则无法判断差异来自哪里</text>

  <path d="M620 152 H644" class="line"/>

  <rect x="648" y="96" width="280" height="112" class="box" fill="#ffffff"/>
  <rect x="662" y="110" width="24" height="24" rx="6" fill="#3b82f6"/>
  <text x="674" y="127" text-anchor="middle" class="t n">3</text>
  <text x="696" y="127" class="t b">验收完整结果</text>
  <text x="662" y="156" class="t s">指令遵循、身份与产品保持、文字准确</text>
  <text x="662" y="174" class="t s">跑完整编辑序列，而不是只测单步</text>
  <text x="662" y="192" class="t s">同一请求重复多次，看一致性</text>

  <path d="M788 208 V250" class="line"/>

  <rect x="648" y="250" width="280" height="112" class="box" fill="#ffffff"/>
  <rect x="662" y="264" width="24" height="24" rx="6" fill="#8b5cf6"/>
  <text x="674" y="281" text-anchor="middle" class="t n">4</text>
  <text x="696" y="281" class="t b">再测延迟收益</text>
  <text x="662" y="310" class="t s">质量过关后才换回 flare 比延迟</text>
  <text x="662" y="328" class="t s">质量掉下来就回退，不做妥协</text>
  <text x="662" y="346" class="t s">统计典型与最慢响应，而不只看均值</text>

  <path d="M648 306 H624" class="line"/>

  <rect x="340" y="250" width="280" height="112" class="box" fill="#ffffff"/>
  <rect x="354" y="264" width="24" height="24" rx="6" fill="#8b5cf6"/>
  <text x="366" y="281" text-anchor="middle" class="t n">5</text>
  <text x="388" y="281" class="t b">单变量调参</text>
  <text x="354" y="310" class="t s">先比 quality 档位，再考虑改提示词</text>
  <text x="354" y="328" class="t s">统计失败率、重试次数与单张可用成本</text>
  <text x="354" y="346" class="t s">xhigh / max 只在确有收益时使用</text>

  <path d="M340 306 H316" class="line"/>

  <rect x="32" y="250" width="280" height="112" class="box" fill="#ffffff"/>
  <rect x="46" y="264" width="24" height="24" rx="6" fill="#10b981"/>
  <text x="58" y="281" text-anchor="middle" class="t n">6</text>
  <text x="80" y="281" class="t b">按工作流放量</text>
  <text x="46" y="310" class="t s">先切小流量，监控后再逐步扩大</text>
  <text x="46" y="328" class="t s">保留上一代模型，随时可以回滚</text>
  <text x="46" y="346" class="t s">一个工作流一个工作流地迁移</text>

  <rect x="32" y="392" width="896" height="56" class="box" fill="#fffbeb"/>
  <text x="52" y="415" class="t b">红线：反复编辑仍会漂移</text>
  <text x="52" y="436" class="t s">需要保持像素级一致的区域，把已批准的编辑合成回原图，不要指望提示词替你锁住它。</text>
</svg>
