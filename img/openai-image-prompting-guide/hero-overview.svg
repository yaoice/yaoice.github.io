<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="ipg1-t ipg1-d">
  <title id="ipg1-t">OpenAI 图像提示词指南的结构地图</title>
  <desc id="ipg1-d">指南分为选型、迁移、使用三层：先定模型与参数，再按六步流程迁移，最后用八条原则写提示词并验收结果。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .h{font-size:14px;font-weight:700}
      .b{font-size:12px;font-weight:700;fill:#334155}
      .s{font-size:11px;fill:#64748b}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
    </style>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <text x="32" y="34" class="t title">OpenAI 图像提示词指南：三层结构，一条主线</text>
  <text x="32" y="57" class="t sub">先选对模型与参数，再谈提示词；描述负责生成，约束负责保护，验收负责收口</text>

  <rect x="32" y="80" width="288" height="300" class="box" fill="#ffffff"/>
  <rect x="44" y="92" width="264" height="30" rx="8" fill="#eff6ff"/>
  <text x="58" y="112" class="t h">① 选型层：模型与参数</text>
  <text x="58" y="146" class="t b">两档模型</text>
  <text x="58" y="166" class="t s">flare 优化速度，sunburst 优化质量</text>
  <text x="58" y="194" class="t b">quality 六档</text>
  <text x="58" y="214" class="t s">auto / low / medium / high / xhigh / max</text>
  <text x="58" y="242" class="t b">自定义分辨率</text>
  <text x="58" y="262" class="t s">边长 ≤ 3840px，16 的倍数，长短边比 ≤ 3:1</text>
  <text x="58" y="290" class="t b">背景</text>
  <text x="58" y="310" class="t s">transparent 必须配 PNG / WebP</text>
  <text x="58" y="338" class="t b">前提</text>
  <text x="58" y="358" class="t s">同档 quality 不跨模型可比，要在自有负载上测</text>

  <rect x="336" y="80" width="288" height="300" class="box" fill="#ffffff"/>
  <rect x="348" y="92" width="264" height="30" rx="8" fill="#f1f5f9"/>
  <text x="362" y="112" class="t h">② 迁移层：六步工作流</text>
  <text x="362" y="146" class="t b">① 保存基线　② 选第一候选</text>
  <text x="362" y="170" class="t b">③ 验收完整结果　④ 再测延迟</text>
  <text x="362" y="194" class="t b">⑤ 单变量调参　⑥ 按工作流放量</text>
  <text x="362" y="228" class="t s">顺序不能反：质量没过，不测延迟</text>
  <text x="362" y="248" class="t s">放量前保留回滚路径</text>
  <text x="362" y="282" class="t b">红线</text>
  <text x="362" y="302" class="t s">重复编辑会漂移；需要像素级一致的区域，</text>
  <text x="362" y="320" class="t s">用合成而不是提示词</text>
  <text x="362" y="350" class="t b">成本</text>
  <text x="362" y="370" class="t s">不要假设更快就等于更便宜，先确认定价</text>

  <rect x="640" y="80" width="288" height="300" class="box" fill="#ffffff"/>
  <rect x="652" y="92" width="264" height="30" rx="8" fill="#ecfdf5"/>
  <text x="666" y="112" class="t h">③ 使用层：提示词与验收</text>
  <text x="666" y="146" class="t b">八条提示词原则</text>
  <text x="666" y="166" class="t s">定义结果 / 可见细节 / 精确文本</text>
  <text x="666" y="184" class="t s">变更与约束分离 / 参考图角色 / 迭代</text>
  <text x="666" y="212" class="t b">案例矩阵</text>
  <text x="666" y="232" class="t s">生成 9 例 + 编辑 8 例</text>
  <text x="666" y="260" class="t b">多轮迭代</text>
  <text x="666" y="280" class="t s">上一轮输出即下一轮输入，一次改一处</text>
  <text x="666" y="308" class="t b">验收四问</text>
  <text x="666" y="328" class="t s">文字准不准 / 身份丢没丢</text>
  <text x="666" y="346" class="t s">有没有越界 / alpha 是不是真的</text>

  <rect x="32" y="400" width="896" height="52" class="box" fill="#f1f5f9"/>
  <text x="52" y="431" class="t b">主线：把图像生成与编辑当作可测量、可回滚、按工作流放量的工程流程，而不是一次提示词抽奖。</text>
</svg>
