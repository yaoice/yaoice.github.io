<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
  <title id="title">AgentScope 2.0 源码全景</title><desc id="desc">从开发者调用到模型、工具、状态和生产服务的分层架构图</desc>
  <rect width="960" height="510" rx="10" fill="#f8fafc"/>
  <g font-family="Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif">
    <text x="48" y="52" font-size="18" font-weight="700" fill="#1e293b">AgentScope 2.0：一个以事件和状态为中心的 Agent 运行时</text>
    <text x="48" y="80" font-size="12" fill="#64748b">从 SDK 调用到生产服务，核心不是“包装 LLM”，而是管理可恢复的执行过程</text>
    <g stroke="#cbd5e1" stroke-width="1">
      <rect x="48" y="116" width="182" height="112" rx="10" fill="#fff"/><rect x="267" y="116" width="182" height="112" rx="10" fill="#eff6ff"/><rect x="486" y="116" width="182" height="112" rx="10" fill="#fff"/><rect x="705" y="116" width="207" height="112" rx="10" fill="#f0fdf4"/>
      <rect x="48" y="291" width="864" height="145" rx="10" fill="#fff"/>
    </g>
    <g font-size="14" font-weight="700" fill="#1e293b"><text x="66" y="151">调用入口</text><text x="285" y="151">Agent 内核</text><text x="504" y="151">能力边界</text><text x="723" y="151">生产运行时</text></g>
    <g font-size="12" fill="#475569"><text x="66" y="179">reply_stream()</text><text x="66" y="202">create_app()</text><text x="285" y="179">ReAct 状态机</text><text x="285" y="202">AgentState + Events</text><text x="504" y="179">Model / Toolkit</text><text x="504" y="202">Permission / Workspace</text><text x="723" y="179">ChatService</text><text x="723" y="202">Storage + Bus + SSE</text></g>
    <g stroke="#94a3b8" stroke-width="2" fill="none"><path d="M230 172h30"/><path d="M449 172h30"/><path d="M668 172h30"/></g><g fill="#94a3b8"><path d="M259 168l7 4-7 4z"/><path d="M478 168l7 4-7 4z"/><path d="M697 168l7 4-7 4z"/></g>
    <text x="70" y="327" font-size="14" font-weight="700" fill="#1e293b">一次回复中的四类运行时事实</text>
    <g><rect x="70" y="350" width="184" height="58" rx="7" fill="#eff6ff"/><rect x="274" y="350" width="184" height="58" rx="7" fill="#f8fafc"/><rect x="478" y="350" width="184" height="58" rx="7" fill="#fff7ed"/><rect x="682" y="350" width="184" height="58" rx="7" fill="#f0fdf4"/></g>
    <g font-size="13" font-weight="700" fill="#1e293b"><text x="87" y="375">上下文与摘要</text><text x="291" y="375">工具调用状态</text><text x="495" y="375">权限与工作目录</text><text x="699" y="375">事件流与实时推送</text></g>
    <g font-size="11" fill="#64748b"><text x="87" y="394">context / summary</text><text x="291" y="394">ASKING / SUBMITTED</text><text x="495" y="394">规则、模式、边界</text><text x="699" y="394">短期 replay + Pub/Sub</text></g>
    <text x="48" y="475" font-size="12" fill="#475569">阅读主线：Agent → Msg/Event → Model/Toolkit → Permission → App/Team</text>
  </g>
</svg>
