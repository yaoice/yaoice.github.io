<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">AgentScope 工具调用闸门</title><desc id="desc">模型工具调用依次经过工具组、JSON Schema 校验、权限引擎和本地或外部执行路径</desc>
  <rect width="960" height="490" rx="10" fill="#f8fafc"/>
  <g font-family="Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif">
    <text x="48" y="52" font-size="18" font-weight="700" fill="#1e293b">工具调用：先证明“能调”，再决定“可不可以调”</text>
    <text x="48" y="79" font-size="12" fill="#64748b">模型输出只是一段 ToolCallBlock；真正副作用必须穿过验证、权限和执行三道边界</text>
    <g stroke="#cbd5e1" stroke-width="1"><rect x="48" y="151" width="152" height="88" rx="9" fill="#eff6ff"/><rect x="245" y="151" width="152" height="88" rx="9" fill="#fff"/><rect x="442" y="151" width="152" height="88" rx="9" fill="#fff7ed"/><rect x="639" y="151" width="152" height="88" rx="9" fill="#f0fdf4"/><rect x="710" y="327" width="180" height="76" rx="9" fill="#fff"/><rect x="474" y="327" width="180" height="76" rx="9" fill="#fff"/></g>
    <g font-size="14" font-weight="700" fill="#1e293b"><text x="68" y="185">ToolCallBlock</text><text x="263" y="185">Toolkit</text><text x="459" y="185">PermissionEngine</text><text x="661" y="185">_acting()</text><text x="494" y="359">等待用户</text><text x="730" y="359">外部执行器</text></g>
    <g font-size="11" fill="#475569"><text x="63" y="207">name + JSON input</text><text x="262" y="207">组激活、Schema</text><text x="456" y="207">ALLOW / ASK / DENY</text><text x="654" y="207">流式 ToolChunk</text><text x="492" y="381">REQUIRE_CONFIRM</text><text x="728" y="381">REQUIRE_EXTERNAL</text></g>
    <g stroke="#3b82f6" stroke-width="2" fill="none"><path d="M200 195h38"/><path d="M397 195h38"/><path d="M594 195h38"/><path d="M791 195h55v87H654"/></g><g fill="#3b82f6"><path d="M233 191l8 4-8 4z"/><path d="M430 191l8 4-8 4z"/><path d="M627 191l8 4-8 4z"/><path d="M658 278l-4-8 8 4z"/></g>
    <g stroke="#f59e0b" stroke-width="2" fill="none"><path d="M518 239v49H564v32"/><path d="M518 239v49h282v32"/></g><g fill="#f59e0b"><path d="M560 316l4 8 4-8z"/><path d="M796 316l4 8 4-8z"/></g>
    <g><rect x="62" y="282" width="337" height="117" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="82" y="313" font-size="13" font-weight="700" fill="#1e293b">权限决策的优先级（默认模式）</text><text x="82" y="340" font-size="12" fill="#475569">Deny 规则 → Ask 规则 → 只读快速放行</text><text x="82" y="363" font-size="12" fill="#475569">→ 工具自身安全检查 → Allow 规则 → 再询问</text><text x="82" y="386" font-size="11" fill="#64748b">ASK 会把调用留在状态里，确认后再进入同一执行链</text></g>
    <text x="48" y="451" font-size="12" fill="#475569">错误不会打断协议：解析、校验和业务异常都会转成 ToolResult，而非让模型循环崩溃。</text>
  </g>
</svg>