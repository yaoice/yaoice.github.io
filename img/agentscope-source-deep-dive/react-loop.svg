<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">AgentScope ReAct 执行环</title><desc id="desc">reply_stream 驱动的输入、推理、工具执行、人机确认、状态更新和最终输出闭环</desc>
  <rect width="960" height="500" rx="10" fill="#f8fafc"/>
  <g font-family="Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif">
    <text x="48" y="52" font-size="18" font-weight="700" fill="#1e293b">ReAct 不是 while + LLM：它是可暂停、可恢复的状态机</text>
    <text x="48" y="79" font-size="12" fill="#64748b">`_next_action()` 只做决策；事件流负责把每一步暴露给 UI、存储和恢复逻辑</text>
    <g stroke="#cbd5e1" stroke-width="1"><rect x="55" y="164" width="160" height="84" rx="9" fill="#fff"/><rect x="280" y="164" width="160" height="84" rx="9" fill="#eff6ff"/><rect x="505" y="164" width="160" height="84" rx="9" fill="#fff"/><rect x="730" y="164" width="160" height="84" rx="9" fill="#f0fdf4"/><rect x="372" y="337" width="216" height="82" rx="9" fill="#fff7ed"/></g>
    <g font-size="14" font-weight="700" fill="#1e293b"><text x="80" y="197">1. 输入归一化</text><text x="306" y="197">2. Reasoning</text><text x="530" y="197">3. Acting</text><text x="756" y="197">4. 决定下一步</text><text x="397" y="369">HITL / 外部执行挂起</text></g>
    <g font-size="11" fill="#475569"><text x="78" y="219">Msg / Confirm / Result</text><text x="299" y="219">压缩、注入、模型调用</text><text x="530" y="219">校验、授权、工具流</text><text x="751" y="219">Exit / Acting / Reasoning</text><text x="399" y="391">ASKING 或 SUBMITTED</text></g>
    <g stroke="#3b82f6" stroke-width="2" fill="none"><path d="M215 206h58"/><path d="M440 206h58"/><path d="M665 206h58"/><path d="M810 249c0 74-105 83-210 83"/><path d="M372 378c-125 0-170-42-170-129"/></g>
    <g fill="#3b82f6"><path d="M268 202l8 4-8 4z"/><path d="M493 202l8 4-8 4z"/><path d="M718 202l8 4-8 4z"/><path d="M600 328l-8 4 8 4z"/><path d="M208 255l-4-8 8 4z"/></g>
    <g stroke="#f59e0b" stroke-width="2" fill="none"><path d="M585 248v81h-105"/><path d="M372 378H230"/></g><g fill="#f59e0b"><path d="M478 325l-8 4 8 4z"/><path d="M238 374l-8 4 8 4z"/></g>
    <text x="620" y="391" font-size="11" fill="#92400e">用户确认 / 执行器结果进入下一次 reply_stream</text>
    <line x1="55" y1="456" x2="890" y2="456" stroke="#cbd5e1"/>
    <text x="55" y="480" font-size="12" fill="#475569">终止条件：文本最终消息、结构化输出满足，或达到 max_iters；中断会补齐未完成工具结果。</text>
  </g>
</svg>