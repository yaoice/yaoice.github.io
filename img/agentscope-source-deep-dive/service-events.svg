<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" role="img" aria-labelledby="title desc">
  <title id="title">AgentScope 服务层事件架构</title><desc id="desc">HTTP 触发 ChatService，事件写入消息总线并通过 SSE 回放和实时推送给客户端</desc>
  <rect width="960" height="495" rx="10" fill="#f8fafc"/>
  <g font-family="Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif">
    <text x="48" y="52" font-size="18" font-weight="700" fill="#1e293b">生产服务：命令触发与事件订阅分离</text>
    <text x="48" y="79" font-size="12" fill="#64748b">POST /chat/ 快速返回；GET /sessions/{id}/stream 负责运行期回放、实时推送和心跳</text>
    <g stroke="#cbd5e1" stroke-width="1"><rect x="56" y="164" width="165" height="88" rx="9" fill="#eff6ff"/><rect x="301" y="164" width="185" height="88" rx="9" fill="#fff"/><rect x="566" y="164" width="185" height="88" rx="9" fill="#f0fdf4"/><rect x="781" y="164" width="125" height="88" rx="9" fill="#fff"/><rect x="303" y="338" width="445" height="76" rx="9" fill="#fff7ed"/></g>
    <g font-size="14" font-weight="700" fill="#1e293b"><text x="78" y="197">浏览器 / 客户端</text><text x="337" y="197">ChatService</text><text x="598" y="197">MessageBus</text><text x="797" y="197">SSE</text><text x="327" y="370">Storage + Workspace + Model + Toolkit 组装</text></g>
    <g font-size="11" fill="#475569"><text x="91" y="219">POST 与长连接</text><text x="328" y="219">串行运行一个 session</text><text x="587" y="219">分布式锁、日志、Pub/Sub</text><text x="797" y="219">回放 + 实时事件</text><text x="345" y="392">状态与上下文按 session 恢复；资源访问按用户与资源类型解析</text></g>
    <g stroke="#3b82f6" stroke-width="2" fill="none"><path d="M221 208h72"/><path d="M486 208h72"/><path d="M751 208h23"/><path d="M845 253v45H140V253"/></g><g fill="#3b82f6"><path d="M288 204l8 4-8 4z"/><path d="M553 204l8 4-8 4z"/><path d="M769 204l8 4-8 4z"/><path d="M144 294l-4 8 8-4z"/></g>
    <g stroke="#f59e0b" stroke-width="2" fill="none"><path d="M393 252v78"/></g><path d="M389 326l4 8 4-8z" fill="#f59e0b"/>
    <g><rect x="66" y="338" width="190" height="76" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="86" y="370" font-size="13" font-weight="700" fill="#1e293b">事件的两份副本</text><text x="86" y="393" font-size="11" fill="#475569">replay log：本次运行内补事件</text><text x="86" y="409" font-size="11" fill="#475569">live channel：在线客户端即时消费</text></g>
    <text x="48" y="460" font-size="12" fill="#475569">价值：前端、持久化和 Agent 核心通过稳定事件协议解耦；共享总线后端下可串行同一 session。</text>
  </g>
</svg>
