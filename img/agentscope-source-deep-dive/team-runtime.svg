<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">AgentScope 团队智能体运行模型</title><desc id="desc">Leader 创建团队和工作成员，成员通过 TeamSay 投递 HintBlock 并触发收件人会话</desc>
  <rect width="960" height="500" rx="10" fill="#f8fafc"/>
  <g font-family="Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif">
    <text x="48" y="52" font-size="18" font-weight="700" fill="#1e293b">多智能体不是另一个引擎，而是“团队工具 + 会话唤醒”</text>
    <text x="48" y="79" font-size="12" fill="#64748b">每名成员仍是独立 Agent + Session；协调语义被编码成 TeamCreate、AgentCreate 与 TeamSay</text>
    <g stroke="#cbd5e1" stroke-width="1"><rect x="380" y="126" width="200" height="87" rx="9" fill="#eff6ff"/><rect x="99" y="305" width="190" height="84" rx="9" fill="#fff"/><rect x="385" y="305" width="190" height="84" rx="9" fill="#fff"/><rect x="671" y="305" width="190" height="84" rx="9" fill="#fff"/><rect x="630" y="126" width="230" height="87" rx="9" fill="#f0fdf4"/></g>
    <g font-size="14" font-weight="700" fill="#1e293b"><text x="423" y="159">Leader Session</text><text x="119" y="337">Worker A</text><text x="405" y="337">Worker B</text><text x="691" y="337">Worker C</text><text x="657" y="159">Storage + MessageBus</text></g>
    <g font-size="11" fill="#475569"><text x="414" y="181">TeamCreate / AgentCreate</text><text x="119" y="359">独立 state 与上下文</text><text x="405" y="359">独立 state 与上下文</text><text x="691" y="359">独立 state 与上下文</text><text x="655" y="181">成员目录、inbox、wakeup</text></g>
    <g stroke="#3b82f6" stroke-width="2" fill="none"><path d="M430 213v56H194v29"/><path d="M480 213v86"/><path d="M530 213v56h236v29"/><path d="M580 170h42"/></g><g fill="#3b82f6"><path d="M190 294l4 8 4-8z"/><path d="M476 294l4 8 4-8z"/><path d="M762 294l4 8 4-8z"/><path d="M617 166l8 4-8 4z"/></g>
    <g stroke="#10b981" stroke-width="2" fill="none"><path d="M194 305V259h236"/><path d="M480 305v-46"/><path d="M766 305V259H530"/></g><g fill="#10b981"><path d="M425 255l8 4-8 4z"/><path d="M476 255l4 8 4-8z"/><path d="M535 255l-8 4 8 4z"/></g>
    <g><rect x="80" y="428" width="800" height="36" rx="7" fill="#fff7ed"/><text x="102" y="451" font-size="12" fill="#92400e">TeamSay：将 &lt;team-message&gt; 变成收件人 Inbox 的 HintBlock，再排队唤醒对应 Session；默认偏向 Leader 汇总。</text></g>
  </g>
</svg>