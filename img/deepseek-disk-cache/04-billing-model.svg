<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="三档计费模型">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="960" height="560" rx="10" fill="#f8fafc"/>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">三档计费：缓存命中价 ≈ 未命中价的 1/30</text>
    <text x="480" y="60" text-anchor="middle" font-size="12" fill="#475569">以 deepseek-v4-flash 高峰时段为例（人民币 / 每百万 tokens，2026-08）</text>

    <rect x="30" y="84" width="460" height="240" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="52" y="114" font-size="14" font-weight="700" fill="#1e293b">V4-Flash 单价（高峰时段）</text>
    <text x="52" y="144" font-size="12" fill="#475569">输入 · 缓存未命中</text>
    <rect x="52" y="152" width="93" height="26" rx="4" fill="#475569"/>
    <text x="155" y="170" font-size="13" font-weight="700" fill="#1e293b">3.0 元</text>
    <text x="52" y="196" font-size="12" fill="#475569">输入 · 缓存命中</text>
    <rect x="52" y="204" width="5" height="26" rx="2" fill="#10b981"/>
    <text x="67" y="222" font-size="13" font-weight="700" fill="#10b981">0.10 元（约 1/30）</text>
    <text x="52" y="248" font-size="12" fill="#475569">输出</text>
    <rect x="52" y="256" width="280" height="26" rx="4" fill="#3b82f6"/>
    <text x="340" y="274" font-size="13" font-weight="700" fill="#1e293b">9.0 元</text>
    <text x="52" y="308" font-size="11" fill="#475569">空闲时段一律半价；V4-Pro 高峰：命中 0.30 / 未命中 9.0 / 输出 27.0 元</text>

    <rect x="510" y="84" width="420" height="240" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="532" y="114" font-size="14" font-weight="700" fill="#1e293b">怎么观察命中？usage 返回字段</text>
    <rect x="532" y="128" width="376" height="86" rx="8" fill="#1e293b"/>
    <g font-family="Consolas, Menlo, monospace" font-size="12">
      <text x="548" y="152" fill="#cbd5e1">"usage": {</text>
      <text x="548" y="172" fill="#cbd5e1">  prompt_cache_hit_tokens:  <tspan fill="#10b981">6000</tspan>,</text>
      <text x="548" y="192" fill="#cbd5e1">  prompt_cache_miss_tokens: <tspan fill="#f59e0b">4000</tspan></text>
      <text x="548" y="208" fill="#cbd5e1">}</text>
    </g>
    <text x="532" y="240" font-size="11.5" fill="#475569">命中部分按 0.10 元、未命中部分按 3.0 元分别计费，</text>
    <text x="532" y="260" font-size="11.5" fill="#475569">两项相加即本次输入费用；缓存存储本身不收费，</text>
    <text x="532" y="280" font-size="11.5" fill="#475569">缓存构建也无额外费用。</text>
    <text x="532" y="308" font-size="11" fill="#475569">命中率 = hit / (hit + miss)，是长上下文应用的第一监控指标</text>

    <text x="30" y="364" font-size="14" font-weight="700" fill="#1e293b">一笔账：10,000 token 输入（V4-Flash 高峰价）</text>
    <rect x="30" y="380" width="290" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="50" y="408" font-size="13" font-weight="700" fill="#1e293b">无缓存</text>
    <text x="50" y="436" font-size="16" font-weight="700" fill="#475569">0.030 元 / 次</text>
    <text x="50" y="456" font-size="11" fill="#475569">10,000 × 3.0 / 1M</text>
    <rect x="50" y="470" width="250" height="14" rx="3" fill="#475569"/>
    <text x="50" y="500" font-size="11" fill="#475569">输入成本 100%</text>

    <rect x="335" y="380" width="290" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="355" y="408" font-size="13" font-weight="700" fill="#1e293b">命中率 60%</text>
    <text x="355" y="436" font-size="16" font-weight="700" fill="#b45309">0.0126 元 / 次</text>
    <text x="355" y="456" font-size="11" fill="#475569">6,000×0.1 + 4,000×3.0（/1M）</text>
    <rect x="355" y="470" width="105" height="14" rx="3" fill="#f59e0b"/>
    <text x="355" y="500" font-size="11" fill="#475569">成本 42% · 省 58%</text>

    <rect x="640" y="380" width="290" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="660" y="408" font-size="13" font-weight="700" fill="#1e293b">命中率 90%</text>
    <text x="660" y="436" font-size="16" font-weight="700" fill="#10b981">0.0039 元 / 次</text>
    <text x="660" y="456" font-size="11" fill="#475569">9,000×0.1 + 1,000×3.0（/1M）</text>
    <rect x="660" y="470" width="33" height="14" rx="3" fill="#10b981"/>
    <text x="660" y="500" font-size="11" fill="#475569">成本 13% · 省 87%</text>

    <text x="30" y="540" font-size="11" fill="#475569">首发价（2024-08 公告）：命中 0.1 元 vs 未命中 1.0 元（1/10）；两年后的 V4 时代，折扣已加深至约 1/30。另：128K 大部分重复的输入，首 token 延迟实测从 13 秒降到 500 毫秒。</text>
  </g>
</svg>
