<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="KV Cache 原理示意">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#10b981"/></marker>
  </defs>
  <rect width="960" height="560" rx="10" fill="#f8fafc"/>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">KV Cache：自回归推理中不断增长的 K / V 缓存</text>
    <text x="480" y="60" text-anchor="middle" font-size="12" fill="#475569">因果掩码保证历史 token 的 K / V 永不改变 —— 这就是"缓存可行"的全部前提</text>

    <rect x="30" y="84" width="435" height="256" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="52" y="114" font-size="15" font-weight="700" fill="#1e293b">① Prefill 预填充：整段 prompt 并行计算</text>
    <rect x="60" y="134" width="56" height="34" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <rect x="130" y="134" width="56" height="34" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <rect x="200" y="134" width="56" height="34" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <rect x="270" y="134" width="56" height="34" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="88" y="156" text-anchor="middle" font-size="13" fill="#1e293b">t₁</text>
    <text x="158" y="156" text-anchor="middle" font-size="13" fill="#1e293b">t₂</text>
    <text x="228" y="156" text-anchor="middle" font-size="13" fill="#1e293b">t₃</text>
    <text x="298" y="156" text-anchor="middle" font-size="13" fill="#1e293b">t₄</text>
    <text x="352" y="148" font-size="12" fill="#475569">一次前向 →</text>
    <text x="352" y="166" font-size="12" fill="#475569">产出全部 K / V</text>
    <line x1="196" y1="172" x2="196" y2="202" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="60" y="208" width="72" height="40" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <rect x="140" y="208" width="72" height="40" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <rect x="220" y="208" width="72" height="40" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <rect x="300" y="208" width="72" height="40" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <text x="96" y="233" text-anchor="middle" font-size="12" fill="#1e293b">K₁V₁</text>
    <text x="176" y="233" text-anchor="middle" font-size="12" fill="#1e293b">K₂V₂</text>
    <text x="256" y="233" text-anchor="middle" font-size="12" fill="#1e293b">K₃V₃</text>
    <text x="336" y="233" text-anchor="middle" font-size="12" fill="#1e293b">K₄V₄</text>
    <text x="52" y="286" font-size="12" fill="#475569">· 产出首 token（TTFT 的主要耗时来源）</text>
    <text x="52" y="308" font-size="12" fill="#475569">· 计算量约 O(L²)，随上下文长度平方增长</text>

    <rect x="495" y="84" width="435" height="256" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="517" y="114" font-size="15" font-weight="700" fill="#1e293b">② Decode 解码：每步只算一个新 token</text>
    <rect x="525" y="134" width="64" height="38" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <rect x="597" y="134" width="64" height="38" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <rect x="669" y="134" width="64" height="38" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <rect x="741" y="134" width="64" height="38" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <rect x="813" y="134" width="64" height="38" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-dasharray="5 3"/>
    <text x="557" y="158" text-anchor="middle" font-size="12" fill="#1e293b">K₁V₁</text>
    <text x="629" y="158" text-anchor="middle" font-size="12" fill="#1e293b">K₂V₂</text>
    <text x="701" y="158" text-anchor="middle" font-size="12" fill="#1e293b">K₃V₃</text>
    <text x="773" y="158" text-anchor="middle" font-size="12" fill="#1e293b">K₄V₄</text>
    <text x="845" y="158" text-anchor="middle" font-size="12" fill="#10b981">K₅V₅</text>
    <line x1="701" y1="174" x2="701" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="525" y="206" width="56" height="34" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="553" y="228" text-anchor="middle" font-size="13" fill="#1e293b">t₅</text>
    <line x1="581" y1="223" x2="616" y2="223" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="620" y="200" width="152" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="696" y="219" text-anchor="middle" font-size="12" fill="#1e293b">Q₅ × 历史 K/V</text>
    <text x="696" y="237" text-anchor="middle" font-size="12" fill="#1e293b">Attention</text>
    <line x1="772" y1="223" x2="796" y2="223" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
    <rect x="800" y="206" width="56" height="34" rx="6" fill="#ffffff" stroke="#475569"/>
    <text x="828" y="228" text-anchor="middle" font-size="13" fill="#1e293b">y₅</text>
    <line x1="567" y1="204" x2="843" y2="178" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ag)"/>
    <text x="517" y="286" font-size="12" fill="#475569">· Q₅ 与全部历史 K/V 做注意力（读多写少）</text>
    <text x="517" y="308" font-size="12" fill="#475569">· 自己的 K₅V₅ 追加进缓存（虚线），缓存随生成增长</text>

    <rect x="30" y="352" width="435" height="168" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <rect x="30" y="352" width="4" height="168" rx="2" fill="#3b82f6"/>
    <text x="52" y="382" font-size="14" font-weight="700" fill="#1e293b">为什么 K / V 可以缓存？</text>
    <text x="52" y="412" font-size="12" fill="#475569">因果掩码：token i 只能看到位置 ≤ i 的 token</text>
    <text x="52" y="438" font-size="12" fill="#475569">→ Kᵢ、Vᵢ 只由前缀决定，与后面出现什么无关</text>
    <text x="52" y="464" font-size="12" fill="#475569">→ 算一次就够；后续请求复用同样前缀时</text>
    <text x="52" y="490" font-size="12" fill="#475569">   可直接读缓存，跳过整段 Prefill 计算</text>

    <rect x="495" y="352" width="435" height="168" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <rect x="495" y="352" width="4" height="168" rx="2" fill="#10b981"/>
    <text x="517" y="382" font-size="14" font-weight="700" fill="#1e293b">成本瓶颈在哪里？</text>
    <text x="517" y="412" font-size="12" fill="#475569">Decode 每一步都要扫描全部 KV Cache</text>
    <text x="517" y="438" font-size="12" fill="#475569">→ 显存容量 + 显存带宽决定长上下文上限</text>
    <text x="517" y="464" font-size="12" fill="#475569">→ KV 体积每压缩一个数量级，就能把更多</text>
    <text x="517" y="490" font-size="12" fill="#475569">   前缀放进更便宜的存储（硬盘）里</text>
  </g>
</svg>
