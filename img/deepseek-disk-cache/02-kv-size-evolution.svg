<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="KV Cache 体积演进">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="960" height="540" rx="10" fill="#f8fafc"/>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">KV Cache 体积演进：从塞满显存到装进硬盘</text>
    <text x="480" y="60" text-anchor="middle" font-size="12" fill="#475569">每 token 每层 KV 缓存字节数的相对量级（示意，各代论文基准不同，详见正文）</text>

    <line x1="300" y1="96" x2="300" y2="372" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="96" x2="860" y2="96" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 3"/>
    <text x="298" y="88" text-anchor="end" font-size="11" fill="#475569">0%</text>
    <text x="860" y="88" text-anchor="middle" font-size="11" fill="#475569">100%（MHA 基准）</text>

    <line x1="356" y1="100" x2="356" y2="372" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="366" y="112" font-size="11" fill="#10b981">≈10%：进入"硬盘缓存"经济学可行区</text>

    <text x="285" y="128" text-anchor="end" font-size="14" font-weight="700" fill="#1e293b">MHA 多头注意力</text>
    <text x="285" y="146" text-anchor="end" font-size="11" fill="#475569">DeepSeek-V1 / R1 · 每个头独立 K/V</text>
    <rect x="300" y="110" width="560" height="42" rx="4" fill="#cbd5e1" stroke="#94a3b8"/>
    <text x="852" y="136" font-size="13" font-weight="700" fill="#1e293b">100%</text>

    <text x="285" y="196" text-anchor="end" font-size="14" font-weight="700" fill="#1e293b">GQA 分组查询</text>
    <text x="285" y="214" text-anchor="end" font-size="11" fill="#475569">业界主流 · 多个 Q 头共享一组 K/V</text>
    <rect x="300" y="178" width="140" height="42" rx="4" fill="#94a3b8"/>
    <text x="448" y="204" font-size="13" font-weight="700" fill="#1e293b">≈25%</text>

    <text x="285" y="264" text-anchor="end" font-size="14" font-weight="700" fill="#1e293b">MLA 多头潜在注意力</text>
    <text x="285" y="282" text-anchor="end" font-size="11" fill="#475569">DeepSeek-V2 / V3 · 只存 latent 向量 + RoPE 键</text>
    <rect x="300" y="246" width="39" height="42" rx="3" fill="#3b82f6"/>
    <text x="347" y="272" font-size="13" font-weight="700" fill="#1e293b">≈7%</text>

    <text x="285" y="332" text-anchor="end" font-size="14" font-weight="700" fill="#1e293b">CSA + HCA（V4）</text>
    <text x="285" y="350" text-anchor="end" font-size="11" fill="#475569">压缩 KV + 稀疏选择 · 1M 上下文可行</text>
    <rect x="300" y="314" width="16" height="42" rx="2" fill="#10b981"/>
    <text x="324" y="340" font-size="13" font-weight="700" fill="#1e293b">≈2–10%</text>

    <rect x="30" y="392" width="435" height="124" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <rect x="30" y="392" width="4" height="124" rx="2" fill="#3b82f6"/>
    <text x="52" y="420" font-size="13" font-weight="700" fill="#1e293b">2024-08 官方公告</text>
    <text x="52" y="446" font-size="11.5" fill="#475569">「得益于 V2 提出的 MLA 结构……大大压缩了上下文</text>
    <text x="52" y="466" font-size="11.5" fill="#475569">KV Cache 的大小，使得存储所需要的传输带宽和存储</text>
    <text x="52" y="486" font-size="11.5" fill="#475569">容量均大幅减少，因此可以缓存到低成本的硬盘上。」</text>
    <text x="52" y="506" font-size="11.5" fill="#3b82f6">—— 可能是全球第一家大范围采用硬盘缓存的厂商</text>

    <rect x="495" y="392" width="435" height="124" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <rect x="495" y="392" width="4" height="124" rx="2" fill="#10b981"/>
    <text x="517" y="420" font-size="13" font-weight="700" fill="#1e293b">V4 的两类缓存（异构 KV Cache）</text>
    <text x="517" y="446" font-size="11.5" fill="#475569">Classical KV Cache：压缩后不可变 → 可下沉到硬盘</text>
    <text x="517" y="466" font-size="11.5" fill="#475569">State Cache：滑动窗口未压缩 KV，热度高 → 留在 HBM</text>
    <text x="517" y="486" font-size="11.5" fill="#475569">「不可变性」是 KV 能搬到硬盘上的架构前提，</text>
    <text x="517" y="506" font-size="11.5" fill="#10b981">也是前缀必须"完整匹配"的根源（见下一图）</text>
  </g>
</svg>
