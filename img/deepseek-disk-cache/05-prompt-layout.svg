<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Prompt 布局最佳实践">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="960" height="540" rx="10" fill="#f8fafc"/>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Prompt 布局决定命中率：稳定在前，动态在后</text>
    <text x="480" y="60" text-anchor="middle" font-size="12" fill="#475569">硬盘缓存按前缀完整匹配 —— 开头一个字符变了，后面全部失效</text>

    <rect x="30" y="84" width="435" height="330" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#sh)"/>
    <text x="52" y="114" font-size="15" font-weight="700" fill="#1e293b">反面：动态内容前置（缓存杀手）</text>
    <text x="52" y="132" font-size="11" fill="#ef4444">首段每轮都变 = 整个前缀永不命中</text>
    <rect x="50" y="142" width="310" height="42" rx="6" fill="#fef2f2" stroke="#ef4444"/>
    <text x="205" y="168" text-anchor="middle" font-size="12" fill="#1e293b">当前时间戳 / 请求 ID（每次都变）</text>
    <rect x="50" y="192" width="310" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="205" y="218" text-anchor="middle" font-size="12" fill="#1e293b">system 角色设定</text>
    <rect x="50" y="242" width="310" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="205" y="268" text-anchor="middle" font-size="12" fill="#1e293b">知识库 / few-shot（很长）</text>
    <rect x="50" y="292" width="310" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="205" y="318" text-anchor="middle" font-size="12" fill="#1e293b">用户问题</text>
    <text x="52" y="356" font-size="12.5" font-weight="700" fill="#ef4444">→ 每次请求前缀都不同，缓存全部失效</text>
    <text x="52" y="384" font-size="11" fill="#475569">缓存命中率</text>
    <rect x="130" y="374" width="300" height="14" rx="3" fill="#f1f5f9"/>
    <rect x="130" y="374" width="16" height="14" rx="3" fill="#ef4444"/>
    <text x="436" y="386" font-size="12" font-weight="700" fill="#ef4444">≈5%</text>

    <rect x="495" y="84" width="435" height="330" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
    <text x="517" y="114" font-size="15" font-weight="700" fill="#1e293b">正面：稳定前缀前置（缓存友好）</text>
    <text x="517" y="132" font-size="11" fill="#10b981">前三段逐字节稳定 = 可缓存前缀</text>
    <rect x="515" y="142" width="310" height="42" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <text x="670" y="168" text-anchor="middle" font-size="12" fill="#1e293b">system 角色设定（逐字节固定）</text>
    <rect x="515" y="192" width="310" height="42" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <text x="670" y="218" text-anchor="middle" font-size="12" fill="#1e293b">知识库 / few-shot（长且稳定）</text>
    <rect x="515" y="242" width="310" height="42" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <text x="670" y="268" text-anchor="middle" font-size="12" fill="#1e293b">多轮历史（对话模板逐字一致）</text>
    <rect x="515" y="292" width="310" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="670" y="318" text-anchor="middle" font-size="12" fill="#1e293b">最新用户问题（唯一变化的部分）</text>
    <text x="517" y="356" font-size="12.5" font-weight="700" fill="#10b981">→ 长前缀稳定复用，只有尾部需要计算</text>
    <text x="517" y="384" font-size="11" fill="#475569">缓存命中率</text>
    <rect x="595" y="374" width="300" height="14" rx="3" fill="#f1f5f9"/>
    <rect x="595" y="374" width="270" height="14" rx="3" fill="#10b981"/>
    <text x="899" y="386" font-size="12" font-weight="700" fill="#10b981">≈90%</text>

    <rect x="30" y="436" width="217" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <circle cx="52" cy="462" r="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="52" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">1</text>
    <text x="70" y="466" font-size="12" font-weight="700" fill="#1e293b">system 逐字节固定</text>
    <text x="48" y="490" font-size="11" fill="#475569">多一个空格 = 整个前缀失效</text>

    <rect x="262" y="436" width="217" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <circle cx="284" cy="462" r="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="284" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">2</text>
    <text x="302" y="466" font-size="12" font-weight="700" fill="#1e293b">对话模板一致</text>
    <text x="280" y="490" font-size="11" fill="#475569">role 顺序、分隔符逐字相同</text>

    <rect x="494" y="436" width="217" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <circle cx="516" cy="462" r="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="516" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">3</text>
    <text x="534" y="466" font-size="12" font-weight="700" fill="#1e293b">动态内容后置</text>
    <text x="512" y="490" font-size="11" fill="#475569">时间戳 / 请求 ID 放到末尾</text>

    <rect x="726" y="436" width="217" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <circle cx="748" cy="462" r="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="748" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">4</text>
    <text x="766" y="466" font-size="12" font-weight="700" fill="#1e293b">监控 usage 命中率</text>
    <text x="744" y="490" font-size="11" fill="#475569">&gt; 40% 健康，&lt; 20% 要整改</text>
  </g>
</svg>
