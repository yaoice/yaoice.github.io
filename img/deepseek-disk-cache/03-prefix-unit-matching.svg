<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="缓存前缀单元与完整匹配">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="960" height="600" rx="10" fill="#f8fafc"/>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">缓存前缀单元：三条落盘时机 × 完整匹配原则</text>
    <text x="480" y="60" text-anchor="middle" font-size="12" fill="#475569">受滑动窗口注意力影响，缓存以"独立完整单元"存取；后续请求必须完整匹配整个单元才能命中</text>

    <rect x="30" y="80" width="290" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="50" y="106" font-size="13" font-weight="700" fill="#1e293b">① 请求结束位置落盘</text>
    <text x="50" y="130" font-size="11.5" fill="#475569">用户输入结束、模型输出结束两处，</text>
    <text x="50" y="150" font-size="11.5" fill="#475569">各产生一个缓存前缀单元</text>

    <rect x="335" y="80" width="290" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="355" y="106" font-size="13" font-weight="700" fill="#1e293b">② 公共前缀检测落盘</text>
    <text x="355" y="130" font-size="11.5" fill="#475569">系统检测到多次请求间存在公共前缀时，</text>
    <text x="355" y="150" font-size="11.5" fill="#475569">将该公共前缀作为独立单元落盘</text>

    <rect x="640" y="80" width="290" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="660" y="106" font-size="13" font-weight="700" fill="#1e293b">③ 固定 token 间隔落盘</text>
    <text x="660" y="130" font-size="11.5" fill="#475569">长输入 / 长输出按固定 token 间隔截取单元，</text>
    <text x="660" y="150" font-size="11.5" fill="#475569">避免长前缀迟迟达不到结束位置无法缓存</text>

    <text x="30" y="208" font-size="13" font-weight="700" fill="#1e293b">完整匹配示例（官方举例 1 + 举例 2 合并推演）</text>

    <rect x="30" y="222" width="900" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="46" y="250" font-size="13" font-weight="700" fill="#1e293b">请求 1</text>
    <text x="46" y="268" font-size="11" fill="#475569">输入 = A + B</text>
    <rect x="120" y="236" width="120" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="180" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">A</text>
    <rect x="245" y="236" width="100" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="295" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">B</text>
    <rect x="620" y="234" width="296" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="768" y="259" text-anchor="middle" font-size="12" fill="#1e293b">落盘缓存前缀单元 [ A + B ]</text>

    <rect x="30" y="300" width="900" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="46" y="328" font-size="13" font-weight="700" fill="#1e293b">请求 2</text>
    <text x="46" y="346" font-size="11" fill="#475569">输入 = A + B + C</text>
    <rect x="120" y="314" width="120" height="36" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <text x="180" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">A</text>
    <rect x="245" y="314" width="100" height="36" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <text x="295" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">B</text>
    <rect x="350" y="314" width="100" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="400" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">C</text>
    <rect x="620" y="312" width="296" height="40" rx="8" fill="#f0fdf4" stroke="#10b981"/>
    <text x="768" y="337" text-anchor="middle" font-size="12" fill="#1e293b">命中 [A+B]：A、B 走缓存，只算 C</text>

    <rect x="30" y="378" width="900" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="46" y="406" font-size="13" font-weight="700" fill="#1e293b">请求 3</text>
    <text x="46" y="424" font-size="11" fill="#475569">输入 = A + C</text>
    <rect x="120" y="392" width="120" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="180" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">A</text>
    <rect x="245" y="392" width="100" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="295" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">C</text>
    <rect x="620" y="386" width="296" height="48" rx="8" fill="#fef2f2" stroke="#ef4444"/>
    <text x="768" y="406" text-anchor="middle" font-size="12" fill="#1e293b">未命中：A + C 无法完整匹配 [A+B]</text>
    <text x="768" y="424" text-anchor="middle" font-size="11" fill="#475569">但系统检测到公共前缀 A → 落盘 [A]</text>

    <rect x="30" y="456" width="900" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="46" y="484" font-size="13" font-weight="700" fill="#1e293b">请求 4</text>
    <text x="46" y="502" font-size="11" fill="#475569">输入 = A + D</text>
    <rect x="120" y="470" width="120" height="36" rx="6" fill="#f0fdf4" stroke="#10b981"/>
    <text x="180" y="493" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">A</text>
    <rect x="245" y="470" width="100" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="295" y="493" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">D</text>
    <rect x="620" y="468" width="296" height="40" rx="8" fill="#f0fdf4" stroke="#10b981"/>
    <text x="768" y="493" text-anchor="middle" font-size="12" fill="#1e293b">命中 [A]：A 走缓存，只算 D</text>

    <rect x="120" y="540" width="16" height="14" rx="3" fill="#f0fdf4" stroke="#10b981"/>
    <text x="142" y="552" font-size="11" fill="#475569">缓存命中部分</text>
    <rect x="230" y="540" width="16" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="252" y="552" font-size="11" fill="#475569">需现场计算</text>
    <rect x="330" y="540" width="16" height="14" rx="3" fill="#fef2f2" stroke="#ef4444"/>
    <text x="352" y="552" font-size="11" fill="#475569">未命中</text>
    <text x="30" y="580" font-size="11" fill="#475569">对比旧机制（64-token 块粒度匹配）：A + C 本可直接命中 A 部分；新机制下需等系统把 A 落盘为独立单元（秒级）后，后续请求才能命中。</text>
  </g>
</svg>
