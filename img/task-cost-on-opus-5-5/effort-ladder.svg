<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect width="960" height="420" fill="#f8fafc"/>

  <text x="480" y="46" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">难度档位：high 的价值是省掉一次重试</text>
  <text x="480" y="71" text-anchor="middle" font-size="12" fill="#64748b">high 大约多花 20K thinking token ≈ $0.40，约等于一次十轮重试的成本</text>

  <line x1="60" y1="300" x2="900" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="82" y="244" width="140" height="56" rx="4" fill="#e2e8f0"/>
  <text x="152" y="322" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">low</text>
  <text x="152" y="340" text-anchor="middle" font-size="11" fill="#64748b">机械改动、套用已知模式</text>

  <rect x="246" y="212" width="140" height="88" rx="4" fill="#cbd5e1"/>
  <text x="316" y="322" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">medium</text>
  <text x="316" y="340" text-anchor="middle" font-size="11" fill="#64748b">范围明确的日常活</text>

  <rect x="410" y="176" width="140" height="124" rx="4" fill="#3b82f6"/>
  <text x="480" y="166" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="600">+20K thinking ≈ $0.40</text>
  <text x="480" y="322" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">high</text>
  <text x="480" y="340" text-anchor="middle" font-size="11" fill="#64748b">medium 卡住时才升</text>

  <rect x="574" y="140" width="140" height="160" rx="4" fill="#94a3b8"/>
  <text x="644" y="322" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">xhigh</text>
  <text x="644" y="340" text-anchor="middle" font-size="11" fill="#64748b">难题</text>

  <rect x="738" y="104" width="140" height="196" rx="4" fill="#64748b"/>
  <text x="808" y="322" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">max</text>
  <text x="808" y="340" text-anchor="middle" font-size="11" fill="#64748b">单次会话使用</text>

  <rect x="40" y="358" width="880" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="385" text-anchor="middle" font-size="12.5" fill="#1e293b">顺序：<tspan font-weight="600">① 先给模型一个能自检的手段</tspan> → ② 再升 effort → ③ 最后才换模型</text>
</svg>
