<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="420" fill="#f8fafc"/>

  <text x="480" y="46" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">同样的 token，Opus 5.5 少付 31%</text>
  <text x="480" y="71" text-anchor="middle" font-size="12" fill="#64748b">示例会话：2.0M 缓存读 + 200K 新输入 + 60K 输出</text>

  <rect x="40" y="92" width="560" height="250" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="72" y="126" font-size="12" fill="#94a3b8">项目</text>
  <text x="410" y="126" text-anchor="end" font-size="12" fill="#94a3b8">Opus 5</text>
  <text x="568" y="126" text-anchor="end" font-size="12" fill="#94a3b8">Opus 5.5</text>
  <line x1="64" y1="140" x2="576" y2="140" stroke="#e2e8f0"/>

  <text x="72" y="174" font-size="12.5" fill="#1e293b">缓存读 2.0M</text>
  <text x="410" y="174" text-anchor="end" font-size="12.5" fill="#64748b">$1.00</text>
  <text x="568" y="174" text-anchor="end" font-size="12.5" fill="#1e293b">$0.40</text>

  <text x="72" y="210" font-size="12.5" fill="#1e293b">新输入 200K</text>
  <text x="410" y="210" text-anchor="end" font-size="12.5" fill="#64748b">$1.00</text>
  <text x="568" y="210" text-anchor="end" font-size="12.5" fill="#1e293b">$0.80</text>

  <text x="72" y="246" font-size="12.5" fill="#1e293b">输出 60K</text>
  <text x="410" y="246" text-anchor="end" font-size="12.5" fill="#64748b">$1.50</text>
  <text x="568" y="246" text-anchor="end" font-size="12.5" fill="#1e293b">$1.20</text>

  <line x1="64" y1="266" x2="576" y2="266" stroke="#e2e8f0"/>
  <text x="72" y="300" font-size="13" fill="#1e293b" font-weight="600">合计</text>
  <text x="410" y="300" text-anchor="end" font-size="14" fill="#64748b">$3.50</text>
  <text x="568" y="300" text-anchor="end" font-size="16" fill="#3b82f6" font-weight="700">$2.40</text>

  <rect x="620" y="92" width="300" height="250" rx="10" fill="#ffffff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="770" y="126" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">月度账单估算</text>
  <text x="770" y="148" text-anchor="middle" font-size="11" fill="#94a3b8">10 任务/天 × 22 工作日</text>
  <text x="770" y="196" text-anchor="middle" font-size="13.5" fill="#64748b">Opus 5 · $770 / 月</text>
  <text x="770" y="228" text-anchor="middle" font-size="14" fill="#3b82f6" font-weight="600">Opus 5.5 · $528 / 月</text>
  <rect x="668" y="256" width="204" height="42" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="770" y="282" text-anchor="middle" font-size="13" fill="#047857" font-weight="600">每月少 $242（−31%）</text>

  <rect x="40" y="360" width="440" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="260" y="385" text-anchor="middle" font-size="12" fill="#475569">输入 / 输出单价各降 20% → $4 / $20</text>
  <rect x="500" y="360" width="420" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="710" y="385" text-anchor="middle" font-size="12" fill="#475569">缓存读取降 60%：从输入的 1/10 降到 1/20</text>
</svg>
