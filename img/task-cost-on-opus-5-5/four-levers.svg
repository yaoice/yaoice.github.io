<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="420" fill="#f8fafc"/>

  <text x="480" y="48" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">一次任务的成本由四个杠杆决定</text>
  <text x="480" y="73" text-anchor="middle" font-size="12" fill="#64748b">前三个决定「处理多少 token」，第四个决定「每个 token 多少钱」</text>

  <g>
    <rect x="40" y="100" width="880" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
    <circle cx="86" cy="136" r="15" fill="#3b82f6"/>
    <text x="86" y="141" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">1</text>
    <text x="118" y="131" font-size="13.5" fill="#1e293b" font-weight="600">轮数</text>
    <text x="118" y="152" font-size="11.5" fill="#64748b">每一轮都重发「到目前为止的全部对话」——这是最强的放大器</text>
    <text x="896" y="133" text-anchor="end" font-size="15" fill="#3b82f6" font-weight="600">40 轮 → 2.8M 输入</text>
    <text x="896" y="153" text-anchor="end" font-size="11" fill="#94a3b8">同样任务压到 25 轮 → 1.75M</text>
  </g>

  <g>
    <rect x="40" y="180" width="880" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
    <circle cx="86" cy="216" r="15" fill="#10b981"/>
    <text x="86" y="221" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">2</text>
    <text x="118" y="211" font-size="13.5" fill="#1e293b" font-weight="600">缓存读取</text>
    <text x="118" y="232" font-size="11.5" fill="#64748b">重发的文本大多命中 prompt cache，按输入价的一个零头计费</text>
    <text x="896" y="213" text-anchor="end" font-size="15" fill="#10b981" font-weight="600">= 输入价的 5%</text>
    <text x="896" y="233" text-anchor="end" font-size="11" fill="#94a3b8">未命中则按新输入 1:1 计费</text>
  </g>

  <g>
    <rect x="40" y="260" width="880" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
    <circle cx="86" cy="296" r="15" fill="#ef4444"/>
    <text x="86" y="301" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">3</text>
    <text x="118" y="291" font-size="13.5" fill="#1e293b" font-weight="600">输出 token</text>
    <text x="118" y="312" font-size="11.5" fill="#64748b">最贵的一类：单价是输入的 5 倍，而且 thinking 也按输出计费</text>
    <text x="896" y="293" text-anchor="end" font-size="15" fill="#ef4444" font-weight="600">= 缓存读的 100 倍</text>
    <text x="896" y="313" text-anchor="end" font-size="11" fill="#94a3b8">60K 输出 = $1.20</text>
  </g>

  <g>
    <rect x="40" y="340" width="880" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
    <circle cx="86" cy="376" r="15" fill="#8b5cf6"/>
    <text x="86" y="381" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">4</text>
    <text x="118" y="371" font-size="13.5" fill="#1e293b" font-weight="600">模型定价</text>
    <text x="118" y="392" font-size="11.5" fill="#64748b">它决定上面每一项的单价，也是唯一一个你能一行命令切换的杠杆</text>
    <text x="896" y="373" text-anchor="end" font-size="14" fill="#8b5cf6" font-weight="600">$4 / $20 / $0.20</text>
    <text x="896" y="393" text-anchor="end" font-size="11" fill="#94a3b8">每百万 token：输入 / 输出 / 缓存读</text>
  </g>
</svg>
