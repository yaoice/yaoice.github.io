<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect width="960" height="450" fill="#f8fafc"/>

  <text x="480" y="46" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">缓存经济学：一次写入等于 25 次读取</text>
  <text x="480" y="71" text-anchor="middle" font-size="12" fill="#64748b">以 120K 上下文为例，Opus 5.5 定价 —— 缓存让输入价有了第二个数量级</text>

  <line x1="60" y1="344" x2="900" y2="344" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="100" y="338" width="72" height="6" rx="2" fill="#10b981"/>
  <text x="136" y="330" text-anchor="middle" font-size="13" fill="#047857" font-weight="600">$0.02</text>
  <text x="136" y="366" text-anchor="middle" font-size="11.5" fill="#475569">读取一次</text>

  <rect x="210" y="194" width="72" height="150" rx="4" fill="#f59e0b"/>
  <text x="246" y="186" text-anchor="middle" font-size="13" fill="#b45309" font-weight="600">$0.60</text>
  <text x="246" y="366" text-anchor="middle" font-size="11.5" fill="#475569">写入一次</text>
  <text x="246" y="384" text-anchor="middle" font-size="10.5" fill="#94a3b8">5 分钟缓存</text>

  <rect x="320" y="104" width="72" height="240" rx="4" fill="#ef4444"/>
  <text x="356" y="96" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="600">$0.96</text>
  <text x="356" y="366" text-anchor="middle" font-size="11.5" fill="#475569">写入一次</text>
  <text x="356" y="384" text-anchor="middle" font-size="10.5" fill="#94a3b8">1 小时缓存</text>

  <text x="690" y="152" text-anchor="middle" font-size="30" fill="#3b82f6" font-weight="700">1 : 25</text>
  <text x="690" y="176" text-anchor="middle" font-size="12" fill="#64748b">一次写入 ≈ 25 次读取的价格</text>
  <line x1="470" y1="196" x2="900" y2="196" stroke="#e2e8f0"/>

  <text x="470" y="222" font-size="12.5" fill="#1e293b" font-weight="600">会触发缓存写入的动作</text>
  <text x="470" y="250" font-size="12" fill="#475569">· 暂停超过缓存生命周期（订阅 1 小时 / API 5 分钟）</text>
  <text x="470" y="274" font-size="12" fill="#475569">· 改动 effort 或 thinking 档位</text>
  <text x="470" y="298" font-size="12" fill="#475569">· 连接或断开 MCP server</text>
  <text x="470" y="322" font-size="12" fill="#475569">· 切换模型</text>
  <text x="470" y="346" font-size="12" fill="#475569">· 会话压缩（compact）</text>

  <rect x="40" y="392" width="880" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="417" text-anchor="middle" font-size="12" fill="#475569">缓存是前缀存储：只从请求开头匹配 —— 改工具定义会清空全部，改系统提示只从该点起失效</text>
</svg>
