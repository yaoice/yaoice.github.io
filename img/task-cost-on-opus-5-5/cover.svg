<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="400" fill="#f8fafc"/>

  <text x="480" y="52" text-anchor="middle" font-size="21" fill="#1e293b" font-weight="600">你买的不是 token，是一个做完的任务</text>
  <text x="480" y="78" text-anchor="middle" font-size="12.5" fill="#64748b">同一次会话的 token 数完全一样，Opus 5.5 的账单少 31%</text>

  <text x="96" y="140" font-size="13" fill="#475569" font-weight="600">Opus 5</text>
  <rect x="200" y="118" width="540" height="40" rx="6" fill="#cbd5e1"/>
  <text x="470" y="144" text-anchor="middle" font-size="13" fill="#334155">$3.50 / 会话</text>

  <text x="96" y="204" font-size="13" fill="#475569" font-weight="600">Opus 5.5</text>
  <rect x="200" y="182" width="540" height="40" rx="6" fill="#e2e8f0"/>
  <rect x="200" y="182" width="370" height="40" rx="6" fill="#3b82f6"/>
  <text x="385" y="208" text-anchor="middle" font-size="13" fill="#ffffff">$2.40 / 会话</text>

  <line x1="570" y1="224" x2="570" y2="240" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="740" y1="224" x2="740" y2="240" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="570" y1="240" x2="740" y2="240" stroke="#10b981" stroke-width="1"/>
  <text x="655" y="258" text-anchor="middle" font-size="12" fill="#047857">省下 $1.10 · −31%</text>

  <g>
    <rect x="30" y="296" width="210" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
    <text x="135" y="320" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">轮数</text>
    <text x="135" y="339" text-anchor="middle" font-size="10.5" fill="#64748b">决定重发多少上下文</text>
  </g>
  <g>
    <rect x="260" y="296" width="210" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
    <text x="365" y="320" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">缓存读取</text>
    <text x="365" y="339" text-anchor="middle" font-size="10.5" fill="#64748b">输入价的 5%</text>
  </g>
  <g>
    <rect x="490" y="296" width="210" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
    <text x="595" y="320" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">输出 token</text>
    <text x="595" y="339" text-anchor="middle" font-size="10.5" fill="#64748b">输入价的 5 倍</text>
  </g>
  <g>
    <rect x="720" y="296" width="210" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
    <text x="825" y="320" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">模型定价</text>
    <text x="825" y="339" text-anchor="middle" font-size="10.5" fill="#64748b">决定每个 token 单价</text>
  </g>

  <text x="480" y="382" text-anchor="middle" font-size="11" fill="#94a3b8">示例会话：2.0M 缓存读 + 200K 新输入 + 60K 输出，按 API 列表价</text>
</svg>
