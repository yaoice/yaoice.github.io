<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="470" fill="#f8fafc"/>

  <text x="480" y="46" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">三档分工：什么时候升级，什么时候回落</text>
  <text x="480" y="71" text-anchor="middle" font-size="12" fill="#64748b">判断规则不是「等第三次失败」，而是「同一个问题失败两次就换」</text>

  <rect x="40" y="96" width="880" height="88" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="72" y="132" font-size="14" fill="#1e293b" font-weight="600">小模型 · Haiku / Sonnet</text>
  <text x="72" y="156" font-size="11.5" fill="#94a3b8">检索 · 读日志 · 定位定义</text>
  <line x1="352" y1="112" x2="352" y2="168" stroke="#e2e8f0"/>
  <text x="376" y="132" font-size="12" fill="#475569">· 在 subagent 定义里写 model: haiku，或设 CLAUDE_CODE_SUBAGENT_MODEL</text>
  <text x="376" y="156" font-size="12" fill="#475569">· 只交给它「错了容易发现」的活：搜错文件会把主模型带到错的文件上</text>

  <line x1="480" y1="188" x2="480" y2="200" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="480,204 476,196 484,196" fill="#3b82f6"/>
  <text x="494" y="201" font-size="10.5" fill="#3b82f6">更难</text>

  <rect x="40" y="204" width="880" height="88" rx="10" fill="#ffffff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="72" y="240" font-size="14" fill="#1e293b" font-weight="600">Opus 5.5 · 日常主力</text>
  <text x="72" y="264" font-size="11.5" fill="#94a3b8">$4 / $20 / $0.20 每百万</text>
  <line x1="352" y1="220" x2="352" y2="276" stroke="#e2e8f0"/>
  <text x="376" y="240" font-size="12" fill="#475569">· 跨文件功能开发、调试、带后续修改的 code review</text>
  <text x="376" y="264" font-size="12" fill="#475569">· medium 起步；同一个问题连续两次失败，就往上走</text>

  <line x1="480" y1="296" x2="480" y2="308" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="480,312 476,304 484,304" fill="#3b82f6"/>
  <text x="494" y="309" font-size="10.5" fill="#3b82f6">更难</text>

  <rect x="40" y="312" width="880" height="88" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="72" y="348" font-size="14" fill="#1e293b" font-weight="600">Fable 5.1 · 升级档</text>
  <text x="72" y="372" font-size="11.5" fill="#94a3b8">$10 / $50 / $0.25 每百万</text>
  <line x1="352" y1="328" x2="352" y2="384" stroke="#e2e8f0"/>
  <text x="376" y="348" font-size="12" fill="#475569">· 无人值守长跑、没有现成模式的问题、大规模多 subagent 改动</text>
  <text x="376" y="372" font-size="12" fill="#475569">· 问题解决后立刻换回 Opus 5.5，它的延迟更低、交互更便宜</text>

  <rect x="40" y="416" width="880" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="441" text-anchor="middle" font-size="12" fill="#475569">缓存属于上一个模型：切换后第一轮要为整段对话付写入价 —— 先 /compact，或带一份简短计划重开</text>
</svg>
