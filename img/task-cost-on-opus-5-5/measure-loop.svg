<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="410" fill="#f8fafc"/>

  <text x="480" y="46" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">用三个读数看穿一次会话</text>
  <text x="480" y="71" text-anchor="middle" font-size="12" fill="#64748b">在会话里跑 /usage 或 /cost；订阅计划下金额是参考值，不是账单</text>

  <rect x="40" y="96" width="280" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="64" y="134" font-size="14.5" fill="#1e293b" font-weight="600">缓存占比</text>
  <text x="64" y="158" font-size="11.5" fill="#94a3b8">长会话里它应该很高</text>
  <line x1="60" y1="172" x2="300" y2="172" stroke="#e2e8f0"/>
  <text x="64" y="194" font-size="11.5" fill="#475569" font-weight="600">偏低说明：</text>
  <text x="64" y="216" font-size="11.5" fill="#475569">中途长时间暂停</text>
  <text x="64" y="236" font-size="11.5" fill="#475569">临时改了 effort 或模型</text>
  <text x="64" y="256" font-size="11.5" fill="#475569">会话中挂载了 MCP</text>

  <rect x="340" y="96" width="280" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="364" y="134" font-size="14.5" fill="#1e293b" font-weight="600">输出 ÷ 输入</text>
  <text x="364" y="158" font-size="11.5" fill="#94a3b8">输出是最贵的那一类</text>
  <line x1="360" y1="172" x2="600" y2="172" stroke="#e2e8f0"/>
  <text x="364" y="194" font-size="11.5" fill="#475569" font-weight="600">小改动却大量输出：</text>
  <text x="364" y="216" font-size="11.5" fill="#475569">effort 开得太高</text>
  <text x="364" y="236" font-size="11.5" fill="#475569">或者在反复重试</text>

  <rect x="640" y="96" width="280" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="664" y="134" font-size="14.5" fill="#1e293b" font-weight="600">总输入 ÷ 会话大小</text>
  <text x="664" y="158" font-size="11.5" fill="#94a3b8">两个数字不该差太多倍</text>
  <line x1="660" y1="172" x2="900" y2="172" stroke="#e2e8f0"/>
  <text x="664" y="194" font-size="11.5" fill="#475569" font-weight="600">总输入是会话的许多倍：</text>
  <text x="664" y="216" font-size="11.5" fill="#475569">轮数太多</text>
  <text x="664" y="236" font-size="11.5" fill="#475569">每轮都在重发全部上下文</text>

  <rect x="40" y="296" width="880" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="64" y="324" font-size="12.5" fill="#1e293b" font-weight="600">怎么量</text>
  <text x="64" y="348" font-size="12" fill="#475569">① 挑一个真实任务（不是玩具），用 /model 切换模型各跑一遍；② 记下轮数、输出 token、花费；③ 做三到四个任务再下结论。</text>
  <text x="64" y="374" font-size="12" fill="#64748b">参考基线：企业平均每位开发者每个活跃日约 $13，90% 的用户在 $30 以内。</text>
</svg>
