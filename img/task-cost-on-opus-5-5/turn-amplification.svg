<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect width="960" height="380" fill="#f8fafc"/>

  <text x="480" y="46" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">上下文只有 120K，账单却处理了 2.8M</text>
  <text x="480" y="71" text-anchor="middle" font-size="12" fill="#64748b">每一轮都要重发全部历史：对话大小是「水位」，输入总量是「过水量」</text>

  <text x="196" y="150" text-anchor="end" font-size="12.5" fill="#475569">对话峰值</text>
  <rect x="210" y="128" width="30" height="34" rx="3" fill="#94a3b8"/>
  <text x="252" y="150" font-size="12" fill="#64748b">120K（单轮最大发送量）</text>

  <text x="196" y="212" text-anchor="end" font-size="12.5" fill="#475569">25 轮累计</text>
  <rect x="210" y="186" width="438" height="34" rx="3" fill="#3b82f6"/>
  <text x="636" y="208" text-anchor="end" font-size="12" fill="#ffffff">1.75M → $1.02</text>

  <text x="196" y="274" text-anchor="end" font-size="12.5" fill="#475569">40 轮累计</text>
  <rect x="210" y="248" width="700" height="34" rx="3" fill="#1e293b"/>
  <text x="898" y="270" text-anchor="end" font-size="12" fill="#ffffff">2.8M → $1.62</text>

  <rect x="40" y="304" width="880" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="326" text-anchor="middle" font-size="12" fill="#1e293b">同样 2.8M 输入：<tspan fill="#ef4444" font-weight="600">0% 缓存命中 = $11.20</tspan>　·　90% = $1.62　·　96% ≈ $0.99</text>
  <text x="480" y="345" text-anchor="middle" font-size="11" fill="#94a3b8">对话本身从没超过 120K —— 多出来的 2.68M 全是「重发」</text>
</svg>
