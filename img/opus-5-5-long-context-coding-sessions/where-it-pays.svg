<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="400" fill="#f8fafc"/>

  <text x="480" y="48" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">收益不是均匀发放的：看你的任务有多「开放」</text>
  <text x="480" y="73" text-anchor="middle" font-size="12" fill="#64748b">轮数差异只在模型有机会走错路的地方才会出现</text>

  <rect x="40" y="100" width="420" height="250" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <rect x="40" y="100" width="420" height="44" rx="10" fill="#f1f5f9"/>
  <rect x="40" y="134" width="420" height="10" fill="#f1f5f9"/>
  <text x="250" y="128" text-anchor="middle" font-size="13.5" fill="#334155" font-weight="600">范围清晰的任务</text>

  <text x="66" y="176" font-size="12" fill="#475569">改一个函数、补一处测试、按模板重构</text>
  <text x="66" y="200" font-size="12" fill="#475569">两代模型轮数基本相同</text>

  <rect x="66" y="222" width="368" height="26" rx="5" fill="#e2e8f0"/>
  <rect x="66" y="222" width="114" height="26" rx="5" fill="#94a3b8"/>
  <text x="123" y="240" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">−31%</text>
  <text x="196" y="240" font-size="11" fill="#64748b">收益 = 纯降价</text>

  <text x="66" y="286" font-size="12" fill="#1e293b" font-weight="600">你拿到的：账单打折</text>
  <text x="66" y="310" font-size="11.5" fill="#64748b">该省的省了，但没有额外惊喜</text>
  <text x="66" y="332" font-size="11.5" fill="#94a3b8">这类任务本来就该往更便宜的模型路由</text>

  <rect x="500" y="100" width="420" height="250" rx="10" fill="#ffffff" stroke="#c4b5fd" filter="url(#s)"/>
  <rect x="500" y="100" width="420" height="44" rx="10" fill="#f5f3ff"/>
  <rect x="500" y="134" width="420" height="10" fill="#f5f3ff"/>
  <text x="710" y="128" text-anchor="middle" font-size="13.5" fill="#6d28d9" font-weight="600">开放式 / 委派式任务</text>

  <text x="526" y="176" font-size="12" fill="#475569">跨模块排障、架构迁移、无人值守的长跑</text>
  <text x="526" y="200" font-size="12" fill="#475569">轮数本身就是最大的方差来源</text>

  <rect x="526" y="222" width="368" height="26" rx="5" fill="#ede9fe"/>
  <rect x="526" y="222" width="230" height="26" rx="5" fill="#8b5cf6"/>
  <text x="641" y="240" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">降价 + 少走的轮次</text>
  <text x="772" y="240" font-size="11" fill="#7c3aed">可达近半</text>

  <text x="526" y="286" font-size="12" fill="#1e293b" font-weight="600">你拿到的：账单打折 + 少走弯路</text>
  <text x="526" y="310" font-size="11.5" fill="#64748b">最难的一档任务从「做不完」变成「做完了」</text>
  <text x="526" y="332" font-size="11.5" fill="#94a3b8">这才是 −40% 说法真正的适用区间</text>

  <text x="480" y="382" text-anchor="middle" font-size="11.5" fill="#475569">“No single number holds for every codebase, so measure it.” —— 没有一个数字适用于所有代码库，自己测</text>
</svg>
