<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="400" fill="#f8fafc"/>

  <text x="480" y="50" text-anchor="middle" font-size="21" fill="#1e293b" font-weight="600">「成本低 40%」不是一次降价，是三层叠加</text>
  <text x="480" y="76" text-anchor="middle" font-size="12.5" fill="#64748b">定价层 + 缓存框架层 + 模型行为层，依次把同一次会话的账单往下压</text>

  <text x="180" y="130" text-anchor="end" font-size="12.5" fill="#475569" font-weight="600">Opus 5 基线</text>
  <rect x="200" y="110" width="700" height="34" rx="6" fill="#cbd5e1"/>
  <text x="884" y="132" text-anchor="end" font-size="13" fill="#334155" font-weight="600">$3.50</text>

  <text x="180" y="185" text-anchor="end" font-size="12.5" fill="#475569" font-weight="600">+ 定价层</text>
  <rect x="200" y="165" width="700" height="34" rx="6" fill="#e2e8f0"/>
  <rect x="200" y="165" width="480" height="34" rx="6" fill="#3b82f6"/>
  <text x="664" y="187" text-anchor="end" font-size="13" fill="#ffffff" font-weight="600">$2.40</text>
  <text x="700" y="187" font-size="11.5" fill="#3b82f6">缓存读 −60% / 输入输出 −20%</text>

  <text x="180" y="240" text-anchor="end" font-size="12.5" fill="#475569" font-weight="600">+ 缓存框架层</text>
  <rect x="200" y="220" width="700" height="34" rx="6" fill="#e2e8f0"/>
  <rect x="200" y="220" width="400" height="34" rx="6" fill="#10b981"/>
  <text x="584" y="242" text-anchor="end" font-size="13" fill="#ffffff" font-weight="600">$2.00</text>
  <text x="620" y="242" font-size="11.5" fill="#059669">未命中缓存的输入减少一半</text>

  <text x="180" y="295" text-anchor="end" font-size="12.5" fill="#475569" font-weight="600">+ 模型行为层</text>
  <rect x="200" y="275" width="700" height="34" rx="6" fill="#e2e8f0"/>
  <rect x="200" y="275" width="350" height="34" rx="6" fill="#8b5cf6"/>
  <text x="534" y="297" text-anchor="end" font-size="13" fill="#ffffff" font-weight="600">更低</text>
  <text x="570" y="297" font-size="11.5" fill="#7c3aed">同样任务更少轮次（Zeta Labs：成本近半）</text>

  <line x1="200" y1="330" x2="900" y2="330" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="356" text-anchor="middle" font-size="12" fill="#475569">前两层可按列表价算清，第三层取决于任务开放程度——所以官方给的是「约 40%」而不是一个定值</text>
  <text x="480" y="382" text-anchor="middle" font-size="11" fill="#94a3b8">示例会话：2.0M 缓存读 + 200K 新输入 + 60K 输出，按 API 列表价自算；末行为实测方向，非列表价推算</text>
</svg>
