<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="430" fill="#f8fafc"/>

  <text x="480" y="48" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">每个会话的 prompt 数量没变，prompt 里面的东西全变了</text>
  <text x="480" y="73" text-anchor="middle" font-size="12" fill="#64748b">Claude Code 聚合数据：2026 年 3 月 → 9 月</text>

  <rect x="30" y="98" width="440" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <rect x="30" y="98" width="440" height="42" rx="10" fill="#eff6ff"/>
  <rect x="30" y="130" width="440" height="10" fill="#eff6ff"/>
  <text x="54" y="125" font-size="13.5" fill="#1e40af" font-weight="600">一、会话变得更「重」</text>

  <text x="54" y="180" font-size="12.5" fill="#1e293b">每个 prompt 的工作时长</text>
  <text x="446" y="180" text-anchor="end" font-size="16" fill="#3b82f6" font-weight="600">×3.3</text>
  <line x1="54" y1="196" x2="446" y2="196" stroke="#f1f5f9" stroke-width="1"/>

  <text x="54" y="228" font-size="12.5" fill="#1e293b">每个 prompt 的模型调用次数</text>
  <text x="446" y="228" text-anchor="end" font-size="16" fill="#3b82f6" font-weight="600">+40%</text>
  <line x1="54" y1="244" x2="446" y2="244" stroke="#f1f5f9" stroke-width="1"/>

  <text x="54" y="276" font-size="12.5" fill="#1e293b">人工打断次数</text>
  <text x="446" y="276" text-anchor="end" font-size="16" fill="#10b981" font-weight="600">−68%</text>
  <line x1="54" y1="292" x2="446" y2="292" stroke="#f1f5f9" stroke-width="1"/>

  <text x="54" y="324" font-size="12.5" fill="#1e293b">连接工具服务器 / 使用 skill 的比例</text>
  <text x="446" y="324" text-anchor="end" font-size="16" fill="#3b82f6" font-weight="600">×2</text>

  <text x="54" y="368" font-size="11.5" fill="#64748b">读法：开发者把任务整段交出去了，</text>
  <text x="54" y="386" font-size="11.5" fill="#64748b">而不是坐在旁边一步步喂。</text>

  <rect x="490" y="98" width="440" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <rect x="490" y="98" width="440" height="42" rx="10" fill="#f5f3ff"/>
  <rect x="490" y="130" width="440" height="10" fill="#f5f3ff"/>
  <text x="514" y="125" font-size="13.5" fill="#6d28d9" font-weight="600">二、上下文变得更「厚」</text>

  <text x="514" y="180" font-size="12.5" fill="#1e293b">每个请求携带的上下文量</text>
  <text x="906" y="180" text-anchor="end" font-size="16" fill="#8b5cf6" font-weight="600">×2.6</text>
  <line x1="514" y1="196" x2="906" y2="196" stroke="#f1f5f9" stroke-width="1"/>

  <text x="514" y="228" font-size="12.5" fill="#1e293b">输入 : 输出 token 比</text>
  <text x="906" y="228" text-anchor="end" font-size="16" fill="#8b5cf6" font-weight="600">189 : 1 → 324 : 1</text>
  <line x1="514" y1="244" x2="906" y2="244" stroke="#f1f5f9" stroke-width="1"/>

  <text x="514" y="276" font-size="12.5" fill="#1e293b">直接往 prompt 里粘贴文本的比例</text>
  <text x="906" y="276" text-anchor="end" font-size="16" fill="#f59e0b" font-weight="600">−1/3</text>
  <line x1="514" y1="292" x2="906" y2="292" stroke="#f1f5f9" stroke-width="1"/>

  <text x="514" y="324" font-size="12.5" fill="#475569">上下文从「手动粘贴」转向「工具自取」</text>

  <text x="514" y="368" font-size="11.5" fill="#64748b">读法：账单结构整体向输入侧倾斜，</text>
  <text x="514" y="386" font-size="11.5" fill="#64748b">上下文工程的经济影响被成倍放大。</text>

  <text x="480" y="420" text-anchor="middle" font-size="11" fill="#94a3b8">数据来源：Claude 官方博客《Coding sessions are longer and use more context》（2026-09-24）</text>
</svg>
