<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="440" fill="#f8fafc"/>

  <text x="480" y="48" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">未命中缓存的输入，按 20 倍价钱重新买一遍</text>
  <text x="480" y="73" text-anchor="middle" font-size="12" fill="#64748b">缓存读 $0.20/M vs 新输入 $4/M——所以命中率比降价更值钱</text>

  <text x="150" y="108" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="600">失效来源</text>
  <text x="480" y="108" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="600">Claude Code 侧的修复</text>
  <text x="810" y="108" text-anchor="middle" font-size="13" fill="#047857" font-weight="600">结果</text>

  <rect x="30" y="124" width="240" height="56" rx="10" fill="#ffffff" stroke="#fecaca" filter="url(#s)"/>
  <text x="50" y="146" font-size="12" fill="#1e293b" font-weight="600">刷新登录态</text>
  <text x="50" y="166" font-size="10.5" fill="#64748b">「小痛点」类意外失效</text>

  <rect x="30" y="190" width="240" height="56" rx="10" fill="#ffffff" stroke="#fecaca" filter="url(#s)"/>
  <text x="50" y="212" font-size="12" fill="#1e293b" font-weight="600">对话中途追加指令</text>
  <text x="50" y="232" font-size="10.5" fill="#64748b">前缀一改，后面全部重算</text>

  <rect x="30" y="256" width="240" height="56" rx="10" fill="#ffffff" stroke="#fecaca" filter="url(#s)"/>
  <text x="50" y="278" font-size="12" fill="#1e293b" font-weight="600">按需加载工具</text>
  <text x="50" y="298" font-size="10.5" fill="#64748b">工具定义插进已缓存前缀</text>

  <rect x="30" y="322" width="240" height="56" rx="10" fill="#ffffff" stroke="#fecaca" filter="url(#s)"/>
  <text x="50" y="344" font-size="12" fill="#1e293b" font-weight="600">中途切模型 / 切 effort</text>
  <text x="50" y="364" font-size="10.5" fill="#64748b">整条缓存作废</text>

  <path d="M278 152 L322 152" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M316 147 L323 152 L316 157" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M278 218 L322 218" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M316 213 L323 218 L316 223" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M278 284 L322 284" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M316 279 L323 284 L316 289" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M278 350 L322 350" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M316 345 L323 350 L316 355" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="330" y="124" width="300" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="350" y="146" font-size="12" fill="#1e293b" font-weight="600">修掉登录刷新等意外失效路径</text>
  <text x="350" y="166" font-size="10.5" fill="#475569">用户侧无感，命中率直接回来</text>

  <rect x="330" y="190" width="300" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="350" y="212" font-size="12" fill="#1e293b" font-weight="600">effort level 可中途切换不重置缓存</text>
  <text x="350" y="232" font-size="10.5" fill="#475569">Opus 5.5 / Fable 5.1 等新模型支持</text>

  <rect x="330" y="256" width="300" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="350" y="278" font-size="12" fill="#1e293b" font-weight="600">分叉的 subagent 继承父级缓存</text>
  <text x="350" y="298" font-size="10.5" fill="#475569">相同上下文不再重复付费</text>

  <rect x="330" y="322" width="300" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="350" y="344" font-size="12" fill="#1e293b" font-weight="600">1 小时缓存 TTL 开放给 API / 云厂商</text>
  <text x="350" y="364" font-size="10.5" fill="#475569">订阅用户此前已有</text>

  <path d="M638 251 L682 251" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M676 246 L683 251 L676 256" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="690" y="150" width="240" height="202" rx="10" fill="#ffffff" stroke="#a7f3d0" filter="url(#s)"/>
  <text x="810" y="192" text-anchor="middle" font-size="12.5" fill="#475569">未命中缓存的输入</text>
  <text x="810" y="242" text-anchor="middle" font-size="38" fill="#10b981" font-weight="600">−50%</text>
  <text x="810" y="272" text-anchor="middle" font-size="11.5" fill="#64748b">上下文量同期 ×2.6</text>
  <text x="810" y="292" text-anchor="middle" font-size="11.5" fill="#64748b">按趋势本该升，实际反着走</text>
  <line x1="714" y1="310" x2="906" y2="310" stroke="#f1f5f9"/>
  <text x="810" y="332" text-anchor="middle" font-size="11.5" fill="#047857">示例会话可再省 $0.40</text>

  <text x="480" y="414" text-anchor="middle" font-size="12" fill="#475569">$2.40 → $2.00，累计 −43%——官方那句「约 40%」到这里才对得上</text>
</svg>
