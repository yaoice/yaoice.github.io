<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="400" fill="#f8fafc"/>

  <text x="480" y="48" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">少走一轮，等于省下 30 万个缓存 token</text>
  <text x="480" y="73" text-anchor="middle" font-size="12" fill="#64748b">“A reduced turn is even more cost efficient than a cached token.”</text>

  <rect x="40" y="100" width="380" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="230" y="130" text-anchor="middle" font-size="12.5" fill="#475569" font-weight="600">1 个缓存 token</text>
  <rect x="225" y="150" width="10" height="10" rx="2" fill="#94a3b8"/>
  <text x="230" y="198" text-anchor="middle" font-size="20" fill="#64748b" font-weight="600">$0.0000002</text>
  <text x="230" y="226" text-anchor="middle" font-size="11.5" fill="#94a3b8">降价 60% 之后的单价</text>

  <rect x="540" y="100" width="380" height="150" rx="10" fill="#ffffff" stroke="#bfdbfe" filter="url(#s)"/>
  <text x="730" y="130" text-anchor="middle" font-size="12.5" fill="#1d4ed8" font-weight="600">1 轮（100K 上下文 + 2K 输出）</text>
  <rect x="610" y="146" width="240" height="18" rx="4" fill="#3b82f6"/>
  <text x="730" y="198" text-anchor="middle" font-size="20" fill="#3b82f6" font-weight="600">$0.06</text>
  <text x="730" y="226" text-anchor="middle" font-size="11.5" fill="#64748b">缓存读 $0.02 + 输出 $0.04</text>

  <text x="480" y="180" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">×30 万</text>
  <path d="M424 160 L536 160" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M530 155 L537 160 L530 165" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="210" text-anchor="middle" font-size="11" fill="#94a3b8">同一量级</text>

  <text x="60" y="288" font-size="12.5" fill="#475569" font-weight="600">Zeta Labs 实测（Opus 5.5 对比 Opus 5）</text>
  <rect x="60" y="300" width="270" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="195" y="324" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">轮次与工具调用</text>
  <text x="195" y="346" text-anchor="middle" font-size="13" fill="#10b981" font-weight="600">更少</text>

  <rect x="345" y="300" width="270" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="480" y="324" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">每任务成本</text>
  <text x="480" y="346" text-anchor="middle" font-size="13" fill="#10b981" font-weight="600">接近减半</text>

  <rect x="630" y="300" width="270" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="765" y="324" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">最难任务的完成数量</text>
  <text x="765" y="346" text-anchor="middle" font-size="13" fill="#8b5cf6" font-weight="600">翻倍</text>

  <text x="480" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">单轮成本按 Opus 5.5 列表价自算；输出生成速度另有 30% 以上提升，省时间但不省 token</text>
</svg>
