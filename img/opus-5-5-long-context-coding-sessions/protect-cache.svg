<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="400" fill="#f8fafc"/>

  <text x="480" y="48" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">一条长会话上的三个决策点：保住你的缓存读</text>
  <text x="480" y="73" text-anchor="middle" font-size="12" fill="#64748b">上方是常见做法，下方是应该改成的做法</text>

  <line x1="90" y1="216" x2="880" y2="216" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M872 210 L881 216 L872 222" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="244" font-size="11" fill="#94a3b8">会话开始</text>
  <text x="880" y="244" text-anchor="end" font-size="11" fill="#94a3b8">会话结束</text>

  <circle cx="200" cy="216" r="7" fill="#3b82f6"/>
  <circle cx="490" cy="216" r="7" fill="#3b82f6"/>
  <circle cx="770" cy="216" r="7" fill="#3b82f6"/>
  <text x="200" y="266" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">① 选模型</text>
  <text x="490" y="266" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">② 离开工位前</text>
  <text x="770" y="266" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">③ 长会话配置</text>

  <rect x="80" y="100" width="240" height="66" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="200" y="124" text-anchor="middle" font-size="11.5" fill="#b91c1c" font-weight="600">写到一半发现不够用，切模型</text>
  <text x="200" y="146" text-anchor="middle" font-size="11" fill="#7f1d1d">整条缓存作废，从头再读一遍</text>
  <path d="M200 170 L200 202" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3 3"/>

  <rect x="370" y="100" width="240" height="66" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="490" y="124" text-anchor="middle" font-size="11.5" fill="#b91c1c" font-weight="600">回来之后再 compact</text>
  <text x="490" y="146" text-anchor="middle" font-size="11" fill="#7f1d1d">先花钱读完旧上下文，再压缩</text>
  <path d="M490 170 L490 202" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3 3"/>

  <rect x="650" y="100" width="240" height="66" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="770" y="124" text-anchor="middle" font-size="11.5" fill="#b91c1c" font-weight="600">用默认缓存生命周期</text>
  <text x="770" y="146" text-anchor="middle" font-size="11" fill="#7f1d1d">开个会回来，缓存已经凉了</text>
  <path d="M770 170 L770 202" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3 3"/>

  <rect x="80" y="286" width="240" height="66" rx="10" fill="#ffffff" stroke="#a7f3d0" filter="url(#s)"/>
  <text x="200" y="310" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="600">会话开始时就把模型定下来</text>
  <text x="200" y="332" text-anchor="middle" font-size="11" fill="#475569">effort level 可以中途调，模型不要</text>

  <rect x="370" y="286" width="240" height="66" rx="10" fill="#ffffff" stroke="#a7f3d0" filter="url(#s)"/>
  <text x="490" y="310" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="600">走之前先 compact，再离开</text>
  <text x="490" y="332" text-anchor="middle" font-size="11" fill="#475569">让下一段会话从瘦上下文起步</text>

  <rect x="650" y="286" width="240" height="66" rx="10" fill="#ffffff" stroke="#a7f3d0" filter="url(#s)"/>
  <text x="770" y="310" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="600">把缓存 TTL 设成 1 小时</text>
  <text x="770" y="332" text-anchor="middle" font-size="11" fill="#475569">API key 与云厂商用户现已可用</text>

  <text x="480" y="384" text-anchor="middle" font-size="11.5" fill="#64748b">先量再调：在 Claude Code 里看一眼用量构成，确认缓存读到底占你账单的多少</text>
</svg>
