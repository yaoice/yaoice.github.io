<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="420" fill="#f8fafc"/>

  <text x="480" y="48" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">降价打在哪一段上，决定了它值多少钱</text>
  <text x="480" y="73" text-anchor="middle" font-size="12" fill="#64748b">同一个示例会话：2.0M 缓存读 + 200K 新输入 + 60K 输出</text>

  <text x="60" y="112" font-size="12.5" fill="#475569" font-weight="600">Opus 5 账单切片 · 合计 $3.50</text>
  <rect x="60" y="124" width="243" height="46" rx="6" fill="#94a3b8"/>
  <rect x="307" y="124" width="243" height="46" rx="6" fill="#64748b"/>
  <rect x="554" y="124" width="346" height="46" rx="6" fill="#475569"/>
  <text x="181" y="146" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">缓存读 $1.00</text>
  <text x="181" y="163" text-anchor="middle" font-size="10.5" fill="#e2e8f0">29%</text>
  <text x="428" y="146" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">新输入 $1.00</text>
  <text x="428" y="163" text-anchor="middle" font-size="10.5" fill="#e2e8f0">29%</text>
  <text x="727" y="146" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">输出 $1.50</text>
  <text x="727" y="163" text-anchor="middle" font-size="10.5" fill="#e2e8f0">43%</text>

  <path d="M181 178 L181 196" stroke="#10b981" stroke-width="1.5"/>
  <path d="M176 190 L181 197 L186 190" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <path d="M577 178 L577 196" stroke="#3b82f6" stroke-width="1.5"/>
  <path d="M572 190 L577 197 L582 190" fill="none" stroke="#3b82f6" stroke-width="1.5"/>

  <rect x="60" y="202" width="243" height="62" rx="10" fill="#ffffff" stroke="#a7f3d0" filter="url(#s)"/>
  <text x="181" y="226" text-anchor="middle" font-size="13" fill="#047857" font-weight="600">缓存读价 −60%</text>
  <text x="181" y="248" text-anchor="middle" font-size="12" fill="#475569">省下 $0.60</text>

  <rect x="330" y="202" width="570" height="62" rx="10" fill="#ffffff" stroke="#bfdbfe" filter="url(#s)"/>
  <text x="615" y="226" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="600">输入 / 输出价各 −20%</text>
  <text x="615" y="248" text-anchor="middle" font-size="12" fill="#475569">省下 $0.50</text>

  <text x="60" y="300" font-size="12.5" fill="#475569" font-weight="600">Opus 5.5 账单切片 · 合计 $2.40（−31%）</text>
  <rect x="60" y="312" width="140" height="46" rx="6" fill="#10b981"/>
  <rect x="204" y="312" width="280" height="46" rx="6" fill="#3b82f6"/>
  <rect x="488" y="312" width="420" height="46" rx="6" fill="#1d4ed8"/>
  <text x="130" y="334" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">缓存读 $0.40</text>
  <text x="130" y="351" text-anchor="middle" font-size="10.5" fill="#d1fae5">17%</text>
  <text x="344" y="334" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">新输入 $0.80</text>
  <text x="344" y="351" text-anchor="middle" font-size="10.5" fill="#dbeafe">33%</text>
  <text x="698" y="334" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">输出 $1.20</text>
  <text x="698" y="351" text-anchor="middle" font-size="10.5" fill="#dbeafe">50%</text>

  <text x="480" y="390" text-anchor="middle" font-size="12" fill="#475569">关键读法：降价后「新输入 + 输出」占到 83%——纯定价只能拿到 −31%，剩下的要靠少读、少走</text>
  <text x="480" y="410" text-anchor="middle" font-size="11" fill="#94a3b8">单价推算：Opus 5 为 $5 / $25 / $0.50，Opus 5.5 为 $4 / $20 / $0.20（每百万 token：输入 / 输出 / 缓存读）</text>
</svg>
