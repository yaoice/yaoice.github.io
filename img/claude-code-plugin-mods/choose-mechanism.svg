<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">四种扩展机制怎么选</title>
  <desc id="d">从上到下依次判断：只需指令用 Skill，要外部系统用 MCP server，用现成脚本拦截事件用 settings hook，要界面或改写事件才用 mod。</desc>
  <rect width="800" height="370" fill="#f8fafc" rx="10"/>
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">四种扩展机制怎么选</text>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#64748b">自上而下判断，命中即停：越往下能力越强，信任成本也越高</text>

  <g font-size="12" fill="#1e293b">
    <rect x="70" y="84" width="440" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="90" y="112">反复粘贴同一段指令，想让模型"记住怎么做"？</text>
    <rect x="70" y="146" width="440" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="90" y="174">模型需要访问外部系统或新工具？</text>
    <rect x="70" y="208" width="440" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="90" y="236">已有脚本，想拦截 / 放行 / 记录某个事件？</text>
    <rect x="70" y="270" width="440" height="46" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="90" y="298">要面板、横条、即时 /command，或改写事件与界面？</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="510" y1="107" x2="548" y2="107"/><line x1="510" y1="169" x2="548" y2="169"/>
    <line x1="510" y1="231" x2="548" y2="231"/><line x1="510" y1="293" x2="548" y2="293" stroke="#3b82f6"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="546,102 546,112 556,107"/><polygon points="546,164 546,174 556,169"/>
    <polygon points="546,226 546,236 556,231"/><polygon points="546,288 546,298 556,293" fill="#3b82f6"/>
  </g>

  <rect x="556" y="84" width="200" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="572" y="104" font-size="12" font-weight="700" fill="#1e293b">Skill</text>
  <text x="572" y="121" font-size="10" fill="#64748b">Markdown · 改变模型知道什么</text>
  <rect x="556" y="146" width="200" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="572" y="166" font-size="12" font-weight="700" fill="#1e293b">MCP server</text>
  <text x="572" y="183" font-size="10" fill="#64748b">任意语言服务 · 给模型加工具</text>
  <rect x="556" y="208" width="200" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="572" y="228" font-size="12" font-weight="700" fill="#1e293b">settings hook</text>
  <text x="572" y="245" font-size="10" fill="#64748b">脚本 + settings.json · 进程外</text>
  <rect x="556" y="270" width="200" height="46" rx="8" fill="#3b82f6"/>
  <text x="572" y="290" font-size="12" font-weight="700" fill="#ffffff">Mod</text>
  <text x="572" y="307" font-size="10" fill="#dbeafe">JS/TS · 进程内 · 唯一能画界面</text>

  <line x1="48" y1="90" x2="48" y2="306" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="43,304 53,304 48,314" fill="#cbd5e1"/>
  <text x="400" y="348" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">能用上面一层解决的，就不要下沉到 mod</text>
</svg>
