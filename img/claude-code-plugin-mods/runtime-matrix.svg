<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">同一个 mod，在不同运行位置的表现</title>
  <desc id="d">hooks 几乎处处运行，但绘制的界面只在终端与桌面应用中显示。</desc>
  <rect width="800" height="380" fill="#f8fafc" rx="10"/>
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">同一个 mod，在不同运行位置的表现</text>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#64748b">逻辑几乎处处运行，界面只在有终端渲染的地方出现</text>

  <rect x="40" y="80" width="720" height="250" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="80" width="720" height="34" rx="10" fill="#475569"/>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <text x="60" y="102">运行位置</text>
    <text x="520" y="102" text-anchor="middle">hooks 运行</text>
    <text x="670" y="102" text-anchor="middle">绘制内容显示</text>
  </g>
  <g stroke="#f1f5f9">
    <line x1="40" y1="146" x2="760" y2="146"/><line x1="40" y1="176" x2="760" y2="176"/>
    <line x1="40" y1="206" x2="760" y2="206"/><line x1="40" y1="236" x2="760" y2="236"/>
    <line x1="40" y1="266" x2="760" y2="266"/><line x1="40" y1="296" x2="760" y2="296"/>
  </g>
  <g font-size="11" fill="#1e293b">
    <text x="60" y="135">终端 claude（含编辑器内置终端、JetBrains 插件）</text>
    <text x="60" y="165">桌面应用 Code 标签</text>
    <text x="60" y="195">桌面应用中的 WSL 会话</text>
    <text x="60" y="225">VS Code 扩展的聊天面板</text>
    <text x="60" y="255">claude -p 与 Agent SDK</text>
    <text x="60" y="285">Remote Control（claude.ai / 手机 App）</text>
    <text x="60" y="315">云端会话</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <text x="520" y="135" fill="#10b981">● 是</text><text x="670" y="135" fill="#10b981">● 是</text>
    <text x="520" y="165" fill="#10b981">● 是</text><text x="670" y="165" fill="#f59e0b">◐ 仅终端元素除外</text>
    <text x="520" y="195" fill="#94a3b8">○ 否（不支持 plugin）</text><text x="670" y="195" fill="#94a3b8">○ 否</text>
    <text x="520" y="225" fill="#10b981">● 是</text><text x="670" y="225" fill="#94a3b8">○ 否</text>
    <text x="520" y="255" fill="#10b981">● 是</text><text x="670" y="255" fill="#94a3b8">○ 否</text>
    <text x="520" y="285" fill="#10b981">● 是（本机会话）</text><text x="670" y="285" fill="#f59e0b">◐ 只在本机终端</text>
    <text x="520" y="315" fill="#10b981">● 是（plugin 被带上时）</text><text x="670" y="315" fill="#94a3b8">○ 否</text>
  </g>
  <rect x="40" y="342" width="720" height="26" rx="6" fill="#eff6ff"/>
  <text x="400" y="359" text-anchor="middle" font-size="10.5" fill="#1e293b">会画界面的 mod 要先探测环境：画不出来时，退回成一行对话文本或命令的文本回复</text>
</svg>
