<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Claude Code Mods：把扩展装进进程里</title>
  <desc id="d">settings hook、skill、MCP server、status line 都在进程外工作；mod 以 JS/TS hooks module 的形式运行在 Claude Code 进程内，可以观察、改写、接管事件并绘制界面。</desc>
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="800" height="360" fill="#f8fafc" rx="10"/>
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Claude Code Mods：把扩展装进进程里</text>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#64748b">其他扩展机制在工具外面工作，mod 在工具里面运行</text>

  <rect x="40" y="86" width="440" height="170" rx="10" fill="#ffffff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="60" y="110" font-size="12" font-weight="700" fill="#3b82f6">Claude Code 进程（同进程）</text>
  <rect x="64" y="124" width="392" height="44" rx="8" fill="#1e293b"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">事件循环</text>
  <text x="260" y="159" text-anchor="middle" font-size="10" fill="#cbd5e1">tool.call · 提交提示词 · ui.render · /command</text>
  <line x1="260" y1="168" x2="260" y2="184" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="255,182 265,182 260,190" fill="#3b82f6"/>
  <rect x="64" y="190" width="392" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="260" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Mod = JS/TS hooks module</text>
  <text x="260" y="228" text-anchor="middle" font-size="10" fill="#475569">观察 · 改写 · 接管事件；绘制、调模型、读文件都经 mods API</text>

  <rect x="520" y="86" width="240" height="170" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="540" y="110" font-size="12" font-weight="700" fill="#475569">进程外扩展</text>
  <text x="540" y="138" font-size="11" font-weight="700" fill="#1e293b">settings hook</text>
  <text x="640" y="138" font-size="10" fill="#64748b">shell / HTTP / prompt</text>
  <text x="540" y="166" font-size="11" font-weight="700" fill="#1e293b">Skill</text>
  <text x="640" y="166" font-size="10" fill="#64748b">SKILL.md 指令</text>
  <text x="540" y="194" font-size="11" font-weight="700" fill="#1e293b">MCP server</text>
  <text x="640" y="194" font-size="10" fill="#64748b">外部工具进程</text>
  <text x="540" y="222" font-size="11" font-weight="700" fill="#1e293b">status line</text>
  <text x="640" y="222" font-size="10" fill="#64748b">状态栏脚本</text>
  <line x1="518" y1="171" x2="490" y2="171" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="492,166 492,176 482,171" fill="#94a3b8"/>

  <g font-size="11" fill="#1e293b" text-anchor="middle">
    <rect x="40" y="278" width="136" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="108" y="300">绘制可交互界面</text>
    <rect x="186" y="278" width="136" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="254" y="300">重绘自带界面</text>
    <rect x="332" y="278" width="136" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="400" y="300">介入工具调用</text>
    <rect x="478" y="278" width="136" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="546" y="300">/command 即时执行</text>
    <rect x="624" y="278" width="136" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="692" y="300">hooks 共享状态</text>
  </g>
  <text x="400" y="342" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">只有在进程内，才拿得到这五种能力，也才需要对它付出完整的信任</text>
</svg>
