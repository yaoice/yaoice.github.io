<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">mod 拿到的是你的权限，不是一个沙箱</title>
  <desc id="d">左列为 mod 能做的事，中列为三条硬边界，右列为用户和组织手里的开关。</desc>
  <rect width="800" height="380" fill="#f8fafc" rx="10"/>
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">mod 拿到的是你的权限，不是一个沙箱</text>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#64748b">装一个 mod，约等于把一段代码放进你的终端会话里常驻</text>

  <rect x="40" y="84" width="228" height="236" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="84" width="228" height="30" rx="10" fill="#475569"/>
  <text x="154" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">它能做什么</text>
  <g font-size="10.5" fill="#1e293b">
    <text x="56" y="140">· 以你的身份读写文件、起进程</text>
    <text x="56" y="166">· 发网络请求</text>
    <text x="56" y="192">· 读环境变量和设置里的 API key</text>
    <text x="56" y="218">· 看到每条提示词与工具调用</text>
    <text x="56" y="244">· 改写提示词、代你提交</text>
    <text x="56" y="270">· 在询问你之前自动批准工具调用</text>
    <text x="56" y="296">· 消耗你的套餐额度或 API key</text>
  </g>

  <rect x="286" y="84" width="228" height="236" rx="10" fill="#ffffff" stroke="#fecaca"/>
  <rect x="286" y="84" width="228" height="30" rx="10" fill="#ef4444"/>
  <text x="400" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">三条硬边界</text>
  <text x="302" y="142" font-size="11" font-weight="700" fill="#1e293b">1. 没有沙箱</text>
  <text x="302" y="160" font-size="10" fill="#475569">sandboxing 只隔离模型跑的 Bash，</text>
  <text x="302" y="175" font-size="10" fill="#475569">mod 起的进程在沙箱之外</text>
  <text x="302" y="206" font-size="11" font-weight="700" fill="#1e293b">2. 能越过部分权限规则</text>
  <text x="302" y="224" font-size="10" fill="#475569">可批准 ask 规则、PreToolUse hook</text>
  <text x="302" y="239" font-size="10" fill="#475569">拦下的调用，个别情况连 deny 也能</text>
  <text x="302" y="270" font-size="11" font-weight="700" fill="#1e293b">3. 改不了权限提示框</text>
  <text x="302" y="288" font-size="10" fill="#475569">界面大多可重画，唯独权限提示</text>
  <text x="302" y="303" font-size="10" fill="#475569">及其显示内容不能动</text>

  <rect x="532" y="84" width="228" height="236" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <rect x="532" y="84" width="228" height="30" rx="10" fill="#3b82f6"/>
  <text x="646" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">你手里的开关</text>
  <g font-size="10.5" fill="#1e293b">
    <text x="548" y="140">· 装前 claude plugin validate</text>
    <text x="548" y="166">· /plugin 里禁用或卸载单个 mod</text>
    <text x="548" y="192">· --safe-mode：本次会话全关</text>
    <text x="548" y="218">· disableAllHooks：所有会话全关</text>
    <text x="548" y="244">· 组织：allowManagedModsOnly</text>
  </g>
  <text x="548" y="276" font-size="10" fill="#64748b">注意：上述开关对内置 mod 无效；</text>
  <text x="548" y="292" font-size="10" fill="#64748b">只停用 mod 部分，同 plugin 的</text>
  <text x="548" y="308" font-size="10" fill="#64748b">skills / MCP / agents 照常加载</text>

  <text x="400" y="352" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">validate 不运行 mod，只列出它处理的事件（hooks:）和请求的操作（calls:）</text>
</svg>
