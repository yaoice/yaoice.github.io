<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img" aria-labelledby="t d">
<title id="t">从线索到有边界的结论</title><desc id="d">提出问题、REA 定位、阅读并核对、形成结论；调查必须注明哪些是观察，哪些是推断。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="#94a3b8"/></marker></defs>
<rect width="760" height="288" rx="10" fill="#f8fafc"/>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<text x="28" y="44" font-size="18" font-weight="700" fill="#1e293b">从线索到有边界的结论</text>
<text x="28" y="69" font-size="12" fill="#64748b">以 Notion 剪贴板案例为例：工具负责定位，调查者负责核对</text>
<path d="M184 158h19m168 0h18m168 0h18" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="28" y="116" width="156" height="86" rx="9" fill="#fff" stroke="#cbd5e1"/>
<rect x="204" y="116" width="168" height="86" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
<rect x="390" y="116" width="168" height="86" rx="9" fill="#fff" stroke="#cbd5e1"/>
<rect x="576" y="116" width="156" height="86" rx="9" fill="#ecfdf5" stroke="#10b981"/>
<g text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b"><text x="106" y="147">提出问题</text><text x="288" y="147">REA 定位</text><text x="474" y="147">阅读并核对</text><text x="654" y="147">形成结论</text></g>
<g text-anchor="middle" font-size="11" fill="#475569"><text x="106" y="174">剪贴板如何写入？</text><text x="288" y="174">preload / IPC 线索</text><text x="474" y="174">主进程 / 来源 / 版本</text><text x="654" y="174">观察 / 推断 / 未知</text></g>
<path d="M28 232h704" stroke="#cbd5e1"/>
<text x="29" y="258" font-size="12" fill="#475569">定位到调用点 ≠ 已完成端到端验证；版本不一致时，结论也必须分开写。</text>
</g></svg>
