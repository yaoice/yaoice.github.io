<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" role="img" aria-labelledby="t d">
<title id="t">REA 的不同目标，有不同环境成本</title><desc id="d">JavaScript 和 .NET 可静态分析；原生二进制需要分析提供者；网站需要浏览器；运行时捕获可能启动目标程序。</desc>
<rect width="760" height="366" rx="10" fill="#f8fafc"/>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<text x="30" y="44" font-size="18" font-weight="700" fill="#1e293b">不同目标，不同环境成本</text>
<text x="30" y="68" font-size="12" fill="#64748b">在选择调查路径之前，先问：读文件，还是运行目标？</text>
<rect x="30" y="91" width="700" height="37" rx="7" fill="#e2e8f0"/>
<text x="48" y="115" font-size="12" font-weight="700" fill="#1e293b">目标类型</text><text x="294" y="115" font-size="12" font-weight="700" fill="#1e293b">所需能力</text><text x="575" y="115" font-size="12" font-weight="700" fill="#1e293b">执行边界</text>
<g font-size="13" fill="#1e293b"><text x="48" y="161">JavaScript / Electron</text><text x="294" y="161">Node.js 与 npm</text><text x="575" y="161">静态读取</text><text x="48" y="207">.NET 程序集</text><text x="294" y="207">内建静态检查</text><text x="575" y="207">静态读取</text><text x="48" y="253">原生二进制</text><text x="294" y="253">Hopper / Ghidra / IDA</text><text x="575" y="253">依赖提供者</text><text x="48" y="299">网站</text><text x="294" y="299">Chrome 系浏览器</text><text x="575" y="299">有网络观察</text></g>
<g stroke="#e2e8f0"><path d="M30 174h700m-700 46h700m-700 46h700m-700 46h700"/></g>
<rect x="30" y="319" width="700" height="30" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
<text x="45" y="339" font-size="12" fill="#92400e">运行时捕获可能以当前用户权限启动目标程序；不要把“本地运行”误当成沙箱。</text>
</g></svg>
