<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/>
    </marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">Grok Build 分层架构：Leader 单例守护进程，多客户端 ACP 复用</text>

  <!-- 客户端层 -->
  <rect x="60" y="64" width="250" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="185" y="88" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">TUI 客户端（xai-grok-pager）</text>
  <text x="185" y="106" text-anchor="middle" font-size="10" fill="#475569">全屏 / Inline / Minimal 三种屏幕模式</text>
  <rect x="355" y="64" width="250" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="480" y="88" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">IDE / 编辑器扩展</text>
  <text x="480" y="106" text-anchor="middle" font-size="10" fill="#475569">Agent Client Protocol · JSON-RPC</text>
  <rect x="650" y="64" width="250" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="775" y="88" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">Headless CLI / CI 脚本</text>
  <text x="775" y="106" text-anchor="middle" font-size="10" fill="#475569">grok -p · WebSocket serve（server-key）</text>

  <line x1="185" y1="124" x2="185" y2="154" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="480" y1="124" x2="480" y2="154" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="775" y1="124" x2="775" y2="154" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- IPC 层 -->
  <rect x="130" y="158" width="700" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="480" y="180" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">IPC Server · Unix domain socket（~/.grok/leader.sock）</text>
  <text x="480" y="200" text-anchor="middle" font-size="10" fill="#475569">connect_or_spawn 连接或拉起 leader · 请求 ID 命名空间隔离 · 会话所有权路由</text>
  <line x1="480" y1="214" x2="480" y2="240" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- Leader 进程 -->
  <rect x="60" y="244" width="840" height="172" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#s)"/>
  <text x="480" y="268" text-anchor="middle" font-size="14" fill="#3b82f6" font-weight="600">Leader Process（单例守护进程 · 持有全部会话状态）</text>
  <rect x="90" y="282" width="240" height="112" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="210" y="304" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">MvpAgent（ACP Agent）</text>
  <text x="210" y="324" text-anchor="middle" font-size="10" fill="#475569">SessionRegistry 会话句柄表</text>
  <text x="210" y="340" text-anchor="middle" font-size="10" fill="#475569">认证 · 模型路由 · 配置快照</text>
  <text x="210" y="356" text-anchor="middle" font-size="10" fill="#475569">mid-session /login 热切换</text>
  <rect x="370" y="282" width="250" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="495" y="304" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">SessionActor × N</text>
  <text x="495" y="324" text-anchor="middle" font-size="10" fill="#475569">每会话一个独立 OS 线程</text>
  <text x="495" y="340" text-anchor="middle" font-size="10" fill="#475569">current-thread runtime + LocalSet</text>
  <text x="495" y="356" text-anchor="middle" font-size="10" fill="#475569">!Send · RefCell 内部可变性</text>
  <rect x="650" y="282" width="220" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="760" y="304" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">ChatStateActor × N</text>
  <text x="760" y="324" text-anchor="middle" font-size="10" fill="#475569">对话状态独立线程</text>
  <text x="760" y="340" text-anchor="middle" font-size="10" fill="#475569">compaction · token 统计</text>
  <text x="760" y="356" text-anchor="middle" font-size="10" fill="#475569">xai-chat-state</text>
  <line x1="330" y1="338" x2="366" y2="338" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="620" y1="338" x2="646" y2="338" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>

  <line x1="190" y1="416" x2="190" y2="440" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="480" y1="416" x2="480" y2="440" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="770" y1="416" x2="770" y2="440" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>

  <!-- 能力层 -->
  <rect x="60" y="444" width="260" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="190" y="468" text-anchor="middle" font-size="12" fill="#3b82f6" font-weight="600">模型采样层</text>
  <text x="190" y="488" text-anchor="middle" font-size="10" fill="#475569">xAI API（OpenAI 兼容 · SSE 流式）</text>
  <text x="190" y="504" text-anchor="middle" font-size="10" fill="#475569">async-openai fork · 重试与退避</text>
  <rect x="350" y="444" width="260" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="480" y="468" text-anchor="middle" font-size="12" fill="#8b5cf6" font-weight="600">工具系统</text>
  <text x="480" y="488" text-anchor="middle" font-size="10" fill="#475569">ToolDispatch · 编译期注册表</text>
  <text x="480" y="504" text-anchor="middle" font-size="10" fill="#475569">GrokBuild / Codex / OpenCode / MCP</text>
  <rect x="640" y="444" width="260" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="770" y="468" text-anchor="middle" font-size="12" fill="#ef4444" font-weight="600">沙箱管理器</text>
  <text x="770" y="488" text-anchor="middle" font-size="10" fill="#475569">nono：Landlock / Seatbelt</text>
  <text x="770" y="504" text-anchor="middle" font-size="10" fill="#475569">bwrap 再执行 · seccomp 子进程断网</text>

  <line x1="190" y1="522" x2="190" y2="544" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="480" y1="522" x2="480" y2="544" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="770" y1="522" x2="770" y2="544" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>

  <!-- 持久层 -->
  <rect x="60" y="548" width="840" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="480" y="570" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">持久化层：~/.grok/（目录权限 0700）</text>
  <text x="480" y="590" text-anchor="middle" font-size="10" fill="#475569">sessions/{cwd}/（SQLite journal · 会话搜索 · resume） · config.toml · requirements.toml（Ed25519 签名） · leader.sock</text>
</svg>
