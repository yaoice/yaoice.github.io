<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#10b981"/>
    </marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">会话并发模型：每会话一个 OS 线程，Turn 内「采样 - 工具」循环</text>
  <rect x="50" y="70" width="200" height="170" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="150" y="94" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">Leader 进程（LocalSet）</text>
  <text x="150" y="116" text-anchor="middle" font-size="10" fill="#475569">MvpAgent · SessionRegistry</text>
  <text x="150" y="134" text-anchor="middle" font-size="10" fill="#475569">ACP 消息分发</text>
  <text x="150" y="152" text-anchor="middle" font-size="10" fill="#475569">会话所有权路由</text>
  <text x="150" y="170" text-anchor="middle" font-size="10" fill="#475569">按会话 spawn OS 线程</text>
  <line x1="250" y1="155" x2="296" y2="155" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="273" y="146" text-anchor="middle" font-size="9" fill="#3b82f6" font-weight="600">spawn</text>
  <rect x="50" y="310" width="200" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="150" y="336" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">为什么是 OS 线程？</text>
  <text x="150" y="360" text-anchor="middle" font-size="10" fill="#475569">会话状态 !Send，天然线程私有</text>
  <text x="150" y="380" text-anchor="middle" font-size="10" fill="#475569">RefCell 内部可变性替代锁</text>
  <text x="150" y="400" text-anchor="middle" font-size="10" fill="#475569">单会话卡死不拖累其他会话</text>
  <text x="150" y="420" text-anchor="middle" font-size="10" fill="#475569">OS 抢占式调度保证公平</text>
  <rect x="300" y="70" width="410" height="500" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#s)"/>
  <text x="505" y="94" text-anchor="middle" font-size="13" fill="#3b82f6" font-weight="600">SessionActor</text>
  <text x="505" y="112" text-anchor="middle" font-size="10" fill="#475569">独立 OS 线程 · current-thread runtime + LocalSet · !Send</text>
  <rect x="318" y="124" width="374" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="505" y="142" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="600">State：running_task（AgentTask + AbortHandle）</text>
  <text x="505" y="160" text-anchor="middle" font-size="10" fill="#475569">pending_inputs · pending_notifications · edit_holds</text>
  <text x="505" y="196" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">Turn 循环（loop）</text>
  <rect x="322" y="206" width="250" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="447" y="228" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="600">① 组装上下文</text>
  <text x="447" y="246" text-anchor="middle" font-size="9" fill="#475569">skills · hooks · AGENTS.md · 环境信息</text>
  <rect x="322" y="268" width="250" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="447" y="290" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="600">② 模型流式请求（SSE）</text>
  <text x="447" y="308" text-anchor="middle" font-size="9" fill="#475569">xAI API · delta 增量实时外发</text>
  <rect x="322" y="330" width="250" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="447" y="352" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="600">③ 解析响应项</text>
  <text x="447" y="370" text-anchor="middle" font-size="9" fill="#475569">正文 / 推理 delta · 识别工具调用</text>
  <rect x="322" y="392" width="250" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="447" y="414" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="600">④ 工具分发执行</text>
  <text x="447" y="432" text-anchor="middle" font-size="9" fill="#475569">ToolDispatch · 沙箱内执行 · 审批闸门</text>
  <rect x="322" y="454" width="250" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="447" y="476" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="600">⑤ 结果回填上下文</text>
  <text x="447" y="494" text-anchor="middle" font-size="9" fill="#475569">工具输出进入下一轮请求</text>
  <line x1="447" y1="256" x2="447" y2="264" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="447" y1="318" x2="447" y2="326" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="447" y1="380" x2="447" y2="388" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="447" y1="442" x2="447" y2="450" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <path d="M572,479 C622,479 622,293 572,293" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="636" y="374" text-anchor="middle" font-size="9" fill="#94a3b8">有工具调用</text>
  <text x="636" y="388" text-anchor="middle" font-size="9" fill="#94a3b8">回到 ②</text>
  <line x1="447" y1="504" x2="447" y2="516" stroke="#10b981" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="320" y="516" width="340" height="40" rx="8" fill="#eff6ff" stroke="#10b981"/>
  <text x="490" y="534" text-anchor="middle" font-size="10" fill="#1e293b">无工具调用 → TurnCompleted</text>
  <text x="490" y="548" text-anchor="middle" font-size="9" fill="#475569">turn diff 汇总 · token 用量 · 会话落盘</text>
  <rect x="740" y="84" width="180" height="104" rx="10" fill="#ffffff" stroke="#f59e0b"/>
  <text x="830" y="106" text-anchor="middle" font-size="12" fill="#f59e0b" font-weight="600">插话缓冲</text>
  <text x="830" y="126" text-anchor="middle" font-size="10" fill="#475569">InterjectionBuffer</text>
  <text x="830" y="144" text-anchor="middle" font-size="9" fill="#475569">pending_interjections</text>
  <text x="830" y="162" text-anchor="middle" font-size="9" fill="#475569">turn 运行中打断 / 转向</text>
  <line x1="740" y1="136" x2="714" y2="136" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="740" y="224" width="180" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="246" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">ChatStateActor</text>
  <text x="830" y="266" text-anchor="middle" font-size="10" fill="#475569">对话状态独立线程</text>
  <text x="830" y="284" text-anchor="middle" font-size="10" fill="#475569">compaction 压缩</text>
  <text x="830" y="302" text-anchor="middle" font-size="10" fill="#475569">token 统计（xai-chat-state）</text>
  <line x1="740" y1="274" x2="714" y2="274" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
  <rect x="740" y="364" width="180" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="386" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600">会话持久化</text>
  <text x="830" y="406" text-anchor="middle" font-size="9" fill="#475569">~/.grok/sessions/{cwd}/</text>
  <text x="830" y="424" text-anchor="middle" font-size="10" fill="#475569">SQLite journal</text>
  <text x="830" y="442" text-anchor="middle" font-size="10" fill="#475569">resume 恢复 · 会话搜索</text>
  <line x1="740" y1="424" x2="714" y2="424" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aa)"/>
</svg>
