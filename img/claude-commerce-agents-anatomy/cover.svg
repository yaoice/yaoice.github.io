<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">电商 Agent 解剖学</title>
  <desc id="desc">封面图：一个模型加 Agent Loop 连接消费侧与商户侧 Agent，底部三根支柱分别对应架构、时延与成本、生产化。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .line2{stroke:#475569;stroke-width:1.5;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .tw{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#f8fafc}
      .tws{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#cbd5e1}
      .num{font-size:11px;font-weight:700;fill:#ffffff}
    </style>
  </defs>
  <rect width="960" height="440" fill="#f8fafc"/>
  <text x="32" y="40" class="t title">电商 Agent 解剖学</text>
  <text x="32" y="64" class="t small">一个模型 + Agent Loop + Skills + 工具 + Eval —— 架构 · 时延与成本 · 生产化</text>

  <rect x="32" y="96" width="250" height="120" class="box" fill="#eff6ff"/>
  <text x="52" y="126" class="t label">消费侧 Agent</text>
  <text x="52" y="152" class="t small">搜索 · 比较 · 替代 · 拼装订单</text>
  <text x="52" y="172" class="t small">零售购物车 · 旅行行程</text>
  <text x="52" y="192" class="t small">套餐变更 · 演出座位</text>

  <rect x="352" y="96" width="256" height="120" class="box" fill="#1e293b"/>
  <text x="480" y="126" text-anchor="middle" class="tw" font-size="15" font-weight="700">一个模型 + Agent Loop</text>
  <text x="480" y="152" text-anchor="middle" class="tws" font-size="12">推理目标 → 探索上下文</text>
  <text x="480" y="172" text-anchor="middle" class="tws" font-size="12">工具行动 → 观察结果</text>
  <text x="480" y="192" text-anchor="middle" class="tws" font-size="12">直到目标完成</text>

  <rect x="658" y="96" width="270" height="120" class="box" fill="#ecfdf5"/>
  <text x="678" y="126" class="t label">商户侧 Agent</text>
  <text x="678" y="152" class="t small">销售问答 · 促销活动</text>
  <text x="678" y="172" class="t small">库存管理 · 定价决策</text>
  <text x="678" y="192" class="t small">变更提案 · 人工审批</text>

  <path d="M282 150 H352" class="line2"/>
  <path d="M608 150 H658" class="line2"/>

  <rect x="352" y="236" width="256" height="56" class="box" fill="#f1f5f9"/>
  <text x="480" y="262" text-anchor="middle" class="t label">Skills 承载长尾流程</text>
  <text x="480" y="282" text-anchor="middle" class="t small">工具调用你已在运行的系统</text>
  <path d="M480 216 V236" class="line"/>

  <path d="M480 292 V316" class="line"/>
  <path d="M172 316 H788" class="line"/>
  <path d="M172 316 V330" class="line"/>
  <path d="M480 316 V330" class="line"/>
  <path d="M788 316 V330" class="line"/>

  <rect x="32" y="330" width="280" height="78" class="box" fill="#ffffff"/>
  <circle cx="58" cy="352" r="12" fill="#3b82f6"/>
  <text x="58" y="356" text-anchor="middle" class="num">01</text>
  <text x="80" y="358" class="t label">架构</text>
  <text x="52" y="380" class="t small">Skills 而非子代理</text>
  <text x="52" y="398" class="t small">Prompt 与 Skill 按频率划分</text>

  <rect x="340" y="330" width="280" height="78" class="box" fill="#ffffff"/>
  <circle cx="366" cy="352" r="12" fill="#10b981"/>
  <text x="366" y="356" text-anchor="middle" class="num">02</text>
  <text x="388" y="358" class="t label">时延与成本</text>
  <text x="360" y="380" class="t small">三杠杆 + 感知时延</text>
  <text x="360" y="398" class="t small">缓存命中 90–99% 是设计起点</text>

  <rect x="648" y="330" width="280" height="78" class="box" fill="#ffffff"/>
  <circle cx="674" cy="352" r="12" fill="#8b5cf6"/>
  <text x="674" y="356" text-anchor="middle" class="num">03</text>
  <text x="696" y="358" class="t label">生产化</text>
  <text x="668" y="380" class="t small">记忆进系统 · 安全进 Harness</text>
  <text x="668" y="398" class="t small">Eval 用快照与反例</text>
</svg>
