<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">总结：六条可复用判断标准</title>
  <desc id="desc">六张卡片归纳全文可复用的工程判断标准：架构、Prompt 与 Skill 划分、工具工程、UI 组件、时延与缓存、记忆安全与 Eval。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .num{font-size:11px;font-weight:700;fill:#ffffff}
    </style>
  </defs>
  <rect width="960" height="460" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">总结：六条可复用判断标准</text>
  <text x="32" y="55" class="t small">这套架构会活过模型换代与聊天面板 —— 每条原则都能在 commerce-agents 参考实现里找到代码落点</text>

  <rect x="32" y="80" width="280" height="150" class="box" fill="#ffffff"/>
  <circle cx="62" cy="110" r="14" fill="#3b82f6"/>
  <text x="62" y="114" text-anchor="middle" class="num">01</text>
  <text x="86" y="115" class="t label">默认单 Agent + Skills</text>
  <text x="48" y="144" class="t small">子代理只留给自包含窄任务（作工具）</text>
  <text x="48" y="166" class="t small">或已有专用 Agent 的整体交接</text>
  <text x="48" y="188" class="t small">判断标准：对话的所有权</text>
  <rect x="340" y="80" width="280" height="150" class="box" fill="#ffffff"/>
  <circle cx="370" cy="110" r="14" fill="#3b82f6"/>
  <text x="370" y="114" text-anchor="middle" class="num">02</text>
  <text x="394" y="115" class="t label">Prompt 与 Skill 按频率划分</text>
  <text x="356" y="144" class="t small">约 1/3 以上流量 → 系统 Prompt</text>
  <text x="356" y="166" class="t small">安全 / 品牌 / 用户事实永远在 Prompt</text>
  <text x="356" y="188" class="t small">可预测 Skill 由 Harness 预注入</text>
  <rect x="648" y="80" width="280" height="150" class="box" fill="#ffffff"/>
  <circle cx="678" cy="110" r="14" fill="#3b82f6"/>
  <text x="678" y="114" text-anchor="middle" class="num">03</text>
  <text x="702" y="115" class="t label">工具调用已有系统</text>
  <text x="664" y="144" class="t small">搜索排序、促销引擎别在工具里重写</text>
  <text x="664" y="166" class="t small">结果即上下文：只回推理所需字段</text>
  <text x="664" y="188" class="t small">错误给指令，不给错误码</text>

  <rect x="32" y="246" width="280" height="150" class="box" fill="#ffffff"/>
  <circle cx="62" cy="276" r="14" fill="#10b981"/>
  <text x="62" y="280" text-anchor="middle" class="num">04</text>
  <text x="86" y="281" class="t label">UI 组件即工具</text>
  <text x="48" y="310" class="t small">typed 参数 + 服务端校验与 enrich</text>
  <text x="48" y="332" class="t small">参数反映渲染布局（『第三个』可指代）</text>
  <text x="48" y="354" class="t small">eager streaming 换 token 级流式</text>
  <rect x="340" y="246" width="280" height="150" class="box" fill="#ffffff"/>
  <circle cx="370" cy="276" r="14" fill="#10b981"/>
  <text x="370" y="280" text-anchor="middle" class="num">05</text>
  <text x="394" y="281" class="t label">时延攻两头，成本靠前缀</text>
  <text x="356" y="310" class="t small">三杠杆最小化总和 · 感知时延两技</text>
  <text x="356" y="332" class="t small">Global / Session / Volatile 三段排布</text>
  <text x="356" y="354" class="t small">命中 90–99% · 按每完成任务算成本</text>
  <rect x="648" y="246" width="280" height="150" class="box" fill="#ffffff"/>
  <circle cx="678" cy="276" r="14" fill="#8b5cf6"/>
  <text x="678" y="280" text-anchor="middle" class="num">06</text>
  <text x="702" y="281" class="t label">记忆 · 安全 · Eval 各有归宿</text>
  <text x="664" y="310" class="t small">记忆住进数据库，异步写入</text>
  <text x="664" y="332" class="t small">安全执行在 Harness，模型只提案</text>
  <text x="664" y="354" class="t small">Eval 用快照 + 反例 + 脏状态</text>
</svg>
