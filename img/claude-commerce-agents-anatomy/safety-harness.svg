<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">安全：执行点在 Harness，不在 Prompt</title>
  <desc id="desc">商户侧写路径：模型只提案，经 Guardrail 重查与人工或政策批准后落库；下方三张闸门卡片分别对应服务端签发 ID 白名单、封顶规则按结果状态执行、第三方内容 sanitize 与 fence。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .good{stroke:#bfdbfe;stroke-width:1.5;rx:10}
      .gr{stroke:#a7f3d0;stroke-width:1.5;rx:10}
      .wa{stroke:#fde68a;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">安全：执行点在 Harness，不在 Prompt</text>
  <text x="32" y="55" class="t small">模型最危险的动作也只是提案 —— 每条规则写进代码，定义一次、所有运行时共享</text>

  <text x="32" y="82" class="t small">商户侧写路径：提案 → 审批 → 落库（消费侧更彻底：后端接口根本没有 charge 方法）</text>
  <rect x="32" y="92" width="190" height="76" class="good" fill="#eff6ff"/>
  <text x="52" y="118" class="t label">模型只提案</text>
  <text x="52" y="140" class="t small">staged change</text>
  <text x="52" y="158" class="t small">服务端生成 ID</text>
  <rect x="262" y="92" width="190" height="76" class="wa" fill="#fef3c7"/>
  <text x="282" y="118" class="t label">Guardrail 重查</text>
  <text x="282" y="140" class="t small">apply 时按当前限额</text>
  <text x="282" y="158" class="t small">而非 stage 时的限额</text>
  <rect x="492" y="92" width="190" height="76" class="wa" fill="#fef3c7"/>
  <text x="512" y="118" class="t label">人或政策批准</text>
  <text x="512" y="140" class="t small">portal 按钮 · CLI 确认</text>
  <text x="512" y="158" class="t small">平台审批 prompt</text>
  <rect x="722" y="92" width="206" height="76" class="gr" fill="#ecfdf5"/>
  <text x="742" y="118" class="t label">apply_change 落库</text>
  <text x="742" y="140" class="t small">未批准的 ID 一律拒绝</text>
  <text x="742" y="158" class="t small">走 maker-checker 流程</text>
  <path d="M222 130 H262" class="line"/>
  <path d="M452 130 H492" class="line"/>
  <path d="M682 130 H722" class="line"/>

  <rect x="32" y="200" width="280" height="200" class="good" fill="#eff6ff"/>
  <text x="52" y="226" class="t label">服务端签发 ID 白名单</text>
  <text x="52" y="252" class="t small">写与渲染只认本会话服务器发过的 ID</text>
  <text x="52" y="274" class="t small">幻觉、粘贴、评论里种的 ID</text>
  <text x="52" y="296" class="t small">→ 到后端之前被拒</text>
  <text x="52" y="322" class="t small">受监管文案由服务器逐字提供</text>
  <text x="52" y="344" class="t small">UI 卡片只渲染服务器自己填过的记录</text>
  <text x="52" y="370" class="t small">delegate 只读，不新增可写 ID</text>
  <rect x="340" y="200" width="280" height="200" class="gr" fill="#ecfdf5"/>
  <text x="360" y="226" class="t label">封顶规则按结果状态执行</text>
  <text x="360" y="252" class="t small">写后状态超限即拒：</text>
  <text x="360" y="274" class="t small">『再加两个』无法叠加</text>
  <text x="360" y="296" class="t small">单会话写串行化，并行调用</text>
  <text x="360" y="318" class="t small">不能组合超限</text>
  <text x="360" y="344" class="t small">商户侧：价格变动 · 折扣深度</text>
  <text x="360" y="366" class="t small">补货量 · 活动预算 · 受保护字段</text>
  <rect x="648" y="200" width="280" height="200" class="wa" fill="#fef3c7"/>
  <text x="668" y="226" class="t label">第三方内容 sanitize + fence</text>
  <text x="668" y="252" class="t small">listing/评论/政策/卖家消息</text>
  <text x="668" y="274" class="t small">= 不可信输入</text>
  <text x="668" y="296" class="t small">剥控制字符 · 去伪 turn</text>
  <text x="668" y="318" class="t small">与伪造标记 · 限制大小</text>
  <text x="668" y="344" class="t small">固定标签包裹（fence）</text>
  <text x="668" y="366" class="t small">模型只报告，不照办</text>

  <rect x="32" y="424" width="896" height="64" class="box" fill="#f1f5f9"/>
  <text x="52" y="450" class="t label">为什么必须在代码里执行</text>
  <text x="52" y="472" class="t small">失败是财务性的、常不可逆；Prompt 规则离一次注入或一个坏样本只有一步之遥</text>
</svg>
