<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">时延与成本：三杠杆、两技与三段缓存</title>
  <desc id="desc">端到端时延的三个杠杆（更少轮次、更快工具、更快 token），感知时延的两个技巧，以及按 Global/Session/Volatile 三段排布的前缀缓存。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .good{stroke:#bfdbfe;stroke-width:1.5;rx:10}
      .gr{stroke:#a7f3d0;stroke-width:1.5;rx:10}
      .wa{stroke:#fde68a;stroke-width:1.5;rx:10}
      .bad{stroke:#fecaca;stroke-width:1.5;rx:10}
      .badnote{font-size:12px;fill:#b91c1c}
      .goodnote{font-size:12px;fill:#047857}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="640" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">时延与成本：三杠杆 + 两技 + 三段缓存</text>
  <text x="32" y="55" class="t small">最小化端到端时延的总和，而不是单项；成本靠前缀缓存，命中 90–99% 是设计起点</text>

  <text x="32" y="84" class="t label">端到端时延 = Σ（每轮末 token 时间 + 工具处理时间）</text>
  <rect x="32" y="94" width="280" height="150" class="box" fill="#ffffff"/>
  <text x="52" y="118" class="t label">更少轮次</text>
  <text x="52" y="142" class="t small">预加载可能上下文（进入页面即注入）</text>
  <text x="52" y="164" class="t small">提升模型智能：每任务 &gt; 5 轮换更聪明模型</text>
  <text x="52" y="186" class="t small">并行调用独立工具，不烧额外轮次</text>
  <text x="52" y="208" class="t small">复杂查询轮次更少 → 常在 p90/p99 赢时延</text>
  <rect x="340" y="94" width="280" height="150" class="box" fill="#ffffff"/>
  <text x="360" y="118" class="t label">更快工具</text>
  <text x="360" y="142" class="t small">优化工具自身后端</text>
  <text x="360" y="164" class="t small">别在工具里拼接缺失的后端逻辑</text>
  <text x="360" y="186" class="t small">参数一完成即派发执行（SDK 默认）</text>
  <text x="360" y="208" class="t small">多秒级间隙 → 数百毫秒</text>
  <rect x="648" y="94" width="280" height="150" class="box" fill="#ffffff"/>
  <text x="668" y="118" class="t label">更快 token</text>
  <text x="668" y="142" class="t small">模型与 effort 按整套 Eval 扫描选择</text>
  <text x="668" y="164" class="t small">商户侧 Opus 起步 · 消费侧 Sonnet 起步</text>
  <text x="668" y="186" class="t small">按每完成任务成本衡量</text>
  <text x="668" y="208" class="t small">结果接近时，选智能</text>

  <text x="32" y="270" class="t label">感知时延：让等待看起来像进展（不碰模型）</text>
  <rect x="32" y="280" width="434" height="76" class="box" fill="#ffffff"/>
  <text x="52" y="304" class="t label">组件边生成边渲染</text>
  <text x="52" y="326" class="t small">500–700 token 不流式 ≈ 5 秒+ spinner</text>
  <text x="52" y="344" class="t small">参数边流边渲染页面，渐进呈现</text>
  <rect x="494" y="280" width="434" height="76" class="box" fill="#ffffff"/>
  <text x="514" y="304" class="t label">展示工作进度</text>
  <text x="514" y="326" class="t small">每步一行：『正在寻找滨水酒店…』</text>
  <text x="514" y="344" class="t small">从工具参数构建，或 user_facing_message 参数</text>

  <text x="32" y="392" class="t label">Prompt Caching —— 前缀缓存 · 读价 1/10 · 写溢价 1.25x（二次使用回本）· 读速 1.5–2x</text>
  <rect x="32" y="402" width="430" height="96" class="good" fill="#eff6ff"/>
  <text x="52" y="426" class="t label">Global 全局段（最热缓存）</text>
  <text x="52" y="450" class="t small">system prompt + 工具定义 · 跨会话逐字节一致</text>
  <text x="52" y="470" class="t small">段尾放缓存断点 · 规模上几乎不过期</text>
  <rect x="462" y="402" width="300" height="96" class="gr" fill="#ecfdf5"/>
  <text x="482" y="426" class="t label">Session 会话段</text>
  <text x="482" y="450" class="t small">用户上下文 + 对话历史</text>
  <text x="482" y="470" class="t small">跨会话不同 · 会话内稳定</text>
  <text x="482" y="488" class="t small">记忆属于此段（断点之下）</text>
  <rect x="762" y="402" width="166" height="96" class="wa" fill="#fef3c7"/>
  <text x="782" y="426" class="t label">Volatile 易变段</text>
  <text x="782" y="450" class="t small">当前时间 / 当前页面</text>
  <text x="782" y="470" class="t small">置于请求最末尾</text>

  <rect x="32" y="512" width="896" height="44" class="bad" fill="#fef2f2"/>
  <text x="52" y="530" class="badnote">最常见错误：时间戳 / 当前页面放在 system prompt 顶部</text>
  <text x="52" y="548" class="badnote">→ 每次请求静默破坏整段缓存</text>
  <rect x="32" y="568" width="896" height="44" class="gr" fill="#ecfdf5"/>
  <text x="52" y="596" class="goodnote">实现细节：Skills 以工具结果载入（随会话前缀缓存）· 断点每轮前移 → 历史与长工具结果全部命中</text>
</svg>
