<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Eval：给非确定系统上确定性的度量</title>
  <desc id="desc">快照式用例构造流程：构造测试状态、追加用户消息、运行后只评结果不评路径；下方五类用例卡片与最常见的缺口（缺反例）。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .bad{stroke:#fecaca;stroke-width:1.5;rx:10}
      .wa{stroke:#fde68a;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="640" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">Eval：给非确定系统上确定性的度量</text>
  <text x="32" y="55" class="t small">快照式用例 + 反例 + 脏状态开局 —— 评结果，不评路径</text>

  <text x="32" y="82" class="t label">一条 eval case 的构造方式</text>
  <rect x="32" y="92" width="190" height="76" class="box" fill="#ffffff"/>
  <text x="52" y="118" class="t label">构造测试状态</text>
  <text x="52" y="140" class="t small">API 无状态</text>
  <text x="52" y="158" class="t small">任意可达状态可直接构造</text>
  <rect x="262" y="92" width="190" height="76" class="box" fill="#ffffff"/>
  <text x="282" y="118" class="t label">追加用户消息</text>
  <text x="282" y="140" class="t small">从该状态继续</text>
  <text x="282" y="158" class="t small">让 agent 跑下去</text>
  <rect x="492" y="92" width="190" height="76" class="box" fill="#ffffff"/>
  <text x="512" y="118" class="t label">只评结果</text>
  <text x="512" y="140" class="t small">最终状态 + 渲染响应</text>
  <text x="512" y="158" class="t small">含最后一次写参数</text>
  <rect x="722" y="92" width="206" height="76" class="wa" fill="#fef3c7"/>
  <text x="742" y="118" class="t label">不评路径</text>
  <text x="742" y="140" class="t small">路径用例脆弱</text>
  <text x="742" y="158" class="t small">且限制性强</text>
  <path d="M222 130 H262" class="line"/>
  <path d="M452 130 H492" class="line"/>
  <path d="M682 130 H722" class="line"/>
  <text x="32" y="192" class="t small">simulated-user eval 只用于发现覆盖缺口；每个 case 最终写成快照 —— 失败可归因、样本可控制</text>

  <text x="32" y="226" class="t label">五类用例（每个正例配反例）</text>
  <rect x="32" y="236" width="280" height="140" class="box" fill="#ffffff"/>
  <text x="52" y="262" class="t label">核心请求</text>
  <text x="52" y="286" class="t small">简单查询 · 多约束 · 多意图</text>
  <text x="52" y="308" class="t small">价格/库存/属性 trace 回返回数据</text>
  <text x="52" y="330" class="t small">数据缺失要明说，不编造</text>
  <rect x="340" y="236" width="280" height="140" class="box" fill="#ffffff"/>
  <text x="360" y="262" class="t label">上下文相关</text>
  <text x="360" y="286" class="t small">屏幕引用 · 前轮约束</text>
  <text x="360" y="308" class="t small">对已有购物车的写</text>
  <text x="360" y="330" class="t small">记忆：提取 + 检索 + 改变答案</text>
  <rect x="648" y="236" width="280" height="140" class="box" fill="#ffffff"/>
  <text x="668" y="262" class="t label">安全与品牌</text>
  <text x="668" y="286" class="t small">用户注入 vs 数据面注入</text>
  <text x="668" y="308" class="t small">（种进商品名 / 评论 / 网页片段）</text>
  <text x="668" y="330" class="t small">越权读他人数据 · 受监管文案逐字节</text>
  <rect x="32" y="392" width="280" height="140" class="box" fill="#ffffff"/>
  <text x="52" y="418" class="t label">界面</text>
  <text x="52" y="442" class="t small">渲染正确组件 · 上限生效</text>
  <text x="52" y="464" class="t small">用户可见文本无内部标识符</text>
  <text x="52" y="486" class="t small">超时与空结果</text>
  <rect x="340" y="392" width="280" height="140" class="box" fill="#ffffff"/>
  <text x="360" y="418" class="t label">跨能力组合</text>
  <text x="360" y="442" class="t small">『降价 15%，库存够覆盖吗？』</text>
  <text x="360" y="464" class="t small">定价 + 库存两半都要答</text>
  <text x="360" y="486" class="t small">单能力 eval 各评一半，抓不住</text>
  <rect x="648" y="392" width="280" height="140" class="bad" fill="#fef2f2"/>
  <text x="668" y="418" class="t label">最常见的缺口：缺反例</text>
  <text x="668" y="442" class="t small">每个『应该服务』配『应该拒绝』</text>
  <text x="668" y="464" class="t small">每个『直接做』配『应该先问』</text>
  <text x="668" y="486" class="t small">脏状态开局：长 / 乱 / 矛盾历史</text>

  <rect x="32" y="552" width="896" height="60" class="box" fill="#f1f5f9"/>
  <text x="52" y="586" class="t small">与 SME 共建用例（Product/Legal/Ops/Care/Category）· 真实事故是最好的 eval · 每用户流 50–100 条起步 · 生产 transcript 挖新 case</text>
</svg>
