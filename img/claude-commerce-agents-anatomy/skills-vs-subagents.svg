<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Skills, not Subagents：两种架构对比</title>
  <desc id="desc">左：子代理架构，每次交接带来状态丢失、token 与时延成本；右：单 Agent 加 Skills，技能按需载入、主 Agent 始终持有完整上下文。底部给出判断标准：对话的所有权。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .bad{stroke:#fecaca;stroke-width:1.5;rx:10}
      .good{stroke:#bfdbfe;stroke-width:1.5;rx:10}
      .badnote{font-size:11px;fill:#b91c1c}
      .goodnote{font-size:11px;fill:#047857}
      .tw{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#f8fafc}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">Skills, not Subagents：两种架构对比</text>
  <text x="32" y="55" class="t small">单 Agent + Skills 在质量、成本与时延上稳定胜出 —— 例外取决于对话的所有权</text>

  <circle cx="480" cy="245" r="26" fill="#1e293b"/>
  <text x="480" y="251" text-anchor="middle" class="tw" font-size="14" font-weight="700">VS</text>

  <rect x="32" y="80" width="420" height="330" class="bad" fill="#fef2f2"/>
  <text x="52" y="106" class="t label">子代理架构（多域拆分的诱惑）</text>
  <rect x="52" y="116" width="380" height="64" class="box" fill="#ffffff"/>
  <text x="72" y="140" class="t label">Orchestrator 主控</text>
  <text x="72" y="162" class="t small">持有购物车 · 用户偏好 · 会话历史</text>
  <rect x="52" y="196" width="180" height="44" class="bad" fill="#fef2f2"/>
  <text x="142" y="222" text-anchor="middle" class="t small">搜索域子代理</text>
  <text x="248" y="210" class="badnote">每次交接：状态丢失</text>
  <text x="248" y="228" class="badnote">几倍 token + 数秒时延</text>
  <rect x="52" y="256" width="180" height="44" class="bad" fill="#fef2f2"/>
  <text x="142" y="282" text-anchor="middle" class="t small">订单域子代理</text>
  <text x="248" y="270" class="badnote">领域无法干净切分</text>
  <text x="248" y="288" class="badnote">要么复制访问，要么中途交接</text>
  <rect x="52" y="316" width="180" height="44" class="bad" fill="#fef2f2"/>
  <text x="142" y="342" text-anchor="middle" class="t small">退货域子代理</text>
  <text x="248" y="330" class="badnote">退货流程需要订单历史</text>
  <text x="248" y="348" class="badnote">+ 当前购物车 + 商品目录</text>
  <text x="52" y="392" class="t small">对话是跨多意图多轮的紧耦合会话，共享上下文远大于隔离收益</text>

  <rect x="508" y="80" width="420" height="330" class="good" fill="#f0f9ff"/>
  <text x="528" y="106" class="t label">单 Agent + Skills（推荐）</text>
  <rect x="528" y="116" width="380" height="64" class="box" fill="#ffffff"/>
  <text x="548" y="140" class="t label">主 Agent：完整上下文单循环</text>
  <text x="548" y="162" class="t small">购物车 · 偏好 · 全部历史 · 工具 · 技能索引</text>
  <rect x="528" y="196" width="68" height="44" class="good" fill="#eff6ff"/>
  <text x="562" y="222" text-anchor="middle" class="t small">搜索发现</text>
  <rect x="606" y="196" width="68" height="44" class="good" fill="#eff6ff"/>
  <text x="640" y="222" text-anchor="middle" class="t small">购买研究</text>
  <rect x="684" y="196" width="68" height="44" class="good" fill="#eff6ff"/>
  <text x="718" y="222" text-anchor="middle" class="t small">规划目标</text>
  <rect x="762" y="196" width="68" height="44" class="good" fill="#eff6ff"/>
  <text x="796" y="222" text-anchor="middle" class="t small">客服关怀</text>
  <rect x="840" y="196" width="68" height="44" class="good" fill="#eff6ff"/>
  <text x="874" y="222" text-anchor="middle" class="t small">记忆个性化</text>
  <text x="528" y="264" class="goodnote">技能指令按需载入主 Agent —— 模块化与上下文控制，零交接成本</text>
  <text x="528" y="284" class="goodnote">企业部署对比：质量稳定优于全 Prompt 与子代理设计，单任务成本与时延通常更低</text>
  <text x="528" y="312" class="t label">子代理仍有两处用武之地</text>
  <text x="528" y="336" class="t small">① 作为工具：自包含窄任务（深度研究），只回紧凑答案</text>
  <text x="528" y="358" class="t small">② 整体 hand-off：已有专用 Agent 的领域（药房 / 金融合规面）</text>
  <text x="528" y="380" class="t small">区别：hand-off 交出对话所有权，delegation 每次交换都在降质</text>

  <rect x="32" y="430" width="896" height="70" class="box" fill="#f1f5f9"/>
  <text x="52" y="456" class="t label">判断标准：对话的所有权</text>
  <text x="52" y="480" class="t small">hand-off 让领域 Agent 成为用户的对端 · delegation 保留 orchestrator 主导，领域 Agent 在一个 turn 内被弹进弹出</text>
</svg>
