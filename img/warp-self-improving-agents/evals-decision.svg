<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="600" rx="10" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">评测与安全网：假设反馈会出错</text>

  <rect x="390" y="80" width="180" height="44" rx="22" fill="#1e293b" filter="url(#sh)"/>
  <text x="480" y="107" text-anchor="middle" font-size="13.5" fill="#ffffff" font-weight="600">领域可验证？</text>
  <path d="M 390 102 C 330 108, 292 120, 274 146" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 570 102 C 630 108, 668 120, 686 146" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="150" y="150" width="240" height="112" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="270" y="176" text-anchor="middle" font-size="14" fill="#3b82f6" font-weight="600">可验证</text>
  <text x="270" y="200" text-anchor="middle" font-size="12" fill="#475569">先建验证工具链：</text>
  <text x="270" y="220" text-anchor="middle" font-size="12" fill="#475569">生成参考语料 → 对比黄金输出</text>
  <text x="270" y="240" text-anchor="middle" font-size="12" fill="#475569">→ 修复 → 循环调优</text>

  <rect x="570" y="150" width="240" height="112" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="690" y="176" text-anchor="middle" font-size="14" fill="#8b5cf6" font-weight="600">不可验证</text>
  <text x="690" y="200" text-anchor="middle" font-size="12" fill="#475569">确定性评测对齐黄金输出；</text>
  <text x="690" y="220" text-anchor="middle" font-size="12" fill="#475569">必须用人类反馈时仅限</text>
  <text x="690" y="240" text-anchor="middle" font-size="12" fill="#475569">领域专家，不开放全员</text>

  <text x="480" y="292" text-anchor="middle" font-size="12" fill="#94a3b8">三条安全网原则——不让 agent 盲从反馈</text>
  <rect x="180" y="304" width="200" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="280" y="334" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">合理性检查</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#475569">给 agent 上下文，不盲从</text>
  <rect x="380" y="304" width="200" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="334" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">过滤反馈来源</text>
  <text x="480" y="358" text-anchor="middle" font-size="11" fill="#475569">低信源先剔除</text>
  <rect x="580" y="304" width="200" height="76" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="680" y="334" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="600">人类保留终审</text>
  <text x="680" y="358" text-anchor="middle" font-size="11" fill="#475569">合并权始终在人</text>

  <rect x="150" y="404" width="660" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="432" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">全局指标回灌</text>
  <text x="480" y="456" text-anchor="middle" font-size="12" fill="#475569">追踪人类已在看的指标——合并耗时 · 贡献者数量 · 成本——并回灌给 improver agent</text>

  <text x="150" y="506" font-size="12" fill="#94a3b8">部署策略：crawl-walk-run 渐进放量</text>
  <rect x="150" y="516" width="216" height="56" rx="10" fill="#e2e8f0"/>
  <text x="258" y="550" text-anchor="middle" font-size="13" fill="#475569" font-weight="600">爬 · 小范围试点</text>
  <path d="M 370 544 L 384 544" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="390" y="516" width="216" height="56" rx="10" fill="#dbeafe"/>
  <text x="498" y="550" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="600">走 · 扩大覆盖</text>
  <path d="M 610 544 L 624 544" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrB)"/>
  <rect x="630" y="516" width="180" height="56" rx="10" fill="#10b981"/>
  <text x="720" y="550" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">跑 · 全面运行</text>
</svg>
