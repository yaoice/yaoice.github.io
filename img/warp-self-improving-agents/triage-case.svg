<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="640" rx="10" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">实战：issue 分诊 agent 的自我改进闭环</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#94a3b8">示例仓库 warpdotdev/warp-agents-demo-github-issue-triage · Oz 内部 agent 编排平台</text>

  <rect x="70" y="92" width="260" height="170" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
  <circle cx="104" cy="126" r="14" fill="#1e293b"/>
  <text x="104" y="131" text-anchor="middle" font-size="13" fill="#ffffff">1</text>
  <text x="126" y="131" font-size="14" fill="#1e293b" font-weight="600">issue 提交</text>
  <text x="92" y="172" font-size="12" fill="#475569">有人提交 GitHub issue</text>
  <text x="92" y="192" font-size="12" fill="#475569">GitHub Action 自动触发</text>
  <text x="92" y="212" font-size="12" fill="#475569">分诊 agent 开始工作</text>

  <rect x="350" y="92" width="260" height="170" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="384" cy="126" r="14" fill="#3b82f6"/>
  <text x="384" y="131" text-anchor="middle" font-size="13" fill="#ffffff">2</text>
  <text x="406" y="131" font-size="14" fill="#1e293b" font-weight="600">内层技能执行</text>
  <text x="372" y="172" font-size="12" fill="#475569">分析复杂度与可行性</text>
  <text x="372" y="192" font-size="12" fill="#475569">打标签 · 建议修复方向</text>

  <rect x="630" y="92" width="260" height="170" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="664" cy="126" r="14" fill="#f59e0b"/>
  <text x="664" y="131" text-anchor="middle" font-size="13" fill="#ffffff">3</text>
  <text x="686" y="131" font-size="14" fill="#1e293b" font-weight="600">首跑失误</text>
  <text x="652" y="172" font-size="12" fill="#475569">漏打 ready-to-spec 标签</text>
  <text x="652" y="192" font-size="12" fill="#475569">维护者发现遗漏</text>

  <rect x="630" y="340" width="260" height="170" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
  <circle cx="664" cy="374" r="14" fill="#1e293b"/>
  <text x="664" y="379" text-anchor="middle" font-size="13" fill="#ffffff">4</text>
  <text x="686" y="379" font-size="14" fill="#1e293b" font-weight="600">现场反馈</text>
  <text x="652" y="420" font-size="12" fill="#475569">直接在 issue 上评论</text>
  <text x="652" y="440" font-size="12" fill="#475569">说明期望行为与原因</text>
  <text x="652" y="460" font-size="12" fill="#475569">无额外提交流程</text>

  <rect x="350" y="340" width="260" height="170" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="384" cy="374" r="14" fill="#3b82f6"/>
  <text x="384" y="379" text-anchor="middle" font-size="13" fill="#ffffff">5</text>
  <text x="406" y="379" font-size="14" fill="#1e293b" font-weight="600">improver 定时运行</text>
  <text x="372" y="420" font-size="12" fill="#475569">Oz 平台认证 GitHub</text>
  <text x="372" y="440" font-size="12" fill="#475569">脚本拉取反馈 → 汇总 JSON</text>
  <text x="372" y="460" font-size="12" fill="#475569">识别信号，提出最小编辑</text>

  <rect x="70" y="340" width="260" height="170" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="104" cy="374" r="14" fill="#10b981"/>
  <text x="104" y="379" text-anchor="middle" font-size="13" fill="#ffffff">6</text>
  <text x="126" y="379" font-size="14" fill="#1e293b" font-weight="600">闭环继承</text>
  <text x="92" y="420" font-size="12" fill="#475569">自动开 PR 修改内层技能</text>
  <text x="92" y="440" font-size="12" fill="#475569">人类审核合并</text>
  <text x="92" y="460" font-size="12" fill="#475569">下一次分诊自动继承</text>

  <path d="M 330 177 L 348 177" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 610 177 L 628 177" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 760 262 L 760 338" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 630 425 L 612 425" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>
  <path d="M 350 425 L 332 425" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>

  <text x="480" y="562" text-anchor="middle" font-size="12.5" fill="#475569">Warp 已在整个开源仓库运行此模式——规格撰写、审查、分诊 agent 各自携带独立的自我改进循环</text>
  <text x="480" y="586" text-anchor="middle" font-size="11" fill="#94a3b8">技能即文件：agent 擅长更新文件，更新走标准 PR 流程，最终由人类合并闭环</text>
</svg>
