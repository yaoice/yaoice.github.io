<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect x="0" y="0" width="960" height="560" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">编写自我改进技能的六个实践</text>

  <rect x="70" y="78" width="270" height="195" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="96" y="130" font-size="28" fill="#cbd5e1" font-weight="600">1</text>
  <text x="130" y="126" font-size="15" fill="#1e293b" font-weight="600">写原则，不写规则</text>
  <text x="94" y="168" font-size="12" fill="#475569">像指导一个聪明人，而非给</text>
  <text x="94" y="188" font-size="12" fill="#475569">计算机编程。“寻找重复代码”</text>
  <text x="94" y="208" font-size="12" fill="#475569">优于穷举命名规则。</text>

  <rect x="345" y="78" width="270" height="195" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="371" y="130" font-size="28" fill="#cbd5e1" font-weight="600">2</text>
  <text x="405" y="126" font-size="15" fill="#1e293b" font-weight="600">解释为什么</text>
  <text x="369" y="168" font-size="12" fill="#475569">提供规则背后的理由，让</text>
  <text x="369" y="188" font-size="12" fill="#475569">agent 推理泛化，而不是</text>
  <text x="369" y="208" font-size="12" fill="#475569">机械执行。</text>

  <rect x="620" y="78" width="270" height="195" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="646" y="130" font-size="28" fill="#cbd5e1" font-weight="600">3</text>
  <text x="680" y="126" font-size="15" fill="#1e293b" font-weight="600">反馈零门槛</text>
  <text x="644" y="168" font-size="12" fill="#475569">在已有工作流中捕获：</text>
  <text x="644" y="188" font-size="12" fill="#475569">issue / PR 评论即可，自动</text>
  <text x="644" y="208" font-size="12" fill="#475569">触发，无额外提交步骤。</text>

  <rect x="70" y="292" width="270" height="195" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="96" y="344" font-size="28" fill="#cbd5e1" font-weight="600">4</text>
  <text x="130" y="340" font-size="15" fill="#1e293b" font-weight="600">技能小巧 · 渐进披露</text>
  <text x="94" y="382" font-size="12" fill="#475569">好的技能文件不大：引用</text>
  <text x="94" y="402" font-size="12" fill="#475569">资源文件与脚本，而非一次</text>
  <text x="94" y="422" font-size="12" fill="#475569">性塞满上下文。</text>

  <rect x="345" y="292" width="270" height="195" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="371" y="344" font-size="28" fill="#cbd5e1" font-weight="600">5</text>
  <text x="405" y="340" font-size="15" fill="#1e293b" font-weight="600">反馈质量 &gt; 数量</text>
  <text x="369" y="382" font-size="12" fill="#475569">资深工程师的少量详细反馈</text>
  <text x="369" y="402" font-size="12" fill="#475569">价值远超大量点赞；</text>
  <text x="369" y="422" font-size="12" fill="#475569">但高质量语料也是越多越好。</text>

  <rect x="620" y="292" width="270" height="195" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="646" y="344" font-size="28" fill="#cbd5e1" font-weight="600">6</text>
  <text x="680" y="340" font-size="15" fill="#1e293b" font-weight="600">在 improver 上多投入</text>
  <text x="644" y="382" font-size="12" fill="#475569">improver 技能跨用例高度</text>
  <text x="644" y="402" font-size="12" fill="#475569">可复用，投入回报超越</text>
  <text x="644" y="422" font-size="12" fill="#475569">单一 agent 循环。</text>

  <text x="480" y="530" text-anchor="middle" font-size="12" fill="#475569" font-style="italic">“低摩擦是信号持续流动的关键。如果反馈太难给，你既收不到反馈，也无法改进技能。” — Zach Lloyd</text>
</svg>
