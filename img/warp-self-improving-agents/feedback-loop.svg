<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="570" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">从反馈消失到双层技能闭环</text>

  <rect x="60" y="78" width="380" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="250" y="112" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">问题：反馈消失</text>

  <rect x="150" y="130" width="200" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="250" y="157" text-anchor="middle" font-size="13" fill="#1e293b">agent 会话运行</text>
  <path d="M 250 176 L 250 206" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrR)"/>
  <rect x="150" y="208" width="200" height="46" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="250" y="235" text-anchor="middle" font-size="13" fill="#ef4444">反馈随上下文丢弃</text>
  <path d="M 250 254 L 250 284" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrR)"/>
  <rect x="150" y="286" width="200" height="46" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="250" y="313" text-anchor="middle" font-size="13" fill="#1e293b">同类错误下次重犯</text>

  <text x="250" y="386" text-anchor="middle" font-size="12.5" fill="#475569">没有沉淀机制，每次会话都是“第一次”，</text>
  <text x="250" y="408" text-anchor="middle" font-size="12.5" fill="#475569">同类错误以同样的方式重复。</text>
  <text x="250" y="452" text-anchor="middle" font-size="11.5" fill="#94a3b8">反馈止于单次会话，组织不产生复利</text>

  <rect x="520" y="78" width="380" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="710" y="112" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">方案：双层技能闭环</text>

  <rect x="620" y="128" width="180" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="710" y="152" text-anchor="middle" font-size="12.5" fill="#1e293b">工作现场反馈</text>
  <path d="M 710 168 L 710 188" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>

  <rect x="545" y="192" width="330" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="560" y="214" font-size="12" fill="#475569">外层 · improver 技能（定时运行）</text>
  <rect x="560" y="224" width="140" height="40" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="630" y="248" text-anchor="middle" font-size="12" fill="#1e293b">拉取反馈 · 对比</text>
  <rect x="720" y="224" width="140" height="40" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="790" y="248" text-anchor="middle" font-size="12" fill="#1e293b">提出最小修改</text>
  <path d="M 700 244 L 718 244" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>
  <path d="M 790 264 C 790 284, 760 288, 718 292" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>
  <rect x="640" y="290" width="140" height="40" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="710" y="314" text-anchor="middle" font-size="12" fill="#1e293b">开 PR · 人类合并</text>

  <path d="M 710 342 L 710 362" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="722" y="356" font-size="11" fill="#10b981">下一轮自动继承</text>

  <rect x="545" y="366" width="330" height="110" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="390" font-size="12" fill="#475569">内层 · 基础技能（领域知识 + 指令）</text>
  <rect x="585" y="400" width="250" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="710" y="425" text-anchor="middle" font-size="12.5" fill="#1e293b">技能文件：审查规则 · 分诊标准</text>
  <text x="710" y="445" text-anchor="middle" font-size="11" fill="#94a3b8">纯 Markdown，不占用 prompt</text>

  <text x="710" y="508" text-anchor="middle" font-size="11.5" fill="#94a3b8">知识以文件形式沉淀，人类始终掌控合并权</text>
</svg>
