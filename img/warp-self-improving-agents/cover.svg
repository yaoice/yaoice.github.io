<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="410" rx="10" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">自我改进 Agent：双层技能闭环</text>
  <text x="480" y="64" text-anchor="middle" font-size="12.5" fill="#94a3b8">Warp on Claude · 反馈 → 技能更新 → 人工合并 → 下一代继承</text>

  <circle cx="480" cy="228" r="62" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="480" y="222" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">技能 = 文件</text>
  <text x="480" y="242" text-anchor="middle" font-size="11" fill="#94a3b8">不占 prompt</text>
  <text x="480" y="258" text-anchor="middle" font-size="11" fill="#94a3b8">可 PR 可 review</text>

  <rect x="380" y="86" width="200" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="480" y="107" text-anchor="middle" font-size="13.5" fill="#1e293b" font-weight="600">内层技能 · 执行任务</text>
  <text x="480" y="124" text-anchor="middle" font-size="11" fill="#475569">分诊 / 审查 / 规格撰写</text>

  <rect x="662" y="205" width="170" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="747" y="226" text-anchor="middle" font-size="13.5" fill="#1e293b" font-weight="600">工作现场反馈</text>
  <text x="747" y="243" text-anchor="middle" font-size="11" fill="#475569">issue / PR 评论</text>

  <rect x="370" y="352" width="220" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="480" y="373" text-anchor="middle" font-size="13.5" fill="#1e293b" font-weight="600">外层 improver 技能</text>
  <text x="480" y="390" text-anchor="middle" font-size="11" fill="#475569">定时观察 · 提出最小修改</text>

  <rect x="128" y="205" width="170" height="46" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="213" y="226" text-anchor="middle" font-size="13.5" fill="#1e293b" font-weight="600">PR · 人类合并</text>
  <text x="213" y="243" text-anchor="middle" font-size="11" fill="#475569">人在闭环掌控</text>

  <path d="M 585 112 C 660 118, 725 145, 742 197" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 752 255 C 760 302, 700 336, 598 348" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="790" y="306" text-anchor="middle" font-size="11" fill="#475569">捕获</text>
  <path d="M 360 348 C 258 336, 200 302, 209 255" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 219 197 C 238 145, 300 118, 372 112" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="252" y="140" text-anchor="middle" font-size="11" fill="#10b981">继承改进</text>

  <text x="480" y="394" text-anchor="middle" font-size="11.5" fill="#94a3b8">80 万月活开发者 · 1000 万次 Claude Code 会话 · 4000 万次 agent 对话 · 56% 财富 500 强在用</text>
