<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect width="960" height="440" fill="#f8fafc"/>

  <text x="480" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1e293b">从 v1alpha1 到生产，还差三道关</text>
  <text x="480" y="68" text-anchor="middle" font-size="12" fill="#64748b">docs/roadmap.md 的五个方向，归拢成三类必须跨过的工程问题</text>

  <rect x="40" y="98" width="280" height="252" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="66" cy="130" r="13" fill="#dbeafe"/>
  <text x="66" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">1</text>
  <text x="90" y="135" font-size="14" font-weight="600" fill="#1e293b">规范稳定化</text>
  <text x="60" y="170" font-size="11" fill="#334155">· Task：阶段 / 条件 / 预算 / 审批</text>
  <text x="60" y="198" font-size="11" fill="#334155">· Workspace：挂载路径与 goal 覆盖</text>
  <text x="60" y="226" font-size="11" fill="#334155">· Model：provider / 标识 / 凭据</text>
  <text x="60" y="254" font-size="11" fill="#334155">· Sandbox：隔离后端与安全配置</text>
  <rect x="60" y="278" width="240" height="52" rx="8" fill="#eff6ff"/>
  <text x="72" y="300" font-size="10.5" fill="#1d4ed8">现状：Sandbox 仍只是路线图条目，</text>
  <text x="72" y="318" font-size="10.5" fill="#1d4ed8">还不是 v1alpha1 里的一种 kind</text>

  <rect x="340" y="98" width="280" height="252" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="366" cy="130" r="13" fill="#ede9fe"/>
  <text x="366" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">2</text>
  <text x="390" y="135" font-size="14" font-weight="600" fill="#1e293b">Actor 架构重构</text>
  <text x="360" y="170" font-size="11" fill="#334155">· 环境准备拆成独立 setup actor</text>
  <text x="360" y="198" font-size="11" fill="#334155">· setup 与任务 actor 分别最小权限</text>
  <text x="360" y="226" font-size="11" fill="#334155">· 空闲检测 → 自动挂起提密度</text>
  <text x="360" y="254" font-size="11" fill="#334155">· 有状态任务分叉（内存 + 文件系统）</text>
  <rect x="360" y="278" width="240" height="52" rx="8" fill="#f5f3ff"/>
  <text x="372" y="300" font-size="10.5" fill="#6d28d9">动机：让「Agent 自己搭环境」</text>
  <text x="372" y="318" font-size="10.5" fill="#6d28d9">这件事变得可审计</text>

  <rect x="640" y="98" width="280" height="252" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="666" cy="130" r="13" fill="#d1fae5"/>
  <text x="666" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">3</text>
  <text x="690" y="135" font-size="14" font-weight="600" fill="#1e293b">身份 · 治理 · 可观测</text>
  <text x="660" y="170" font-size="11" fill="#334155">· 任务级 SPIFFE 身份 + 零信任 mTLS</text>
  <text x="660" y="198" font-size="11" fill="#334155">· 治理：策略执行 / 预算护栏 / 审计</text>
  <text x="660" y="226" font-size="11" fill="#334155">· OTel 指标 / 追踪 / 结构化轨迹</text>
  <text x="660" y="254" font-size="11" fill="#334155">· 无需用户容器改代码埋点</text>
  <rect x="660" y="278" width="240" height="52" rx="8" fill="#ecfdf5"/>
  <text x="672" y="300" font-size="10.5" fill="#047857">动机：把审计与调试从可选项</text>
  <text x="672" y="318" font-size="10.5" fill="#047857">变成默认能力</text>

  <rect x="40" y="366" width="880" height="56" rx="10" fill="#eef2f7"/>
  <text x="480" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">三道关跨过之前，它的定位是设计参考与实验平台，不是生产关键路径</text>
  <text x="480" y="410" text-anchor="middle" font-size="11" fill="#94a3b8">README 原文：We will likely to introduce major breaking changes prior to a stable release.（API 版本：ax.io/v1alpha1）</text>
</svg>
