<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect width="960" height="380" fill="#f8fafc"/>

  <text x="480" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1e293b">AX 管什么，不管什么</text>
  <text x="480" y="68" text-anchor="middle" font-size="12" fill="#64748b">三个原语里没有 graph、没有 chain、没有 node —— 它不介入 Agent 内部逻辑</text>

  <rect x="40" y="96" width="430" height="214" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="126" font-size="13" font-weight="600" fill="#1d4ed8">AX 负责</text>
  <text x="60" y="158" font-size="11.5" fill="#334155">· 隔离与生命周期：Task 创建 / 挂起 / 恢复 / 删除</text>
  <text x="60" y="188" font-size="11.5" fill="#334155">· 环境物化：Git 仓库 / MCP 服务器 / skills / goal 引导</text>
  <text x="60" y="218" font-size="11.5" fill="#334155">· 模型与凭据：集群级 Model + Kubernetes Secret</text>
  <text x="60" y="248" font-size="11.5" fill="#334155">· 规模与复用：Substrate 的 actor 复用与快照恢复</text>
  <text x="60" y="278" font-size="11.5" fill="#334155">· 观测入口：ax watch / describe / ssh / get</text>

  <rect x="490" y="96" width="430" height="214" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="510" y="126" font-size="13" font-weight="600" fill="#475569">AX 不负责</text>
  <text x="510" y="158" font-size="11.5" fill="#64748b">· Agent 内部逻辑：规划、工具编排、状态机</text>
  <text x="510" y="198" font-size="11.5" fill="#64748b">· harness 实现：runner 可替换，框架无关</text>
  <text x="510" y="238" font-size="11.5" fill="#64748b">· 工具服务器本身：MCP 由 Workspace 接线</text>
  <text x="510" y="278" font-size="11.5" fill="#64748b">· 单机体验：需要 K8s + Agent Substrate 前置</text>

  <rect x="40" y="326" width="880" height="44" rx="10" fill="#eef2f7"/>
  <text x="480" y="354" text-anchor="middle" font-size="12" fill="#1e293b">所以它抢的不是 Agent 框架的位置，是集群控制面的位置 —— 「用过 Kubernetes，ax 就会很眼熟」是设计目标，不是营销类比</text>
</svg>
