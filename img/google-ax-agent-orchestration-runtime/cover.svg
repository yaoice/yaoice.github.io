<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="420" fill="#f8fafc"/>

  <text x="480" y="48" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b">Agent 既不是无状态微服务，也不是批处理作业</text>
  <text x="480" y="74" text-anchor="middle" font-size="12.5" fill="#64748b">Google AX 的出发点：先把「这是哪种负载」说清楚，再谈怎么在集群里编排它</text>

  <g filter="url(#s)">
    <rect x="40" y="104" width="280" height="186" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="340" y="104" width="280" height="186" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="640" y="104" width="280" height="186" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <text x="64" y="138" font-size="14" font-weight="600" fill="#475569">无状态微服务</text>
  <text x="64" y="170" font-size="12" fill="#64748b">请求进、应答出</text>
  <text x="64" y="196" font-size="12" fill="#64748b">实例可随意替换</text>
  <text x="64" y="222" font-size="12" fill="#64748b">扩容 = 加副本</text>
  <text x="64" y="266" font-size="11.5" fill="#94a3b8">K8s 的原生假设</text>

  <text x="364" y="138" font-size="14" font-weight="600" fill="#475569">批处理作业</text>
  <text x="364" y="170" font-size="12" fill="#64748b">跑完即止</text>
  <text x="364" y="196" font-size="12" fill="#64748b">状态放外部存储</text>
  <text x="364" y="222" font-size="12" fill="#64748b">失败就重跑</text>
  <text x="364" y="266" font-size="11.5" fill="#94a3b8">Job / CronJob 的假设</text>

  <text x="664" y="138" font-size="14" font-weight="600" fill="#1d4ed8">Agent（新工作负载）</text>
  <text x="664" y="170" font-size="12" fill="#334155">跨调用累积状态，会规划与分叉</text>
  <text x="664" y="196" font-size="12" fill="#334155">跑的是不可信代码，需严格隔离</text>
  <text x="664" y="222" font-size="12" fill="#334155">无人看管时会在循环里烧钱</text>
  <text x="664" y="266" font-size="11.5" fill="#3b82f6">AX 的原文：a new kind of workload</text>

  <rect x="40" y="312" width="880" height="76" rx="10" fill="#eef2f7"/>
  <text x="60" y="340" font-size="12.5" fill="#475569">AX 的答案：三个小原语，一条命令</text>
  <text x="60" y="368" font-size="13.5" font-weight="600" fill="#1e293b">Task 隔离执行　·　Workspace 声明环境　·　Model 集中配置</text>
  <text x="900" y="352" text-anchor="end" font-size="12" fill="#3b82f6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">ax apply -f task.yaml</text>
</svg>
