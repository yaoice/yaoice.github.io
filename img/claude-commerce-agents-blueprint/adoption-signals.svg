<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">落地信号与三条判断</title>
  <desc id="desc">三个落地速度信号与本文的三条反常识判断。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .big{font-size:20px;font-weight:700}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
    </style>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">落地信号与三条判断</text>
  <text x="32" y="55" class="t small">15 分钟跑通只是起点，生产责任仍在宿主</text>

  <rect x="32" y="78" width="285" height="104" class="box" fill="#eff6ff"/>
  <text x="52" y="112" class="t big" fill="#3b82f6">15 分钟</text>
  <text x="52" y="136" class="t small">Wix 工程师跑通一个可接收指令的商业智能体</text>
  <text x="52" y="158" class="t small">“让复杂技术对用户变简单”的使命延续</text>

  <rect x="340" y="78" width="285" height="104" class="box" fill="#ecfdf5"/>
  <text x="360" y="112" class="t big" fill="#10b981">数周</text>
  <text x="360" y="136" class="t small">Zomato：蓝图“零障碍运行”，设置完全按文档工作</text>
  <text x="360" y="158" class="t small">内置实践为首次搭建的团队省下试错时间</text>

  <rect x="648" y="78" width="280" height="104" class="box" fill="#f1f5f9"/>
  <text x="668" y="112" class="t big" fill="#8b5cf6">&lt; 1 小时</text>
  <text x="668" y="136" class="t small">产品经理实测：本地跑通两个 Agent</text>
  <text x="668" y="158" class="t small">两次 Claude Code 工作流得到两种可用架构</text>

  <rect x="32" y="206" width="896" height="76" class="box" fill="#ffffff"/>
  <text x="52" y="233" class="t label">判断一：瓶颈不在模型能力，在信任与护栏</text>
  <text x="52" y="258" class="t small">最大的工程投入花在 provenance 校验与支付交接上，而不是“更自然的对话”。模型能力是必要条件，信任机制才是差异化。</text>

  <rect x="32" y="298" width="896" height="76" class="box" fill="#ffffff"/>
  <text x="52" y="325" class="t label">判断二：购物侧差异化在“交接”，商家侧在“审批”</text>
  <text x="52" y="350" class="t small">两者都不是“全自动”叙事；在交易与经营决策里，可控性优先于自主性。</text>

  <rect x="32" y="390" width="896" height="76" class="box" fill="#ffffff"/>
  <text x="52" y="417" class="t label">判断三：蓝图降低 0→1 的成本，生产责任没有消失</text>
  <text x="52" y="442" class="t small">“15 分钟跑通”与“上线运营”之间，是刻意留给企业的数据、规则、审批流与支付合规。参考实现是起点，不是终点。</text>
</svg>
