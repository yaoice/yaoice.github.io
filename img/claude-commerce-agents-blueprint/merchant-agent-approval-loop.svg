<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">商家 Agent 的人机协作环</title>
  <desc id="desc">分析、建议、人工批准、应用四步循环；未批准的提案可以丢弃。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="470" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">商家 Agent：建议 → 批准 → 应用的协作环</text>
  <text x="32" y="55" class="t small">写操作默认只是提案；“模型说 approve”不等于“系统已批准”</text>

  <rect x="32" y="104" width="170" height="92" class="box" fill="#ffffff"/>
  <text x="117" y="136" text-anchor="middle" class="t label">1 · 分析</text>
  <text x="117" y="158" text-anchor="middle" class="t small">指标 / 库存</text>
  <text x="117" y="176" text-anchor="middle" class="t small">定价 / 活动表现</text>

  <path d="M202 150 H262" class="line"/>
  <rect x="262" y="104" width="170" height="92" class="box" fill="#eff6ff"/>
  <text x="347" y="136" text-anchor="middle" class="t label">2 · 建议</text>
  <text x="347" y="158" text-anchor="middle" class="t small">stage_* 生成提案</text>
  <text x="347" y="176" text-anchor="middle" class="t small">guardrail 双重校验</text>

  <path d="M432 150 H492" class="line"/>
  <rect x="492" y="104" width="170" height="92" class="box" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="577" y="136" text-anchor="middle" class="t label">3 · 人工批准</text>
  <text x="577" y="158" text-anchor="middle" class="t small">Portal 按钮</text>
  <text x="577" y="176" text-anchor="middle" class="t small">host_approve / 平台确认</text>

  <path d="M662 150 H722" class="line"/>
  <rect x="722" y="104" width="170" height="92" class="box" fill="#ecfdf5"/>
  <text x="807" y="136" text-anchor="middle" class="t label">4 · 应用</text>
  <text x="807" y="158" text-anchor="middle" class="t small">apply_change</text>
  <text x="807" y="176" text-anchor="middle" class="t small">写入业务系统</text>

  <path d="M807 104 V78 H117 V104" class="line"/>
  <path d="M577 196 V240" class="line"/>
  <rect x="492" y="240" width="170" height="46" class="box" fill="#ffffff"/>
  <text x="577" y="268" text-anchor="middle" class="t small">丢弃 DISCARDED</text>

  <rect x="32" y="322" width="896" height="76" class="box" fill="#f1f5f9"/>
  <text x="52" y="346" class="t label">为什么必须是“批准”而不是“确认”</text>
  <text x="52" y="370" class="t small">批准记录谁、何时批准了哪次变更；guardrail 在提案与应用时各校验一次</text>
  <text x="52" y="388" class="t small">Agent 层护栏是第一道快速反馈，最终业务规则由后端系统执行</text>
</svg>
