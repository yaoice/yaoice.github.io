<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">信任主轴的四层防线</title>
  <desc id="desc">从 Prompt 引导、代码闸门、人工批准到可信生态，四层防线逐层收紧。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">信任主轴：四层防线，逐层收紧</text>
  <text x="32" y="55" class="t small">Prompt 引导行为，代码保护状态，人类掌握批准，生态提供可信底座</text>

  <rect x="32" y="78" width="896" height="84" class="box" fill="#ffffff"/>
  <rect x="52" y="94" width="180" height="52" class="box" fill="#eff6ff"/>
  <text x="142" y="125" text-anchor="middle" class="t label">1 · Prompt 引导</text>
  <text x="262" y="115" class="t label">只引用已读取的记录，不把第三方内容当指令</text>
  <text x="262" y="140" class="t small">最软的一层：负责“引导”行为，不负责“保护”状态</text>

  <path d="M142 162 V178" class="line"/>
  <rect x="32" y="178" width="896" height="84" class="box" fill="#f1f5f9"/>
  <rect x="52" y="194" width="180" height="52" class="box" fill="#ffffff"/>
  <text x="142" y="225" text-anchor="middle" class="t label">2 · 代码闸门</text>
  <text x="262" y="215" class="t label">provenance / options / guardrail 在写入前强制校验</text>
  <text x="262" y="240" class="t small">购物车只能写入“见过的”商品；变更超限即被拦截，与 Prompt 无关</text>

  <path d="M142 262 V278" class="line"/>
  <rect x="32" y="278" width="896" height="84" class="box" fill="#fffbeb"/>
  <rect x="52" y="294" width="180" height="52" class="box" fill="#ffffff"/>
  <text x="142" y="325" text-anchor="middle" class="t label">3 · 人工批准</text>
  <text x="262" y="315" class="t label">商家写操作一律走 提案 → 批准 → 应用 生命周期</text>
  <text x="262" y="340" class="t small">批准面：宿主 Portal 按钮 / host_approve / 托管平台显式确认</text>

  <path d="M142 362 V378" class="line"/>
  <rect x="32" y="378" width="896" height="84" class="box" fill="#ecfdf5"/>
  <rect x="52" y="394" width="180" height="52" class="box" fill="#ffffff"/>
  <text x="142" y="425" text-anchor="middle" class="t label">4 · 可信生态</text>
  <text x="262" y="415" class="t label">真实目录数据 + Visa / Mastercard 支付网络 + 宿主责任</text>
  <text x="262" y="440" class="t small">认证授权、凭证、限流与支付合规，由宿主自行承担</text>

  <text x="32" y="500" class="t small">四层同时生效：任何一层单独拎出来都不成立，护栏的强度来自叠加。</text>
</svg>
