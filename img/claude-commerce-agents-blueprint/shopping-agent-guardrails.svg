<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">购物 Agent 的能力与护栏</title>
  <desc id="desc">左侧为购物 Agent 的能力清单，右侧为系统护栏，底部展示从真实目录数据到宿主结账的交接流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">购物 Agent：在可信边界内完成交接</text>
  <text x="32" y="55" class="t small">能力在左，护栏在右，支付永远留在企业侧</text>

  <rect x="32" y="78" width="430" height="220" class="box" fill="#eff6ff"/>
  <text x="52" y="106" class="t label">Agent 能做什么</text>
  <text x="52" y="134" class="t small">· 理解组合需求：帐篷 + 睡袋 + 炉子，一次请求</text>
  <text x="52" y="160" class="t small">· 记住客户偏好，量身定制推荐</text>
  <text x="52" y="186" class="t small">· 对话内直接展示商品、对比与购物车（非纯文本）</text>
  <text x="52" y="212" class="t small">· 同一对话回答订单状态 / 退换货 / 退款政策</text>
  <text x="52" y="244" class="t small" fill="#3b82f6">把复杂需求折叠进一次对话</text>

  <rect x="498" y="78" width="430" height="220" class="box" fill="#fffbeb"/>
  <text x="518" y="106" class="t label">系统不放行什么（护栏）</text>
  <text x="518" y="134" class="t small">· 商品与价格只允许来自真实目录数据</text>
  <text x="518" y="160" class="t small">· provenance gate：只能加本会话“见过”的商品</text>
  <text x="518" y="186" class="t small">· options gate：必须选定具体 variant，不能凭空拼 SKU</text>
  <text x="518" y="212" class="t small">· 数量 / 行数上限；禁止操纵性向上销售</text>
  <text x="518" y="244" class="t small" fill="#f59e0b">模型负责选择，不负责编造事实</text>

  <rect x="32" y="330" width="210" height="56" class="box" fill="#ffffff"/>
  <text x="137" y="363" text-anchor="middle" class="t small">真实目录数据</text>
  <path d="M242 358 H300" class="line"/>
  <rect x="300" y="330" width="210" height="56" class="box" fill="#eff6ff"/>
  <text x="405" y="363" text-anchor="middle" class="t small">Agent 构建购物车</text>
  <path d="M510 358 H568" class="line"/>
  <rect x="568" y="330" width="360" height="56" class="box" fill="#ecfdf5"/>
  <text x="748" y="354" text-anchor="middle" class="t small">交接宿主结账 / 智能支付提供商</text>
  <text x="748" y="374" text-anchor="middle" class="t small" fill="#10b981">模型看不到支付 URL，也没有扣款能力</text>

  <text x="32" y="424" class="t small">checkout 只生成订单摘要，由宿主渲染自己的结账页面；可选平台 hosted checkout 的 URL 在调用结束后才注入 UI。</text>
</svg>
