<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Claude Commerce Agents 蓝图全景</title>
  <desc id="desc">展示购物与商家两个 Agent 的分工、共享安全机制、三种运行路径与合作伙伴生态。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700}
      .small{font-size:12px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="600" fill="#f8fafc"/>
  <text x="32" y="32" class="t title">Claude Commerce Agents 蓝图全景</text>
  <text x="32" y="55" class="t small">两个角色、一套共享护栏、三种运行路径与开放生态</text>

  <rect x="32" y="78" width="896" height="52" class="box" fill="#eff6ff"/>
  <text x="480" y="110" text-anchor="middle" class="t label">Anthropic Commerce Agents Blueprint · 开源参考实现（2026-09 发布）</text>

  <path d="M247 130 V152" class="line"/>
  <path d="M713 130 V152" class="line"/>

  <rect x="32" y="152" width="430" height="116" class="box" fill="#eff6ff"/>
  <text x="52" y="180" class="t label">shopping agent · 面向消费者</text>
  <text x="52" y="205" class="t small">组合多商品请求 / 偏好记忆 / 对话内商品卡片</text>
  <text x="52" y="225" class="t small">回答订单与售后 · 构建购物车 → 交接宿主结账</text>
  <text x="52" y="250" class="t small" fill="#f59e0b">写边界：只改购物车，支付留在企业侧</text>

  <rect x="498" y="152" width="430" height="116" class="box" fill="#ecfdf5"/>
  <text x="518" y="180" class="t label">merchant agent · 面向运营者</text>
  <text x="518" y="205" class="t small">销售表现 / 库存预警 / 定价与促销建议</text>
  <text x="518" y="225" class="t small">起草营销活动 · 变更提案 → 人工批准后应用</text>
  <text x="518" y="250" class="t small" fill="#10b981">写边界：只提提案，批准权在人类</text>

  <path d="M247 268 V290" class="line"/>
  <path d="M713 268 V290" class="line"/>

  <rect x="32" y="290" width="896" height="62" class="box" fill="#f1f5f9"/>
  <text x="52" y="317" class="t label">共享执行与安全机制（commerce-common）</text>
  <text x="52" y="340" class="t small">工具执行器 · 记忆治理 · 上下文栅栏 · grounding · 事件协议</text>

  <path d="M480 352 V374" class="line"/>

  <rect x="32" y="374" width="285" height="46" class="box" fill="#ffffff"/>
  <text x="174" y="402" text-anchor="middle" class="t small">Messages API · 自有轮次循环</text>
  <rect x="340" y="374" width="285" height="46" class="box" fill="#ffffff"/>
  <text x="482" y="402" text-anchor="middle" class="t small">Agent SDK · 进程内 MCP</text>
  <rect x="648" y="374" width="280" height="46" class="box" fill="#ffffff"/>
  <text x="788" y="402" text-anchor="middle" class="t small">Managed Agents · 平台托管（beta）</text>

  <rect x="32" y="444" width="896" height="62" class="box" fill="#e2e8f0"/>
  <text x="52" y="471" class="t label">生态与交付</text>
  <text x="52" y="494" class="t small">Visa · Mastercard · Accenture · Wix · Zomato · Shopify · Klaviyo · Square · Priceline · Intuit</text>

  <text x="32" y="540" class="t small">部署面：Claude API · Amazon Bedrock · Microsoft Foundry · Google Cloud Vertex AI</text>
</svg>
