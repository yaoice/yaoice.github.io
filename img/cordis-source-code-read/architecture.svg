<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#f8fafc"/>

  <text x="480" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Cordis 分层架构总览</text>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#64748b">核心只有五个服务；配置加载、日志输出、热更新等能力全部以插件形式挂在同一个 Context 上</text>

  <!-- 应用层 -->
  <rect x="40" y="92" width="880" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="116" font-size="12" fill="#94a3b8">应用层</text>
  <text x="480" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">你的应用（如 Koishi 机器人框架）</text>
  <text x="480" y="154" text-anchor="middle" font-size="12" fill="#64748b">ctx.plugin() 安装插件 · ctx.provide() 暴露服务 · ctx.on() 监听事件</text>

  <!-- 生态插件层 -->
  <rect x="40" y="204" width="880" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="228" font-size="12" fill="#94a3b8">生态插件层</text>
  <g font-size="13" font-weight="700" fill="#475569" text-anchor="middle">
    <rect x="52" y="238" width="202" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="153" y="261">plugin-loader 配置驱动加载</text>
    <rect x="270" y="238" width="202" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="371" y="261">plugin-hmr 热更新</text>
    <rect x="488" y="238" width="202" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="589" y="261">plugin-timer 定时器</text>
    <rect x="706" y="238" width="202" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="807" y="261">plugin-logger-console 输出</text>
  </g>

  <!-- 核心层 -->
  <rect x="40" y="316" width="880" height="188" rx="10" fill="#ffffff" stroke="#3b82f6" filter="url(#soft)"/>
  <text x="60" y="340" font-size="12" fill="#3b82f6">核心层 · cordis（packages/core，零 I/O 依赖）</text>
  <text x="480" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Context — 一个 Proxy 包裹的原型链对象</text>
  <g text-anchor="middle">
    <rect x="52" y="376" width="164" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="134" y="402" font-size="13" font-weight="700" fill="#1e293b">Fiber</text>
    <text x="134" y="422" font-size="11" fill="#64748b">生命周期状态机</text>
    <text x="134" y="438" font-size="11" fill="#64748b">effect 副作用回收</text>

    <rect x="225" y="376" width="164" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="307" y="402" font-size="13" font-weight="700" fill="#1e293b">Registry</text>
    <text x="307" y="422" font-size="11" fill="#64748b">插件注册与去重</text>
    <text x="307" y="438" font-size="11" fill="#64748b">@Inject 依赖声明</text>

    <rect x="398" y="376" width="164" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="480" y="402" font-size="13" font-weight="700" fill="#1e293b">Reflect</text>
    <text x="480" y="422" font-size="11" fill="#64748b">服务注册表 store</text>
    <text x="480" y="438" font-size="11" fill="#64748b">Proxy 属性解析</text>

    <rect x="571" y="376" width="164" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="653" y="402" font-size="13" font-weight="700" fill="#1e293b">Events</text>
    <text x="653" y="422" font-size="11" fill="#64748b">事件分派</text>
    <text x="653" y="438" font-size="11" fill="#64748b">emit/serial/waterfall…</text>

    <rect x="744" y="376" width="164" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="826" y="402" font-size="13" font-weight="700" fill="#1e293b">Logger</text>
    <text x="826" y="422" font-size="11" fill="#64748b">消息缓冲</text>
    <text x="826" y="438" font-size="11" fill="#64748b">exporter 插件化输出</text>
  </g>
  <text x="480" y="488" text-anchor="middle" font-size="11" fill="#64748b">五个服务通过 ctx.mixin() 把方法转发到 Context 上：ctx.plugin、ctx.on、ctx.provide、ctx.logger 由此而来</text>

  <!-- 基建层 -->
  <rect x="40" y="532" width="880" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="556" font-size="12" fill="#94a3b8">基建层</text>
  <text x="480" y="572" text-anchor="middle" font-size="13" fill="#475569">cosmokit（基础工具库） · Standard Schema（配置校验） · Node.js ESM / TypeScript</text>

  <!-- arrows -->
  <path d="M480 176 L480 204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M480 288 L480 316" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M480 504 L480 532" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
