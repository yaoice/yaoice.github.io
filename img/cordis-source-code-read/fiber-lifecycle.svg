<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>

  <text x="480" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Fiber 生命周期状态机</text>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#64748b">LOADING 与 UNLOADING 之间的每次往返，都是一次完整的卸载 → 重载</text>

  <!-- LOADING -->
  <rect x="395" y="88" width="170" height="64" rx="12" fill="#eff6ff" stroke="#3b82f6" filter="url(#soft)"/>
  <text x="480" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">LOADING</text>
  <text x="480" y="135" text-anchor="middle" font-size="11" fill="#64748b">正在执行插件 callback</text>

  <!-- ACTIVE -->
  <rect x="395" y="232" width="170" height="64" rx="12" fill="#ecfdf5" stroke="#10b981" filter="url(#soft)"/>
  <text x="480" y="259" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">ACTIVE</text>
  <text x="480" y="279" text-anchor="middle" font-size="11" fill="#64748b">服务可用，正常运行</text>

  <!-- PENDING -->
  <rect x="105" y="232" width="170" height="64" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text x="190" y="259" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">PENDING</text>
  <text x="190" y="279" text-anchor="middle" font-size="11" fill="#64748b">依赖未就绪，等待注入</text>

  <!-- UNLOADING -->
  <rect x="105" y="380" width="170" height="64" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="190" y="407" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">UNLOADING</text>
  <text x="190" y="427" text-anchor="middle" font-size="11" fill="#64748b">逆序回收副作用</text>

  <!-- FAILED -->
  <rect x="685" y="88" width="170" height="64" rx="12" fill="#fef2f2" stroke="#ef4444"/>
  <text x="770" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">FAILED</text>
  <text x="770" y="135" text-anchor="middle" font-size="11" fill="#64748b">执行出错，记录 _error</text>

  <!-- DISPOSED -->
  <rect x="685" y="380" width="170" height="64" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="770" y="407" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">DISPOSED</text>
  <text x="770" y="427" text-anchor="middle" font-size="11" fill="#64748b">已卸载，uid = null</text>

  <!-- arrows -->
  <path d="M275 240 C330 240 340 152 395 152" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="300" y="188" font-size="11" fill="#64748b">依赖注入就绪</text>

  <path d="M480 152 L480 232" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="490" y="196" font-size="11" fill="#64748b">执行完成</text>

  <path d="M565 120 L685 120" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="625" y="110" font-size="11" fill="#64748b">抛出异常</text>

  <path d="M395 296 C340 336 320 344 275 380" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="262" y="352" font-size="11" fill="#64748b">服务变更 / update()</text>

  <path d="M105 404 C36 404 36 120 395 120" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="30" y="258" font-size="11" fill="#64748b">回收完毕 → reload</text>

  <path d="M565 264 C640 296 660 340 685 380" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="618" y="330" font-size="11" fill="#64748b">dispose()</text>

  <path d="M685 120 L565 120" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="625" y="134" font-size="11" fill="#64748b">update() 修复后重试</text>

  <text x="480" y="458" text-anchor="middle" font-size="11" fill="#94a3b8">副作用按注册逆序回收，异步清理函数会被依次 await —— 卸载链由 inertia Promise 串行化</text>
</svg>
