<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#f8fafc"/>

  <text x="480" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">五种事件分派模式</text>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#64748b">同一个 ctx.on() 注册的监听器，按分派方式不同产生完全不同的协作语义</text>

  <!-- card 1 emit -->
  <g>
    <rect x="36" y="96" width="168" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="36" y="96" width="168" height="34" rx="10" fill="#eff6ff"/>
    <text x="120" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">emit</text>
    <text x="120" y="152" text-anchor="middle" font-size="11" fill="#475569">同步广播</text>
    <text x="120" y="170" text-anchor="middle" font-size="11" fill="#475569">永不停止</text>
    <text x="120" y="188" text-anchor="middle" font-size="11" fill="#94a3b8">返回 void</text>
    <circle cx="44" cy="248" r="13" fill="#3b82f6"/><text x="44" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L1</text>
    <circle cx="120" cy="248" r="13" fill="#3b82f6"/><text x="120" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L2</text>
    <circle cx="196" cy="248" r="13" fill="#3b82f6"/><text x="196" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L3</text>
    <path d="M60 248 L104 248" stroke="#94a3b8" marker-end="url(#arr)"/>
    <path d="M136 248 L180 248" stroke="#94a3b8" marker-end="url(#arr)"/>
    <text x="120" y="300" text-anchor="middle" font-size="10" fill="#64748b">状态通知、广播</text>
    <text x="120" y="318" text-anchor="middle" font-size="10" fill="#64748b">尽力而为的场合</text>
  </g>

  <!-- card 2 parallel -->
  <g>
    <rect x="216" y="96" width="168" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="216" y="96" width="168" height="34" rx="10" fill="#eff6ff"/>
    <text x="300" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">parallel</text>
    <text x="300" y="152" text-anchor="middle" font-size="11" fill="#475569">并发执行</text>
    <text x="300" y="170" text-anchor="middle" font-size="11" fill="#475569">全部跑完</text>
    <text x="300" y="188" text-anchor="middle" font-size="11" fill="#94a3b8">失败聚合抛出</text>
    <circle cx="224" cy="248" r="13" fill="#3b82f6"/><text x="224" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L1</text>
    <circle cx="300" cy="248" r="13" fill="#3b82f6"/><text x="300" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L2</text>
    <circle cx="376" cy="248" r="13" fill="#3b82f6"/><text x="376" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L3</text>
    <text x="300" y="292" text-anchor="middle" font-size="10" fill="#64748b">Promise.allSettled</text>
    <text x="300" y="310" text-anchor="middle" font-size="10" fill="#64748b">AggregateError</text>
  </g>

  <!-- card 3 serial -->
  <g>
    <rect x="396" y="96" width="168" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="396" y="96" width="168" height="34" rx="10" fill="#f5f3ff"/>
    <text x="480" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">serial</text>
    <text x="480" y="152" text-anchor="middle" font-size="11" fill="#475569">顺序执行（异步）</text>
    <text x="480" y="170" text-anchor="middle" font-size="11" fill="#475569">首个真值即停</text>
    <text x="480" y="188" text-anchor="middle" font-size="11" fill="#94a3b8">返回该值</text>
    <circle cx="404" cy="248" r="13" fill="#8b5cf6"/><text x="404" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L1</text>
    <circle cx="480" cy="248" r="13" fill="#8b5cf6"/><text x="480" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L2</text>
    <circle cx="556" cy="248" r="13" fill="#e2e8f0" stroke="#cbd5e1"/><text x="556" y="252" text-anchor="middle" font-size="10" fill="#94a3b8">L3</text>
    <path d="M420 248 L464 248" stroke="#94a3b8" marker-end="url(#arr)"/>
    <path d="M496 248 L540 248" stroke="#e2e8f0" stroke-dasharray="3 3"/>
    <text x="480" y="292" text-anchor="middle" font-size="10" fill="#64748b">L2 返回真值</text>
    <text x="480" y="310" text-anchor="middle" font-size="10" fill="#64748b">L3 不再执行</text>
  </g>

  <!-- card 4 bail -->
  <g>
    <rect x="576" y="96" width="168" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="576" y="96" width="168" height="34" rx="10" fill="#fffbeb"/>
    <text x="660" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">bail</text>
    <text x="660" y="152" text-anchor="middle" font-size="11" fill="#475569">顺序执行（同步）</text>
    <text x="660" y="170" text-anchor="middle" font-size="11" fill="#475569">首个真值即停</text>
    <text x="660" y="188" text-anchor="middle" font-size="11" fill="#94a3b8">返回该值</text>
    <circle cx="584" cy="248" r="13" fill="#f59e0b"/><text x="584" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L1</text>
    <circle cx="660" cy="248" r="13" fill="#f59e0b"/><text x="660" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L2</text>
    <circle cx="736" cy="248" r="13" fill="#e2e8f0" stroke="#cbd5e1"/><text x="736" y="252" text-anchor="middle" font-size="10" fill="#94a3b8">L3</text>
    <path d="M600 248 L644 248" stroke="#94a3b8" marker-end="url(#arr)"/>
    <path d="M676 248 L720 248" stroke="#e2e8f0" stroke-dasharray="3 3"/>
    <text x="660" y="292" text-anchor="middle" font-size="10" fill="#64748b">权限校验、拦截</text>
    <text x="660" y="310" text-anchor="middle" font-size="10" fill="#64748b">谁先返回非空谁做主</text>
  </g>

  <!-- card 5 waterfall -->
  <g>
    <rect x="756" y="96" width="168" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="756" y="96" width="168" height="34" rx="10" fill="#ecfdf5"/>
    <text x="840" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">waterfall</text>
    <text x="840" y="152" text-anchor="middle" font-size="11" fill="#475569">中间件串联</text>
    <text x="840" y="170" text-anchor="middle" font-size="11" fill="#475569">手动调用 next()</text>
    <text x="840" y="188" text-anchor="middle" font-size="11" fill="#94a3b8">最内层结果</text>
    <circle cx="764" cy="248" r="13" fill="#10b981"/><text x="764" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L1</text>
    <circle cx="840" cy="248" r="13" fill="#10b981"/><text x="840" y="252" text-anchor="middle" font-size="10" fill="#ffffff">L2</text>
    <circle cx="916" cy="248" r="13" fill="#10b981"/><text x="916" y="252" text-anchor="middle" font-size="10" fill="#ffffff">inner</text>
    <path d="M780 248 L824 248" stroke="#94a3b8" marker-end="url(#arr)"/>
    <path d="M856 248 L900 248" stroke="#94a3b8" marker-end="url(#arr)"/>
    <text x="840" y="292" text-anchor="middle" font-size="10" fill="#64748b">Koa 风格洋葱模型</text>
    <text x="840" y="310" text-anchor="middle" font-size="10" fill="#64748b">配置更新、属性读写拦截</text>
  </g>

  <text x="480" y="376" text-anchor="middle" font-size="11" fill="#94a3b8">内部事件 internal/* 同样走这五种模式：如 internal/update 用 waterfall 让各层插件串联干预配置更新</text>
</svg>
