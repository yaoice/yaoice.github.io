<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">Trust, but Verify：让自动化可信的四层防线</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">自动化程度越高，验证必须越硬 —— 沙箱防恶意，防线防漂移</text>

  <!-- 第一层 -->
  <text x="24" y="130" font-size="11" fill="#475569" font-weight="600">第一道防线</text>
  <rect x="130" y="76" width="786" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="160" y="112" font-size="13" fill="#1e293b" font-weight="600">固定不变量</text>
  <text x="160" y="132" font-size="11" fill="#475569">把不可更改的架构规则与安全边界写入根目录 CLAUDE.md，约束每一次生成</text>
  <text x="160" y="152" font-size="10" fill="#94a3b8">案例：Zingage 写下 567 行「这个团队如何思考」的规则</text>
  <line x1="523" y1="172" x2="523" y2="184" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 第二层 -->
  <text x="24" y="242" font-size="11" fill="#475569" font-weight="600">第二道防线</text>
  <rect x="130" y="188" width="786" height="96" rx="10" fill="#ecfdf5" stroke="#10b981" filter="url(#s)"/>
  <text x="160" y="224" font-size="13" fill="#1e293b" font-weight="600">专家审核回路</text>
  <text x="160" y="244" font-size="11" fill="#475569">让领域专家审核智能体的输出与推理过程，把关质量与合规</text>
  <text x="160" y="264" font-size="10" fill="#94a3b8">原则：修正原则，而非修正个例 —— Uriah Israel · Cainex</text>
  <line x1="523" y1="284" x2="523" y2="296" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 第三层 -->
  <text x="24" y="354" font-size="11" fill="#475569" font-weight="600">第三道防线</text>
  <rect x="130" y="300" width="786" height="96" rx="10" fill="#f5f3ff" stroke="#8b5cf6" filter="url(#s)"/>
  <text x="160" y="336" font-size="13" fill="#1e293b" font-weight="600">黄金测试集</text>
  <text x="160" y="356" font-size="11" fill="#475569">用评估集持续回归，防止模型升级带来的智能体能力漂移</text>
  <text x="160" y="376" font-size="10" fill="#94a3b8">模型越强，越需要固定的基线来度量「变好」还是「变偏」</text>
  <line x1="523" y1="396" x2="523" y2="408" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 第四层 -->
  <text x="24" y="466" font-size="11" fill="#475569" font-weight="600">第四道防线</text>
  <rect x="130" y="412" width="786" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" filter="url(#s)"/>
  <text x="160" y="448" font-size="13" fill="#1e293b" font-weight="600">确定性硬闸门</text>
  <text x="160" y="468" font-size="11" fill="#475569">Hooks 强制 lint 阻断、提交前测试，失败即中止，无例外</text>
  <text x="160" y="488" font-size="10" fill="#94a3b8">提示词可以说服，闸门只认结果 —— 确定性是最后一道保险</text>

  <text x="480" y="540" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">先上防线（原则三），再谈交付（原则一）</text>
</svg>
