<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">落地检查清单：本周就能开始</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">原文文末附带的实操清单，逐章对应五条原则</text>

  <!-- 01 -->
  <rect x="40" y="76" width="880" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <circle cx="78" cy="106" r="13" fill="#3b82f6"/>
  <text x="78" y="111" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">01</text>
  <text x="102" y="111" font-size="12" font-weight="700" fill="#1e293b">人人皆可交付</text>
  <rect x="270" y="97" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="107" font-size="11" fill="#334155">用 MCP / CLI 把 Claude 接入日常工具与数据源</text>
  <rect x="270" y="121" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="131" font-size="11" fill="#334155">建公司级插件市场，用 Skills 共享最佳实践</text>

  <!-- 02 -->
  <rect x="40" y="164" width="880" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <circle cx="78" cy="194" r="13" fill="#10b981"/>
  <text x="78" y="199" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">02</text>
  <text x="102" y="199" font-size="12" font-weight="700" fill="#1e293b">自动化繁琐</text>
  <rect x="270" y="185" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="195" font-size="11" fill="#334155">仓库开启 Code Review（研究预览版）</text>
  <rect x="270" y="209" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="219" font-size="11" fill="#334155">用 Claude Tag 参与 CI/CD 值班与 Bug 分诊</text>

  <!-- 03 -->
  <rect x="40" y="252" width="880" height="108" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <circle cx="78" cy="282" r="13" fill="#f59e0b"/>
  <text x="78" y="287" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">03</text>
  <text x="102" y="287" font-size="12" font-weight="700" fill="#1e293b">信任但验证</text>
  <rect x="270" y="273" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="283" font-size="11" fill="#334155">不变量写入根目录 CLAUDE.md</text>
  <rect x="270" y="297" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="307" font-size="11" fill="#334155">用 Loops 处理长期自主任务</text>
  <rect x="270" y="321" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="331" font-size="11" fill="#334155">建立并维护智能体评估集</text>
  <rect x="270" y="345" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="355" font-size="11" fill="#334155">用 Hooks 做确定性硬闸门</text>

  <!-- 04 -->
  <rect x="40" y="372" width="880" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <circle cx="78" cy="402" r="13" fill="#8b5cf6"/>
  <text x="78" y="407" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">04</text>
  <text x="102" y="407" font-size="12" font-weight="700" fill="#1e293b">为重建而构建</text>
  <rect x="270" y="393" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="403" font-size="11" fill="#334155">用 git worktrees 隔离重建</text>
  <rect x="270" y="417" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="427" font-size="11" fill="#334155">大型重写从 plan mode 开始</text>

  <!-- 05 -->
  <rect x="40" y="460" width="880" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <circle cx="78" cy="490" r="13" fill="#475569"/>
  <text x="78" y="495" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">05</text>
  <text x="102" y="495" font-size="12" font-weight="700" fill="#1e293b">原型 → 产品化</text>
  <rect x="270" y="481" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="491" font-size="11" fill="#334155">内部智能体先 dogfood</text>
  <rect x="270" y="505" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <text x="294" y="515" font-size="11" fill="#334155">成熟后经 Claude API / SDK 产品化</text>

  <text x="480" y="566" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">落地顺序建议反过来：先上防线（原则三），再谈交付（原则一）</text>
</svg>
