<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="640" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">Claude Code 初创公司指南：五条运营原则</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">Anthropic 基于 16 家高速增长初创公司的访谈提炼 · 2026-08</text>

  <!-- 01 -->
  <rect x="40" y="76" width="880" height="88" rx="10" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <circle cx="86" cy="120" r="18" fill="#3b82f6"/>
  <text x="86" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">01</text>
  <text x="120" y="114" font-size="15" font-weight="700" fill="#1e293b">Everyone Ships</text>
  <text x="120" y="134" font-size="12" fill="#475569">人人皆可交付</text>
  <text x="420" y="124" font-size="13" font-weight="600" fill="#1e293b">最懂问题的人，直接提交第一版</text>
  <text x="900" y="124" text-anchor="end" font-size="11" fill="#475569">MCP 连接数据 · 路演展示 · Skills 统一标准</text>

  <!-- 02 -->
  <rect x="40" y="176" width="880" height="88" rx="10" fill="#ecfdf5" stroke="#10b981" filter="url(#s)"/>
  <circle cx="86" cy="220" r="18" fill="#10b981"/>
  <text x="86" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">02</text>
  <text x="120" y="214" font-size="15" font-weight="700" fill="#1e293b">Automate the Tedium</text>
  <text x="120" y="234" font-size="12" fill="#475569">自动化繁琐工作</text>
  <text x="420" y="224" font-size="13" font-weight="600" fill="#1e293b">Agent 吃掉 80% 的机械劳动</text>
  <text x="900" y="224" text-anchor="end" font-size="11" fill="#475569">自动代码评审 · Claude Tag 值班 · Bug 分诊</text>

  <!-- 03 -->
  <rect x="40" y="276" width="880" height="88" rx="10" fill="#fffbeb" stroke="#f59e0b" filter="url(#s)"/>
  <circle cx="86" cy="320" r="18" fill="#f59e0b"/>
  <text x="86" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">03</text>
  <text x="120" y="314" font-size="15" font-weight="700" fill="#1e293b">Trust, but Verify</text>
  <text x="120" y="334" font-size="12" fill="#475569">信任，但要验证</text>
  <text x="420" y="324" font-size="13" font-weight="600" fill="#1e293b">自动化程度越高，验证必须越硬</text>
  <text x="900" y="324" text-anchor="end" font-size="11" fill="#475569">CLAUDE.md 不变量 · 黄金测试集 · Hooks 硬闸门</text>

  <!-- 04 -->
  <rect x="40" y="376" width="880" height="88" rx="10" fill="#f5f3ff" stroke="#8b5cf6" filter="url(#s)"/>
  <circle cx="86" cy="420" r="18" fill="#8b5cf6"/>
  <text x="86" y="425" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">04</text>
  <text x="120" y="414" font-size="15" font-weight="700" fill="#1e293b">Build for Rebuilding</text>
  <text x="120" y="434" font-size="12" fill="#475569">为重建而构建</text>
  <text x="420" y="424" font-size="13" font-weight="600" fill="#1e293b">代码不是永久资产，敢推倒重来</text>
  <text x="900" y="424" text-anchor="end" font-size="11" fill="#475569">git worktrees 隔离重建 · plan mode 先行</text>

  <!-- 05 -->
  <rect x="40" y="476" width="880" height="88" rx="10" fill="#f1f5f9" stroke="#475569" filter="url(#s)"/>
  <circle cx="86" cy="520" r="18" fill="#475569"/>
  <text x="86" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">05</text>
  <text x="120" y="514" font-size="15" font-weight="700" fill="#1e293b">Prototype → Dogfood → Productionize</text>
  <text x="120" y="534" font-size="12" fill="#475569">原型 → 试用 → 产品化</text>
  <text x="420" y="524" font-size="13" font-weight="600" fill="#1e293b">内部工具晋升为客户产品</text>
  <text x="900" y="524" text-anchor="end" font-size="11" fill="#475569">内部智能体先行 · 成熟后经 API / SDK 交付</text>

  <text x="480" y="606" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">五条原则指向同一个结论：AI 原生组织让十几人的团队打出百人团队的输出</text>
</svg>
