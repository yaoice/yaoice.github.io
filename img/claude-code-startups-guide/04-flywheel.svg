<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#10b981"/>
    </marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">Prototype → Dogfood → Productionize：内部工具的产品化飞轮</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">用 AI 构建产品的同时，也在理解 AI —— 构建方式的飞轮</text>

  <!-- 原型 -->
  <rect x="360" y="140" width="240" height="96" rx="12" fill="#eff6ff" stroke="#3b82f6" filter="url(#s)"/>
  <text x="480" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Prototype · 原型</text>
  <text x="480" y="206" text-anchor="middle" font-size="11" fill="#475569">用 Claude Code 构建内部智能体</text>
  <text x="480" y="224" text-anchor="middle" font-size="10" fill="#94a3b8">门槛最低的起点</text>

  <!-- 试用 -->
  <rect x="600" y="360" width="240" height="96" rx="12" fill="#ecfdf5" stroke="#10b981" filter="url(#s)"/>
  <text x="720" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Dogfood · 试用</text>
  <text x="720" y="426" text-anchor="middle" font-size="11" fill="#475569">团队日常使用，感知模型边界</text>
  <text x="720" y="444" text-anchor="middle" font-size="10" fill="#94a3b8">洞察反哺产品设计</text>

  <!-- 产品化 -->
  <rect x="120" y="360" width="240" height="96" rx="12" fill="#fffbeb" stroke="#f59e0b" filter="url(#s)"/>
  <text x="240" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Productionize · 产品化</text>
  <text x="240" y="426" text-anchor="middle" font-size="11" fill="#475569">经 Claude API / SDK / Managed Agents</text>
  <text x="240" y="444" text-anchor="middle" font-size="10" fill="#94a3b8">交付客户</text>

  <!-- 环路 -->
  <path d="M 600 205 C 700 210, 730 280, 716 356" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="704" y="290" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="600">成熟后开放</text>
  <line x1="600" y1="408" x2="372" y2="408" stroke="#10b981" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="486" y="398" text-anchor="middle" font-size="10" fill="#047857" font-weight="600">产品化</text>
  <path d="M 320 358 C 280 300, 300 240, 356 212" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="296" y="292" text-anchor="middle" font-size="10" fill="#b45309" font-weight="600">使用洞察反哺</text>

  <!-- 中心 -->
  <text x="480" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">开发者即产品经理</text>
  <text x="480" y="458" text-anchor="middle" font-size="11" fill="#475569">用构建 AI 的方式理解 AI</text>

  <text x="480" y="520" text-anchor="middle" font-size="11" fill="#475569">案例：Omni 在内部试用中比较「文件 vs 嵌入」方案，直接简化了对外产品架构</text>
</svg>
