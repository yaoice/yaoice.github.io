<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">Everyone Ships：从「传话游戏」到直接交付</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">编码门槛被抹平之后，洞见不再需要层层转述</text>

  <!-- 左侧：传统链路 -->
  <rect x="40" y="76" width="400" height="330" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#s)"/>
  <rect x="40" y="76" width="400" height="40" rx="12" fill="#fef2f2"/>
  <rect x="40" y="104" width="400" height="12" fill="#fef2f2"/>
  <text x="240" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">传统链路：层层传话</text>
  <rect x="70" y="132" width="340" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="240" y="160" text-anchor="middle" font-size="12" fill="#334155">业务用户：我有个想法……</text>
  <rect x="70" y="194" width="340" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="240" y="222" text-anchor="middle" font-size="12" fill="#334155">产品经理：需求文档 v3</text>
  <rect x="70" y="256" width="340" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="240" y="284" text-anchor="middle" font-size="12" fill="#334155">工程师：实现与设计不符</text>
  <rect x="70" y="318" width="340" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="240" y="346" text-anchor="middle" font-size="12" fill="#334155">代码上线：洞见已经蒸发</text>
  <line x1="240" y1="178" x2="240" y2="190" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="240" y1="240" x2="240" y2="252" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#aa)"/>
  <line x1="240" y1="302" x2="240" y2="314" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="240" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">每层转述都在丢失信息</text>

  <!-- 中间箭头 -->
  <line x1="446" y1="241" x2="552" y2="241" stroke="#475569" stroke-width="3" marker-end="url(#ad)"/>
  <text x="499" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">门槛被抹平</text>
  <text x="499" y="266" text-anchor="middle" font-size="10" fill="#475569">Claude Code</text>

  <!-- 右侧：新链路 -->
  <rect x="560" y="76" width="360" height="330" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5" filter="url(#s)"/>
  <rect x="560" y="76" width="360" height="40" rx="12" fill="#ecfdf5"/>
  <rect x="560" y="104" width="360" height="12" fill="#ecfdf5"/>
  <text x="740" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">新链路：直接交付</text>
  <rect x="590" y="132" width="300" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="740" y="160" text-anchor="middle" font-size="12" fill="#1e293b">最懂问题的人（业务 / 律师 / 医生）</text>
  <rect x="590" y="194" width="300" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="740" y="222" text-anchor="middle" font-size="12" fill="#1e293b">Claude Code：连接数据与工具</text>
  <rect x="590" y="256" width="300" height="46" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="740" y="284" text-anchor="middle" font-size="12" fill="#1e293b">直接提交 PR</text>
  <line x1="740" y1="178" x2="740" y2="190" stroke="#10b981" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="740" y1="240" x2="740" y2="252" stroke="#10b981" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="740" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">洞见直达 · 原型即交付</text>

  <!-- 底部金句 -->
  <text x="480" y="440" text-anchor="middle" font-size="13" font-style="italic" fill="#1e293b">"真正理解问题的人可以直接提交 PR。"</text>
  <text x="480" y="462" text-anchor="middle" font-size="11" fill="#94a3b8">—— Dr. Thomas Kelly · Heidi 联合创始人兼 CEO</text>
</svg>
