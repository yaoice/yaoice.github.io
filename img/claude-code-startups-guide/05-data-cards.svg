<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="440" fill="#f8fafc" rx="10"/>
  <text x="480" y="38" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="600">16 家初创公司的量化样本（节选）</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">每家公司都是多条原则的组合生效，而非孤立套用</text>

  <!-- ClickHouse -->
  <rect x="40" y="76" width="280" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="58" y="98" font-size="12" font-weight="700" fill="#1e293b">ClickHouse</text>
  <text x="58" y="138" font-size="24" font-weight="700" fill="#3b82f6">+30%</text>
  <text x="58" y="160" font-size="10" fill="#475569">出货功能提升</text>
  <text x="58" y="174" font-size="10" fill="#475569">两个修复智能体成为仓库第 2、3 大贡献者</text>

  <!-- Omni -->
  <rect x="340" y="76" width="280" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="358" y="98" font-size="12" font-weight="700" fill="#1e293b">Omni</text>
  <text x="358" y="138" font-size="24" font-weight="700" fill="#10b981">2–3×</text>
  <text x="358" y="160" font-size="10" fill="#475569">工程生产力提升</text>

  <!-- Clay -->
  <rect x="640" y="76" width="280" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="658" y="98" font-size="12" font-weight="700" fill="#1e293b">Clay</text>
  <text x="658" y="138" font-size="24" font-weight="700" fill="#10b981">100%</text>
  <text x="658" y="160" font-size="10" fill="#475569">Bug 分诊自动化</text>

  <!-- Artemis -->
  <rect x="40" y="198" width="280" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="58" y="220" font-size="12" font-weight="700" fill="#1e293b">Artemis Security</text>
  <text x="58" y="260" font-size="24" font-weight="700" fill="#8b5cf6">6,000+</text>
  <text x="58" y="282" font-size="10" fill="#475569">每周 PR 产出</text>

  <!-- Commure -->
  <rect x="340" y="198" width="280" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="358" y="220" font-size="12" font-weight="700" fill="#1e293b">Commure</text>
  <text x="358" y="260" font-size="24" font-weight="700" fill="#3b82f6">13</text>
  <text x="358" y="282" font-size="10" fill="#475569">一名工程师并行完成的 ticket 数</text>

  <!-- Higgsfield -->
  <rect x="640" y="198" width="280" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#s)"/>
  <text x="658" y="220" font-size="12" font-weight="700" fill="#1e293b">Higgsfield</text>
  <text x="658" y="260" font-size="24" font-weight="700" fill="#f59e0b">天 → 小时</text>
  <text x="658" y="282" font-size="10" fill="#475569">新模型部署周期压缩</text>

  <!-- 底部横条 -->
  <rect x="40" y="320" width="880" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="480" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Anthropic 内部：Claude Tag 在最近一次事件中 15 分钟发布首份情况报告</text>
  <text x="480" y="362" text-anchor="middle" font-size="9" fill="#64748b">样本公司：Artemis · Cainex · Clay · ClickHouse · Cognition · Commure · Crosby · Emergent</text>
  <text x="480" y="380" text-anchor="middle" font-size="9" fill="#64748b">Harvey · Heidi · Higgsfield · Omni · Parahelp · Translucent · Zingage</text>

  <text x="480" y="424" text-anchor="middle" font-size="11" fill="#94a3b8">数据均出自 Anthropic 官方指南原文</text>
</svg>
