<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ja2-t ja2-d">
  <title id="ja2-t">案例卡片解剖</title>
  <desc id="ja2-d">60 条案例共用同一张卡片结构：输入、Jev 判断、后续动作、启发、证据与边界五个固定段位，使不同来源的记录可以被横向比较。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .hd{font-size:12.5px;font-weight:700;fill:#1d4ed8}
      .lb{font-size:11px;font-weight:700;fill:#334155}
      .s{font-size:10.5px;fill:#64748b}
      .h5{font-size:13px;font-weight:700;fill:#334155}
    </style>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="32" y="36" class="t title">案例卡片解剖：五段位固定结构</text>
  <text x="32" y="58" class="t sub">结构固定之后，60 条来自不同发布方的记录才能横向比较；读法也可以分层，浅读看前三段，深读展开证据与边界</text>

  <rect x="32" y="84" width="430" height="440" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="32" y="84" width="430" height="46" rx="10" fill="#eff6ff"/>
  <rect x="32" y="112" width="430" height="18" fill="#eff6ff"/>
  <text x="48" y="114" class="t hd">JEV-41 ｜ AI 回答里，品牌被提到了吗？</text>

  <text x="48" y="152" class="t lb">01 · 输入</text>
  <text x="48" y="170" class="t s">目标品牌与 AI 回答</text>
  <line x1="48" y1="184" x2="446" y2="184" stroke="#e2e8f0" stroke-width="1"/>

  <text x="48" y="204" class="t lb">02 · Jev 判断</text>
  <text x="48" y="222" class="t s">评估是否存在品牌提及（Noul 概率型判断）</text>
  <line x1="48" y1="236" x2="446" y2="236" stroke="#e2e8f0" stroke-width="1"/>

  <text x="48" y="256" class="t lb">03 · 后续动作</text>
  <text x="48" y="274" class="t s">业务模块接收结构化结果</text>

  <rect x="44" y="292" width="406" height="66" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="58" y="314" class="t lb" fill="#b45309">启发</text>
  <text x="58" y="332" class="t s" fill="#78350f">GEO 监测可将实体提及、引用链接和排名分成独立</text>
  <text x="58" y="348" class="t s" fill="#78350f">检查，避免互相替代。</text>

  <rect x="44" y="372" width="406" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="58" y="394" class="t lb">证据与边界（可展开）</text>
  <text x="58" y="414" class="t s">原始记录：Notra 的 GEO 品牌提及判断</text>
  <text x="58" y="432" class="t s">实际环节：GEO 模块调用统一评价客户端</text>
  <text x="58" y="450" class="t s">可信度边界：已见接入代码，线上采用范围未知</text>
  <text x="58" y="468" class="t s">核验方式：核对 evaluateMention、getEvaluationClient</text>

  <text x="48" y="508" class="t s" fill="#94a3b8">资料截至 2026.09.20 ｜ B·项目/作者一手</text>

  <text x="498" y="106" class="t h5">五个段位，五种阅读问题</text>

  <rect x="498" y="124" width="4" height="36" rx="2" fill="#3b82f6"/>
  <text x="514" y="140" class="t lb">01 · 输入 —— 材料与状态是什么？</text>
  <text x="514" y="157" class="t s">输入决定了这条记录的能力边界：模型只处理被喂进来的东西。</text>

  <rect x="498" y="178" width="4" height="36" rx="2" fill="#3b82f6"/>
  <text x="514" y="194" class="t lb">02 · Jev 判断 —— 是判断、选择还是评分？</text>
  <text x="514" y="211" class="t s">这一格对应输出原语：Noul / Choice / Score / Boolean。</text>

  <rect x="498" y="232" width="4" height="36" rx="2" fill="#3b82f6"/>
  <text x="514" y="248" class="t lb">03 · 后续动作 —— 结果被谁消费？</text>
  <text x="514" y="265" class="t s">没有下游消费方的记录，本质上只是一次演示。</text>

  <rect x="498" y="286" width="4" height="36" rx="2" fill="#f59e0b"/>
  <text x="514" y="302" class="t lb" fill="#b45309">启发 —— 可迁移方向</text>
  <text x="514" y="319" class="t s">属于解释性整理，不是原项目的结论，也不是效果承诺。</text>

  <rect x="498" y="340" width="4" height="36" rx="2" fill="#94a3b8"/>
  <text x="514" y="356" class="t lb">证据与边界 —— 这条记录站得住吗？</text>
  <text x="514" y="373" class="t s">原始记录 · 实际环节 · 可信度边界 · 核验方式 · 原始链接。</text>

  <rect x="498" y="400" width="430" height="124" rx="10" fill="#f1f5f9"/>
  <text x="514" y="424" class="t lb">为什么页脚值得单独看一眼</text>
  <text x="514" y="446" class="t s">每条案例页脚都固定声明：原研究未调用 Jev API；本页为可视化</text>
  <text x="514" y="464" class="t s">重编，未新增联网核验或独立复测；流程图与启发为解释性整理。</text>
  <text x="514" y="490" class="t s">这等于告诉读者：图谱回答的是“公开了什么”，而不是“效果如何”。</text>
  <text x="514" y="512" class="t s" fill="#94a3b8">把这句话读完，再去引用任何一条记录，误读概率会低很多。</text>
</svg>
