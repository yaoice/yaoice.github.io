<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="ja7-t ja7-d">
  <title id="ja7-t">从 10 条记录到 4 个 GEO 试验方向</title>
  <desc id="ja7-d">图谱把 10 条 GEO 可借鉴记录归并为四个方向：品牌提及与实体归一、信源筛选与引用审校、商业意图与问句特征、官网表达与内容质检，每个方向都给出先测指标与关联案例编号。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .ch{font-size:10.5px;font-weight:700;fill:#94a3b8}
      .nm{font-size:13.5px;font-weight:700;fill:#1e293b}
      .nm2{font-size:10.5px;fill:#64748b}
      .how{font-size:10.5px;fill:#475569}
      .m{font-size:10.5px;fill:#b45309}
      .lnk{font-size:10.5px;font-weight:700;fill:#1d4ed8}
      .note{font-size:11px;fill:#64748b}
    </style>
  </defs>
  <rect width="960" height="510" fill="#f8fafc"/>
  <text x="32" y="36" class="t title">从 10 条记录到 4 个试验方向</text>
  <text x="32" y="58" class="t sub">这是图谱给出的应用迁移建议：不计作新增案例，也不代表已经验证的商业效果</text>

  <text x="48" y="80" class="t ch">方向</text>
  <text x="330" y="80" class="t ch">怎么做</text>
  <text x="612" y="80" class="t ch">先测什么</text>
  <text x="928" y="80" class="t ch" text-anchor="end">关联案例</text>

  <rect x="32" y="90" width="896" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="32" y="102" width="4" height="60" rx="2" fill="#3b82f6"/>
  <text x="48" y="124" class="t nm">01 · 品牌提及与实体归一</text>
  <text x="48" y="144" class="t nm2">先判断实质提及，再核对同名实体</text>
  <text x="330" y="114" class="t how">将目标品牌、别名和 AI 回答配对，先判断是否存在实质</text>
  <text x="330" y="132" class="t how">提及，再核对同名实体。引用 URL 和答案中的位置另行</text>
  <text x="330" y="150" class="t how">记录，不与提及判断混为一项。</text>
  <text x="612" y="114" class="t m">提及识别精确率 / 召回率</text>
  <text x="612" y="132" class="t m">同名误合并率</text>
  <text x="928" y="124" class="t lnk" text-anchor="end">JEV-41 · JEV-09</text>

  <rect x="32" y="186" width="896" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="32" y="198" width="4" height="60" rx="2" fill="#3b82f6"/>
  <text x="48" y="220" class="t nm">02 · 信源筛选与引用审校</text>
  <text x="48" y="240" class="t nm2">拆开环节，让薄弱证据进复核</text>
  <text x="330" y="210" class="t how">把搜索策略、段落筛选、论断支持度与原文存在性拆成</text>
  <text x="330" y="228" class="t how">独立环节，让薄弱证据和冲突材料进入复核，而不是</text>
  <text x="330" y="246" class="t how">由模型一次给出“可信/不可信”。</text>
  <text x="612" y="210" class="t m">相关性 / 错引检出率</text>
  <text x="612" y="228" class="t m">有效证据误删率</text>
  <text x="928" y="220" class="t lnk" text-anchor="end">JEV-34 · JEV-10 · 11 · 55</text>

  <rect x="32" y="282" width="896" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="32" y="294" width="4" height="60" rx="2" fill="#3b82f6"/>
  <text x="48" y="316" class="t nm">03 · 商业意图与问句特征</text>
  <text x="48" y="336" class="t nm2">把问句当特征，而非关键词</text>
  <text x="330" y="306" class="t how">借鉴层级分类与特征提取，标注问句中的行业、场景、</text>
  <text x="330" y="324" class="t how">预算、比较和采购信号，再结合业务数据验证排序价值；</text>
  <text x="330" y="342" class="t how">模糊样本保留较粗类别。</text>
  <text x="612" y="306" class="t m">标签一致性 / 歧义率</text>
  <text x="612" y="324" class="t m">与线索价值的关联</text>
  <text x="928" y="316" class="t lnk" text-anchor="end">JEV-16 · JEV-17</text>

  <rect x="32" y="378" width="896" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="32" y="390" width="4" height="60" rx="2" fill="#3b82f6"/>
  <text x="48" y="412" class="t nm">04 · 官网表达与内容质检</text>
  <text x="48" y="432" class="t nm2">先审查信息是否清楚，再看转化</text>
  <text x="330" y="402" class="t how">将产品清晰度、目标人群、信任依据和稿件质量拆成具</text>
  <text x="330" y="420" class="t how">体检查项，保留人工意见，并观察修改后的实际转化，</text>
  <text x="330" y="438" class="t how">不用单一总分代替。</text>
  <text x="612" y="402" class="t m">人工评审一致性 / 漏检率</text>
  <text x="612" y="420" class="t m">返工率</text>
  <text x="928" y="412" class="t lnk" text-anchor="end">JEV-56 · JEV-58</text>

  <text x="32" y="488" class="t note">操作建议：先建立带人工标签的小样本集，记录模型版本、问题、阈值和原始响应，再分别观察质量、覆盖率、延迟与成本。</text>
</svg>
