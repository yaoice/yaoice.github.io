<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="ja4-t ja4-d">
  <title id="ja4-t">四类输出原语</title>
  <desc id="ja4-d">图谱把 Jev 的输出归为 Noul、Choice、Score、Boolean 四类：概率型判断、有限候选选择、评分与布尔判定，候选集合与阈值均由程序定义。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .pn{font-size:15px;font-weight:700;fill:#334155}
      .pnb{font-size:15px;font-weight:700;fill:#1d4ed8}
      .k{font-size:10.5px;font-weight:700;fill:#94a3b8}
      .v{font-size:10.5px;fill:#475569}
      .e{font-size:10.5px;fill:#64748b}
    </style>
  </defs>
  <rect width="960" height="470" fill="#f8fafc"/>
  <text x="32" y="36" class="t title">四类输出原语：模型只在给定范围内做判断</text>
  <text x="32" y="58" class="t sub">候选集合、检查项与阈值由程序定义；模型不负责生成候选，也不负责执行动作——这是“小模型进流程”的前提</text>

  <rect x="32" y="84" width="212" height="310" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="32" y="84" width="212" height="38" rx="10" fill="#eff6ff"/>
  <rect x="32" y="112" width="212" height="10" fill="#eff6ff"/>
  <text x="138" y="110" class="t pnb" text-anchor="middle">Noul</text>
  <text x="48" y="152" class="t k">形态</text>
  <text x="48" y="170" class="t v">在一条主张上给出倾向</text>
  <text x="48" y="186" class="t v">与不确定度（概率型）</text>
  <text x="48" y="216" class="t k">适合</text>
  <text x="48" y="234" class="t v">存在性判断</text>
  <text x="48" y="250" class="t v">风险与严重程度</text>
  <text x="48" y="266" class="t v">相关性与支持关系</text>
  <text x="48" y="296" class="t k">代表案例</text>
  <text x="48" y="314" class="t e">JEV-41 品牌提及是否存在</text>
  <text x="48" y="330" class="t e">JEV-10 段落可用性与冲突</text>
  <text x="48" y="346" class="t e">JEV-44 HTTP 200 语义故障</text>
  <text x="48" y="374" class="t e" fill="#94a3b8">大量案例的默认输出</text>

  <rect x="260" y="84" width="212" height="310" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="260" y="84" width="212" height="38" rx="10" fill="#f1f5f9"/>
  <rect x="260" y="112" width="212" height="10" fill="#f1f5f9"/>
  <text x="366" y="110" class="t pn" text-anchor="middle">Choice</text>
  <text x="276" y="152" class="t k">形态</text>
  <text x="276" y="170" class="t v">候选项由程序给定</text>
  <text x="276" y="186" class="t v">模型只选，不自己造</text>
  <text x="276" y="216" class="t k">适合</text>
  <text x="276" y="234" class="t v">路由与分流</text>
  <text x="276" y="250" class="t v">工具、函数、动作选择</text>
  <text x="276" y="266" class="t v">分类树逐层选择</text>
  <text x="276" y="296" class="t k">代表案例</text>
  <text x="276" y="314" class="t e">JEV-49 邮件意图分流</text>
  <text x="276" y="330" class="t e">JEV-28 网页动作与元素</text>
  <text x="276" y="346" class="t e">JEV-16 标签树逐层下钻</text>
  <text x="276" y="374" class="t e" fill="#94a3b8">候选质量决定上限</text>

  <rect x="488" y="84" width="212" height="310" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="488" y="84" width="212" height="38" rx="10" fill="#f1f5f9"/>
  <rect x="488" y="112" width="212" height="10" fill="#f1f5f9"/>
  <text x="594" y="110" class="t pn" text-anchor="middle">Score</text>
  <text x="504" y="152" class="t k">形态</text>
  <text x="504" y="170" class="t v">为对象给出可比较的</text>
  <text x="504" y="186" class="t v">分值，用于排序或分级</text>
  <text x="504" y="216" class="t k">适合</text>
  <text x="504" y="234" class="t v">优先级排序</text>
  <text x="504" y="250" class="t v">风险严重程度</text>
  <text x="504" y="266" class="t v">质量与诊断价值档位</text>
  <text x="504" y="296" class="t k">代表案例</text>
  <text x="504" y="314" class="t e">JEV-42 日志诊断价值</text>
  <text x="504" y="330" class="t e">JEV-12 输入输出风险分级</text>
  <text x="504" y="346" class="t e">JEV-58 写作模式检查</text>
  <text x="504" y="374" class="t e" fill="#94a3b8">分数口径必须显式定义</text>

  <rect x="716" y="84" width="212" height="310" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="716" y="84" width="212" height="38" rx="10" fill="#f1f5f9"/>
  <rect x="716" y="112" width="212" height="10" fill="#f1f5f9"/>
  <text x="822" y="110" class="t pn" text-anchor="middle">Boolean</text>
  <text x="732" y="152" class="t k">形态</text>
  <text x="732" y="170" class="t v">单一真假命题的判定</text>
  <text x="732" y="186" class="t v">结果最容易被代码消费</text>
  <text x="732" y="216" class="t k">适合</text>
  <text x="732" y="234" class="t v">门禁与准入检查</text>
  <text x="732" y="250" class="t v">是否触发某类请求</text>
  <text x="732" y="266" class="t v">是否达成目标状态</text>
  <text x="732" y="296" class="t k">代表案例</text>
  <text x="732" y="314" class="t e">JEV-26 是否请求退款</text>
  <text x="732" y="330" class="t e">JEV-35 是否到达目标节点</text>
  <text x="732" y="346" class="t e">JEV-57 是否丢失跟踪目标</text>
  <text x="732" y="374" class="t e" fill="#94a3b8">常与 Choice 组合出现</text>

  <text x="32" y="428" class="t sub" font-weight="700">共同点</text>
  <text x="102" y="428" class="t sub">判断对象小、候选有限、结果可被程序直接消费。图谱里的案例极少让模型“自由回答”，绝大多数都是这四类原语的组合。</text>
</svg>
