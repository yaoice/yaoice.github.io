<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ja5-t ja5-d">
  <title id="ja5-t">九类场景模块与案例分布</title>
  <desc id="ja5-d">九个模块按案例数排列：知识检索与证据、文档与数据工程、Agent 编排与安全各 9 条，业务分流与风控、浏览器与设备自动化、开发与运维、内容与媒体审核各 7 条，交互与能力评测 3 条，GEO 与营销 2 条。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .no{font-size:11.5px;font-weight:700;fill:#94a3b8}
      .nm{font-size:12.5px;font-weight:700;fill:#334155}
      .nmh{font-size:12.5px;font-weight:700;fill:#1d4ed8}
      .c{font-size:11px;fill:#64748b}
      .lg{font-size:10.5px;fill:#64748b}
    </style>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="32" y="36" class="t title">九类场景模块与案例分布</text>
  <text x="32" y="58" class="t sub">每条记录只计入一个模块，跨场景启发不重复计数；“GEO 可借鉴”是一个标签，不是一个模块</text>

  <circle cx="646" cy="76" r="4.5" fill="#3b82f6"/>
  <text x="658" y="80" class="t lg">含“GEO 可借鉴”标签的记录（共 10 条，分布见原文）</text>
  <text x="658" y="98" class="t lg">带标记的模块：01 · 02 · 03 · 09</text>

  <text x="32" y="106" class="t no">01</text>
  <circle cx="76" cy="102" r="4.5" fill="#3b82f6"/>
  <text x="92" y="106" class="t nmh">GEO 与营销</text>
  <rect x="300" y="88" width="102" height="20" rx="5" fill="#3b82f6"/>
  <text x="412" y="103" class="t c">2 条</text>

  <text x="32" y="148" class="t no">02</text>
  <circle cx="76" cy="144" r="4.5" fill="#3b82f6"/>
  <text x="92" y="148" class="t nm">知识检索与证据</text>
  <rect x="300" y="130" width="460" height="20" rx="5" fill="#94a3b8"/>
  <text x="770" y="145" class="t c">9 条</text>

  <text x="32" y="190" class="t no">03</text>
  <circle cx="76" cy="186" r="4.5" fill="#3b82f6"/>
  <text x="92" y="190" class="t nm">文档与数据工程</text>
  <rect x="300" y="172" width="460" height="20" rx="5" fill="#94a3b8"/>
  <text x="770" y="187" class="t c">9 条</text>

  <text x="32" y="232" class="t no">04</text>
  <text x="92" y="232" class="t nm">业务分流与风控</text>
  <rect x="300" y="214" width="358" height="20" rx="5" fill="#94a3b8"/>
  <text x="668" y="229" class="t c">7 条</text>

  <text x="32" y="274" class="t no">05</text>
  <text x="92" y="274" class="t nm">Agent 编排与安全</text>
  <rect x="300" y="256" width="460" height="20" rx="5" fill="#94a3b8"/>
  <text x="770" y="271" class="t c">9 条</text>

  <text x="32" y="316" class="t no">06</text>
  <text x="92" y="316" class="t nm">浏览器与设备自动化</text>
  <rect x="300" y="298" width="358" height="20" rx="5" fill="#94a3b8"/>
  <text x="668" y="313" class="t c">7 条</text>

  <text x="32" y="358" class="t no">07</text>
  <text x="92" y="358" class="t nm">开发与运维</text>
  <rect x="300" y="340" width="358" height="20" rx="5" fill="#94a3b8"/>
  <text x="668" y="355" class="t c">7 条</text>

  <text x="32" y="400" class="t no">08</text>
  <text x="92" y="400" class="t nm">内容与媒体审核</text>
  <rect x="300" y="382" width="358" height="20" rx="5" fill="#94a3b8"/>
  <text x="668" y="397" class="t c">7 条</text>

  <text x="32" y="442" class="t no">09</text>
  <circle cx="76" cy="438" r="4.5" fill="#3b82f6"/>
  <text x="92" y="442" class="t nm">交互与能力评测</text>
  <rect x="300" y="424" width="153" height="20" rx="5" fill="#94a3b8"/>
  <text x="463" y="439" class="t c">3 条</text>

  <text x="32" y="486" class="t lg">60 条独立任务对应 59 个去重原始出处：Doom 与 Wikiracing 共用同一篇发布文章，计为不同任务。</text>
  <text x="32" y="504" class="t lg">模块按主要用途归类；同一份能力在不同模块里反复出现，正是这份图谱最值得读的地方。</text>
</svg>
