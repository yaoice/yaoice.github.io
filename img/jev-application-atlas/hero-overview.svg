<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ja1-t ja1-d">
  <title id="ja1-t">Jev 应用图谱总览</title>
  <desc id="ja1-d">60 条公开记录分布在 9 类场景模块中，来源分为官方 27 条与项目及作者 33 条；读图谱需分别判断来源身份、实现存在性与效果可信度。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .num{font-size:30px;font-weight:700;fill:#1e293b}
      .lb{font-size:12px;font-weight:700;fill:#334155}
      .s{font-size:11px;fill:#64748b}
      .xs{font-size:10.5px;fill:#94a3b8}
      .chip{font-size:12.5px;font-weight:700;fill:#334155}
      .cnt{font-size:11px;fill:#64748b}
    </style>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="32" y="36" class="t title">Jev 应用图谱：60 个案例，9 类场景，2 级证据</text>
  <text x="32" y="60" class="t sub">资料截至 2026.09.20 ｜ 60 条独立任务 ｜ 59 个去重原始出处 ｜ 官方 27 · 开发者 30 · 作者实验 3</text>

  <rect x="32" y="80" width="212" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="122" class="t num">60</text>
  <text x="48" y="144" class="t lb">公开应用记录</text>
  <text x="48" y="162" class="t xs">教程 · 演示 · 评测 · 原型 · 实验</text>

  <rect x="260" y="80" width="212" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="276" y="122" class="t num">09</text>
  <text x="276" y="144" class="t lb">应用场景模块</text>
  <text x="276" y="162" class="t xs">按主要用途归类，不重复计数</text>

  <rect x="488" y="80" width="212" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="504" y="122" class="t num">27</text>
  <text x="504" y="144" class="t lb">官方一手记录</text>
  <text x="504" y="162" class="t xs">TypeSafe AI · Vercel · LangChain</text>

  <rect x="716" y="80" width="212" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="732" y="122" class="t num">33</text>
  <text x="732" y="144" class="t lb">项目与作者记录</text>
  <text x="732" y="162" class="t xs">30 个开发者项目 + 3 项作者实验</text>

  <text x="32" y="208" class="t lb">九类场景模块（括号内为案例数；蓝色为本文主线）</text>

  <rect x="32" y="224" width="285" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="246" class="t chip" fill="#1d4ed8">01 ｜ GEO 与营销</text>
  <text x="303" y="246" class="cnt" text-anchor="end">2 条</text>
  <text x="46" y="262" class="t xs" fill="#3b82f6">从品牌提及，到官网表达</text>

  <rect x="337" y="224" width="285" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="351" y="246" class="t chip">02 ｜ 知识检索与证据</text>
  <text x="608" y="246" class="cnt" text-anchor="end">9 条</text>
  <text x="351" y="262" class="t xs">找得到，还要有依据</text>

  <rect x="642" y="224" width="285" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="656" y="246" class="t chip">03 ｜ 文档与数据工程</text>
  <text x="913" y="246" class="cnt" text-anchor="end">9 条</text>
  <text x="656" y="262" class="t xs">让非结构化材料进入流程</text>

  <rect x="32" y="276" width="285" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="298" class="t chip">04 ｜ 业务分流与风控</text>
  <text x="303" y="298" class="cnt" text-anchor="end">7 条</text>
  <text x="46" y="314" class="t xs">标准化判断，保留人工入口</text>

  <rect x="337" y="276" width="285" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="351" y="298" class="t chip">05 ｜ Agent 编排与安全</text>
  <text x="608" y="298" class="cnt" text-anchor="end">9 条</text>
  <text x="351" y="314" class="t xs">选工具，查风险，看进展</text>

  <rect x="642" y="276" width="285" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="656" y="298" class="t chip">06 ｜ 浏览器与设备自动化</text>
  <text x="913" y="298" class="cnt" text-anchor="end">7 条</text>
  <text x="656" y="314" class="t xs">从状态理解，到受控动作</text>

  <rect x="32" y="328" width="285" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="350" class="t chip">07 ｜ 开发与运维</text>
  <text x="303" y="350" class="cnt" text-anchor="end">7 条</text>
  <text x="46" y="366" class="t xs">从代码差异里，找出重点</text>

  <rect x="337" y="328" width="285" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="351" y="350" class="t chip">08 ｜ 内容与媒体审核</text>
  <text x="608" y="350" class="cnt" text-anchor="end">7 条</text>
  <text x="351" y="366" class="t xs">从一篇文章，细到一句表达</text>

  <rect x="642" y="328" width="285" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="656" y="350" class="t chip">09 ｜ 交互与能力评测</text>
  <text x="913" y="350" class="cnt" text-anchor="end">3 条</text>
  <text x="656" y="366" class="t xs">看清任务，也看清指标口径</text>

  <rect x="32" y="392" width="896" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="418" class="t lb">读这份图谱的三条纪律</text>
  <text x="48" y="442" class="t s">① 来源身份：A·官方一手（27）与 B·项目/作者一手（33）分开看，官方身份本身不等于生产部署</text>
  <text x="48" y="462" class="t s">② 实现存在性：代码接入 ≠ 线上采用；演示、mock、dry-run、录制回放都应单独标注</text>
  <text x="48" y="482" class="t s">③ 效果可信度：生产采用、业务收益、独立复现需要各自的证据——60 条记录不等于 60 个成熟商业部署</text>
</svg>
