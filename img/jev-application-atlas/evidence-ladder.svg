<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="ja8-t ja8-d">
  <title id="ja8-t">证据口径的三层可判性</title>
  <desc id="ja8-d">读这份图谱要把来源身份、实现存在性与效果可信度分开判断；图谱自身声明未调用 Jev API、未新增联网核验、未独立复测。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .lv{font-size:13.5px;font-weight:700;fill:#1e293b}
      .ls{font-size:10.5px;fill:#64748b}
      .num{font-size:13px;font-weight:700;fill:#1d4ed8}
      .ch{font-size:10.5px;fill:#334155}
      .chb{font-size:10.5px;fill:#1d4ed8}
      .pt{font-size:12.5px;font-weight:700;fill:#334155}
      .pl{font-size:10.5px;fill:#475569}
      .pn{font-size:11px;fill:#64748b}
    </style>
  </defs>
  <rect width="960" height="470" fill="#f8fafc"/>
  <text x="32" y="36" class="t title">证据口径：把三件事分开判断</text>
  <text x="32" y="58" class="t sub">同一份图谱里，来源身份、实现存在性、效果可信度各自需要证据；任何一层都不能替下一层背书</text>

  <rect x="32" y="84" width="580" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="68" cy="118" r="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="68" y="124" class="t num" text-anchor="middle">1</text>
  <text x="96" y="124" class="t lv">来源身份 —— 谁说的</text>
  <text x="96" y="146" class="t ls">官方一手不等于生产部署；项目与作者一手还要看自证程度</text>
  <rect x="96" y="154" width="176" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="184" y="172" class="t chb" text-anchor="middle">A · 官方一手 27 条</text>
  <rect x="284" y="154" width="196" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="382" y="172" class="t ch" text-anchor="middle">B · 项目/作者一手 33 条</text>

  <rect x="32" y="204" width="580" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="68" cy="238" r="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="68" y="244" class="t num" text-anchor="middle">2</text>
  <text x="96" y="244" class="t lv">实现存在性 —— 代码里有没有</text>
  <text x="96" y="266" class="t ls">看到接入代码只说明集成存在，不说明运行范围与实际效果</text>
  <rect x="96" y="274" width="68" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="130" y="292" class="t ch" text-anchor="middle">代码接入</text>
  <rect x="174" y="274" width="68" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="208" y="292" class="t ch" text-anchor="middle">教程示例</text>
  <rect x="252" y="274" width="68" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="286" y="292" class="t ch" text-anchor="middle">厂商演示</text>
  <rect x="330" y="274" width="96" height="26" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="378" y="292" class="t ch" text-anchor="middle">mock / dry-run</text>
  <rect x="436" y="274" width="68" height="26" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="470" y="292" class="t ch" text-anchor="middle">录制回放</text>

  <rect x="32" y="324" width="580" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="68" cy="358" r="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="68" y="364" class="t num" text-anchor="middle">3</text>
  <text x="96" y="364" class="t lv">效果可信度 —— 实际有没有用</text>
  <text x="96" y="386" class="t ls">生产采用、业务收益、独立复现，三者都需要各自的证据</text>
  <rect x="96" y="394" width="68" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="130" y="412" class="t ch" text-anchor="middle">生产采用</text>
  <rect x="174" y="394" width="68" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="208" y="412" class="t ch" text-anchor="middle">业务收益</text>
  <rect x="252" y="394" width="68" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="286" y="412" class="t ch" text-anchor="middle">独立复现</text>

  <rect x="628" y="84" width="300" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="648" y="114" class="t pt">这份图谱自陈了什么</text>
  <text x="648" y="142" class="t pl">· 基于《Jev 公开应用案例与证据清单》重编</text>
  <text x="648" y="164" class="t pl">· 未调用 Jev API</text>
  <text x="648" y="186" class="t pl">· 未新增联网核验</text>
  <text x="648" y="208" class="t pl">· 未独立复测，也未复跑作者实验</text>
  <line x1="648" y1="228" x2="908" y2="228" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="648" y="242" width="260" height="68" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="664" y="266" class="t pn" fill="#92400e">60 条记录包含教程、演示、评测、原型</text>
  <text x="664" y="284" class="t pn" fill="#92400e">与作者实验，不等同于 60 个成熟商业</text>
  <text x="664" y="302" class="t pn" fill="#92400e">部署。</text>
  <text x="648" y="338" class="t pl">边界标签应当随结论一起引用，例如</text>
  <text x="648" y="358" class="t pl">“线上采用范围未知”“分数不代表 SEO</text>
  <text x="648" y="378" class="t pl">排名“”无密钥演示不构成真实推理证明“。</text>

  <text x="32" y="452" class="t sub">读法：先分清来源身份 → 再看实现存在性 → 最后判断效果可信度。跳级引用，是这类证据图谱最常见的误读。</text>
</svg>
