<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="ja3-t ja3-d">
  <title id="ja3-t">CONTEXT 到 Jev 到 ACTION 的三段工作流与职责分工</title>
  <desc id="ja3-d">图谱给出的通用工作流是输入材料、模型判断、推进流程三段；其中确定性计算、模型判断、人工复核与安全边界分别由不同角色承担。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .st{font-size:13.5px;font-weight:700;fill:#334155}
      .stb{font-size:14px;font-weight:700;fill:#1d4ed8}
      .ct{font-size:12px;font-weight:700;fill:#334155}
      .cs{font-size:11px;fill:#64748b}
      .col{font-size:11.5px;font-weight:700}
      .cl{font-size:10.5px;fill:#64748b}
    </style>
  </defs>
  <rect width="960" height="420" fill="#f8fafc"/>
  <text x="32" y="36" class="t title">通用工作流：判断放中间，确定性与权限留在两侧</text>
  <text x="32" y="58" class="t sub">图谱把常见链路抽象成三段：材料进来、模型判断、流程推进；但“谁负责什么”才是能否落地生产的关键</text>

  <rect x="40" y="88" width="248" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="88" width="248" height="34" rx="10" fill="#f1f5f9"/>
  <rect x="40" y="110" width="248" height="12" fill="#f1f5f9"/>
  <text x="164" y="110" class="t st" text-anchor="middle">CONTEXT</text>
  <text x="164" y="148" class="t ct" text-anchor="middle">输入材料</text>
  <text x="164" y="170" class="t cs" text-anchor="middle">文本、状态、问题与候选</text>
  <text x="164" y="196" class="t cs" text-anchor="middle">由代码准备，不由模型自己找</text>

  <line x1="296" y1="152" x2="336" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="336,146 348,152 336,158" fill="#94a3b8"/>

  <rect x="356" y="88" width="248" height="128" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="356" y="88" width="248" height="34" rx="10" fill="#dbeafe"/>
  <rect x="356" y="110" width="248" height="12" fill="#dbeafe"/>
  <text x="480" y="110" class="t stb" text-anchor="middle">Jev</text>
  <text x="480" y="148" class="t ct" text-anchor="middle">判断 · 选择 · 评分</text>
  <text x="480" y="170" class="t cs" text-anchor="middle">输出可供流程使用的结果</text>
  <text x="480" y="196" class="t cs" text-anchor="middle">Noul · Choice · Score · Boolean</text>

  <line x1="612" y1="152" x2="652" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="652,146 664,152 652,158" fill="#94a3b8"/>

  <rect x="672" y="88" width="248" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="672" y="88" width="248" height="34" rx="10" fill="#f1f5f9"/>
  <rect x="672" y="110" width="248" height="12" fill="#f1f5f9"/>
  <text x="796" y="110" class="t st" text-anchor="middle">ACTION</text>
  <text x="796" y="148" class="t ct" text-anchor="middle">推进流程</text>
  <text x="796" y="170" class="t cs" text-anchor="middle">执行与校验，必要时转人工</text>
  <text x="796" y="196" class="t cs" text-anchor="middle">权限与不可逆动作另行控制</text>

  <rect x="40" y="240" width="880" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="266" class="t ct">四类职责：模型只承担其中一格</text>

  <text x="56" y="294" class="t col" fill="#475569">确定性代码</text>
  <text x="56" y="314" class="t cl">候选召回 · 字符串核对</text>
  <text x="56" y="332" class="t cl">金额计算 · 日历校验</text>
  <text x="56" y="350" class="t cl">检索执行 · 格式输出</text>

  <text x="276" y="294" class="t col" fill="#3b82f6">模型判断</text>
  <text x="276" y="314" class="t cl">相关性 · 可用性 · 冲突</text>
  <text x="276" y="332" class="t cl">支持关系 · 风险与严重程度</text>
  <text x="276" y="350" class="t cl">工具与动作的有限选择</text>

  <text x="496" y="294" class="t col" fill="#f59e0b">人工复核</text>
  <text x="496" y="314" class="t cl">不确定与相互矛盾的结果</text>
  <text x="496" y="332" class="t cl">高影响、可逆性差的动作</text>
  <text x="496" y="350" class="t cl">误合并 · 薄弱证据 · 申诉</text>

  <text x="716" y="294" class="t col" fill="#ef4444">安全边界</text>
  <text x="716" y="314" class="t cl">身份认证与授权</text>
  <text x="716" y="332" class="t cl">沙箱隔离 · 人工批准</text>
  <text x="716" y="350" class="t cl">不可逆动作与资金动作</text>

  <text x="32" y="402" class="t cs">CONTEXT → Jev → ACTION 是图谱中的解释性示意；每条案例的感知、生成、执行与安全职责分别说明，并未被统一封装成同一个框架。</text>
</svg>
