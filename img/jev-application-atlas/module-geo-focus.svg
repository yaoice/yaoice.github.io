<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ja6-t ja6-d">
  <title id="ja6-t">GEO 与营销模块的两条记录拆解</title>
  <desc id="ja6-d">JEV-41 判断 AI 回答里是否提到目标品牌，JEV-56 判断官网是否把产品、受众、价值主张与信任依据讲清楚；两条记录分别对应被外部提到与把自己讲清楚两端。</desc>
  <defs>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1e293b}
      .title{font-size:18px;font-weight:700}
      .sub{font-size:12px;fill:#475569}
      .meta{font-size:10.5px;fill:#64748b}
      .hd{font-size:10.5px;font-weight:700;fill:#1d4ed8}
      .hd2{font-size:13.5px;font-weight:700;fill:#1e293b}
      .d{font-size:11px;fill:#475569}
      .r{font-size:11px;fill:#334155}
      .lb{font-size:11px;font-weight:700;fill:#334155}
      .eb{font-size:10.5px;fill:#78350f}
      .bd{font-size:10.5px;fill:#64748b}
      .bt{font-size:11.5px;fill:#334155}
    </style>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="32" y="36" class="t title">GEO 与营销：两条记录，两端问题</text>
  <text x="32" y="58" class="t sub">JEV-41 看“外部有没有提到你”，JEV-56 看“你自己有没有把业务讲清楚”——两条都标注为 GEO 可借鉴 · 开发者项目</text>

  <rect x="32" y="84" width="430" height="44" rx="10" fill="#eff6ff"/>
  <rect x="32" y="110" width="430" height="18" fill="#eff6ff"/>
  <text x="48" y="100" class="t hd">JEV-41 ｜ 标题：AI 回答里，品牌被提到了吗？</text>
  <text x="48" y="120" class="t hd2">品牌提及判断（Notra）</text>

  <text x="48" y="146" class="t meta">来源：usenotra ｜ 原始出处：github.com/usenotra/notra ｜ 证据：B · 项目/作者一手</text>

  <text x="48" y="170" class="t d">Notra 在 GEO 模块中调用统一评价客户端，对 AI 回答中的品牌提及</text>
  <text x="48" y="188" class="t d">进行判断，并保留禁用与回退配置。</text>

  <line x1="48" y1="206" x2="446" y2="206" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="224" class="t r">01 · 输入：目标品牌与 AI 回答</text>
  <line x1="48" y1="238" x2="446" y2="238" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="256" class="t r">02 · Jev 判断：评估是否存在品牌提及</text>
  <line x1="48" y1="270" x2="446" y2="270" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="288" class="t r">03 · 后续动作：业务模块接收结构化结果</text>

  <rect x="32" y="304" width="430" height="78" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="48" y="326" class="t lb" fill="#b45309">启发</text>
  <text x="48" y="346" class="t eb">GEO 监测可将实体提及、引用链接和排名分成独立检查，</text>
  <text x="48" y="364" class="t eb">避免互相替代。</text>

  <rect x="32" y="394" width="430" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="48" y="416" class="t lb">证据与边界</text>
  <text x="48" y="436" class="t bd">已见接入代码及禁用/回退开关；无法从代码确认线上启用比例、</text>
  <text x="48" y="454" class="t bd">客户数量及效果。同一客户端也支撑路由与反馈分类。</text>
  <text x="48" y="474" class="t bd">核验：核对 evaluateMention、getEvaluationClient、模型常量 typesafe-ai/jev</text>

  <rect x="498" y="84" width="430" height="44" rx="10" fill="#eff6ff"/>
  <rect x="498" y="110" width="430" height="18" fill="#eff6ff"/>
  <text x="514" y="100" class="t hd">JEV-56 ｜ 标题：官网，把业务讲清楚了吗？</text>
  <text x="514" y="120" class="t hd2">官网表达评估（ReplyNodes）</text>

  <text x="514" y="146" class="t meta">来源：replynodes ｜ 出处：github.com/replynodes/jev-web-analyzer ｜ 证据：B</text>

  <text x="514" y="170" class="t d">抓取 SaaS 官网为 Markdown，检查产品、受众、价值主张、差异化、</text>
  <text x="514" y="188" class="t d">信任依据和行动指引。</text>

  <line x1="514" y1="206" x2="912" y2="206" stroke="#e2e8f0" stroke-width="1"/>
  <text x="514" y="224" class="t r">01 · 输入：官网正文与表达检查项</text>
  <line x1="514" y1="238" x2="912" y2="238" stroke="#e2e8f0" stroke-width="1"/>
  <text x="514" y="256" class="t r">02 · Jev 判断：判断清晰度与信息完整性</text>
  <line x1="514" y1="270" x2="912" y2="270" stroke="#e2e8f0" stroke-width="1"/>
  <text x="514" y="288" class="t r">03 · 后续动作：生成多维表达检查结果</text>

  <rect x="498" y="304" width="430" height="78" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="514" y="326" class="t lb" fill="#b45309">启发</text>
  <text x="514" y="346" class="t eb">官网诊断可以先审查关键信息是否清楚，再用真实转化数据</text>
  <text x="514" y="364" class="t eb">验证改进。</text>

  <rect x="498" y="394" width="430" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="514" y="416" class="t lb">证据与边界</text>
  <text x="514" y="436" class="t bd">作者明确标为开发者演示；分数不能视为 SEO/GEO 排名、真实</text>
  <text x="514" y="454" class="t bd">访客调研或客观企业评级。输出类型为 Boolean / Choice / Score。</text>
  <text x="514" y="474" class="t bd">核验：阅读项目原始说明，官方文档仅用于能力对照</text>

  <rect x="32" y="498" width="896" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="518" class="t bt">两条记录的抽象：GEO 的一端是“被外部提到”，另一端是“自己讲清楚”；前者靠监测，后者靠表达诊断。</text>
  <text x="48" y="538" class="t bt" fill="#64748b">数量口径要注意：模块统计中 GEO 营销只有 2 条，但被打上“GEO 可借鉴”标签的记录共 10 条。</text>
</svg>
